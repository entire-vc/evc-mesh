name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'dev-docs/**']
  # NOTE: no paths-ignore here. Lint/Test/Build/Authed E2E/Go coverage are
  # required status checks with enforce_admins=true — a path-skipped workflow
  # reports nothing, so the checks stay pending and the PR can never merge.
  # Doc-only PRs pay a full CI run; that is cheaper than a wedged branch.
  pull_request:
    branches: [main]
  # A merge queue runs the required checks on the `merge_group` event, against
  # the batched tree, and waits for the SAME context strings it waits for on a
  # PR. A workflow that does not list this event produces none of them there:
  # with `enforce_admins: true` and six required contexts, turning the queue on
  # while this line is missing wedges the repository — every entry sits waiting
  # for checks that will never be requested, and no one can override.
  #
  # So this trigger lands BEFORE the queue is enabled, never with it. Also note
  # the deploy workflows deliberately do NOT get this event: a queue branch is a
  # candidate, not main, and must not deploy.
  merge_group:
    types: [checks_requested]

concurrency:
  # `head_ref` is empty outside `pull_request`; on `merge_group` this falls
  # through to `github.ref`, which is the queue's own
  # `refs/heads/gh-readonly-queue/main/pr-N-<sha>` — unique per group, so groups
  # do not cancel each other.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job carries `timeout-minutes`. GitHub's default is 360 (six hours), and
# this workflow runs on `merge_group` — so a job that hangs holds the whole merge
# queue behind it, which is how #72d1bf09 (queue stalled 5h) started life as
# "the benchmark is hanging". The ceilings below are ~4-6x the p100 measured over
# the last 8 green runs (slowest: coverage-gate 5.7m, test 5.2m), and every one is
# under the ruleset's `check_response_timeout_minutes: 60`. That ordering is the
# point: a stuck job must die and report a DEFINITE failure the queue can act on,
# rather than going quiet and leaving the queue to time out on "no response" —
# a cancelled/absent check does not evict the entry cleanly.
# memory-bench.yml already does this (45m branch arm, 50m prod arm); this file was
# the half of the merge-queue surface that did not, and the gap was missed once by
# checking only the workflow that had been blamed.
jobs:
  self-host-env:
    name: "Self-host env (no new required vars)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # A compose variable that is required with no default breaks upgrades
      # for every existing self-host install that lacks it — at config-parse
      # time, before a container starts, which our own prod never sees
      # because it has had the variable all along.
      - name: check-required-env
        run: deploy/docker/mesh/check-required-env.sh
      # The static check above cannot see a variable made required in a way
      # the regex misses, so also prove it end to end: an .env produced from
      # the FIRST installable release still parses against today's compose
      # files. This is the exact upgrade that failed on 2026-07-29
      # (mesh.prototypes.ventures, 5b672a6 -> 9d7ac87).
      #
      # BOTH files, for the reason spelled out in check-required-env.sh: the
      # first version of this job parsed only the production file, so the same
      # defect in docker-compose.yml — which docs/self-hosting.md presents as
      # the default Quick Start path — slipped the static and the dynamic
      # layer at once. Also parses env_file: references, which the regex
      # cannot follow.
      - name: An .env from the first release still parses
        working-directory: deploy/docker/mesh
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder/' \
            testdata/first-release.env.example > /tmp/first-release.env
          for f in docker-compose.prod.yml docker-compose.yml; do
            echo "--- $f"
            docker compose -f "$f" \
              --env-file /tmp/first-release.env config >/dev/null
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Lives here rather than beside the coverage gate's own self-check, which
      # is guarded by `if: steps.affected.outputs.pkgs != ''` and so does not run
      # on a workflow-only diff — exactly the diff that can break this. `Lint` is
      # required, runs on every PR unconditionally, and this is stdlib-only and
      # instant. An unwired self-check guards nothing (cf. #2a079432, where two
      # existed, passed, and were credited by the README while appearing in no
      # workflow step).
      - name: Merge-queue preconditions
        run: python3 scripts/ci/test_merge_queue_preconditions.py
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.11.3"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
        # Note: JetStream enabled via command args
        # GitHub Actions services don't support 'command',
        # so we'll configure NATS connection to work without JetStream in unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Run migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: goose -dir migrations up
      - name: Run tests
        env:
          DATABASE_URL: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          NATS_URL: "nats://localhost:4222"
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # ─── A. Integration tests ───────────────────────────────────────────────────
  # Runs ./tests/integration/ with -tags=integration against a live API server.
  # REPORT mode: continue-on-error=true — failures visible but do NOT block merge.
  integration:
    name: "Integration tests (REPORT)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # NOTE: nats is deliberately NOT a service container. The event bus needs
      # JetStream, and JetStream is off unless nats-server is started with
      # --jetstream. A `services:` entry runs the image's default CMD and GitHub
      # Actions offers no way to override it, so a service-declared nats ran
      # without JetStream: PublishEvent failed and no event was ever delivered
      # to a subscriber. Nothing caught it because until the WebSocket tenancy
      # tests, no integration test asserted that an event ARRIVES — only that
      # endpoints answer. Started as a plain container below instead, with the
      # same flags as deploy/docker/mesh/docker-compose.yml.
      #
      # minio is not a service container for exactly the same reason: its
      # default CMD prints usage and exits, and the server only starts with
      # `server /data`. Started as a plain container below. Without it, every
      # upload answered "object storage is unreachable" and the workspace-icon
      # test could not check the one thing it exists to check.
    steps:
      - uses: actions/checkout@v7
      - name: Start NATS with JetStream enabled
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine \
            --jetstream --store_dir /data --http_port 8222
          for _ in $(seq 30); do
            if docker exec nats wget --spider -q http://127.0.0.1:8222/healthz 2>/dev/null; then
              echo "NATS ready with JetStream"; exit 0
            fi
            sleep 1
          done
          echo "NATS did not become healthy"; docker logs nats; exit 1

      - name: Start MinIO (object storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose + run migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations up

      - name: Build + start API server
        env:
          # DB — match services above (CI ports, not local defaults)
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mesh
          DB_PASSWORD: mesh
          DB_NAME: mesh
          DB_SSL_MODE: disable
          # Cache + messaging
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          NATS_URL: "nats://localhost:4222"
          # Object storage — the MinIO container started above. The bucket is
          # created by the API at startup, so nothing sets it up here.
          S3_ENDPOINT: "localhost:9000"
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET: mesh-artifacts
          S3_REGION: us-east-1
          S3_USE_SSL: "false"
          # Auth — CI-safe values (tests create their own users via /auth/register)
          JWT_SECRET: "ci-test-secret-32chars-minimum!!"
          JWT_ISSUER: "mesh-ci"
          # Disable rate limiting so integration tests don't hit auth RPM
          MESH_RATE_LIMIT_ENABLED: "false"
          APP_ENV: test
        run: |
          go build -o /tmp/mesh-api ./cmd/api
          /tmp/mesh-api &
          # Wait up to 15s for the server to be ready on default port 8005
          for i in $(seq 15); do
            curl -sf http://localhost:8005/healthz && break || sleep 1
          done
          echo "API server ready"

      - name: Run integration tests
        env:
          TEST_API_URL: "http://localhost:8005"
          TEST_DB_DSN: "host=localhost port=5432 user=mesh password=mesh dbname=mesh sslmode=disable"
        run: go test ./tests/integration/ -v -tags=integration -timeout=120s

  # ─── A2. Repo-layer integration tests ──────────────────────────────────────
  # internal/repository/postgres/integration_test.go carries `//go:build
  # integration` and was invisible to every other job: the Test job runs
  # `go test ./...` with no build tag (so the file is excluded from
  # compilation entirely), and the Integration job above passes `-tags=integration`
  # but scopes to ./tests/integration/ only. Net effect: ~9 repo-level tests —
  # including the ones that exist specifically to catch a field present in an
  # UPDATE but missing from the matching INSERT (the reviewer_id class of bug,
  # #564) — never ran in CI. Unlike the Integration job above, this one is a
  # normal blocking job (no continue-on-error): it exists to be a real gate,
  # not a report.
  repo-integration:
    name: "Repo tests (integration)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Run migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: goose -dir migrations up
      - name: Run repo-layer integration tests
        env:
          # DATABASE_URL is for this package's other DB tests (the ones with
          # no build tag, e.g. user_repo_test.go's userRepoTestDB) which the
          # Test job already exercises — setting it here too means running
          # this job doesn't accidentally skip them. TEST_DATABASE_URL is
          # what integration_test.go's testDB() actually reads.
          DATABASE_URL: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
          TEST_DATABASE_URL: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: go test ./internal/repository/postgres/... -v -race -tags=integration

  # ─── B. Affected-set coverage gate (Go) ────────────────────────────────────
  # Coverage ≥80% on changed_packages ∪ reverse_dep_closure.
  # ENFORCE mode: failures block merge (enforced 2026-06-22, burn-in complete).
  coverage-gate:
    name: "Go coverage ≥80% (affected-set)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose + run migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations up

      # BASE is resolved ONCE here and republished as an output, because the
      # threshold step below needs the identical value and used to re-derive it
      # from its own copy of this expression. Two expressions encoding one fact
      # drift silently, and the direction they drift in is the dangerous one:
      # a narrower BASE means fewer changed lines, which reads as a pass.
      #
      # `HEAD~1` is right for `push` (one squashed commit on main) and WRONG for
      # `merge_group`. A queue branch is base + one commit per queued PR, so on a
      # batch of three `HEAD~1` scores only the last PR and the other two enter
      # main ungated — the gate would go green having measured a third of the
      # change. `merge_group.base_sha` ("the SHA of the merge group's parent
      # commit", a required field of the checks_requested payload) is the whole
      # batch's parent, so the diff covers every PR in the group.
      - name: Compute affected-set (changed pkgs + reverse-dep closure)
        id: affected
        run: |
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            merge_group)  BASE="${{ github.event.merge_group.base_sha }}" ;;
            *)            BASE="HEAD~1" ;;
          esac
          # An empty BASE would make `git diff` compare against the working tree
          # and silently report nothing changed — fail loudly instead.
          if [ -z "$BASE" ]; then
            echo "::error::BASE is empty for event '${{ github.event_name }}'"
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff base ($GITHUB_EVENT_NAME): $BASE"
          chmod +x docs/ci-templates/scripts/affected_set_go.sh
          AFFECTED=$(docs/ci-templates/scripts/affected_set_go.sh "$BASE" 2>/dev/null || true)
          echo "pkgs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$AFFECTED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Affected packages: $AFFECTED"

      - name: Run coverage on affected packages
        if: steps.affected.outputs.pkgs != ''
        env:
          DATABASE_URL: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          NATS_URL: "nats://localhost:4222"
        run: |
          FAILED=0
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            # Skip main packages. A composition root is wiring that unit tests
            # never execute — it is covered by the Test / Integration / Authed
            # E2E jobs instead. Measuring it here makes the gate unpassable for
            # any change to cmd/*: cmd/api alone is ~276 statements at 0%, which
            # drowns out any package it is merged with.
            if [ "$(go list -f '{{.Name}}' "$pkg" 2>/dev/null)" = "main" ]; then
              echo "skip (main package, not unit-testable): $pkg"
              continue
            fi
            go test -race -covermode=atomic \
              -coverprofile="/tmp/cover_$(echo "$pkg" | tr '/' '_').out" \
              "$pkg" 2>&1 || { FAILED=1; echo "FAIL: $pkg"; }
          done <<< "${{ steps.affected.outputs.pkgs }}"

          # Merge profiles and report aggregate.
          if ls /tmp/cover_*.out 1>/dev/null 2>&1; then
            # Keep exactly one "mode:" line. A plain `cat` of N profiles emits N
            # of them, which makes `go tool cover` bail out — and because the
            # threshold check was guarded on a parsed total, an unparseable
            # total silently SKIPPED the gate. That made this job vacuous for
            # every PR touching more than one package.
            # Merge target lives outside the cover_*.out glob, otherwise grep
            # reads its own output and warns on every run.
            echo "mode: atomic" > /tmp/merged_cover.out
            grep -h -v '^mode:' /tmp/cover_*.out >> /tmp/merged_cover.out

            go tool cover -func=/tmp/merged_cover.out | tee /tmp/cover_summary.txt
            TOTAL=$(grep '^total:' /tmp/cover_summary.txt | awk '{print $NF}' | tr -d '%')
            # Informational only. See the threshold discussion below.
            echo "Affected-set total coverage (context, not gated): ${TOTAL}%"

            if [ "$FAILED" -ne 0 ]; then
              echo "::error::One or more affected packages failed to test"
              exit 1
            fi
          else
            echo "No coverage profiles produced (affected set was main-only or test-free) — nothing to gate."
          fi

      # The threshold is applied to the lines THIS change touches, not to the
      # aggregate of the affected set.
      #
      # The aggregate is the reverse-dependency closure of whatever the author
      # opened, so a change to internal/repository/postgres is scored against
      # handler + middleware + service + ws as well — ~28% combined. No amount of
      # testing your own change moves that number, which made an 80% bar
      # unreachable for the entire lower half of the codebase. It went unnoticed
      # because the gate had been silently skipping multi-package PRs until the
      # merge bug was fixed (#381/#382); switching it from fail-open to
      # fail-closed simply revealed that the bar had never been reachable.
      #
      # Pre-existing debt is a real problem, but it is not this gate's problem —
      # holding unrelated PRs hostage to it just teaches people to route around
      # the gate.
      - name: Gate on diff coverage (lines this change touches)
        if: steps.affected.outputs.pkgs != ''
        run: |
          BASE="${{ steps.affected.outputs.base }}"
          if [ ! -f /tmp/merged_cover.out ]; then
            echo "No merged profile — nothing to gate."
            exit 0
          fi
          set +e
          python3 scripts/ci/diff_coverage.py \
            --profile /tmp/merged_cover.out --base "$BASE" --threshold 80
          rc=$?
          set -e
          # 2 = could not measure. That is an infrastructure fault, not a verdict
          # on the author's change, and must not read as "you made it worse".
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Diff coverage INCONCLUSIVE — gate not applied"
            exit 0
          fi
          exit "$rc"

      - name: Self-check the diff-coverage gate
        if: steps.affected.outputs.pkgs != ''
        run: python3 scripts/ci/test_diff_coverage.py

      - name: Skip (no Go files changed)
        if: steps.affected.outputs.pkgs == ''
        run: echo "No Go files in this diff — coverage gate skipped."

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage-affected
          path: /tmp/cover_summary.txt

  # ─── C. React frontend coverage (vitest) ───────────────────────────────────
  # Runs vitest with V8 coverage. Threshold: lines ≥60% (raised as test suite grows).
  # REPORT mode: continue-on-error=true — non-blocking.
  frontend-coverage:
    name: "Frontend coverage (vitest, REPORT)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Run vitest with coverage
        working-directory: web
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/

  # ─── D. React authed E2E (Playwright, F1 harness) ──────────────────────────
  # Logs in once through Mesh's own /api/v1/auth/login (this app has no Casdoor
  # flow), then asserts the API honours the session, the shell routes into the
  # workspace, and nothing logs a console error / page error / failed API call.
  # ENFORCE mode: failures block merge (enforced 2026-06-22, burn-in complete).
  # Requires repo variable: APP_BASE_URL
  # Requires repo secrets: E2E_USER_EMAIL, E2E_USER_PASSWORD
  # Missing secrets fail the job on purpose — see web/e2e/global-setup.ts.
  playwright-e2e:
    name: "Authed E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Pinned to the SAME version as playwright-core in web/pnpm-lock.yaml, on
      # purpose: matched, the browsers this job needs are already baked into the
      # image at /ms-playwright and nothing is fetched at run time. Mismatched,
      # Playwright deletes the image's browsers and re-downloads its own from
      # cdn.playwright.dev on every run. The step below is what enforces this.
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright system deps (apt, best-effort)
        working-directory: web
        timeout-minutes: 5
        # Best-effort: the runner image (mcr.microsoft.com/playwright) already ships
        # chromium's system libraries. Verified on this branch by forcing all three
        # apt attempts to fail and then launching chromium anyway:
        # CHROMIUM_LAUNCHED version=151.0.7922.34. The browser download below and the
        # E2E run remain hard-required.
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if timeout 90 npx playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt stalled or failed; retrying"
            sleep 10
          done
          echo "::warning::playwright install-deps failed after 3 attempts"
          exit 1
      # A no-op that touches no network — it exists to PROVE that, and to fail
      # loudly the day it stops being true.
      #
      # Until 2026-08-20 the image was pinned at v1.44.0 while web/package.json
      # asked for @playwright/test ^1.62.1, so every run deleted the image's
      # browsers and pulled 301 MiB from cdn.playwright.dev (chromium 184.3 MiB
      # + headless shell 114.7 MiB + ffmpeg 2.3 MiB). On 2026-08-19 that CDN
      # geo-blocked the runner — "<Details>this service is not available in your
      # location</Details>" — and evicted a 19/19-green PR (#614) from the merge
      # queue. `Authed E2E` is a required check with enforce_admins=true, so an
      # external CDN was a hard dependency of merging anything at all.
      #
      # PLAYWRIGHT_DOWNLOAD_HOST points every download at a closed port, so a
      # missing browser fails in milliseconds against 127.0.0.1 instead of
      # quietly reaching the CDN and going green. That is the whole guarantee:
      # this step passing means zero bytes came from outside.
      - name: Chromium ships with the image (downloads black-holed)
        working-directory: web
        timeout-minutes: 3
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: http://127.0.0.1:9
        run: |
          if ! npx playwright install chromium; then
            echo "::error::Playwright tried to download a browser, so the container image and web/pnpm-lock.yaml have drifted. Fix: set container.image in this job to mcr.microsoft.com/playwright:v<version>-jammy, where <version> is playwright-core's version in web/pnpm-lock.yaml. Do not delete this step to make it green — it is what keeps cdn.playwright.dev out of the merge path."
            exit 1
          fi
      - name: Run Playwright E2E
        working-directory: web
        # WHERE THIS WRITES, AND AS WHOM — read this before changing the suite.
        #
        # E2E_USER_EMAIL is e2e-ci@entire.vc. It is a member of exactly ONE
        # workspace, `e2e-ci-sandbox`, and of NO real workspace: asking the
        # production workspace for anything under this credential answers
        # 403 "workspace access denied". The suite asserts that membership list
        # itself, so putting this account back into a real workspace turns the
        # check red rather than quietly widening what a GitHub secret can reach.
        #
        # Inside the sandbox its role is `member` (create/update/delete tasks,
        # documents, comments — see internal/middleware/rbac.go). It is NOT the
        # owner: admin@entire.vc is, so this credential cannot delete the
        # workspace or change anyone's role, and a human can clean the sandbox
        # up. `viewer` was the previous setting and made the required check
        # structurally unable to test any write path, which is what §1n asks for.
        #
        # What a run leaves behind: nothing. Every document and comment it makes
        # is named "[e2e] … <run id>" and deleted in afterAll (comments first —
        # a document delete is soft and orphans its comment routes), and the
        # suite prints the sandbox's document list afterwards. Two rows are
        # permanent fixtures the reads depend on: project `e2e-fixtures` and the
        # task "E2E read fixture — do not delete".
        run: npx playwright test
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://mesh.entire.host' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Assert typecheck is not vacuous
        run: ./scripts/assert-typecheck-is-not-vacuous.sh
      - name: Assert typecheck covers e2e/
        run: ./scripts/assert-typecheck-covers-e2e.sh
      - name: Typecheck frontend
        working-directory: web
        run: pnpm typecheck
      - name: Build frontend
        working-directory: web
        run: pnpm build
      - name: Build API server
        run: go build -o bin/api ./cmd/api
      - name: Build MCP server
        run: go build -o bin/mcp ./cmd/mcp
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
