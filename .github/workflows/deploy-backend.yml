name: Deploy backend to mesh VM (via hel01)

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'migrations/**'
      # A test-only merge used to deploy prod. `_test.go` files are never
      # compiled into a non-test build, so such a push changes the serving
      # binary by exactly nothing — but it still landed a deploy, and a deploy
      # landing mid-measurement destroys a `memory-bench` run (the version pin
      # from #e8570874 catches it, but only by REFUSING: rc=2
      # `version-changed-mid-run`, no score, and for a `--update-baseline
      # --repeat 3` capture that is ~65 min thrown away). PR #407 was the live
      # case: one file, `internal/service/memory_service_test.go`, matched
      # `internal/**` here and deployed, while `memory-bench.yml`'s own
      # push filter (an explicit file allowlist) did not match it at all —
      # so neither author could see it from their diff.
      #
      # Must stay LAST: GitHub applies the patterns in order and the final
      # match wins, so this negation only excludes if nothing re-includes it
      # below. Verified binary-neutral on `7a5aebf`: no `go:embed` anywhere
      # under cmd/, internal/ or pkg/, and no `testdata/` directories, so
      # nothing test-shaped reaches the artifact by another route.
      #
      # Lint/Test coverage is NOT lost: `ci.yml` runs on every push to main
      # (paths-ignore is `**.md`/`docs/**`/`dev-docs/**` only) and on every PR,
      # where Lint/Test/Build are required checks. This filter only decides
      # whether prod gets REDEPLOYED.
      - '!**/*_test.go'
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip burst-deploy guard (force deploy)'
        type: boolean
        default: false

permissions:
  contents: read

# Sequential deploys — never cancel an in-flight deploy.
concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.11.3"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Run migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: goose -dir migrations up
      - name: Run tests
        env:
          DATABASE_URL: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          NATS_URL: "nats://localhost:4222"
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

  migrate:
    name: Migrate (prod DB gate)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: needs.lint.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # CI runners reach the mesh VM (private 10.10.10.10) only through the hel01
      # forwarding-only jump user `ghdeploy` (single public IP). The deploy key is
      # authorized on BOTH ghdeploy@hel01 and root@mesh-vm; ssh-agent offers it to
      # both hops. See docs/DEPLOY_HEL01.md.
      - name: Configure hel01 jump
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H 66.151.34.194 >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host mesh-vm"
            echo "  HostName 10.10.10.10"
            echo "  User root"
            echo "  ProxyJump hel01-jump"
            echo "  StrictHostKeyChecking accept-new"
            echo "Host hel01-jump"
            echo "  HostName 66.151.34.194"
            echo "  User ghdeploy"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync migration files to prod
        run: |
          rsync -avz --checksum migrations/ mesh-vm:/opt/evc-mesh/migrations/

      # Build goose for linux/amd64 on the CI runner and upload to prod so migrations
      # run directly on the host without requiring docker or a pre-installed goose CLI.
      # DSN is constructed from DB_* component vars in /opt/evc-mesh/.env.prod (no DATABASE_URL alias).
      # Hard fail: non-zero exit prevents the deploy job from starting (fail-closed).
      # -allow-missing: apply out-of-order pending migrations without erroring (safe — goose tracks
      # each version independently). Prevents whole-fleet deploy jams when two PRs land migrations
      # in the same release window with a version gap already applied on prod.
      # Ref: CLAUDE-workflow.md §1b Deploy Discipline
      - name: Build and upload goose to prod
        run: |
          GOBIN=$(pwd) GOOS=linux GOARCH=amd64 go install github.com/pressly/goose/v3/cmd/goose@latest
          rsync -avz goose mesh-vm:/opt/evc-mesh/bin/goose
          ssh mesh-vm 'chmod +x /opt/evc-mesh/bin/goose'

      - name: Run migrations on prod (fail-closed)
        run: |
          ssh mesh-vm bash << 'REMOTE'
          set -uo pipefail
          # Source component DB_* vars from .env.prod (prod uses DB_HOST/PORT/USER/PASSWORD/NAME, not DATABASE_URL)
          set -a
          source /opt/evc-mesh/.env.prod
          set +a
          if [ -z "${DB_USER:-}" ] || [ -z "${DB_HOST:-}" ] || [ -z "${DB_NAME:-}" ] || [ -z "${DB_PASSWORD:-}" ]; then
            echo "ERROR: DB_USER/DB_HOST/DB_NAME/DB_PASSWORD not found in /opt/evc-mesh/.env.prod" >&2
            grep -c "" /opt/evc-mesh/.env.prod >&2 || echo "file missing" >&2
            exit 1
          fi
          DB_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:-disable}"
          echo "=== Running goose migrations ==="
          GOOSE_OUT=$(/opt/evc-mesh/bin/goose -dir /opt/evc-mesh/migrations postgres "$DB_URL" up -allow-missing 2>&1)
          GOOSE_RC=$?
          echo "$GOOSE_OUT"
          if echo "$GOOSE_OUT" | grep -qi "missing"; then
            echo "WARN: out-of-order migration(s) applied — check migration version sequence"
          fi
          exit $GOOSE_RC
          REMOTE

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, test, migrate]
    if: needs.lint.result == 'success' && needs.test.result == 'success' && needs.migrate.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build backend binary (linux/amd64)
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          BUILD_VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-w -s \
              -X main.BuildSHA=${BUILD_SHA} \
              -X main.BuildTime=${BUILD_TIME} \
              -X main.BuildVersion=${BUILD_VERSION} \
              -X main.BuildEnv=prod" \
            -o mesh-api ./cmd/api

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure hel01 jump
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H 66.151.34.194 >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host mesh-vm"
            echo "  HostName 10.10.10.10"
            echo "  User root"
            echo "  ProxyJump hel01-jump"
            echo "  StrictHostKeyChecking accept-new"
            echo "Host hel01-jump"
            echo "  HostName 66.151.34.194"
            echo "  User ghdeploy"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Burst-deploy guard
        env:
          GH_FORCE_INPUT: ${{ inputs.force }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FORCE="${GH_FORCE_INPUT}"
          if echo "$COMMIT_MSG" | grep -qF '[force-deploy]'; then
            FORCE=true
          fi

          LAST=$(ssh mesh-vm 'cat /opt/evc-mesh/.last-backend-deploy 2>/dev/null || echo 0')
          NOW=$(date +%s)
          DIFF=$((NOW - LAST))

          if [ "$FORCE" != "true" ] && [ "$DIFF" -lt 300 ]; then
            echo "::error::Burst-deploy guard: last deploy was ${DIFF}s ago (< 5 min). Add [force-deploy] to commit message or use workflow_dispatch with force=true to override."
            exit 1
          fi

      - name: Upload binary
        run: |
          sha256sum mesh-api | cut -d' ' -f1 > mesh-api.sha256
          rsync -avz --checksum mesh-api mesh-vm:/opt/evc-mesh/bin/mesh-api.new
          rsync -avz mesh-api.sha256 mesh-vm:/opt/evc-mesh/bin/mesh-api.new.sha256

      - name: Atomic swap and restart
        run: |
          ssh mesh-vm 'set -e
            EXPECTED=$(cat /opt/evc-mesh/bin/mesh-api.new.sha256)
            mv /opt/evc-mesh/bin/mesh-api.new /opt/evc-mesh/bin/mesh-api
            rm -f /opt/evc-mesh/bin/mesh-api.new.sha256
            ACTUAL=$(sha256sum /opt/evc-mesh/bin/mesh-api | cut -d" " -f1)
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "Binary swap assertion FAILED: expected $EXPECTED got $ACTUAL" >&2
              exit 1
            fi
            systemctl restart mesh-api
            date +%s > /opt/evc-mesh/.last-backend-deploy'

      - name: Smoke test
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          DEPLOYED=""
          for i in $(seq 1 15); do
            DEPLOYED=$(ssh mesh-vm 'curl -sf http://127.0.0.1:8005/api/v1/healthz/version' 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['commit'])" 2>/dev/null) || true
            if [ -n "$DEPLOYED" ]; then
              break
            fi
            echo "Waiting for service (attempt $i/15)..."
            sleep 2
          done
          if [ "$DEPLOYED" != "${EXPECTED_SHA}" ]; then
            echo "::error::Smoke test FAILED: expected ${EXPECTED_SHA}, got ${DEPLOYED}"
            exit 1
          fi
          echo "Deploy verified: ${DEPLOYED}"
