name: Deploy frontend to tw-mesh

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Verify SW cache version was injected
        working-directory: web
        run: |
          if grep -q '__BUILD_HASH__' dist/sw.js; then
            echo "::error::dist/sw.js still contains __BUILD_HASH__ placeholder; vite plugin did not run."
            exit 1
          fi
          grep -E "^const CACHE_NAME = 'mesh-[0-9a-f]+';" dist/sw.js \
            || (echo "::error::dist/sw.js CACHE_NAME does not match mesh-<hash> pattern"; exit 1)
          echo "SW CACHE_NAME: $(grep CACHE_NAME dist/sw.js | head -1)"

      - name: Deploy to tw-mesh
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: web/dist/
          remote_path: /opt/evc-mesh/web/dist/
          remote_host: 216.57.106.222
          remote_user: root
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
