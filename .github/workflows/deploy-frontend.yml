name: Deploy frontend to mesh VM (via hel01)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Verify SW cache version was injected
        working-directory: web
        run: |
          if grep -q '__BUILD_HASH__' dist/sw.js; then
            echo "::error::dist/sw.js still contains __BUILD_HASH__ placeholder; vite plugin did not run."
            exit 1
          fi
          grep -E "^const CACHE_NAME = 'mesh-[0-9a-f]+';" dist/sw.js \
            || (echo "::error::dist/sw.js CACHE_NAME does not match mesh-<hash> pattern"; exit 1)
          echo "SW CACHE_NAME: $(grep CACHE_NAME dist/sw.js | head -1)"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # CI reaches the private mesh VM only via the hel01 forwarding-only jump user.
      # See docs/DEPLOY_HEL01.md.
      - name: Configure hel01 jump
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H 66.151.34.194 >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host mesh-vm"
            echo "  HostName 10.10.10.10"
            echo "  User root"
            echo "  ProxyJump hel01-jump"
            echo "  StrictHostKeyChecking accept-new"
            echo "Host hel01-jump"
            echo "  HostName 66.151.34.194"
            echo "  User ghdeploy"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to mesh VM
        run: |
          rsync -avz --delete web/dist/ mesh-vm:/opt/evc-mesh/web/dist/
