name: MCP drift gate

# internal/mcp exists TWICE — here, feeding cmd/mcp (built by deploy-backend.yml
# and deployed to mesh-vm's mesh-mcp.service, the public SSE surface behind
# Caddy), and again in entire-vc/evc-mesh-mcp, feeding ~/bin/mesh-mcp (the
# stdio binary every agent workspace actually runs). Go's internal/ visibility
# forbids one importing the other across modules, so they are hand-maintained
# copies of the same tool implementation. That already bit us once silently:
# Mesh #9855f866 / #4222c17d — a comment-truncation fix merged clean here, CI
# green, deployed, and the fleet kept serving the old broken behavior because
# the binary agents run is built from the other repo entirely.
#
# This job makes that class of drift loud: it diffs every function/method
# common to both trees (gofmt-normalized, comments stripped) via
# cmd/mcp-drift-check, and fails if any differ outside the reviewed allowlist
# at cmd/mcp-drift-check/allow.txt. See that file for the current baseline
# and #46233e08 / #3bc9f59d for how it got there and where it's headed.
#
# This is one half of the gate — it only fires when a PR HERE touches
# internal/mcp or cmd/mcp. A matching job lives in evc-mesh-mcp's own CI
# (checking this repo out as the counterpart) to catch drift introduced from
# that side. Neither alone is sufficient; both exist because a PR against
# either repo needs to see the OTHER repo's current main to detect drift.

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/mcp/**'
      - 'cmd/mcp/**'
      - 'cmd/mcp-drift-check/**'
  push:
    branches: [main]
    paths:
      - 'internal/mcp/**'
      - 'cmd/mcp/**'
      - 'cmd/mcp-drift-check/**'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcp-drift-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-drift-gate:
    name: MCP drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out evc-mesh
        uses: actions/checkout@v7
        with:
          path: evc-mesh

      - name: Check out evc-mesh-mcp
        uses: actions/checkout@v7
        with:
          repository: entire-vc/evc-mesh-mcp
          # Same cross-repo pattern already in use by memory-bench.yml — the
          # default GITHUB_TOKEN has read access to sibling repos in this org.
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - uses: actions/setup-go@v7
        with:
          go-version-file: evc-mesh/go.mod
          cache: true
          cache-dependency-path: evc-mesh/go.sum

      - name: Run mcp-drift-check
        working-directory: evc-mesh
        run: |
          go run ./cmd/mcp-drift-check \
            -a internal/mcp \
            -b ../evc-mesh-mcp/internal/mcp \
            -label-a evc-mesh \
            -label-b evc-mesh-mcp \
            -allow cmd/mcp-drift-check/allow.txt
