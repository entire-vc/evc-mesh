name: Memory Benchmark (LongMemEval-S)

# Two arms, split by cost and determinism:
#
#   recall-gate  — free, no LLM, deterministic. Scores recall@k against the
#                  dataset's gold answer_session_ids. Runs on EVERY PR (see the
#                  no-paths-filter note below) and is the arm intended to become
#                  a required check.
#
#   memory-bench — full LongMemEval (recall → chat model → LLM judge). Depends on
#                  a paid API and a nondeterministic judge, so it is ADVISORY and
#                  runs on a schedule/dispatch, never as a PR merge gate. It used
#                  to run on PRs, where it failed on every single one since it
#                  landed (2026-07-04) with `chat_complete failed: 402` — a red
#                  check nobody can act on is worse than no check.

on:
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Per-category regression tolerance (default: 0.25 — 1-question variance on 4q/category CI subset)'
        required: false
        default: '0.25'
      full_eval:
        description: 'Also run the paid end-to-end LongMemEval (chat + LLM judge)'
        type: boolean
        required: false
        default: false
      update_baseline:
        description: >-
          Re-snap a baseline instead of judging against it (see `baseline_arm` for
          which one). Uploads the new file as an artifact to commit by hand —
          capture it HERE, not on a laptop: a baseline snapped against a different
          agent key, chat model or embedder is not comparable to the run that will
          be judged against it, and that is the same class of not-comparable this
          workflow already exits 2 over.
        type: boolean
        required: false
        default: false
      baseline_arm:
        description: >-
          Which baseline `update_baseline` re-snaps. `end-to-end` writes
          baseline.json in the paid advisory arm. `retrieval` writes
          baseline_retrieval.json in the prod canary. `retrieval-branch` writes
          baseline_retrieval_branch.json in the branch arm — the one behind the
          REQUIRED check, so its capture is refused outright unless the run was
          complete and served in `hybrid` mode. `both` re-snaps end-to-end and
          retrieval, each in its own arm. The three retrieval files are NOT
          interchangeable: each records its own `arm` and one used in the wrong
          arm is refused as `arm-mismatch`.
        type: choice
        options:
          - end-to-end
          - retrieval
          - retrieval-branch
          - both
        required: false
        default: end-to-end
      expect_commit:
        description: >-
          Override the commit the PROD CANARY requires prod to be serving before
          it will score. Empty (the default) means "derive it": `github.sha` on a
          main-ref run, and no pin at all otherwise. Supply a value to pin a run
          on a branch, which is also how the refusal itself is proved — dispatch
          with a commit prod is not serving and the canary must exit 2 naming
          `version-mismatch`. Has no effect on the required branch arm, which
          builds and measures its own server and has no deployed version to race.
        required: false
        default: ''
      repeat:
        description: >-
          Passes to average when re-snapping (default 3). One pass is a coin toss:
          4 questions per category means one flipped answer moves it 0.25, and
          single-session-assistant was observed at 1.000/0.250/1.000 on three
          consecutive nightlies of identical code.
        required: false
        default: '3'

  # NOTE: deliberately NO `paths:` filter on pull_request. A required check born
  # in a path-filtered workflow never reports on PRs that miss the filter, and a
  # never-reported required context blocks that PR forever (cf. evc-mesh#320).
  # The gate runs on every PR and no-ops internally when no memory path changed.
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'internal/service/memory_service.go'
      - 'internal/repository/postgres/memory_repo.go'
      - 'internal/repository/postgres/memory_edges_repo.go'
      - 'internal/mcp/tools.go'
      - 'internal/mcp/server.go'
      - 'internal/reconciler/**'
      - 'scripts/memory-bench/**'

  schedule:
    # Nightly 04:00 UTC — the paid end-to-end eval lives here, not on PRs.
    - cron: '0 4 * * *'

env:
  # Every file whose behaviour the gate is supposed to protect. A memory file
  # MISSING from this list is the worst failure mode available to a required
  # check: the job reports green having measured nothing, and the "required"
  # badge certifies a run that never happened.
  #
  # That was not hypothetical — #347 rewrote the authorization on memory DELETE,
  # touching only `internal/handler/memory_handler.go`, and the gate no-op'd to
  # green because the handler was not listed here. When adding a memory code
  # path, add it here in the same PR.
  MEMORY_PATHS: |
    internal/handler/memory_handler.go
    internal/domain/memory.go
    internal/service/memory_service.go
    internal/repository/postgres/memory_repo.go
    internal/repository/postgres/memory_edges_repo.go
    internal/repository/postgres/memory_chunk_rank.go
    internal/repository/postgres/memory_chunk_repo.go
    internal/mcp/tools.go
    internal/mcp/server.go
    internal/reconciler/
    pkg/sdk/memories.go
    scripts/memory-bench/

jobs:
  # ---------------------------------------------------------------------------
  # THE REQUIRED ARM (ADR-0003): builds `cmd/api` from the PR head and measures
  # THAT. Everything below it in this file measures the deployed server, which
  # is a different question and never the PR's.
  #
  # The defect this replaces: `Memory recall gate` was required on every PR and
  # took its target from `secrets.MESH_API_URL` — production. Nothing in this
  # file built the branch (the two `go build` steps compile `mesh-mcp`, the
  # CLIENT, from another repo). So the required check reported a confident green
  # about a binary the PR did not contain. #388/#389/#391 each passed that way
  # while carrying the regression that took every new memory out of the dense
  # arm; the check could not have seen it, by construction.
  # ---------------------------------------------------------------------------
  # The NAME is load-bearing and deliberately unchanged from the job this
  # replaces. `main`'s branch protection requires the literal context string
  # "Memory recall gate" with `enforce_admins: true`; GitHub matches a required
  # context against the check-run NAME, not the job id. So:
  #   - naming this job anything else leaves the required context unproduced on
  #     every PR that carries this file — mergeStateStatus BLOCKED forever, with
  #     no override available to anyone (evc-mesh#320, and this PR itself sat
  #     BLOCKED at 14 green checks until the name went back);
  #   - and moving the requirement to a new string is not a free swap either: it
  #     instantly BLOCKS every other open PR, because they still produce the old
  #     name.
  # Inheriting the name is the only edit that needs zero admin action and leaves
  # no window in which memory is gated by nothing. The job id below may change
  # freely; this line may not.
  recall-gate-branch:
    name: Memory recall gate
    runs-on: ubuntu-latest
    # ~10 min of bench against a local build, plus build + model download on a
    # cold cache. Generous rather than tight: a timeout here reads as a gate
    # failure, and this is the arm that blocks merges. A capture runs the whole
    # bench `repeat` times, so it gets the same headroom the prod arm gets.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 45 }}
    permissions:
      contents: read
      issues: write

    services:
      # Stock postgres:16 is enough — `migrations/20260315044_memories_vector_columns.sql`
      # stores embeddings as TEXT and does the cosine in application code
      # specifically so pgvector is not a database-level requirement.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (gate self-checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Runs on EVERY PR, before the scope check — these guard the gate against
      # going blind, so they must not be skipped by the very no-op they exist to
      # detect. Stdlib only: no secrets, no network, ~1s.
      #
      # A red here means "this PR would make the recall gate stop enforcing" —
      # e.g. it adds a memory source file MEMORY_PATHS does not cover, or it
      # edits the dense-arm control until BM25 can answer it. That IS a
      # legitimate merge block, and unlike an infra failure the author can clear
      # it. These moved here from the prod job because THIS is now the job that
      # runs on every PR.
      # `test_the_required_job_invokes_every_self_check` pins this list against
      # the directory: a self-check that exists but is not named here guards
      # nothing, which is how test_gate_dense_arm.py and
      # test_check_captured_baseline.py sat unwired while the README credited
      # them as the pin for their failure mode.
      - name: Gate self-checks (blind-spot, mode, arm, control)
        run: |
          python scripts/memory-bench/test_gate_blindness.py
          python scripts/memory-bench/test_gate_modes.py
          python scripts/memory-bench/test_gate_arm.py
          python scripts/memory-bench/test_gate_dense_arm.py
          python scripts/memory-bench/test_check_captured_baseline.py
          python scripts/memory-bench/test_gold_rank.py
          python scripts/memory-bench/test_fixture_isolation.py
          python scripts/memory-bench/test_serving_version.py
          python scripts/memory-bench/test_classify_cancelled_arm.py
          python scripts/memory-bench/dense_arm_control.py --selftest
          python scripts/memory-bench/prod_window.py --selftest

      # One source of truth for "this dispatch is a capture, not a verdict" —
      # the re-snap must run and the judging gate must not, and two copies of the
      # expression drift into both running or neither.
      #
      # `pull_request` is excluded explicitly. `inputs.*` is empty on that event
      # so the expression is already false, but this arm — unlike the prod one —
      # DOES run on PRs, so the exclusion has to be visible here rather than
      # inferred from a property of a different trigger.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (github.event_name != 'pull_request' && inputs.update_baseline && inputs.baseline_arm == 'retrieval-branch') && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      - name: Does this change touch memory?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the PR's own base..head — never the merge ref (a guard that reads
          # the merge ref deadlocks every open PR).
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"; echo "$changed"
          relevant=false
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if echo "$changed" | grep -qE "^${p}"; then relevant=true; fi
          done <<< "$(printf '%s' "${MEMORY_PATHS}" | tr -d '\r')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "memory-relevant: $relevant"

      - name: No memory paths touched — nothing to gate
        if: steps.scope.outputs.relevant != 'true'
        run: |
          echo "This PR changes no memory-path file; the recall gate is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Keyed on the pinned model name, so a model bump busts the cache rather
      # than silently serving the old weights against the new baseline.
      - name: Cache the CI embedder model
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: scripts/memory-bench/.fastembed_cache
          key: fastembed-bge-small-en-v1.5-v1

      - name: Install Python dependencies
        if: steps.scope.outputs.relevant == 'true'
        # No `openai` — this arm must not acquire a paid dependency. fastembed is
        # the local ONNX runtime for the embedder; see ci_embedder.py for why a
        # hash stub would make this whole job blind.
        run: pip install mcp httpx fastembed

      - name: Start the local embedder
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd scripts/memory-bench
          nohup python ci_embedder.py --port 8099 --cache-dir .fastembed_cache \
            > embedder.log 2>&1 &
          echo $! > embedder.pid
          # ci_embedder loads the model BEFORE binding the port, so /healthz
          # answering is proof the weights are resident — not merely that a
          # process started.
          for i in $(seq 180); do
            if curl -sf http://127.0.0.1:8099/healthz > /dev/null; then
              echo "embedder ready after ${i}s"; curl -s http://127.0.0.1:8099/healthz; exit 0
            fi
            sleep 1
          done
          echo "::error::embedder never became ready"; cat embedder.log; exit 1

      - name: Run migrations
        if: steps.scope.outputs.relevant == 'true'
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations up

      - name: Build + start the API from THIS branch
        if: steps.scope.outputs.relevant == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mesh
          DB_PASSWORD: mesh
          DB_NAME: mesh
          DB_SSL_MODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          NATS_URL: "nats://localhost:4222"
          JWT_SECRET: "ci-recall-gate-secret-32chars-min!"
          JWT_ISSUER: "mesh-ci"
          # ~1900 `remember` calls per pass would otherwise hit APIRPM (600) and
          # the resulting 429s would score as recall misses.
          MESH_RATE_LIMIT_ENABLED: "false"
          MESH_ALLOW_REGISTRATION: "true"
          # The OpenAI wire shape, served locally by ci_embedder.py. 384 dims to
          # match prod (migrations/20260727082_memory_chunks.sql).
          EMBEDDING_PROVIDER: openai
          EMBEDDING_ENDPOINT: "http://127.0.0.1:8099"
          EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
          EMBEDDING_DIMENSIONS: "384"
          EMBEDDING_API_KEY: "not-used-by-the-local-embedder"
          APP_ENV: test
        run: |
          go build -o /tmp/mesh-api ./cmd/api
          nohup /tmp/mesh-api > api.log 2>&1 &
          echo $! > api.pid
          echo "MESH_API_URL=http://127.0.0.1:8005" >> "$GITHUB_ENV"

      # Mints its own workspace + agent key against the ephemeral database.
      # `secrets.MESH_BENCH_KEY` is deliberately NOT used here: it is prod's, and
      # using it would point this arm back at the thing it exists to stop
      # measuring. It also blocks until /health really answers, instead of the
      # `curl || sleep` loop that prints "ready" unconditionally.
      - name: Bootstrap a bench workspace + agent key
        if: steps.scope.outputs.relevant == 'true'
        run: |
          # No stdout redirect: the script appends to $GITHUB_ENV itself, so the
          # minted key is never a printed value that a later refactor could
          # accidentally route into the job log.
          python scripts/memory-bench/ci_bootstrap.py \
            --api-url http://127.0.0.1:8005 \
            || { echo "::error::bootstrap failed"; tail -50 api.log; exit 1; }

      - name: Checkout evc-mesh-mcp
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Cross-compile mesh-mcp (linux/amd64)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin

      # ---------------------------------------------------------------------
      # The dense-arm control, run BEFORE the scored bench so a severed vector
      # arm is named as such rather than showing up as an unexplained score.
      #
      # The scored dataset cannot do this job: every question in it is answerable
      # from the words it uses, so BM25 carries them alone. Run 30316983402
      # scored `overall 0.9583` — its best ever — with the dense arm returning
      # zero rows for the entire haystack. This question is keyword-dark by
      # construction; see dense_arm_control.py for the measurement.
      # ---------------------------------------------------------------------
      - name: Dense-arm control — the vector arm must be contributing
        id: control_alive
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b-ctl
        run: |
          cd scripts/memory-bench
          set +e
          python dense_arm_control.py --expect alive 2>&1 | tee control_alive.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Same contract as the scored gate: 1 blocks, 2 never does.
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      # `!cancelled()` and not the default: a failed dense-arm control must not
      # skip the two steps that explain it. Skipping them is how a red arrives
      # with its own evidence missing — the score that would say how bad, and the
      # power check that says whether the control can be trusted at all. Both are
      # exactly the artefacts a reviewer needs on a red, and the default `if`
      # withholds them precisely then. The job still fails: these steps report
      # their own conclusions, they do not launder the control's.
      # The capture path for THIS arm's baseline. Without it the required check
      # is permanently `no-baseline` ⇒ INCONCLUSIVE — required, and blocking
      # nothing but the dense-arm control. The README used to say "dispatch the
      # workflow on main; the branch job writes it": the job does run on
      # dispatch, but nothing in it ever passed `--update-baseline`, so the
      # documented procedure was inert and would only have been discovered by
      # someone following it after the merge.
      #
      # `--repeat` matters more here than anywhere: 4 questions per category
      # means one flipped answer moves a category by 0.25, which is the whole
      # tolerance. A one-pass floor is a coin toss frozen into the gate.
      - name: Re-snap the branch recall baseline
        id: resnap
        if: steps.scope.outputs.relevant == 'true' && steps.mode.outputs.capture == 'true'
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-c
        run: |
          cd scripts/memory-bench
          python run_ci.py --retrieval-only --arm branch --update-baseline \
            --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          echo "### Branch recall baseline re-snapped" >> "$GITHUB_STEP_SUMMARY"
          echo '`baseline_retrieval_branch.json` is uploaded as an artifact — commit it by hand.' \
            >> "$GITHUB_STEP_SUMMARY"

      # Captured HERE and committed by hand, never generated on a laptop: a
      # baseline snapped against a different embedder or a different DB is not
      # comparable to the runs that will be judged against it, and that is the
      # same not-comparable this workflow already exits 2 over (`arm-mismatch`).
      - name: Upload the re-snapped branch baseline
        if: ${{ !cancelled() && steps.resnap.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-retrieval-branch
          path: |
            scripts/memory-bench/baseline_retrieval_branch.json
            scripts/memory-bench/resnap.log
          if-no-files-found: error

      - name: Run the recall gate against the branch build
        id: gate
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' && steps.mode.outputs.capture != 'true' }}
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --retrieval-only --arm branch \
            --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e

          reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
          if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval' gate.log; then
            rc=2
            reason="no-baseline — the gate compared against nothing"
          fi
          [ -z "$reason" ] && reason="unspecified"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## Memory recall gate (branch build)"
            echo
            echo "Target: \`cmd/api\` built from \`${{ github.sha }}\`, ephemeral postgres,"
            echo "local \`BAAI/bge-small-en-v1.5\`. Not comparable with the prod canary's numbers."
            echo
            case "$rc" in
              0) echo "✅ **PASS** — recall measured on THIS branch, within tolerance of the branch baseline." ;;
              1) echo "❌ **REGRESSION** — recall dropped below the branch baseline in the same retrieval mode."
                 echo "This PR makes memory measurably worse. This is the only condition that blocks the merge." ;;
              2) echo "### ⚠️ INCONCLUSIVE — nothing was measured, so nothing was enforced"
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "\`arm-mismatch\` means the baseline on disk was captured against a"
                 echo "different target than this run — re-snap with \`--arm branch\`, do not"
                 echo "hand-edit. A red nobody can clear gets bypassed, so this does not fail"
                 echo "the check; the alert below is what stops it being silent." ;;
              *) echo "❌ Gate exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then exit "$rc"; fi
          exit 0

      # ---------------------------------------------------------------------
      # POSITIVE CONTROL ON THE CONTROL — the step that has been missing every
      # previous time this harness went blind.
      #
      # "Gold was retrieved" proves the dense arm works only if the same
      # assertion FAILS when the dense arm is gone. So: kill the embedder, leave
      # the binary and the corpus exactly as they are, and require the control to
      # miss. If it still finds gold, BM25 could reach it all along and every
      # green the control ever produced was uninformative.
      #
      # Runs LAST because it destroys the dense arm for the rest of the job.
      # ---------------------------------------------------------------------
      - name: Power check — with the dense arm off, the control must MISS
        id: control_dead
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b-pwr
        run: |
          kill "$(cat scripts/memory-bench/embedder.pid)" 2>/dev/null || true
          # Recall fails OPEN on an embed error (memory_service.go: log, count,
          # return) — so this yields bm25-only rather than a 500, which is
          # exactly the degraded shape being simulated.
          for i in $(seq 20); do
            curl -sf http://127.0.0.1:8099/healthz > /dev/null || break
            sleep 1
          done
          cd scripts/memory-bench
          set +e
          python dense_arm_control.py --expect dead 2>&1 | tee control_dead.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "### Dense-arm control — power check"
            echo
            case "$rc" in
              0) echo "✅ The control goes red when the dense arm is removed, so its green means something." ;;
              1) echo "❌ **The control has no power** — gold was still found with the dense arm off."
                 echo "Every green it has produced was uninformative. See \`control_dead.log\`." ;;
              *) echo "⚠️ Power check inconclusive (\`$rc\`) — the dense arm could not be confirmed off." ;;
            esac
            echo
            echo '```'
            tail -20 control_dead.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      - name: Server logs (always — a boot failure is invisible otherwise)
        if: always() && steps.scope.outputs.relevant == 'true'
        run: |
          echo "::group::mesh-api"; tail -200 api.log 2>/dev/null || true; echo "::endgroup::"
          echo "::group::embedder"; tail -50 scripts/memory-bench/embedder.log 2>/dev/null || true; echo "::endgroup::"

      - name: Upload branch-arm results
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-gate-branch-results
          path: |
            scripts/memory-bench/gate.log
            scripts/memory-bench/control_alive.log
            scripts/memory-bench/control_dead.log
            scripts/memory-bench/embedder.log
            scripts/memory-bench/results/
            api.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The prod CANARY (ADR-0003). Same harness, different question: "is what we
  # deployed still good?" It is no longer a PR gate — it never could answer the
  # PR's question, and presenting its green as if it did is the defect that
  # opened #2a079432. Runs on push to main (post-deploy), nightly, and dispatch.
  # ---------------------------------------------------------------------------
  recall-gate:
    name: Memory recall canary (prod)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # There is exactly ONE `secrets.MESH_API_URL`, and every job below this line
    # ingests a haystack into it and searches it. Concurrent runs therefore do
    # not merely queue — they slow each other down inside the shared server, and
    # a run that would take 17 min alone takes 30+ with company. On 2026-07-28
    # four runs overlapped and the slowest hit `timeout-minutes: 30` at 14/15
    # checks green, which surfaces as `cancelled`, NOT `failure` — so the arm
    # produced no verdict at all while looking like an infra hiccup.
    #
    # `cancel-in-progress: false` is the point of the block, not boilerplate.
    # The template default `true` would abort a peer MID-RUN to make room, which
    # is the same lost verdict by a different route and without even a timeout in
    # the log to diagnose it from. Serialise; never pre-empt.
    #
    # The required arm (above) needs no group at all: its postgres and embedder
    # live inside its own job, so it has nothing to contend for.
    #
    # ------------------------------------------------------------------------
    # WHICH EVICTIONS REMAIN POSSIBLE, and why each is acceptable (#3ce651a0).
    # A group holds one running + one pending member; a third arrival cancels the
    # pending one. That is not avoidable in GitHub Actions — the group is not a
    # queue — so the only honest control is over WHO can be the third arrival.
    # The previous version of this comment claimed only one ordering existed and
    # was wrong about which; enumerate them all or the omitted one is the one
    # that bites.
    #
    #   (a) A newer RUN's canary evicts an older run's PENDING canary.
    #       POSSIBLE, and intended. The canary asks "is what is deployed still
    #       good"; when two commits are deploying, the newer is the one worth
    #       measuring, and the older canary would in any case have been refused
    #       by the version pin for being unable to find its own sha in prod.
    #
    #   (b) The advisory arm evicts the canary of its OWN run.
    #       IMPOSSIBLE now. `needs: recall-gate` keeps the advisory out of the
    #       group until the canary has left it. This was the whole defect.
    #
    #   (c) An older run's advisory evicts a newer run's PENDING canary.
    #       POSSIBLE, and now rare by construction rather than by luck: the
    #       advisory is off `push`, so it only enters the group on the nightly
    #       and on an explicit `full_eval` dispatch, and it needs a canary
    #       already pending at the moment it arrives — i.e. two pushes landing
    #       inside one nightly canary. Accepted rather than eliminated: removing
    #       it means taking the advisory out of this group, which restores the
    #       two arms strangling each other through one API. It is bounded by
    #       being loud — see the `prod-arm-cancelled` job at the end of this file.
    #
    #   (d) This job is cancelled by `timeout-minutes`.
    #       POSSIBLE, and indistinguishable from (a)-(c) by conclusion alone:
    #       GitHub reports a timeout as `cancelled`, not `failure`. Only elapsed
    #       time separates them. Also handled by `prod-arm-cancelled`.
    #
    # (a), (c) and (d) all surface as the same word — `cancelled` — which is the
    # conclusion every reader has been trained to skim past as an infra hiccup.
    # That is how (b) hid for its entire existence. The safety net's death must
    # not look like weather: `prod-arm-cancelled` classifies it and goes red for
    # everything that is not (a).
    # ------------------------------------------------------------------------
    concurrency:
      group: memory-bench-prod
      cancel-in-progress: false
    # A recall pass is ~17 min, so a `--repeat 3` capture needs the same headroom
    # the advisory arm already takes. Unchanged (30) for every PR and nightly.
    # 30 -> 50 because the version pin below now spends IN-JOB time: up to
    # BENCH_VERSION_WAIT_SECONDS (15 min) waiting for a deploy to land, on top of
    # a 17-25 min measurement. Leaving the budget at 30 would have made the guard
    # die on precisely the runs it exists for — and it would have died as a
    # `cancelled` at the ceiling, which reads as a flake rather than as the deploy
    # collision it is. (Measured 2026-07-28: run 30330437164 was cancelled at
    # 32m51s while ALONE in the endpoint, so 30 is now too tight even without the
    # wait.) The wait is a CEILING, not a cost: a matching first poll returns in
    # about a second, so a quiet run is no slower than before.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 50 }}
    permissions:
      contents: read
      # The gate raises an out-of-band alert when it is BLIND (INCONCLUSIVE), so
      # that a safety net that stopped enforcing anything always pages somebody
      # instead of quietly passing.
      issues: write

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs on EVERY PR, before (and independently of) the scope check — these
      # are the tests that guard the gate against going blind, so they must not
      # be skipped by the very no-op they exist to detect. Stdlib only: no
      # secrets, no network, ~1s.
      #
      # A red here means "this PR would make the recall gate stop enforcing" —
      # e.g. it adds a memory source file that MEMORY_PATHS does not cover. That
      # IS a legitimate merge block, and unlike an infra failure the author can
      # clear it: list the file.
      - name: Set up Python (gate self-checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate self-checks (blind-spot + mode logic)
        run: |
          python scripts/memory-bench/test_gate_blindness.py
          python scripts/memory-bench/test_gate_modes.py
          python scripts/memory-bench/test_gate_arm.py
          python scripts/memory-bench/test_gate_dense_arm.py
          python scripts/memory-bench/test_check_captured_baseline.py
          python scripts/memory-bench/test_gold_rank.py
          python scripts/memory-bench/test_fixture_isolation.py
          python scripts/memory-bench/test_serving_version.py
          python scripts/memory-bench/test_classify_cancelled_arm.py
          python scripts/memory-bench/dense_arm_control.py --selftest
          python scripts/memory-bench/prod_window.py --selftest

      # One source of truth for "this dispatch is a capture, not a verdict". Two
      # steps have to agree on it — the capture runs, the gate must not — and two
      # copies of the same expression is how they drift into either both running
      # or neither.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (inputs.update_baseline && (inputs.baseline_arm == 'retrieval' || inputs.baseline_arm == 'both')) && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      - name: Does this change touch memory?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the PR's own base..head — never the merge ref (a guard that reads
          # the merge ref deadlocks every open PR).
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"; echo "$changed"
          relevant=false
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if echo "$changed" | grep -qE "^${p}"; then relevant=true; fi
          done <<< "$(printf '%s' "${MEMORY_PATHS}" | tr -d '\r')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "memory-relevant: $relevant"

      - name: No memory paths touched — nothing to gate
        if: steps.scope.outputs.relevant != 'true'
        run: |
          echo "This PR changes no memory-path file; the recall gate is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Which binary is this canary about to measure?
      #
      # This job triggers on `push: branches:[main]`. So does deploy-backend.yml.
      # Nothing sequences them, so a push-triggered canary used to spend its first
      # ~6 minutes measuring the PREVIOUS binary and then have the binary swap
      # underneath it. Every run on the night of 2026-07-28 crossed a deploy,
      # including one dispatched at 03:23:43Z *specifically* to be a clean
      # post-deploy run: prod went f161732 -> de52f76 at 03:43:10Z, inside it. The
      # harness reported a score anyway, because it had no way to say it could not
      # attribute one.
      #
      # Only this arm needs it. The required branch arm above builds and starts
      # its own server, so there is no deployed version for it to race.
      #
      # Runs BEFORE the Go build so a run that cannot be attributed costs the wait
      # and nothing else.
      # ---------------------------------------------------------------------
      - name: Which commit is prod serving?
        id: version
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          # Ceiling, not a cost: a matching first poll returns in ~1s. Sized for
          # the ~6-7 min a backend deploy takes, doubled, so a queued deploy still
          # fits. Paired with `timeout-minutes: 50` above — raise both together or
          # the guard dies as a timeout on the runs it exists for.
          BENCH_VERSION_WAIT_SECONDS: '900'
          # Operator-supplied, so it goes through the environment rather than
          # `${{ }}` interpolation into the script body — an input spliced into a
          # shell line is the standard Actions script-injection shape, and this one
          # runs with the bench credentials in scope.
          EXPECT_COMMIT_INPUT: ${{ inputs.expect_commit }}
        run: |
          set -euo pipefail
          # Pin only where `github.sha` names a commit prod is expected to serve.
          # push to main / schedule / dispatch on main: github.sha IS main's tip,
          # which deploy-backend.yml ships. This job never runs on pull_request.
          expect="${EXPECT_COMMIT_INPUT:-}"
          if [ -z "$expect" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            expect="${{ github.sha }}"
          fi

          if [ -n "$expect" ]; then
            echo "Pinning to $expect (wait up to ${BENCH_VERSION_WAIT_SECONDS}s)."
            set +e
            python3 scripts/memory-bench/check_serving_version.py \
              --expect "$expect" --wait-seconds "${BENCH_VERSION_WAIT_SECONDS}" \
              2>&1 | tee version.log
            rc=${PIPESTATUS[0]}
            set -e
          else
            echo "No pin: ${{ github.event_name }} on ${{ github.ref }} is not a commit prod serves."
            set +e
            python3 scripts/memory-bench/check_serving_version.py --record 2>&1 | tee version.log
            rc=${PIPESTATUS[0]}
            set -e
          fi

          reason="$(grep -m1 '^GATE_REASON:' version.log | sed 's/^GATE_REASON: *//' || true)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          if [ "$rc" != "0" ]; then
            {
              echo "## Memory recall canary — NOT RUN"
              echo
              echo "### ⚠️ INCONCLUSIVE — could not confirm which binary would be measured"
              echo
              echo "> The canary refused to score rather than measure whichever build happened"
              echo "> to be up. **Nothing was measured, so nothing was enforced.**"
              echo
              echo "**Reason:** \`${reason:-unspecified}\`"
              echo
              echo "This is infrastructure: a backend deploy was in flight, or prod is serving"
              echo "code that is not on the line under test. Re-run once the deploy has landed."
              echo
              echo '```'
              tail -30 version.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Never exit non-zero here. `cannot measure => inconclusive`, and
          # INCONCLUSIVE must not fail a check (cf. #342) — the steps below are
          # skipped and the alert step pages instead.
          exit 0

      - name: Checkout evc-mesh-mcp
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Set up Go
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        uses: actions/setup-go@v5
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      - name: Cross-compile mesh-mcp (linux/amd64)
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin

      - name: Install Python dependencies
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        # Python itself is already set up above for the gate self-checks.
        # No `openai` — the recall gate must not acquire a paid dependency.
        run: pip install mcp httpx

      # ---------------------------------------------------------------------
      # Baseline capture for the REQUIRED arm. #363 added this path for the
      # advisory arm and deliberately left the required arm's baseline alone;
      # this is the same path extended to cover it, rather than a second capture
      # route with its own drift.
      #
      # It runs HERE for the same reason the advisory capture does — same runner,
      # same MESH_BENCH_KEY, same embedder as the PR runs it will judge — and it
      # matters MORE here: this is the baseline behind a required check, so a
      # laptop capture against a different key would make every PR's verdict a
      # comparison across two environments.
      #
      # `run_ci.py` refuses to write this file at all if the run was incomplete or
      # served in a degraded mode, so a capture that reaches the artifact is a
      # 24/24 hybrid run by construction, not by the operator remembering to read
      # the log.
      # ---------------------------------------------------------------------
      - name: Re-snap the recall baseline
        id: resnap
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0' && steps.mode.outputs.capture == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-p-snap
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --retrieval-only --update-baseline \
            --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "## Recall baseline re-snap (required arm)"
            echo
            if [ "$rc" = "0" ]; then
              echo "Captured over \`${{ inputs.repeat || '3' }}\` pass(es) on a complete,"
              echo "\`hybrid\`-served run. Download the \`recall-gate-baseline\` artifact and"
              echo "commit \`scripts/memory-bench/baseline_retrieval.json\`."
              echo
              echo '```json'
              cat baseline_retrieval.json
              echo '```'
            else
              reason="$(grep -m1 '^GATE_REASON:' resnap.log | sed 's/^GATE_REASON: *//' || true)"
              echo "⚠️ Capture exited $rc — \`baseline_retrieval.json\` was **NOT** written."
              echo
              echo "**Reason:** \`${reason:-unspecified}\`"
              echo
              echo "\`capture-refused\` means the run was not a sound basis for a required"
              echo "check's threshold — incomplete sample or degraded retrieval mode. Fix the"
              echo "cause and re-dispatch; do not hand-edit the baseline."
            fi
            echo
            echo '```'
            tail -40 resnap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the re-snapped recall baseline
        if: always() && steps.mode.outputs.capture == 'true' && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-gate-baseline
          path: |
            scripts/memory-bench/baseline_retrieval.json
            scripts/memory-bench/resnap.log
          retention-days: 30

      - name: Run recall gate (no LLM)
        id: gate
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0' && steps.mode.outputs.capture != 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-p
          # The commit the version pin confirmed prod was serving before the
          # measurement began. Empty when no pin applied and the endpoint could
          # not be read, in which case the stability check below is skipped.
          SERVED_AT_START: ${{ steps.version.outputs.served }}
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1: the harness prints its tracebacks to stderr, so without this the
          # uploaded gate.log — the only artifact anyone reads after the fact —
          # contains the "could not measure" verdict but not the reason for it.
          python run_ci.py --retrieval-only --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e

          # run_ci emits a machine-readable `GATE_REASON: <kind> — <detail>` line on
          # every INCONCLUSIVE path. Belt-and-braces: an older run_ci returns 0 with
          # no baseline, which is a VACUOUS GREEN (it compared against nothing) —
          # treat it as inconclusive too. A gate that enforces nothing must never
          # look green-and-healthy.
          reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
          if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval.json' gate.log; then
            rc=2
            reason="no-baseline — the gate compared against nothing"
          fi

          # The pin above proved which binary we STARTED against. A deploy takes
          # ~6-7 min and a recall pass 17-25, so the binary can still swap in the
          # middle — which is exactly what happened to run 30325802161, dispatched
          # to be a clean post-deploy run and crossed by one anyway at 03:43:10Z.
          #
          # This OVERRIDES rc=1 as well as rc=0, on purpose. A score straddling two
          # binaries is a measurement of neither, so a REGRESSION verdict from one
          # is no more attributable than a PASS — and a red nobody can reproduce is
          # how a gate loses its authority. INCONCLUSIVE pages instead.
          if [ -n "${SERVED_AT_START:-}" ]; then
            set +e
            python3 check_serving_version.py \
              --was "${SERVED_AT_START}" 2>&1 | tee -a gate.log
            vrc=${PIPESTATUS[0]}
            set -e
            if [ "$vrc" != "0" ]; then
              rc=2
              reason="$(grep -m1 '^GATE_REASON: version-changed-mid-run' gate.log \
                        | sed 's/^GATE_REASON: *//' || true)"
              [ -z "$reason" ] && reason="version-changed-mid-run — prod was redeployed during the measurement"
            fi
          fi
          [ -z "$reason" ] && reason="unspecified"

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## Memory recall gate"
            echo
            case "$rc" in
              0) echo "✅ **PASS** — recall measured, comparable, and within tolerance of the baseline." ;;
              1) echo "❌ **REGRESSION** — recall dropped below the baseline **in the same retrieval mode**."
                 echo "This PR makes memory measurably worse. This is the only condition that blocks the merge." ;;
              # The banner is scoped to the REASON KIND. `mode-mismatch` and
              # `mode-unknown` really do measure nothing; `category-unmeasured` and
              # `baseline-sample-mismatch` are per-category and leave every
              # comparable category enforced (decide_verdict ranks REGRESSION above
              # INCONCLUSIVE). One banner for both overstates the partial case, and
              # a banner that overstates gets discounted — after which it also
              # understates, at the exact moment it is telling the truth.
              2) case "${reason%% *}" in
                   category-unmeasured|baseline-sample-mismatch|persistent-errors)
                     echo "### ⚠️ PARTIAL — some categories were not compared on this PR"
                     echo
                     echo "> **This is not total blindness.** Every *comparable* category was measured"
                     echo "> and enforced, and a regression in one of those still fails this check."
                     echo "> The gap is narrower: the categories named below were set aside as"
                     echo "> not-comparable, so a regression **in those** could pass through unseen." ;;
                   *)
                     echo "### ⚠️ INCONCLUSIVE — the recall safety net is **BLIND** for this PR"
                     echo
                     echo "> **Nothing was measured, so nothing was enforced.** A real memory regression"
                     echo "> could pass through this PR unseen." ;;
                 esac
                 echo "> This check is **not failing you** — the cause is infrastructure you cannot"
                 echo "> fix from a PR, and a red check nobody can clear just gets bypassed until"
                 echo "> the whole gate is worthless."
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 case "${reason%% *}" in
                   persistent-errors)
                     echo "One or more questions failed with an error that is **not transient**:"
                     echo "either the message is not an infrastructure blip, or the question spent"
                     echo "its entire retry allowance and every attempt died the same way. Such a"
                     echo "question will fail identically on the next run, so it is not merely"
                     echo "excluded from this score — it is excluded from every score, for ever."
                     echo
                     echo "The percentage budget (\`--max-error-rate\`) cannot express that: it"
                     echo "forgives up to 10% *per run*, which forgives the same 8% permanently."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** the error report in the log"
                     echo "names the question ids and the failing stage. Fix the harness or the"
                     echo "dataset — this one does not clear itself and no re-snap will hide it." ;;
                   baseline-sample-mismatch)
                     echo "A category was measured on a different number of questions than the baseline"
                     echo "was captured on. \`1.000\` over 2 questions and \`0.500\` over 4 are two"
                     echo "different measurements, not a 50% drop — so they are not compared."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** re-snap the baseline so its"
                     echo "denominator matches — \`python run_ci.py --retrieval-only --update-baseline\`." ;;
                   category-unmeasured)
                     echo "Those categories lost questions to a harness error (see the log below), which"
                     echo "widens the per-question quantum past the tolerance — at n=3 one unlucky"
                     echo "answer moves the score by 1/3 > 0.25 and would clear the bar on its own."
                     echo
                     echo "**Fix:** stop losing the questions, rather than lowering the bar. The error"
                     echo "report in the log names the failing stage per question." ;;
                   *)
                     echo "Most common cause: the baseline was captured in one retrieval mode (\`hybrid\`)"
                     echo "but this run was served in another (\`bm25-only\`, i.e. the embedder is down and"
                     echo "\`recall\` failed open). Hit@k is not comparable across modes, so a lower score"
                     echo "here says nothing about this PR's code."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** restore the embedder, then re-snap"
                     echo "the baseline — \`python run_ci.py --retrieval-only --update-baseline\`." ;;
                 esac
                 echo "A tracking issue has been opened/updated so this blindness is not silent." ;;
              *) echo "❌ Gate exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # rc=1 (REGRESSION) is the ONLY blocking condition — measured, comparable,
          # worse. rc=2 (INCONCLUSIVE) must not fail the check: see the alert step.
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then exit "$rc"; fi
          exit 0

      # ---------------------------------------------------------------------
      # Blindness must never be silent. INCONCLUSIVE does not block the merge,
      # so the ONLY thing standing between "the safety net stopped working" and
      # "nobody ever noticed" is this alert.
      #
      # ONE tracking issue, not one per PR: we comment on the existing open issue
      # instead of opening a new one, and only when the reason KIND changed (cf.
      # the 292-task alert storm — a poisoned dedup key turns an alert into spam,
      # and spam is ignored, which is the same as having no alert at all).
      # ---------------------------------------------------------------------
      # Reads from EITHER blind source. The version pin can refuse before the gate
      # step ever runs, in which case `steps.gate.outputs.rc` is empty — keying the
      # alert on the gate step alone would make the newest way of going blind the
      # one way that goes blind SILENTLY, which is the whole failure mode this
      # alert exists to prevent.
      #
      # A DRILL IS NOT AN INCIDENT. `expect_commit` exists so the refusal can be
      # proved on demand by pinning to a commit prod is not serving — and the
      # first time that proof was run (30328820759) it posted a real
      # `version-mismatch` alert onto the live tracking issue #397, claiming the
      # safety net was blind when nothing was wrong. Left alone, the acceptance
      # criterion that asks for this proof would charge a false page every time
      # anyone satisfied it, and the readers of that issue would learn to discount
      # it — the same alert-fatigue failure the dedup key below exists to avoid.
      #
      # The suppression is narrow AND fails toward alerting. Only a
      # `workflow_dispatch` that explicitly NAMED a commit is treated as a drill:
      # `expect_commit` is unsettable on push/schedule, so those runs match the
      # first disjunct and alert unconditionally, whatever an absent input coerces
      # to. (A bare `inputs.expect_commit == ''` would put the whole alert at the
      # mercy of that coercion — a guard that silences the alarm on every
      # automatic run is strictly worse than the false page it removes.) A drill
      # is never silent either: the operator dispatched it, and `rc=2` plus the
      # reason are in the step summary and the log.
      - name: Alert — recall gate is blind (INCONCLUSIVE)
        if: >-
          steps.scope.outputs.relevant == 'true'
          && (steps.gate.outputs.rc == '2' || steps.version.outputs.rc == '2')
          && (github.event_name != 'workflow_dispatch' || inputs.expect_commit == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Memory recall gate is INCONCLUSIVE (safety net blind)'
          REASON: ${{ steps.gate.outputs.reason || steps.version.outputs.reason }}
          REASON_KIND: ${{ steps.gate.outputs.reason_kind || steps.version.outputs.reason_kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- recall-gate-blind kind=${REASON_KIND} -->"
          # Scoped to the reason kind, for the same reason as the step summary: the
          # per-category kinds leave every comparable category enforced, and an
          # alert that claims total blindness for a partial gap trains its readers
          # to discount it.
          case "$REASON_KIND" in
            version-mismatch|version-changed-mid-run|version-unreadable)
              lede="The memory recall canary could not confirm WHICH BUILD it was measuring, so it refused to produce a score rather than attribute one to the wrong binary. Nothing was measured and nothing was enforced. This clears itself once the deploy in flight has landed; if it does not, the canary and the backend deploy are racing on the same pushes." ;;
            category-unmeasured|baseline-sample-mismatch)
              lede="The memory recall gate could not compare **some** categories. Every comparable category was still measured and enforced — a regression in one of those still blocks a merge. What is unguarded is limited to the categories in the reason below, and **a regression in those can merge unnoticed** until this clears." ;;
            *)
              lede="The memory recall gate could not produce a verdict: it measured nothing, so it enforced nothing. Until this clears, **memory regressions can merge unnoticed**." ;;
          esac
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" \
            "$lede" \
            "**Reason:** \`${REASON}\`" \
            "Run: ${RUN_URL}")

          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")

          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body" --label memory,ci 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$body"
            echo "Opened tracking issue."
            exit 0
          fi

          # Storm guard: if the most recent comment (or the issue body, when there
          # are none) already reports THIS reason kind, the alert is already live —
          # adding a copy per PR would bury it.
          last=$(gh issue view "$num" --json comments,body \
                   --jq '(.comments | last | .body) // .body // ""')
          if printf '%s' "$last" | grep -qF "$marker"; then
            echo "Issue #$num already reports '${REASON_KIND}' — not commenting again."
            exit 0
          fi
          gh issue comment "$num" --body "$body"
          echo "Commented on tracking issue #$num."

      # A gate that recovered should stop shouting: close the tracking issue once
      # a real, comparable verdict is produced again.
      - name: Resolve blindness alert (gate is measuring again)
        if: steps.scope.outputs.relevant == 'true' && steps.gate.outputs.rc == '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Memory recall gate is INCONCLUSIVE (safety net blind)'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          [ -z "$num" ] && { echo "No open blindness issue."; exit 0; }
          gh issue close "$num" --comment "Recall gate produced a comparable verdict again (baseline and run in the same retrieval mode). Safety net restored: ${RUN_URL}"

      - name: Upload recall-gate results
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-gate-results
          path: |
            scripts/memory-bench/gate.log
            scripts/memory-bench/results/
            version.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The advisory arm: paid, LLM-judged, end-to-end. Never a PR merge gate.
  # ---------------------------------------------------------------------------
  memory-bench:
    name: LongMemEval-S end-to-end (advisory)
    runs-on: ubuntu-latest
    # Same single prod server as the canary, so the same group: two arms racing
    # each other through one API is exactly the contention the block exists to
    # remove, and putting them in separate groups would serialise each arm
    # against itself while leaving them free to strangle each other.
    concurrency:
      group: memory-bench-prod
      cancel-in-progress: false
    # ORDERING, not merely membership — and this line is why the canary exists at
    # all rather than only on paper.
    #
    # A GitHub concurrency group holds ONE running + ONE pending member; a third
    # arrival cancels the pending one. Both jobs of a single run are created in
    # the same second, so with no `needs:` between them the second to queue killed
    # the first — and the first was always the canary. Measured on every push that
    # ever had the job: 3 of 3, canary `cancelled`, two of them at **0s**, zero
    # verdicts produced in the arm's entire existence (#3ce651a0). The
    # version-attribution guard shipped in #402 lives inside that arm and had
    # therefore never executed on a real trigger.
    #
    # The accepted cost documented on the canary above ("a third arrival
    # supersedes the pending one — the newer commit is the one worth measuring")
    # was correct reasoning about a third RUN. The arrival here was the second JOB
    # of the SAME run carrying the SAME sha, so the justifying premise never held
    # and the cost that was accepted was not the cost being paid. A comment that
    # anticipates the wrong arrival reads as a defence and silences the question.
    #
    # `needs:` removes the collision at its source rather than reshuffling it:
    # this job cannot enter the group until the canary has LEFT it, so the two can
    # never be co-pending. It also gives the pair the property the group was
    # bought for — prod is measured by at most one job at a time — without either
    # arm being able to pre-empt the other.
    needs: recall-gate
    # DELIBERATELY NOT version-pinned, unlike the canary above. This arm measures
    # the same live prod and can straddle a deploy in exactly the same way, so the
    # gap is real — it is scoped out rather than overlooked. It is advisory (never
    # a merge gate) and judge-based, so its numbers are already read as
    # indicative; the pin was spent on the arm whose job is attribution. Stated
    # here so the next reader does not infer from the shared concurrency group
    # that this job is covered. If this arm's baseline ever starts gating
    # anything, it needs the pin first.
    #
    # One pass is ~19 min, so a --repeat 3 baseline capture needs room.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 30 }}
    permissions:
      contents: read
      # Advisory does not mean unwatched. An arm that cannot compare must page
      # somebody, or tightening its comparison rules just makes it silent.
      issues: write
    # `baseline_arm: retrieval` is a capture for the OTHER arm — it must not drag
    # the paid job in with it. Without this, re-snapping the free recall baseline
    # would silently also spend an end-to-end capture.
    #
    # `push` REMOVED (#3ce651a0). Two independent reasons, either sufficient:
    #
    #   1. This arm is deliberately NOT version-pinned (see above), so a number it
    #      produces on a push cannot be attributed to the commit that triggered
    #      it — the deploy of that very commit is still in flight underneath it.
    #      A per-commit trigger on an arm that cannot answer a per-commit question
    #      buys an unattributable paid number. The commit-level question belongs
    #      to the canary; this arm's question is "how is prod doing", and its home
    #      is the nightly, exactly as the `schedule:` trigger already says.
    #   2. It is 100% of the observed canary kills. With `needs:` above, a push
    #      run now puts exactly ONE member in `memory-bench-prod` instead of two,
    #      which is the only shape in which the group's documented one-running +
    #      one-pending behaviour matches the cost that was accepted for it.
    #
    # Cost, stated rather than hidden: main no longer gets a per-push end-to-end
    # judge score. It gets the nightly, plus `workflow_dispatch` with
    # `full_eval: true` on demand — which is also how the both-arms path is now
    # exercised on purpose instead of only by accident.
    #
    # `!cancelled()` rather than `success()`: the canary's verdict is not this
    # arm's business — a red canary (rc=1) is a prod regression the advisory
    # should still be measured against, and a default `needs:` skip would have
    # quietly made a canary failure disable the nightly too. It is NOT `always()`:
    # this arm is paid, and a human who cancels the run means it.
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
         (inputs.full_eval ||
          (inputs.update_baseline && inputs.baseline_arm != 'retrieval'))))

    steps:
      # Same one-source-of-truth reason as the recall arm: three steps below key
      # off "is this dispatch an end-to-end capture", and `update_baseline` alone
      # is no longer that question — it now also means the other arm.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (inputs.update_baseline && inputs.baseline_arm != 'retrieval') && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      - name: Checkout evc-mesh
        uses: actions/checkout@v4

      - name: Checkout evc-mesh-mcp
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      - name: Cross-compile mesh-mcp (linux/amd64)
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin
          echo "mesh-mcp built: $(file ../mesh-mcp-bin)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openai mcp httpx

      # ---------------------------------------------------------------------
      # Baseline capture. Runs HERE rather than on a maintainer's laptop so the
      # baseline is produced by the same runner, the same MESH_BENCH_KEY and the
      # same chat/judge models as the nightly that will be compared against it —
      # a baseline captured in a different environment is the same class of
      # not-comparable this workflow already exits 2 over.
      # ---------------------------------------------------------------------
      - name: Re-snap the end-to-end baseline
        id: resnap
        if: steps.mode.outputs.capture == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-e-snap
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --update-baseline --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## LongMemEval-S baseline re-snap"
            echo
            if [ "$rc" = "0" ]; then
              echo "Captured over \`${{ inputs.repeat || '3' }}\` pass(es). Download the"
              echo "\`memory-bench-baseline\` artifact and commit \`scripts/memory-bench/baseline.json\`."
              echo
              echo '```json'
              cat baseline.json
              echo '```'
            else
              echo "⚠️ Capture exited $rc — the baseline was NOT written. See the log."
            fi
            echo
            echo '```'
            tail -30 resnap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the re-snapped baseline
        if: always() && steps.mode.outputs.capture == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-bench-baseline
          path: |
            scripts/memory-bench/baseline.json
            scripts/memory-bench/resnap.log
          retention-days: 30

      - name: Run LongMemEval-S end-to-end
        if: steps.mode.outputs.capture != 'true'
        id: bench
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-e
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1 for the same reason as the recall gate: the harness prints its
          # tracebacks to stderr, and bench.log is the only artifact anyone reads.
          python run_ci.py --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee bench.log
          rc=${PIPESTATUS[0]}
          set -e

          reason="$(grep -m1 '^GATE_REASON:' bench.log | sed 's/^GATE_REASON: *//' || true)"
          [ -z "$reason" ] && reason="unspecified"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## LongMemEval-S (advisory)"
            echo
            case "$rc" in
              0) echo "✅ PASS — measured, comparable, within tolerance of the baseline." ;;
              1) echo "❌ REGRESSION — end-to-end memory quality dropped past the baseline's own spread." ;;
              2) # The scope of the blindness depends on WHICH reason fired, and
                 # saying "measured nothing" when six of seven categories were
                 # enforced normally is not a harmless exaggeration: a banner that
                 # overstates gets discounted, and then it understates on the day
                 # the arm really is fully dark.
                 case "${reason%% *}" in
                   category-unmeasured)
                     echo "### ⚠️ INCONCLUSIVE — **one or more categories** went unmeasured"
                     echo
                     echo "> **Partial blindness, not total.** Every other category was compared and"
                     echo "> enforced normally; a regression in one of those would still have been"
                     echo "> reported. What is missing is the categories named below, which lost"
                     echo "> questions to harness errors and were set aside rather than scored on a"
                     echo "> sample too small to compare." ;;
                   *)
                     echo "### ⚠️ INCONCLUSIVE — this arm measured nothing"
                     echo
                     echo "> Advisory does not mean unwatched. Nothing was compared, so nothing was"
                     echo "> checked — and because this arm never blocks a merge, a silent"
                     echo "> INCONCLUSIVE is indistinguishable from a healthy pass. A tracking issue"
                     echo "> has been opened/updated so it is not silent." ;;
                 esac
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "* \`harness-errors\` — the chat/judge API is down or out of credit."
                 echo "* \`mode-unknown\` / \`mode-mismatch\` — the baseline and this run were served"
                 echo "  in different retrieval modes, or \`baseline.json\` predates mode-scoping."
                 echo "  Re-snap it: run this workflow with **update_baseline**."
                 echo "* \`no-baseline\` — there is nothing to compare against at all."
                 echo "* \`category-unmeasured\` — **partial**: specific categories lost questions to"
                 echo "  harness errors, so their surviving sample no longer supports the tolerance."
                 echo "  The other categories were still enforced. Fix the harness error, not the bar."
                 echo "* \`no-eligible-category\` — the baseline's recorded run-to-run spread is"
                 echo "  wider than its own scores everywhere, so no category could fail." ;;
              *) echo "❌ Eval exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Same rule as the recall gate, for the same reason. rc=2 is an INFRA
          # failure (judge/chat API out of credit) — nothing was measured, so
          # there is nothing to report red about. Failing here paints every push
          # to main red for a cause no author can fix, and a check that is red
          # forever is one people learn to scroll past — which is how the real
          # rc=1 would get ignored too. Advisory means advisory: an unmeasurable
          # run is a loud no-op, a measured regression still shouts.
          if [ "$rc" = "2" ]; then
            echo "::warning title=LongMemEval-S inconclusive::The advisory eval measured nothing ($reason)."
            exit 0
          fi
          exit $rc

      # ---------------------------------------------------------------------
      # The counterpart to tightening this arm's comparison rules. Before, an
      # invalid comparison was published as `✗ REGRESSION` — wrong, but at least
      # visible. Now it exits 2, which does not fail the job, so without this step
      # the fix would trade a noisy red for a silent no-op on an arm nobody is
      # required to look at. Same one-issue / dedup-on-reason-kind shape as the
      # recall gate: an alert that fires per run is spam, and spam is ignored.
      # ---------------------------------------------------------------------
      - name: Alert — advisory arm measured nothing (INCONCLUSIVE)
        if: steps.bench.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          REASON: ${{ steps.bench.outputs.reason }}
          REASON_KIND: ${{ steps.bench.outputs.reason_kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- advisory-arm-blind kind=${REASON_KIND} -->"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" \
            "The end-to-end LongMemEval arm produced no verdict: it compared nothing, so it checked nothing. It does not block merges, so this would otherwise be indistinguishable from a nightly pass." \
            "**Reason:** \`${REASON}\`" \
            "Run: ${RUN_URL}")

          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")

          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body" --label memory,ci 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$body"
            echo "Opened tracking issue."
            exit 0
          fi

          last=$(gh issue view "$num" --json comments,body \
                   --jq '(.comments | last | .body) // .body // ""')
          if printf '%s' "$last" | grep -qF "$marker"; then
            echo "Issue #$num already reports '${REASON_KIND}' — not commenting again."
            exit 0
          fi
          gh issue comment "$num" --body "$body"
          echo "Commented on tracking issue #$num."

      - name: Resolve advisory blindness alert (arm is measuring again)
        if: steps.bench.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          [ -z "$num" ] && { echo "No open advisory-blindness issue."; exit 0; }
          gh issue close "$num" --comment "The advisory arm produced a comparable verdict again: ${RUN_URL}"

      - name: Upload benchmark results
        if: always() && steps.mode.outputs.capture != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-bench-results
          path: |
            scripts/memory-bench/bench.log
            scripts/memory-bench/results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # THE WATCHDOG. A safety net whose death is indistinguishable from weather is
  # not a safety net.
  #
  # `Memory recall canary (prod)` produced ZERO verdicts between the day it was
  # created and the day this job was written, and nobody noticed — because every
  # one of those deaths surfaced as `cancelled`, and `cancelled` is the
  # conclusion every reader has been trained to skim past as a runner hiccup.
  # The defect was not that the arm could be evicted; it is that being evicted,
  # timing out, and being legitimately superseded are the SAME WORD in the UI.
  #
  # So this job does the one thing the conclusion cannot: it separates them, and
  # it goes red for every cause except the one that is actually expected.
  #
  # Deliberately NOT a member of `memory-bench-prod`. It touches no prod
  # endpoint, and a watchdog that the thing it watches can evict is decoration.
  # ---------------------------------------------------------------------------
  prod-arm-cancelled:
    name: Prod arm cancelled (must not be silent)
    needs: [recall-gate, memory-bench]
    # `always()` is load-bearing and not boilerplate: a job whose dependency was
    # CANCELLED is skipped by default, which would make this watchdog absent from
    # precisely the runs it exists for. `!cancelled()` would do the same thing.
    if: >-
      always() &&
      (needs.recall-gate.result == 'cancelled' ||
       needs.memory-bench.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      # ---------------------------------------------------------------------
      # The discriminator is NOT elapsed time. That was the first instinct and
      # it is wrong: GitHub sets `started_at` on a job when it is QUEUED, not
      # when a runner picks it up, so a canary that sat pending for 9m22s and
      # was then superseded reports the same "9 minutes" as one that ran for 9
      # minutes. Measured on the real incident: run 30334077279's canary was
      # pending 9m22s before an eviction — duration alone would have called that
      # a timeout.
      #
      # What separates them is whether the job ever EXECUTED anything. A job
      # cancelled while pending never reaches a runner and reports no completed
      # steps; a job killed by `timeout-minutes` has a trail of them. Combine
      # that with "did a newer run of this workflow already EXIST when this arm
      # died" and every ordering enumerated on the canary job above is
      # distinguishable:
      #
      #   0 steps + a newer run   -> (a) superseded. Expected. Not an alert.
      #   0 steps + no newer run  -> (b)/(c) evicted by a SIBLING or by an older
      #                              run's advisory. This is the bug. Red.
      #   >=1 step                -> (d) timeout, or a mid-run cancel. Red.
      #
      # `created_at <= completed_at` on the newer-run filter is not tidiness. A
      # bare "is there a newer run" is evaluated whenever this job happens to get
      # a runner, so a push arriving in that gap would relabel a genuine
      # sibling-eviction as an expected supersede — the alarm would go quiet
      # exactly on a busy repo. Only a run that already existed at the instant of
      # death can have caused it. It also makes the verdict a pure function of
      # recorded history, which is what lets the control below be re-run.
      #
      # POSITIVE CONTROL, taken before this job was trusted, and it caught a real
      # error in the first draft — see `test_classify_cancelled_arm.py`, which
      # replays the recorded API payloads of those three runs on every PR. An
      # UNBOUNDED newer-run query returns 4/3/2 when re-read hours later and
      # scores all three as "superseded": the first draft of this watchdog would
      # have stayed silent through the entire incident it was written for. That
      # wrong rule is pinned as a negative control so it cannot return as
      # tidy-up. Bounded at the death instant it reproduces the ground truth the
      # incident established by hand:
      #   30330437164  canary   0 steps, 0 newer  -> defect      (sibling)
      #   30334077279  canary   0 steps, 1 newer  -> superseded  (run …90080)
      #   30334590080  canary   0 steps, 0 newer  -> defect      (sibling)
      #   30334590080  advisory 0 steps, 1 newer  -> superseded  (the 06:30 nightly)
      # 2 defects + 2 expected. A probe that only ever produces a NEW number is
      # unfalsifiable; reproducing the OLD one is the free calibration.
      # ---------------------------------------------------------------------
      - name: Checkout evc-mesh
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The classifier is a SCRIPT, not thirty lines of shell wedged into YAML,
      # for one reason: the logic here decides whether an alarm fires, and logic
      # that only exists inside a workflow can only be tested by triggering the
      # incident. `test_classify_cancelled_arm.py` replays the three recorded
      # deaths through it on every PR, which is how the first draft's missing
      # time-bound was caught before it shipped instead of after.
      - name: Classify the cancellation
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          api="repos/${GITHUB_REPOSITORY}"

          # Two payloads, straight from the API, unfiltered — the shaping is the
          # classifier's job so that what runs here and what the tests exercise
          # are the same code path.
          gh api "${api}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > jobs.json || echo '__unreadable__' > jobs.json
          gh api "${api}/actions/workflows/memory-bench.yml/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
            > runs.json || echo '__unreadable__' > runs.json

          python scripts/memory-bench/classify_cancelled_arm.py \
            --jobs-json jobs.json \
            --runs-json runs.json \
            --run-id "${GITHUB_RUN_ID}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # A legitimate supersede is the ONE cause that must not page. Alerting on
      # it would put this job in the red on ordinary busy days, and a check that
      # is red routinely is a check people learn to scroll past — which is the
      # failure this whole job exists to undo, reintroduced one level up.
      - name: Expected supersede — nothing to page
        if: steps.classify.outputs.verdict != 'defect'
        run: |
          echo "::notice::Prod arm cancellation classified as '${{ steps.classify.outputs.verdict }}': ${{ steps.classify.outputs.reason }}"

      - name: Alert — the prod canary was killed, not superseded
        if: steps.classify.outputs.verdict == 'defect'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Memory recall canary (prod) is being cancelled, not run'
          REASON: ${{ steps.classify.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- prod-arm-cancelled -->"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" \
            "A prod arm of the memory benchmark ended \`cancelled\` for a reason that is **not** a newer run superseding it. While this holds, the post-deploy recall canary produces no verdict at all — and it does so silently, because \`cancelled\` reads as an infra hiccup." \
            "**Reason:** ${REASON}" \
            "Run: ${RUN_URL}")

          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")

          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body" --label memory,ci 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$body"
            echo "Opened tracking issue."
          else
            # Same storm guard as the blindness alert: one live report, not one
            # per run. A poisoned dedup key turns an alert into spam, and spam is
            # ignored, which is the same as having no alert at all.
            last=$(gh issue view "$num" --json comments,body \
                     --jq '(.comments | last | .body) // .body // ""')
            if printf '%s' "$last" | grep -qF "$marker"; then
              echo "Issue #$num already reports this — not commenting again."
            else
              gh issue comment "$num" --body "$body"
              echo "Commented on tracking issue #$num."
            fi
          fi

      # The red is the point. An alert on an issue nobody has open in a tab is a
      # filing cabinet; this makes the run itself carry the failure.
      - name: Fail the run
        if: steps.classify.outputs.verdict == 'defect'
        run: |
          echo "::error::${{ steps.classify.outputs.reason }}"
          exit 1
