name: Memory Benchmark (LongMemEval-S)

# Two arms, split by cost and determinism:
#
#   recall-gate  — free, no LLM, deterministic. Scores recall@k against the
#                  dataset's gold answer_session_ids. Runs on EVERY PR (see the
#                  no-paths-filter note below) and is the arm intended to become
#                  a required check.
#
#   memory-bench — full LongMemEval (recall → chat model → LLM judge). Depends on
#                  a paid API and a nondeterministic judge, so it is ADVISORY and
#                  runs on a schedule/dispatch, never as a PR merge gate. It used
#                  to run on PRs, where it failed on every single one since it
#                  landed (2026-07-04) with `chat_complete failed: 402` — a red
#                  check nobody can act on is worse than no check.

on:
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Per-category regression tolerance (default: 0.25 — 1-question variance on 4q/category CI subset)'
        required: false
        default: '0.25'
      full_eval:
        description: 'Also run the paid end-to-end LongMemEval (chat + LLM judge)'
        type: boolean
        required: false
        default: false
      update_baseline:
        description: >-
          Re-snap a baseline instead of judging against it (see `baseline_arm` for
          which one). Uploads the new file as an artifact to commit by hand —
          capture it HERE, not on a laptop: a baseline snapped against a different
          agent key, chat model or embedder is not comparable to the run that will
          be judged against it, and that is the same class of not-comparable this
          workflow already exits 2 over.
        type: boolean
        required: false
        default: false
      baseline_arm:
        description: >-
          Which baseline `update_baseline` re-snaps. `end-to-end` writes
          baseline.json in the paid advisory arm. `retrieval` writes
          baseline_retrieval.json in the free recall arm — the one behind the
          REQUIRED check, so its capture is refused outright unless the run was
          complete and served in `hybrid` mode. `both` re-snaps each in its own arm.
        type: choice
        options:
          - end-to-end
          - retrieval
          - both
        required: false
        default: end-to-end
      repeat:
        description: >-
          Passes to average when re-snapping (default 3). One pass is a coin toss:
          4 questions per category means one flipped answer moves it 0.25, and
          single-session-assistant was observed at 1.000/0.250/1.000 on three
          consecutive nightlies of identical code.
        required: false
        default: '3'

  # NOTE: deliberately NO `paths:` filter on pull_request. A required check born
  # in a path-filtered workflow never reports on PRs that miss the filter, and a
  # never-reported required context blocks that PR forever (cf. evc-mesh#320).
  # The gate runs on every PR and no-ops internally when no memory path changed.
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'internal/service/memory_service.go'
      - 'internal/repository/postgres/memory_repo.go'
      - 'internal/repository/postgres/memory_edges_repo.go'
      - 'internal/mcp/tools.go'
      - 'internal/mcp/server.go'
      - 'internal/reconciler/**'
      - 'scripts/memory-bench/**'

  schedule:
    # Nightly 04:00 UTC — the paid end-to-end eval lives here, not on PRs.
    - cron: '0 4 * * *'

env:
  # Every file whose behaviour the gate is supposed to protect. A memory file
  # MISSING from this list is the worst failure mode available to a required
  # check: the job reports green having measured nothing, and the "required"
  # badge certifies a run that never happened.
  #
  # That was not hypothetical — #347 rewrote the authorization on memory DELETE,
  # touching only `internal/handler/memory_handler.go`, and the gate no-op'd to
  # green because the handler was not listed here. When adding a memory code
  # path, add it here in the same PR.
  MEMORY_PATHS: |
    internal/handler/memory_handler.go
    internal/domain/memory.go
    internal/service/memory_service.go
    internal/repository/postgres/memory_repo.go
    internal/repository/postgres/memory_edges_repo.go
    internal/repository/postgres/memory_chunk_rank.go
    internal/repository/postgres/memory_chunk_repo.go
    internal/mcp/tools.go
    internal/mcp/server.go
    internal/reconciler/
    pkg/sdk/memories.go
    scripts/memory-bench/

jobs:
  # ---------------------------------------------------------------------------
  # THE REQUIRED ARM (ADR-0003): builds `cmd/api` from the PR head and measures
  # THAT. Everything below it in this file measures the deployed server, which
  # is a different question and never the PR's.
  #
  # The defect this replaces: `Memory recall gate` was required on every PR and
  # took its target from `secrets.MESH_API_URL` — production. Nothing in this
  # file built the branch (the two `go build` steps compile `mesh-mcp`, the
  # CLIENT, from another repo). So the required check reported a confident green
  # about a binary the PR did not contain. #388/#389/#391 each passed that way
  # while carrying the regression that took every new memory out of the dense
  # arm; the check could not have seen it, by construction.
  # ---------------------------------------------------------------------------
  recall-gate-branch:
    name: Memory recall gate (branch)
    runs-on: ubuntu-latest
    # ~10 min of bench against a local build, plus build + model download on a
    # cold cache. Generous rather than tight: a timeout here reads as a gate
    # failure, and this is the arm that blocks merges.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write

    services:
      # Stock postgres:16 is enough — `migrations/20260315044_memories_vector_columns.sql`
      # stores embeddings as TEXT and does the cosine in application code
      # specifically so pgvector is not a database-level requirement.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (gate self-checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Runs on EVERY PR, before the scope check — these guard the gate against
      # going blind, so they must not be skipped by the very no-op they exist to
      # detect. Stdlib only: no secrets, no network, ~1s.
      #
      # A red here means "this PR would make the recall gate stop enforcing" —
      # e.g. it adds a memory source file MEMORY_PATHS does not cover, or it
      # edits the dense-arm control until BM25 can answer it. That IS a
      # legitimate merge block, and unlike an infra failure the author can clear
      # it. These moved here from the prod job because THIS is now the job that
      # runs on every PR.
      - name: Gate self-checks (blind-spot, mode, arm, control)
        run: |
          python scripts/memory-bench/test_gate_blindness.py
          python scripts/memory-bench/test_gate_modes.py
          python scripts/memory-bench/test_gate_arm.py
          python scripts/memory-bench/test_gold_rank.py
          python scripts/memory-bench/test_fixture_isolation.py
          python scripts/memory-bench/dense_arm_control.py --selftest

      - name: Does this change touch memory?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the PR's own base..head — never the merge ref (a guard that reads
          # the merge ref deadlocks every open PR).
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"; echo "$changed"
          relevant=false
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if echo "$changed" | grep -qE "^${p}"; then relevant=true; fi
          done <<< "$(printf '%s' "${MEMORY_PATHS}" | tr -d '\r')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "memory-relevant: $relevant"

      - name: No memory paths touched — nothing to gate
        if: steps.scope.outputs.relevant != 'true'
        run: |
          echo "This PR changes no memory-path file; the recall gate is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Keyed on the pinned model name, so a model bump busts the cache rather
      # than silently serving the old weights against the new baseline.
      - name: Cache the CI embedder model
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: scripts/memory-bench/.fastembed_cache
          key: fastembed-bge-small-en-v1.5-v1

      - name: Install Python dependencies
        if: steps.scope.outputs.relevant == 'true'
        # No `openai` — this arm must not acquire a paid dependency. fastembed is
        # the local ONNX runtime for the embedder; see ci_embedder.py for why a
        # hash stub would make this whole job blind.
        run: pip install mcp httpx fastembed

      - name: Start the local embedder
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd scripts/memory-bench
          nohup python ci_embedder.py --port 8099 --cache-dir .fastembed_cache \
            > embedder.log 2>&1 &
          echo $! > embedder.pid
          # ci_embedder loads the model BEFORE binding the port, so /healthz
          # answering is proof the weights are resident — not merely that a
          # process started.
          for i in $(seq 180); do
            if curl -sf http://127.0.0.1:8099/healthz > /dev/null; then
              echo "embedder ready after ${i}s"; curl -s http://127.0.0.1:8099/healthz; exit 0
            fi
            sleep 1
          done
          echo "::error::embedder never became ready"; cat embedder.log; exit 1

      - name: Run migrations
        if: steps.scope.outputs.relevant == 'true'
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations up

      - name: Build + start the API from THIS branch
        if: steps.scope.outputs.relevant == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mesh
          DB_PASSWORD: mesh
          DB_NAME: mesh
          DB_SSL_MODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          NATS_URL: "nats://localhost:4222"
          JWT_SECRET: "ci-recall-gate-secret-32chars-min!"
          JWT_ISSUER: "mesh-ci"
          # ~1900 `remember` calls per pass would otherwise hit APIRPM (600) and
          # the resulting 429s would score as recall misses.
          MESH_RATE_LIMIT_ENABLED: "false"
          MESH_ALLOW_REGISTRATION: "true"
          # The OpenAI wire shape, served locally by ci_embedder.py. 384 dims to
          # match prod (migrations/20260727082_memory_chunks.sql).
          EMBEDDING_PROVIDER: openai
          EMBEDDING_ENDPOINT: "http://127.0.0.1:8099"
          EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
          EMBEDDING_DIMENSIONS: "384"
          EMBEDDING_API_KEY: "not-used-by-the-local-embedder"
          APP_ENV: test
        run: |
          go build -o /tmp/mesh-api ./cmd/api
          nohup /tmp/mesh-api > api.log 2>&1 &
          echo $! > api.pid
          echo "MESH_API_URL=http://127.0.0.1:8005" >> "$GITHUB_ENV"

      # Mints its own workspace + agent key against the ephemeral database.
      # `secrets.MESH_BENCH_KEY` is deliberately NOT used here: it is prod's, and
      # using it would point this arm back at the thing it exists to stop
      # measuring. It also blocks until /health really answers, instead of the
      # `curl || sleep` loop that prints "ready" unconditionally.
      - name: Bootstrap a bench workspace + agent key
        if: steps.scope.outputs.relevant == 'true'
        run: |
          python scripts/memory-bench/ci_bootstrap.py \
            --api-url http://127.0.0.1:8005 >> "$GITHUB_ENV" \
            || { echo "::error::bootstrap failed"; tail -50 api.log; exit 1; }

      - name: Checkout evc-mesh-mcp
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Cross-compile mesh-mcp (linux/amd64)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin

      # ---------------------------------------------------------------------
      # The dense-arm control, run BEFORE the scored bench so a severed vector
      # arm is named as such rather than showing up as an unexplained score.
      #
      # The scored dataset cannot do this job: every question in it is answerable
      # from the words it uses, so BM25 carries them alone. Run 30316983402
      # scored `overall 0.9583` — its best ever — with the dense arm returning
      # zero rows for the entire haystack. This question is keyword-dark by
      # construction; see dense_arm_control.py for the measurement.
      # ---------------------------------------------------------------------
      - name: Dense-arm control — the vector arm must be contributing
        id: control_alive
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-ctl
        run: |
          cd scripts/memory-bench
          set +e
          python dense_arm_control.py --expect alive 2>&1 | tee control_alive.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Same contract as the scored gate: 1 blocks, 2 never does.
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      - name: Run the recall gate against the branch build
        id: gate
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --retrieval-only --arm branch \
            --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e

          reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
          if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval' gate.log; then
            rc=2
            reason="no-baseline — the gate compared against nothing"
          fi
          [ -z "$reason" ] && reason="unspecified"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## Memory recall gate (branch build)"
            echo
            echo "Target: \`cmd/api\` built from \`${{ github.sha }}\`, ephemeral postgres,"
            echo "local \`BAAI/bge-small-en-v1.5\`. Not comparable with the prod canary's numbers."
            echo
            case "$rc" in
              0) echo "✅ **PASS** — recall measured on THIS branch, within tolerance of the branch baseline." ;;
              1) echo "❌ **REGRESSION** — recall dropped below the branch baseline in the same retrieval mode."
                 echo "This PR makes memory measurably worse. This is the only condition that blocks the merge." ;;
              2) echo "### ⚠️ INCONCLUSIVE — nothing was measured, so nothing was enforced"
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "\`arm-mismatch\` means the baseline on disk was captured against a"
                 echo "different target than this run — re-snap with \`--arm branch\`, do not"
                 echo "hand-edit. A red nobody can clear gets bypassed, so this does not fail"
                 echo "the check; the alert below is what stops it being silent." ;;
              *) echo "❌ Gate exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then exit "$rc"; fi
          exit 0

      # ---------------------------------------------------------------------
      # POSITIVE CONTROL ON THE CONTROL — the step that has been missing every
      # previous time this harness went blind.
      #
      # "Gold was retrieved" proves the dense arm works only if the same
      # assertion FAILS when the dense arm is gone. So: kill the embedder, leave
      # the binary and the corpus exactly as they are, and require the control to
      # miss. If it still finds gold, BM25 could reach it all along and every
      # green the control ever produced was uninformative.
      #
      # Runs LAST because it destroys the dense arm for the rest of the job.
      # ---------------------------------------------------------------------
      - name: Power check — with the dense arm off, the control must MISS
        id: control_dead
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-pwr
        run: |
          kill "$(cat scripts/memory-bench/embedder.pid)" 2>/dev/null || true
          # Recall fails OPEN on an embed error (memory_service.go: log, count,
          # return) — so this yields bm25-only rather than a 500, which is
          # exactly the degraded shape being simulated.
          for i in $(seq 20); do
            curl -sf http://127.0.0.1:8099/healthz > /dev/null || break
            sleep 1
          done
          cd scripts/memory-bench
          set +e
          python dense_arm_control.py --expect dead 2>&1 | tee control_dead.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "### Dense-arm control — power check"
            echo
            case "$rc" in
              0) echo "✅ The control goes red when the dense arm is removed, so its green means something." ;;
              1) echo "❌ **The control has no power** — gold was still found with the dense arm off."
                 echo "Every green it has produced was uninformative. See \`control_dead.log\`." ;;
              *) echo "⚠️ Power check inconclusive (\`$rc\`) — the dense arm could not be confirmed off." ;;
            esac
            echo
            echo '```'
            tail -20 control_dead.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      - name: Server logs (always — a boot failure is invisible otherwise)
        if: always() && steps.scope.outputs.relevant == 'true'
        run: |
          echo "::group::mesh-api"; tail -200 api.log 2>/dev/null || true; echo "::endgroup::"
          echo "::group::embedder"; tail -50 scripts/memory-bench/embedder.log 2>/dev/null || true; echo "::endgroup::"

      - name: Upload branch-arm results
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-gate-branch-results
          path: |
            scripts/memory-bench/gate.log
            scripts/memory-bench/control_alive.log
            scripts/memory-bench/control_dead.log
            scripts/memory-bench/embedder.log
            scripts/memory-bench/results/
            api.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The prod CANARY (ADR-0003). Same harness, different question: "is what we
  # deployed still good?" It is no longer a PR gate — it never could answer the
  # PR's question, and presenting its green as if it did is the defect that
  # opened #2a079432. Runs on push to main (post-deploy), nightly, and dispatch.
  # ---------------------------------------------------------------------------
  recall-gate:
    name: Memory recall canary (prod)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A recall pass is ~17 min, so a `--repeat 3` capture needs the same headroom
    # the advisory arm already takes. Unchanged (30) for every PR and nightly.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 30 }}
    permissions:
      contents: read
      # The gate raises an out-of-band alert when it is BLIND (INCONCLUSIVE), so
      # that a safety net that stopped enforcing anything always pages somebody
      # instead of quietly passing.
      issues: write

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs on EVERY PR, before (and independently of) the scope check — these
      # are the tests that guard the gate against going blind, so they must not
      # be skipped by the very no-op they exist to detect. Stdlib only: no
      # secrets, no network, ~1s.
      #
      # A red here means "this PR would make the recall gate stop enforcing" —
      # e.g. it adds a memory source file that MEMORY_PATHS does not cover. That
      # IS a legitimate merge block, and unlike an infra failure the author can
      # clear it: list the file.
      - name: Set up Python (gate self-checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate self-checks (blind-spot + mode logic)
        run: |
          python scripts/memory-bench/test_gate_blindness.py
          python scripts/memory-bench/test_gate_modes.py
          python scripts/memory-bench/test_gate_arm.py
          python scripts/memory-bench/test_gold_rank.py
          python scripts/memory-bench/test_fixture_isolation.py
          python scripts/memory-bench/dense_arm_control.py --selftest

      # One source of truth for "this dispatch is a capture, not a verdict". Two
      # steps have to agree on it — the capture runs, the gate must not — and two
      # copies of the same expression is how they drift into either both running
      # or neither.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (inputs.update_baseline && (inputs.baseline_arm == 'retrieval' || inputs.baseline_arm == 'both')) && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      - name: Does this change touch memory?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the PR's own base..head — never the merge ref (a guard that reads
          # the merge ref deadlocks every open PR).
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"; echo "$changed"
          relevant=false
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if echo "$changed" | grep -qE "^${p}"; then relevant=true; fi
          done <<< "$(printf '%s' "${MEMORY_PATHS}" | tr -d '\r')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "memory-relevant: $relevant"

      - name: No memory paths touched — nothing to gate
        if: steps.scope.outputs.relevant != 'true'
        run: |
          echo "This PR changes no memory-path file; the recall gate is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout evc-mesh-mcp
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Set up Go
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      - name: Cross-compile mesh-mcp (linux/amd64)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin

      - name: Install Python dependencies
        if: steps.scope.outputs.relevant == 'true'
        # Python itself is already set up above for the gate self-checks.
        # No `openai` — the recall gate must not acquire a paid dependency.
        run: pip install mcp httpx

      # ---------------------------------------------------------------------
      # Baseline capture for the REQUIRED arm. #363 added this path for the
      # advisory arm and deliberately left the required arm's baseline alone;
      # this is the same path extended to cover it, rather than a second capture
      # route with its own drift.
      #
      # It runs HERE for the same reason the advisory capture does — same runner,
      # same MESH_BENCH_KEY, same embedder as the PR runs it will judge — and it
      # matters MORE here: this is the baseline behind a required check, so a
      # laptop capture against a different key would make every PR's verdict a
      # comparison across two environments.
      #
      # `run_ci.py` refuses to write this file at all if the run was incomplete or
      # served in a degraded mode, so a capture that reaches the artifact is a
      # 24/24 hybrid run by construction, not by the operator remembering to read
      # the log.
      # ---------------------------------------------------------------------
      - name: Re-snap the recall baseline
        id: resnap
        if: steps.scope.outputs.relevant == 'true' && steps.mode.outputs.capture == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run: on `push` to main, on the nightly
          # schedule, and on any dispatch that asks for the paid arm, recall-gate
          # and the advisory arm run CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace. A run-only nonce would leave those two
          # colliding with each other. (PR runs skip the advisory arm, so they are
          # single-job and were never affected by that particular overlap.)
          #
          # The two cases where it does overlap are the load-bearing ones: the
          # push run is what validates main after a merge, and the nightly is
          # where a baseline is captured — a threshold snapped while the other job
          # deletes fixtures underneath it becomes a permanently wrong floor.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --retrieval-only --update-baseline \
            --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "## Recall baseline re-snap (required arm)"
            echo
            if [ "$rc" = "0" ]; then
              echo "Captured over \`${{ inputs.repeat || '3' }}\` pass(es) on a complete,"
              echo "\`hybrid\`-served run. Download the \`recall-gate-baseline\` artifact and"
              echo "commit \`scripts/memory-bench/baseline_retrieval.json\`."
              echo
              echo '```json'
              cat baseline_retrieval.json
              echo '```'
            else
              reason="$(grep -m1 '^GATE_REASON:' resnap.log | sed 's/^GATE_REASON: *//' || true)"
              echo "⚠️ Capture exited $rc — \`baseline_retrieval.json\` was **NOT** written."
              echo
              echo "**Reason:** \`${reason:-unspecified}\`"
              echo
              echo "\`capture-refused\` means the run was not a sound basis for a required"
              echo "check's threshold — incomplete sample or degraded retrieval mode. Fix the"
              echo "cause and re-dispatch; do not hand-edit the baseline."
            fi
            echo
            echo '```'
            tail -40 resnap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the re-snapped recall baseline
        if: always() && steps.mode.outputs.capture == 'true' && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-gate-baseline
          path: |
            scripts/memory-bench/baseline_retrieval.json
            scripts/memory-bench/resnap.log
          retention-days: 30

      - name: Run recall gate (no LLM)
        id: gate
        if: steps.scope.outputs.relevant == 'true' && steps.mode.outputs.capture != 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run: on `push` to main, on the nightly
          # schedule, and on any dispatch that asks for the paid arm, recall-gate
          # and the advisory arm run CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace. A run-only nonce would leave those two
          # colliding with each other. (PR runs skip the advisory arm, so they are
          # single-job and were never affected by that particular overlap.)
          #
          # The two cases where it does overlap are the load-bearing ones: the
          # push run is what validates main after a merge, and the nightly is
          # where a baseline is captured — a threshold snapped while the other job
          # deletes fixtures underneath it becomes a permanently wrong floor.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1: the harness prints its tracebacks to stderr, so without this the
          # uploaded gate.log — the only artifact anyone reads after the fact —
          # contains the "could not measure" verdict but not the reason for it.
          python run_ci.py --retrieval-only --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e

          # run_ci emits a machine-readable `GATE_REASON: <kind> — <detail>` line on
          # every INCONCLUSIVE path. Belt-and-braces: an older run_ci returns 0 with
          # no baseline, which is a VACUOUS GREEN (it compared against nothing) —
          # treat it as inconclusive too. A gate that enforces nothing must never
          # look green-and-healthy.
          reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
          if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval.json' gate.log; then
            rc=2
            reason="no-baseline — the gate compared against nothing"
          fi
          [ -z "$reason" ] && reason="unspecified"

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## Memory recall gate"
            echo
            case "$rc" in
              0) echo "✅ **PASS** — recall measured, comparable, and within tolerance of the baseline." ;;
              1) echo "❌ **REGRESSION** — recall dropped below the baseline **in the same retrieval mode**."
                 echo "This PR makes memory measurably worse. This is the only condition that blocks the merge." ;;
              # The banner is scoped to the REASON KIND. `mode-mismatch` and
              # `mode-unknown` really do measure nothing; `category-unmeasured` and
              # `baseline-sample-mismatch` are per-category and leave every
              # comparable category enforced (decide_verdict ranks REGRESSION above
              # INCONCLUSIVE). One banner for both overstates the partial case, and
              # a banner that overstates gets discounted — after which it also
              # understates, at the exact moment it is telling the truth.
              2) case "${reason%% *}" in
                   category-unmeasured|baseline-sample-mismatch|persistent-errors)
                     echo "### ⚠️ PARTIAL — some categories were not compared on this PR"
                     echo
                     echo "> **This is not total blindness.** Every *comparable* category was measured"
                     echo "> and enforced, and a regression in one of those still fails this check."
                     echo "> The gap is narrower: the categories named below were set aside as"
                     echo "> not-comparable, so a regression **in those** could pass through unseen." ;;
                   *)
                     echo "### ⚠️ INCONCLUSIVE — the recall safety net is **BLIND** for this PR"
                     echo
                     echo "> **Nothing was measured, so nothing was enforced.** A real memory regression"
                     echo "> could pass through this PR unseen." ;;
                 esac
                 echo "> This check is **not failing you** — the cause is infrastructure you cannot"
                 echo "> fix from a PR, and a red check nobody can clear just gets bypassed until"
                 echo "> the whole gate is worthless."
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 case "${reason%% *}" in
                   persistent-errors)
                     echo "One or more questions failed with an error that is **not transient**:"
                     echo "either the message is not an infrastructure blip, or the question spent"
                     echo "its entire retry allowance and every attempt died the same way. Such a"
                     echo "question will fail identically on the next run, so it is not merely"
                     echo "excluded from this score — it is excluded from every score, for ever."
                     echo
                     echo "The percentage budget (\`--max-error-rate\`) cannot express that: it"
                     echo "forgives up to 10% *per run*, which forgives the same 8% permanently."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** the error report in the log"
                     echo "names the question ids and the failing stage. Fix the harness or the"
                     echo "dataset — this one does not clear itself and no re-snap will hide it." ;;
                   baseline-sample-mismatch)
                     echo "A category was measured on a different number of questions than the baseline"
                     echo "was captured on. \`1.000\` over 2 questions and \`0.500\` over 4 are two"
                     echo "different measurements, not a 50% drop — so they are not compared."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** re-snap the baseline so its"
                     echo "denominator matches — \`python run_ci.py --retrieval-only --update-baseline\`." ;;
                   category-unmeasured)
                     echo "Those categories lost questions to a harness error (see the log below), which"
                     echo "widens the per-question quantum past the tolerance — at n=3 one unlucky"
                     echo "answer moves the score by 1/3 > 0.25 and would clear the bar on its own."
                     echo
                     echo "**Fix:** stop losing the questions, rather than lowering the bar. The error"
                     echo "report in the log names the failing stage per question." ;;
                   *)
                     echo "Most common cause: the baseline was captured in one retrieval mode (\`hybrid\`)"
                     echo "but this run was served in another (\`bm25-only\`, i.e. the embedder is down and"
                     echo "\`recall\` failed open). Hit@k is not comparable across modes, so a lower score"
                     echo "here says nothing about this PR's code."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** restore the embedder, then re-snap"
                     echo "the baseline — \`python run_ci.py --retrieval-only --update-baseline\`." ;;
                 esac
                 echo "A tracking issue has been opened/updated so this blindness is not silent." ;;
              *) echo "❌ Gate exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # rc=1 (REGRESSION) is the ONLY blocking condition — measured, comparable,
          # worse. rc=2 (INCONCLUSIVE) must not fail the check: see the alert step.
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then exit "$rc"; fi
          exit 0

      # ---------------------------------------------------------------------
      # Blindness must never be silent. INCONCLUSIVE does not block the merge,
      # so the ONLY thing standing between "the safety net stopped working" and
      # "nobody ever noticed" is this alert.
      #
      # ONE tracking issue, not one per PR: we comment on the existing open issue
      # instead of opening a new one, and only when the reason KIND changed (cf.
      # the 292-task alert storm — a poisoned dedup key turns an alert into spam,
      # and spam is ignored, which is the same as having no alert at all).
      # ---------------------------------------------------------------------
      - name: Alert — recall gate is blind (INCONCLUSIVE)
        if: steps.scope.outputs.relevant == 'true' && steps.gate.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Memory recall gate is INCONCLUSIVE (safety net blind)'
          REASON: ${{ steps.gate.outputs.reason }}
          REASON_KIND: ${{ steps.gate.outputs.reason_kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- recall-gate-blind kind=${REASON_KIND} -->"
          # Scoped to the reason kind, for the same reason as the step summary: the
          # per-category kinds leave every comparable category enforced, and an
          # alert that claims total blindness for a partial gap trains its readers
          # to discount it.
          case "$REASON_KIND" in
            category-unmeasured|baseline-sample-mismatch)
              lede="The memory recall gate could not compare **some** categories. Every comparable category was still measured and enforced — a regression in one of those still blocks a merge. What is unguarded is limited to the categories in the reason below, and **a regression in those can merge unnoticed** until this clears." ;;
            *)
              lede="The memory recall gate could not produce a verdict: it measured nothing, so it enforced nothing. Until this clears, **memory regressions can merge unnoticed**." ;;
          esac
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" \
            "$lede" \
            "**Reason:** \`${REASON}\`" \
            "Run: ${RUN_URL}")

          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")

          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body" --label memory,ci 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$body"
            echo "Opened tracking issue."
            exit 0
          fi

          # Storm guard: if the most recent comment (or the issue body, when there
          # are none) already reports THIS reason kind, the alert is already live —
          # adding a copy per PR would bury it.
          last=$(gh issue view "$num" --json comments,body \
                   --jq '(.comments | last | .body) // .body // ""')
          if printf '%s' "$last" | grep -qF "$marker"; then
            echo "Issue #$num already reports '${REASON_KIND}' — not commenting again."
            exit 0
          fi
          gh issue comment "$num" --body "$body"
          echo "Commented on tracking issue #$num."

      # A gate that recovered should stop shouting: close the tracking issue once
      # a real, comparable verdict is produced again.
      - name: Resolve blindness alert (gate is measuring again)
        if: steps.scope.outputs.relevant == 'true' && steps.gate.outputs.rc == '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Memory recall gate is INCONCLUSIVE (safety net blind)'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          [ -z "$num" ] && { echo "No open blindness issue."; exit 0; }
          gh issue close "$num" --comment "Recall gate produced a comparable verdict again (baseline and run in the same retrieval mode). Safety net restored: ${RUN_URL}"

      - name: Upload recall-gate results
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-gate-results
          path: |
            scripts/memory-bench/gate.log
            scripts/memory-bench/results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The advisory arm: paid, LLM-judged, end-to-end. Never a PR merge gate.
  # ---------------------------------------------------------------------------
  memory-bench:
    name: LongMemEval-S end-to-end (advisory)
    runs-on: ubuntu-latest
    # One pass is ~19 min, so a --repeat 3 baseline capture needs room.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 30 }}
    permissions:
      contents: read
      # Advisory does not mean unwatched. An arm that cannot compare must page
      # somebody, or tightening its comparison rules just makes it silent.
      issues: write
    # `baseline_arm: retrieval` is a capture for the OTHER arm — it must not drag
    # the paid job in with it. Without this, re-snapping the free recall baseline
    # would silently also spend an end-to-end capture.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.full_eval ||
         (inputs.update_baseline && inputs.baseline_arm != 'retrieval')))

    steps:
      # Same one-source-of-truth reason as the recall arm: three steps below key
      # off "is this dispatch an end-to-end capture", and `update_baseline` alone
      # is no longer that question — it now also means the other arm.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (inputs.update_baseline && inputs.baseline_arm != 'retrieval') && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      - name: Checkout evc-mesh
        uses: actions/checkout@v4

      - name: Checkout evc-mesh-mcp
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      - name: Cross-compile mesh-mcp (linux/amd64)
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin
          echo "mesh-mcp built: $(file ../mesh-mcp-bin)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openai mcp httpx

      # ---------------------------------------------------------------------
      # Baseline capture. Runs HERE rather than on a maintainer's laptop so the
      # baseline is produced by the same runner, the same MESH_BENCH_KEY and the
      # same chat/judge models as the nightly that will be compared against it —
      # a baseline captured in a different environment is the same class of
      # not-comparable this workflow already exits 2 over.
      # ---------------------------------------------------------------------
      - name: Re-snap the end-to-end baseline
        id: resnap
        if: steps.mode.outputs.capture == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run: on `push` to main, on the nightly
          # schedule, and on any dispatch that asks for the paid arm, recall-gate
          # and the advisory arm run CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace. A run-only nonce would leave those two
          # colliding with each other. (PR runs skip the advisory arm, so they are
          # single-job and were never affected by that particular overlap.)
          #
          # The two cases where it does overlap are the load-bearing ones: the
          # push run is what validates main after a merge, and the nightly is
          # where a baseline is captured — a threshold snapped while the other job
          # deletes fixtures underneath it becomes a permanently wrong floor.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --update-baseline --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## LongMemEval-S baseline re-snap"
            echo
            if [ "$rc" = "0" ]; then
              echo "Captured over \`${{ inputs.repeat || '3' }}\` pass(es). Download the"
              echo "\`memory-bench-baseline\` artifact and commit \`scripts/memory-bench/baseline.json\`."
              echo
              echo '```json'
              cat baseline.json
              echo '```'
            else
              echo "⚠️ Capture exited $rc — the baseline was NOT written. See the log."
            fi
            echo
            echo '```'
            tail -30 resnap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the re-snapped baseline
        if: always() && steps.mode.outputs.capture == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-bench-baseline
          path: |
            scripts/memory-bench/baseline.json
            scripts/memory-bench/resnap.log
          retention-days: 30

      - name: Run LongMemEval-S end-to-end
        if: steps.mode.outputs.capture != 'true'
        id: bench
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run: on `push` to main, on the nightly
          # schedule, and on any dispatch that asks for the paid arm, recall-gate
          # and the advisory arm run CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace. A run-only nonce would leave those two
          # colliding with each other. (PR runs skip the advisory arm, so they are
          # single-job and were never affected by that particular overlap.)
          #
          # The two cases where it does overlap are the load-bearing ones: the
          # push run is what validates main after a merge, and the nightly is
          # where a baseline is captured — a threshold snapped while the other job
          # deletes fixtures underneath it becomes a permanently wrong floor.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1 for the same reason as the recall gate: the harness prints its
          # tracebacks to stderr, and bench.log is the only artifact anyone reads.
          python run_ci.py --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee bench.log
          rc=${PIPESTATUS[0]}
          set -e

          reason="$(grep -m1 '^GATE_REASON:' bench.log | sed 's/^GATE_REASON: *//' || true)"
          [ -z "$reason" ] && reason="unspecified"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## LongMemEval-S (advisory)"
            echo
            case "$rc" in
              0) echo "✅ PASS — measured, comparable, within tolerance of the baseline." ;;
              1) echo "❌ REGRESSION — end-to-end memory quality dropped past the baseline's own spread." ;;
              2) # The scope of the blindness depends on WHICH reason fired, and
                 # saying "measured nothing" when six of seven categories were
                 # enforced normally is not a harmless exaggeration: a banner that
                 # overstates gets discounted, and then it understates on the day
                 # the arm really is fully dark.
                 case "${reason%% *}" in
                   category-unmeasured)
                     echo "### ⚠️ INCONCLUSIVE — **one or more categories** went unmeasured"
                     echo
                     echo "> **Partial blindness, not total.** Every other category was compared and"
                     echo "> enforced normally; a regression in one of those would still have been"
                     echo "> reported. What is missing is the categories named below, which lost"
                     echo "> questions to harness errors and were set aside rather than scored on a"
                     echo "> sample too small to compare." ;;
                   *)
                     echo "### ⚠️ INCONCLUSIVE — this arm measured nothing"
                     echo
                     echo "> Advisory does not mean unwatched. Nothing was compared, so nothing was"
                     echo "> checked — and because this arm never blocks a merge, a silent"
                     echo "> INCONCLUSIVE is indistinguishable from a healthy pass. A tracking issue"
                     echo "> has been opened/updated so it is not silent." ;;
                 esac
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "* \`harness-errors\` — the chat/judge API is down or out of credit."
                 echo "* \`mode-unknown\` / \`mode-mismatch\` — the baseline and this run were served"
                 echo "  in different retrieval modes, or \`baseline.json\` predates mode-scoping."
                 echo "  Re-snap it: run this workflow with **update_baseline**."
                 echo "* \`no-baseline\` — there is nothing to compare against at all."
                 echo "* \`category-unmeasured\` — **partial**: specific categories lost questions to"
                 echo "  harness errors, so their surviving sample no longer supports the tolerance."
                 echo "  The other categories were still enforced. Fix the harness error, not the bar."
                 echo "* \`no-eligible-category\` — the baseline's recorded run-to-run spread is"
                 echo "  wider than its own scores everywhere, so no category could fail." ;;
              *) echo "❌ Eval exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Same rule as the recall gate, for the same reason. rc=2 is an INFRA
          # failure (judge/chat API out of credit) — nothing was measured, so
          # there is nothing to report red about. Failing here paints every push
          # to main red for a cause no author can fix, and a check that is red
          # forever is one people learn to scroll past — which is how the real
          # rc=1 would get ignored too. Advisory means advisory: an unmeasurable
          # run is a loud no-op, a measured regression still shouts.
          if [ "$rc" = "2" ]; then
            echo "::warning title=LongMemEval-S inconclusive::The advisory eval measured nothing ($reason)."
            exit 0
          fi
          exit $rc

      # ---------------------------------------------------------------------
      # The counterpart to tightening this arm's comparison rules. Before, an
      # invalid comparison was published as `✗ REGRESSION` — wrong, but at least
      # visible. Now it exits 2, which does not fail the job, so without this step
      # the fix would trade a noisy red for a silent no-op on an arm nobody is
      # required to look at. Same one-issue / dedup-on-reason-kind shape as the
      # recall gate: an alert that fires per run is spam, and spam is ignored.
      # ---------------------------------------------------------------------
      - name: Alert — advisory arm measured nothing (INCONCLUSIVE)
        if: steps.bench.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          REASON: ${{ steps.bench.outputs.reason }}
          REASON_KIND: ${{ steps.bench.outputs.reason_kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- advisory-arm-blind kind=${REASON_KIND} -->"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" \
            "The end-to-end LongMemEval arm produced no verdict: it compared nothing, so it checked nothing. It does not block merges, so this would otherwise be indistinguishable from a nightly pass." \
            "**Reason:** \`${REASON}\`" \
            "Run: ${RUN_URL}")

          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")

          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body" --label memory,ci 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$body"
            echo "Opened tracking issue."
            exit 0
          fi

          last=$(gh issue view "$num" --json comments,body \
                   --jq '(.comments | last | .body) // .body // ""')
          if printf '%s' "$last" | grep -qF "$marker"; then
            echo "Issue #$num already reports '${REASON_KIND}' — not commenting again."
            exit 0
          fi
          gh issue comment "$num" --body "$body"
          echo "Commented on tracking issue #$num."

      - name: Resolve advisory blindness alert (arm is measuring again)
        if: steps.bench.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          [ -z "$num" ] && { echo "No open advisory-blindness issue."; exit 0; }
          gh issue close "$num" --comment "The advisory arm produced a comparable verdict again: ${RUN_URL}"

      - name: Upload benchmark results
        if: always() && steps.mode.outputs.capture != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-bench-results
          path: |
            scripts/memory-bench/bench.log
            scripts/memory-bench/results/
          retention-days: 30
