name: Memory Benchmark (LongMemEval-S)

# Two arms, split by cost and determinism:
#
#   recall-gate  — free, no LLM, deterministic. Scores recall@k against the
#                  dataset's gold answer_session_ids. Runs on EVERY PR (see the
#                  no-paths-filter note below) and is the arm intended to become
#                  a required check.
#
#   memory-bench — full LongMemEval (recall → chat model → LLM judge). Depends on
#                  a paid API and a nondeterministic judge, so it is ADVISORY and
#                  runs on a schedule/dispatch, never as a PR merge gate. It used
#                  to run on PRs, where it failed on every single one since it
#                  landed (2026-07-04) with `chat_complete failed: 402` — a red
#                  check nobody can act on is worse than no check.

on:
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Per-category regression tolerance (default: 0.25 — 1-question variance on 4q/category CI subset)'
        required: false
        default: '0.25'
      full_eval:
        description: 'Also run the paid end-to-end LongMemEval (chat + LLM judge)'
        type: boolean
        required: false
        default: false
      update_baseline:
        description: >-
          Re-snap a baseline instead of judging against it (see `baseline_arm` for
          which one). Uploads the new file as an artifact to commit by hand —
          capture it HERE, not on a laptop: a baseline snapped against a different
          agent key, chat model or embedder is not comparable to the run that will
          be judged against it, and that is the same class of not-comparable this
          workflow already exits 2 over.
        type: boolean
        required: false
        default: false
      baseline_arm:
        description: >-
          Which baseline `update_baseline` re-snaps. `end-to-end` writes
          baseline.json in the paid advisory arm. `retrieval` writes
          baseline_retrieval.json in the prod canary. `retrieval-branch` writes
          baseline_retrieval_branch.json in the branch arm — the one behind the
          REQUIRED check, so its capture is refused outright unless the run was
          complete and served in `hybrid` mode. `both` re-snaps end-to-end and
          retrieval, each in its own arm. The three retrieval files are NOT
          interchangeable: each records its own `arm` and one used in the wrong
          arm is refused as `arm-mismatch`.
        type: choice
        options:
          - end-to-end
          - retrieval
          - retrieval-branch
          - both
        required: false
        default: end-to-end
      expect_commit:
        description: >-
          Override the commit the PROD CANARY requires prod to be serving before
          it will score. Empty (the default) means "derive it": `github.sha` on a
          main-ref run, and no pin at all otherwise. Supply a value to pin a run
          on a branch, which is also how the refusal itself is proved — dispatch
          with a commit prod is not serving and the canary must exit 2 naming
          `version-mismatch`. Has no effect on the required branch arm, which
          builds and measures its own server and has no deployed version to race.
        required: false
        default: ''
      mcp_ref:
        description: >-
          Ref of `entire-vc/evc-mesh-mcp` to build the bench CLIENT from. Empty
          (the default) means that repo's default branch — which is what every
          non-dispatch trigger gets and what every committed baseline was
          captured against, so leaving it empty reproduces today's behaviour
          exactly.

          Supply a branch to measure a pull request in the CLIENT. That is not a
          nicety: the client is not a thin wrapper. `handleRecall` resolves a
          query profile and OVERRIDES the caller's parameters — it can force
          `apply_recency_decay` on over an explicit false, replace `order_by`,
          raise `min_importance`, widen `limit` — so a large share of the
          behaviour this bench scores is decided by this binary. Until this
          input existed all three arms checked out the client with no `ref:`,
          which meant every arm always built `main` and no client PR was
          measurable by this harness at all (#faf92388). One such change moved a
          gold answer from rank 1 to rank 32, out of the scored window, and the
          gate could not see it.

          A run on a non-default ref is reported INCONCLUSIVE against the
          committed baseline (`GATE_REASON: mcp-ref-mismatch`) rather than
          scored: the baseline was captured on a different client, so the
          comparison would be arithmetically valid and factually meaningless.
          To A/B two clients, dispatch twice and diff the two
          `results/recall_gate.json` artifacts, which now record the ref and the
          resolved commit.
        required: false
        default: ''
      repeat:
        description: >-
          Passes to average when re-snapping (default 3). One pass is a coin toss:
          4 questions per category means one flipped answer moves it 0.25, and
          single-session-assistant was observed at 1.000/0.250/1.000 on three
          consecutive nightlies of identical code.
        required: false
        default: '3'

  # NOTE: deliberately NO `paths:` filter on pull_request. A required check born
  # in a path-filtered workflow never reports on PRs that miss the filter, and a
  # never-reported required context blocks that PR forever (cf. evc-mesh#320).
  # The gate runs on every PR and no-ops internally when no memory path changed.
  pull_request:
    branches: [main]

  # Same reasoning as the PR trigger, one level up: `Memory recall gate` is a
  # required context, a merge queue waits for the required contexts on the
  # `merge_group` event, and a workflow that does not list that event produces
  # none of them. Without this the queue cannot be enabled at all — an entry
  # would wait forever for a check that is never requested.
  #
  # Deliberately NO `paths:` filter here either — a path-filtered required check
  # never reports on the groups it filters out, and the queue would wait forever.
  # The narrowing happens IN-JOB instead, in `Does this change touch memory?`,
  # which diffs the group's own `base_sha..head_sha` exactly as the PR arm diffs
  # `base..head`. This used to short-circuit to relevant=true on every non-PR
  # event; that cost the queue 29-42 min per group for batches with no memory
  # path in them at all. Rationale and fail-closed rules: scope_relevant.sh.
  merge_group:
    types: [checks_requested]

  push:
    branches: [main]
    paths:
      - 'internal/service/memory_service.go'
      - 'internal/repository/postgres/memory_repo.go'
      - 'internal/repository/postgres/memory_edges_repo.go'
      - 'internal/reconciler/**'
      - 'scripts/memory-bench/**'

  schedule:
    # Nightly 04:00 UTC — the paid end-to-end eval lives here, not on PRs.
    - cron: '0 4 * * *'

env:
  # Every file whose behaviour the gate is supposed to protect. A memory file
  # MISSING from this list is the worst failure mode available to a required
  # check: the job reports green having measured nothing, and the "required"
  # badge certifies a run that never happened.
  #
  # That was not hypothetical — #347 rewrote the authorization on memory DELETE,
  # touching only `internal/handler/memory_handler.go`, and the gate no-op'd to
  # green because the handler was not listed here. When adding a memory code
  # path, add it here in the same PR.
  #
  # ⚠️ NAMED GAP, so nobody reads this list as complete coverage of recall.
  # `internal/mcp/tools.go` and `internal/mcp/server.go` used to be listed here.
  # They were this repo's DUPLICATE of the MCP server and were deleted with it
  # (Mesh #e85e4e05). The surviving implementation — the one every agent's
  # `recall` actually goes through — lives in entire-vc/evc-mesh-mcp, a
  # different repository, and a `paths:` filter cannot see across repositories.
  # Leaving the two entries in place would have been WORSE than removing them:
  # a path that can never change again is a line that looks like coverage and
  # measures nothing, which is exactly the #347 failure wearing the opposite
  # mask. Recall-side changes in evc-mesh-mcp are therefore NOT gated by this
  # job today. Closing that needs a gate in that repository, not a line here.
  MEMORY_PATHS: |
    internal/handler/memory_handler.go
    internal/domain/memory.go
    internal/service/memory_service.go
    internal/service/memory_sanitizer.go
    internal/repository/postgres/memory_repo.go
    internal/repository/postgres/memory_edges_repo.go
    internal/repository/postgres/memory_chunk_rank.go
    internal/repository/postgres/memory_chunk_repo.go
    internal/reconciler/
    pkg/sdk/memories.go
    scripts/memory-bench/

jobs:
  # ---------------------------------------------------------------------------
  # THE REQUIRED ARM (ADR-0003): builds `cmd/api` from the PR head and measures
  # THAT. Everything below it in this file measures the deployed server, which
  # is a different question and never the PR's.
  #
  # The defect this replaces: `Memory recall gate` was required on every PR and
  # took its target from `secrets.MESH_API_URL` — production. Nothing in this
  # file built the branch (the two `go build` steps compile `mesh-mcp`, the
  # CLIENT, from another repo). So the required check reported a confident green
  # about a binary the PR did not contain. #388/#389/#391 each passed that way
  # while carrying the regression that took every new memory out of the dense
  # arm; the check could not have seen it, by construction.
  # ---------------------------------------------------------------------------
  # The NAME is load-bearing and deliberately unchanged from the job this
  # replaces. `main`'s branch protection requires the literal context string
  # "Memory recall gate" with `enforce_admins: true`; GitHub matches a required
  # context against the check-run NAME, not the job id. So:
  #   - naming this job anything else leaves the required context unproduced on
  #     every PR that carries this file — mergeStateStatus BLOCKED forever, with
  #     no override available to anyone (evc-mesh#320, and this PR itself sat
  #     BLOCKED at 14 green checks until the name went back);
  #   - and moving the requirement to a new string is not a free swap either: it
  #     instantly BLOCKS every other open PR, because they still produce the old
  #     name.
  # Inheriting the name is the only edit that needs zero admin action and leaves
  # no window in which memory is gated by nothing. The job id below may change
  # freely; this line may not.
  recall-gate-branch:
    name: Memory recall gate
    runs-on: ubuntu-latest
    # Sized against the job's MEASURED worst case, not against its median and
    # not against an estimate. The comment here used to say "~10 min of bench
    # ... generous rather than tight" while the budget was 45 and the real thing
    # takes 40+. Measured 2026-08-22, then re-derived independently by a second
    # pass over the workflow's FULL run history (150 runs), job-level timings for
    # this job only:
    #
    #   measuring runs that COMPLETED : 39.97, 40.28, 40.43, 40.63 min  (n=4)
    #   runs killed by this timeout   : 45.40, 45.42, 45.42, 45.45 min  (n=4)
    #   no-op runs (memory untouched) : 0.7 - 1.3 min
    #
    # Read the second row before raising this by a notch: those runs did not
    # finish, so 45.4 is a floor on what they needed, not what they needed.
    #
    # WHERE THE TIME ACTUALLY GOES, because that is what sizes the budget.
    # Almost none of it is bench work. The gate step's log shows questions ending
    # in the harness's `MESH_MCP_HTTP_TIMEOUT_SECS: 120` deadline —
    # `[NN/24] ... ! (12X.Xs)` — while the ones that beat the embed queue return
    # in ~4s. The split VARIES per run and the bad case is the one that sizes
    # this: run 32590095200 (completed) was 16/24 timed out, run 32590768351
    # (killed) was 20/20 of the questions it reached. That is the blindness
    # tracked in issue #587, open since 2026-08-17, and it is NOT fixed here.
    # This budget only has to be large enough that a blind run still REACHES a
    # verdict instead of being killed mid-question:
    #
    #   worst case = 24 questions * ~124.7s = 49.9 min of pure client timeout
    #              + 2.5-2.9 min setup-to-gate-start  (measured, not guessed)
    #              + 4.0 min power check              (measured)
    #              ~= 57 min
    #
    # So 60 would have been another coin flip, three minutes from losing — the
    # same mistake as 45, just later in the distribution. 75 leaves ~18 min /
    # ~30% over the empirical worst case. The asymmetry justifies the slack:
    # overshooting costs runner minutes on a run that was already dead,
    # undershooting turns a REQUIRED check under `enforce_admins: true` red for
    # every PR touching a memory path, with no override for anyone — and it
    # presents as `cancelled`, which reads like an aborted run rather than a
    # gate verdict, so the next person debugs their own branch first (#739 lost
    # two consecutive runs and a session to exactly that misread).
    #
    # Raise this WITH a fresh measurement, not by instinct — a stale reason is
    # how it got to 45. Better than raising it: close #587, and the worst case
    # above collapses from ~50 min of timeouts to a few minutes of real work.
    #
    # A capture (`update_baseline`) runs the whole bench `repeat` times, so it
    # keeps the same 120 it always had.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 75 }}
    permissions:
      contents: read
      issues: write

    services:
      # Pulled from mirror.gcr.io, not registry-1.docker.io — this job is the
      # required "Memory recall gate" context under `enforce_admins: true`, so a
      # container pull failure here blocks every PR with no override for anyone,
      # the repo owner included. GitHub Actions starts `services:` containers in
      # an "Initialize containers" step BELOW this workflow's own steps, which
      # runs before the harness's INCONCLUSIVE (exit 2) path exists to catch it —
      # a Docker Hub blip therefore surfaces as a hard job failure indistinguishable
      # from a real gate red, not as the "could not measure" signal the harness
      # was built to give (#31cc6f73, live: PR #551 knocked out of the merge queue
      # by `context deadline exceeded` against registry-1.docker.io on
      # 2026-08-10, run 31376506182). mirror.gcr.io is Google's public read-through
      # cache of Docker Hub's `library/*` images — same tags, no credentials, and
      # a different network path than Docker Hub itself, so an outage on one
      # rarely takes out the other. Verified all three resolve there via
      # `docker manifest inspect mirror.gcr.io/library/<image>` before landing.
      #
      # Stock postgres:16 is enough — `migrations/20260315044_memories_vector_columns.sql`
      # stores embeddings as TEXT and does the cosine in application code
      # specifically so pgvector is not a database-level requirement.
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: mirror.gcr.io/library/nats:2-alpine
        ports:
          - 4222:4222

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python (gate self-checks)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Runs on EVERY PR, before the scope check — these guard the gate against
      # going blind, so they must not be skipped by the very no-op they exist to
      # detect. Stdlib only: no secrets, no network, ~1s.
      #
      # A red here means "this PR would make the recall gate stop enforcing" —
      # e.g. it adds a memory source file MEMORY_PATHS does not cover, or it
      # edits the dense-arm control until BM25 can answer it. That IS a
      # legitimate merge block, and unlike an infra failure the author can clear
      # it. These moved here from the prod job because THIS is now the job that
      # runs on every PR.
      # `test_the_required_job_invokes_every_self_check` pins this list against
      # the directory: a self-check that exists but is not named here guards
      # nothing, which is how test_gate_dense_arm.py and
      # test_check_captured_baseline.py sat unwired while the README credited
      # them as the pin for their failure mode.
      - name: Gate self-checks (blind-spot, mode, arm, control, ages, client)
        run: |
          python scripts/memory-bench/test_mcp_ref.py
          python scripts/memory-bench/test_gate_blindness.py
          python scripts/memory-bench/test_gate_modes.py
          python scripts/memory-bench/test_gate_arm.py
          python scripts/memory-bench/test_gate_dense_arm.py
          python scripts/memory-bench/test_gate_scope.py
          python scripts/memory-bench/test_check_captured_baseline.py
          python scripts/memory-bench/test_gold_rank.py
          python scripts/memory-bench/test_fixture_isolation.py
          python scripts/memory-bench/test_serving_version.py
          python scripts/memory-bench/test_classify_cancelled_arm.py
          python scripts/memory-bench/test_resume_after_deploy.py
          python scripts/memory-bench/test_bench_window.py
          python scripts/memory-bench/test_fixture_ages.py
          python scripts/memory-bench/test_search_settle.py
          python scripts/memory-bench/test_embed_drain.py
          python scripts/memory-bench/test_confirm_embedder_alive.py
          python scripts/memory-bench/test_corpus_sanitize.py
          python scripts/memory-bench/test_corpus_sanitize_wiring.py
          python scripts/memory-bench/dense_arm_control.py --selftest
          python scripts/memory-bench/prod_window.py --selftest
          python scripts/memory-bench/fixture_ages.py --selftest
          python scripts/memory-bench/recency_control.py --selftest
          python scripts/memory-bench/test_gate_recency_floor.py

      # One source of truth for "this dispatch is a capture, not a verdict" —
      # the re-snap must run and the judging gate must not, and two copies of the
      # expression drift into both running or neither.
      #
      # `pull_request` is excluded explicitly. `inputs.*` is empty on that event
      # so the expression is already false, but this arm — unlike the prod one —
      # DOES run on PRs, so the exclusion has to be visible here rather than
      # inferred from a property of a different trigger.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (github.event_name != 'pull_request' && inputs.update_baseline && inputs.baseline_arm == 'retrieval-branch') && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      # One predicate, two callers — see scope_relevant.sh for why merge_group is
      # diffed rather than short-circuited, and for the fail-closed rules. The
      # SHAs are passed as env, never interpolated into the script body: on
      # pull_request the PR's OWN base..head (never the merge ref — a guard that
      # reads the merge ref deadlocks every open PR), on merge_group the group's
      # base..head, which is main plus exactly the batch.
      - name: Does this change touch memory?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash scripts/memory-bench/scope_relevant.sh

      - name: No memory paths touched — nothing to gate
        if: steps.scope.outputs.relevant != 'true'
        run: |
          echo "This PR changes no memory-path file; the recall gate is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # "The gate produced a verdict" and "the gate can still produce the RED
      # verdict" are different claims, and only the second is the one that was
      # broken while baseline_retrieval_branch.json did not exist (#f70347b5).
      #
      # Committing that file fixes today's symptom; nothing else would keep the
      # property. A tolerance widened past every category's headroom, or a
      # baseline re-snapped from a degraded run, both leave a required check
      # that is green because it can no longer be anything else — which reads
      # exactly like the blind state this card was filed about, minus the
      # `no-baseline` line that made that one noticeable.
      #
      # Drives the pure decision functions against the committed baseline:
      # identity must be OK, a drop past tolerance must name the category, and
      # a drop INSIDE tolerance must stay OK — that last arm is what stops
      # "REGRESSION" from merely meaning "differs from baseline at all".
      #
      # WHO CAN CLEAR IT decides whether it blocks — the rule this file states
      # twice (`cf. #342`, and the gate step's own "a red nobody can clear gets
      # bypassed"). The script's exit codes already carry that distinction, so
      # they are routed rather than collapsed into a bare non-zero:
      #
      #   rc=1  an arm did not behave — the decision logic lost its ability to
      #         go red. Only a memory-path change can do that, so it is the
      #         author's to fix: BLOCKS.
      #   rc=2  the committed baseline is missing / arm-mismatched / has no
      #         sample_sizes. No PR author can fix that, so it must not fail
      #         their check. INCONCLUSIVE on a pull_request, and red on
      #         push/schedule/dispatch, where there is no PR author to punish
      #         and a red main build is how the repo hears about it.
      #
      # My first draft of this step exited non-zero on both, and sat BEFORE the
      # scope gate — so a docs-only PR touching no memory path would have gone
      # red on a missing baseline the author had never heard of. That is the
      # bypass this file already warns about, and it would have re-armed total
      # blindness by consent. Now gated on scope as well: on non-PR events the
      # scope step sets relevant=true unconditionally, so main and the schedule
      # still evaluate this on every run — coverage is unchanged, only the
      # blast radius is.
      #
      # Skipped on a capture, and that is not squeamishness about a red step:
      # a capture is about to REWRITE this file, so proving properties of the
      # outgoing one rules on nothing — and on the bootstrap capture (the one
      # that creates the file in the first place, i.e. exactly the dispatch this
      # card needed) there is no file to read at all, so an ungated step would
      # fail the run before it could ever produce the baseline. Gated on
      # steps.mode — the workflow's single source of truth for capture-vs-judge
      # — rather than on a second copy of that expression.
      - name: The gate must still be able to go RED
        id: redproof
        if: >-
          steps.scope.outputs.relevant == 'true'
          && steps.mode.outputs.capture != 'true'
        run: |
          set +e
          python scripts/memory-bench/prove_gate_can_go_red.py \
            scripts/memory-bench/baseline_retrieval_branch.json branch 2>&1 \
            | tee redproof.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          {
            echo "## Can the recall gate still go RED?"
            echo
            case "$rc" in
              0) echo "✅ All three arms behaved: identity PASSes, a drop past tolerance"
                 echo "names the category, a drop inside tolerance stays PASS." ;;
              1) echo "❌ **An arm did not behave** — the gate can no longer produce the"
                 echo "verdict it exists to produce. A green \`Memory recall gate\` on this"
                 echo "PR would mean nothing. This blocks the merge." ;;
              2) echo "### ⚠️ INCONCLUSIVE — could not prove the gate can go red"
                 echo
                 echo "The committed \`baseline_retrieval_branch.json\` is missing, records a"
                 echo "different arm, or carries no \`sample_sizes\`. **Nothing here is the PR"
                 echo "author's to fix, so this does not fail the check** (cf. \`#342\`) — but"
                 echo "until it clears, the required gate cannot rule on this baseline." ;;
              *) echo "❌ Red-proof exited $rc." ;;
            esac
            echo
            echo '```'
            tail -40 redproof.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # rc=2 is "could not measure" — an infra fault, not a verdict, and
          # `#342`'s rule is that a red nobody can clear gets bypassed rather
          # than respected. `merge_group` is on this list for a stronger reason
          # than `pull_request` is: a merge-queue entry has no author at all, and
          # a required check that goes red on infra with `enforce_admins: true`
          # is not a blocked PR but a frozen repository. The blindness ALERT
          # below deliberately still fires on both events, so nothing is
          # swallowed — the episode is opened, it just does not wedge the queue.
          if [ "$rc" = "2" ]; then
            case "${{ github.event_name }}" in
              pull_request|merge_group) exit 0 ;;
            esac
          fi
          exit $rc

      - name: Set up Go
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Keyed on the pinned model name, so a model bump busts the cache rather
      # than silently serving the old weights against the new baseline.
      - name: Cache the CI embedder model
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@v6
        with:
          path: scripts/memory-bench/.fastembed_cache
          key: fastembed-bge-small-en-v1.5-v1

      - name: Install Python dependencies
        if: steps.scope.outputs.relevant == 'true'
        # No `openai` — this arm must not acquire a paid dependency. fastembed is
        # the local ONNX runtime for the embedder; see ci_embedder.py for why a
        # hash stub would make this whole job blind.
        run: pip install mcp httpx fastembed

      - name: Start the local embedder
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd scripts/memory-bench
          nohup python ci_embedder.py --port 8099 --cache-dir .fastembed_cache \
            > embedder.log 2>&1 &
          echo $! > embedder.pid
          # ci_embedder loads the model BEFORE binding the port, so /healthz
          # answering is proof the weights are resident — not merely that a
          # process started.
          for i in $(seq 180); do
            if curl -sf http://127.0.0.1:8099/healthz > /dev/null; then
              echo "embedder ready after ${i}s"; curl -s http://127.0.0.1:8099/healthz; exit 0
            fi
            sleep 1
          done
          echo "::error::embedder never became ready"; cat embedder.log; exit 1

      - name: Run migrations
        if: steps.scope.outputs.relevant == 'true'
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://mesh:mesh@localhost:5432/mesh?sslmode=disable"
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations up

      - name: Build + start the API from THIS branch
        if: steps.scope.outputs.relevant == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mesh
          DB_PASSWORD: mesh
          DB_NAME: mesh
          DB_SSL_MODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          NATS_URL: "nats://localhost:4222"
          JWT_SECRET: "ci-recall-gate-secret-32chars-min!"
          JWT_ISSUER: "mesh-ci"
          # ~1900 `remember` calls per pass would otherwise hit APIRPM (600) and
          # the resulting 429s would score as recall misses.
          MESH_RATE_LIMIT_ENABLED: "false"
          MESH_ALLOW_REGISTRATION: "true"
          # The OpenAI wire shape, served locally by ci_embedder.py. 384 dims to
          # match prod (migrations/20260727082_memory_chunks.sql).
          EMBEDDING_PROVIDER: openai
          EMBEDDING_ENDPOINT: "http://127.0.0.1:8099"
          EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
          EMBEDDING_DIMENSIONS: "384"
          EMBEDDING_API_KEY: "not-used-by-the-local-embedder"
          APP_ENV: test
        run: |
          go build -o /tmp/mesh-api ./cmd/api
          nohup /tmp/mesh-api > api.log 2>&1 &
          echo $! > api.pid
          echo "MESH_API_URL=http://127.0.0.1:8005" >> "$GITHUB_ENV"

      # Mints its own workspace + agent key against the ephemeral database.
      # `secrets.MESH_BENCH_KEY` is deliberately NOT used here: it is prod's, and
      # using it would point this arm back at the thing it exists to stop
      # measuring. It also blocks until /health really answers, instead of the
      # `curl || sleep` loop that prints "ready" unconditionally.
      - name: Bootstrap a bench workspace + agent key
        if: steps.scope.outputs.relevant == 'true'
        run: |
          # No stdout redirect: the script appends to $GITHUB_ENV itself, so the
          # minted key is never a printed value that a later refactor could
          # accidentally route into the job log.
          python scripts/memory-bench/ci_bootstrap.py \
            --api-url http://127.0.0.1:8005 \
            || { echo "::error::bootstrap failed"; tail -50 api.log; exit 1; }

      - name: Checkout evc-mesh-mcp
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v7
        with:
          repository: entire-vc/evc-mesh-mcp
          # Empty is not the same as absent to a reader, but it IS the same to
          # actions/checkout: `ref` is falsy-checked, so '' resolves to the
          # default branch exactly as no key at all did. That equivalence is what
          # keeps the pull_request / merge_group / push / schedule triggers —
          # none of which populate `inputs` — behaving as before.
          ref: ${{ inputs.mcp_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Resolve which mesh-mcp this run measures
        if: steps.scope.outputs.relevant == 'true'
        env:
          MCP_REF_INPUT: ${{ inputs.mcp_ref }}
        run: |
          # Read the ref back off the CHECKOUT rather than echoing the input:
          # the input is empty on every non-dispatch trigger, and "" tells a
          # later reader nothing about which client produced the numbers. This
          # also makes an explicit `mcp_ref=main` and an empty input resolve to
          # the same string, so dispatching the default branch by name is not a
          # spurious mismatch.
          branch="$(git -C evc-mesh-mcp rev-parse --abbrev-ref HEAD)"
          if [ "$branch" = "HEAD" ]; then
            # Detached: dispatched with a SHA or a tag, so the input IS the name.
            branch="${MCP_REF_INPUT:-unknown}"
          fi
          {
            echo "MCP_REF=$branch"
            echo "MCP_COMMIT=$(git -C evc-mesh-mcp rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "mesh-mcp client: ref=$branch commit=$(git -C evc-mesh-mcp rev-parse --short HEAD)"

      # WHICH CLIENT IS ACTUALLY IN THE BINARY — read out of the artifact, not
      # claimed by the step that fetched the source.
      #
      # `MCP_REF`/`MCP_COMMIT` above describe the CHECKOUT. Everything between
      # that checkout and this compiler is unproven by them: a reordered step, a
      # stale `mesh-mcp-bin` left in the workspace, a `cd` into the wrong
      # directory, and the bench measures a client nobody selected while every
      # log line still names the right ref. That is the same defect this whole
      # card is about (#faf92388) wearing a different hat — the harness stating
      # something it did not observe.
      #
      # `go build` with no `-buildvcs=false` stamps the source commit into the
      # binary, so the artifact answers for itself. Measured, not assumed:
      # `go version -m` on a cross-compiled binary prints
      # `build vcs.revision=06fa62a5e3…` equal to that tree's HEAD.
      #
      # THE ASSERTION BINDS ONLY WHEN A REF WAS DISPATCHED, deliberately. That
      # is exactly when a wrong binary corrupts an A/B silently; on
      # pull_request / merge_group / push / schedule the default branch is the
      # correct answer anyway, so a broken pin there costs nothing and a hard
      # failure would paint a required check red for an author who cannot fix
      # it (the #342 rule). Unstamped counts as a mismatch on that path: an
      # unverifiable provenance claim is not a passing one.
      - name: Cross-compile mesh-mcp (linux/amd64)
        if: steps.scope.outputs.relevant == 'true'
        env:
          MCP_REF_INPUT: ${{ inputs.mcp_ref }}
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin
          built="$(go version -m ../mesh-mcp-bin | sed -n 's/.*vcs\.revision=//p' | head -1)"
          echo "mesh-mcp binary: vcs.revision=${built:-<unstamped>} (checkout ${MCP_COMMIT:-<unset>})"
          if [ -n "$MCP_REF_INPUT" ] && [ "$built" != "$MCP_COMMIT" ]; then
            echo "::error::dispatched mcp_ref='${MCP_REF_INPUT}' resolved to ${MCP_COMMIT:-<unset>}, but the binary carries '${built:-<unstamped>}' — this run would have measured a client nobody asked for"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Re-confirm the embedder is ALIVE right before anything measures
      # through it, not just at its own startup step. Several minutes and
      # several steps (migrations, Go build, bootstrap, mesh-mcp checkout +
      # cross-compile) separate "Start the local embedder" from the first
      # step that actually depends on it — long enough for a crash or an
      # OOM-kill in between to go unnoticed until a scored question fails.
      # Without this, a dead embedder here reads as N individual recall
      # misses that silently accumulate into an INCONCLUSIVE verdict
      # (#352a0b11 — 24/24 "could not run", no named cause). This step turns
      # that into one loud, specific failure at the earliest point it can be
      # caught, instead of a mystery diagnosed after the fact from
      # embedder.log.
      # ---------------------------------------------------------------------
      - name: Confirm the embedder is still alive before measuring
        if: steps.scope.outputs.relevant == 'true'
        run: |
          bash scripts/memory-bench/confirm_embedder_alive.sh \
            http://127.0.0.1:8099/healthz scripts/memory-bench/embedder.log

      # ---------------------------------------------------------------------
      # The dense-arm control, run BEFORE the scored bench so a severed vector
      # arm is named as such rather than showing up as an unexplained score.
      #
      # The scored dataset cannot do this job: every question in it is answerable
      # from the words it uses, so BM25 carries them alone. Run 30316983402
      # scored `overall 0.9583` — its best ever — with the dense arm returning
      # zero rows for the entire haystack. This question is keyword-dark by
      # construction; see dense_arm_control.py for the measurement.
      # ---------------------------------------------------------------------
      - name: Dense-arm control — the vector arm must be contributing
        id: control_alive
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          # This arm ingests its own haystack then searches it immediately —
          # see the comment on "Run the recall gate against the branch build"
          # below for why that races the query-embed against this same
          # question's write-embeds on the CI-only CPU embedder.
          MESH_MCP_HTTP_TIMEOUT_SECS: '120'
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b-ctl
        run: |
          cd scripts/memory-bench
          set +e
          python dense_arm_control.py --expect alive 2>&1 | tee control_alive.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Same contract as the scored gate: 1 blocks, 2 never does.
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      # ---------------------------------------------------------------------
      # The recency control, in both directions. Same shape and same reasoning
      # as the dense-arm pair above: an assertion that can only pass is not a
      # control, so the green ("the bench can see fixture age") is followed by
      # the check that it CAN go red for the right reason ("what it sees is age
      # and not the parameter").
      #
      # `--expect visible` ages one corpus and toggles apply_recency_decay over
      # it: gold must MOVE. `--expect blind` does the same toggle over an
      # un-aged corpus: gold must NOT move. Neither uses the scored dataset —
      # they build a 5-session fixture whose gold is 180 days older than its
      # near-ties, i.e. a 64x decay penalty, chosen to sit far above the
      # 0.0534 % gap between adjacent RRF scores that the scored corpus can
      # resolve.
      #
      # Why these are needed at all: backdating is a side effect on a database,
      # and every way of getting it wrong (an update that matched no rows, an age
      # mode that fell back to the default, a decay flag that never reached the
      # server) produces exactly the numbers the blindness produced. A green
      # scored gate cannot tell those apart; these two steps can.
      # ---------------------------------------------------------------------
      - name: Recency control — fixture age must be visible to the bench
        id: control_recency_visible
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          MESH_MCP_HTTP_TIMEOUT_SECS: '120'
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b-age
          BENCH_BACKDATE_DSN: postgres://mesh:mesh@127.0.0.1:5432/mesh?sslmode=disable
        run: |
          cd scripts/memory-bench
          set +e
          python recency_control.py --expect visible 2>&1 | tee control_recency_visible.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      # `!cancelled()`, not the default: a failed positive control must not skip
      # the step that says whether the control had any power. A red whose own
      # power check was withheld is the exact artefact a reviewer cannot act on.
      - name: Recency control — and what it sees is AGE, not the parameter
        id: control_recency_blind
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          MESH_MCP_HTTP_TIMEOUT_SECS: '120'
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b-age-neg
          # Deliberately NO BENCH_BACKDATE_DSN: this arm's corpus must be born at
          # ingest. Handing it a DSN it does not use would be harmless and would
          # also make the negative control's premise unreadable from the YAML.
        run: |
          cd scripts/memory-bench
          set +e
          python recency_control.py --expect blind 2>&1 | tee control_recency_blind.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      # `!cancelled()` and not the default: a failed dense-arm control must not
      # skip the two steps that explain it. Skipping them is how a red arrives
      # with its own evidence missing — the score that would say how bad, and the
      # power check that says whether the control can be trusted at all. Both are
      # exactly the artefacts a reviewer needs on a red, and the default `if`
      # withholds them precisely then. The job still fails: these steps report
      # their own conclusions, they do not launder the control's.
      # The capture path for THIS arm's baseline. Without it the required check
      # is permanently `no-baseline` ⇒ INCONCLUSIVE — required, and blocking
      # nothing but the dense-arm control. The README used to say "dispatch the
      # workflow on main; the branch job writes it": the job does run on
      # dispatch, but nothing in it ever passed `--update-baseline`, so the
      # documented procedure was inert and would only have been discovered by
      # someone following it after the merge.
      #
      # `--repeat` matters more here than anywhere: 4 questions per category
      # means one flipped answer moves a category by 0.25, which is the whole
      # tolerance. A one-pass floor is a coin toss frozen into the gate.
      - name: Re-snap the branch recall baseline
        id: resnap
        if: steps.scope.outputs.relevant == 'true' && steps.mode.outputs.capture == 'true'
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          MESH_MCP_HTTP_TIMEOUT_SECS: '120'
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-c
          # Captured under the SAME age regime the gate below judges in. This is
          # the whole reason the regime is a recorded baseline field: a floor cut
          # on a corpus born at ingest, compared against runs on a corpus aged
          # over the dataset's real 0-183 day span, would read honest movement as
          # a regression on every open PR at once.
          BENCH_FIXTURE_AGE_MODE: question-anchored
          BENCH_BACKDATE_DSN: postgres://mesh:mesh@127.0.0.1:5432/mesh?sslmode=disable
        run: |
          cd scripts/memory-bench
          # PIPESTATUS, not the pipeline's status. There is no `shell:` key and no
          # `defaults:` block in this workflow, so every `run:` here gets GitHub's
          # default `bash -e {0}` — WITHOUT `pipefail`. Piping through `tee` then
          # yields tee's exit code, and `capture_blockers`' whole point is to
          # refuse BEFORE writing the file: a refused capture would leave this
          # step green, write "re-snapped" into the summary, and upload an
          # artifact containing only resnap.log (`if-no-files-found: error` fires
          # on NO files, and the log is a file). The gate arm, both dense-arm
          # controls, and the PROD arm's own re-snap all already do this — 11 of
          # the 13 tee'd measurement steps in this file. This one was the sole
          # omission, dropped when #394 copied the prod arm to make the branch arm.
          set +e
          python run_ci.py --retrieval-only --arm branch --update-baseline \
            --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e

          {
            if [ "$rc" = "0" ]; then
              echo "### Branch recall baseline re-snapped"
              echo
              echo '`baseline_retrieval_branch.json` is uploaded as an artifact — commit it by hand.'
            else
              echo "### ✗ Branch baseline NOT re-snapped (exit $rc)"
              echo
              echo "No baseline was written, so there is nothing to commit — and the"
              echo "upload step is skipped rather than shipping a log that looks like a"
              echo "capture. Fix the cause and re-dispatch; do not hand-edit a baseline."
              echo
              echo '```'
              tail -40 resnap.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Captured HERE and committed by hand, never generated on a laptop: a
      # baseline snapped against a different embedder or a different DB is not
      # comparable to the runs that will be judged against it, and that is the
      # same not-comparable this workflow already exits 2 over (`arm-mismatch`).
      - name: Upload the re-snapped branch baseline
        if: ${{ !cancelled() && steps.resnap.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-retrieval-branch
          path: |
            scripts/memory-bench/baseline_retrieval_branch.json
            scripts/memory-bench/resnap.log
          if-no-files-found: error

      - name: Run the recall gate against the branch build
        id: gate
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' && steps.mode.outputs.capture != 'true' }}
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          # This job's harness ingests ~45 sessions immediately before searching
          # each question (mesh_client_stdio.py's `ingest_and_search`, no settle
          # wait on this path). recall's query-embed then queues behind those
          # same-question write-embeds on the API's shared embedSem
          # (memory_service.go's RecallWithStats, intentional read/write fairness
          # from #3d10774e) — and ci_embedder.py (bge-small on CPU) is slow enough
          # that the queue alone can exceed mesh-mcp's REST client's default 30s,
          # failing the whole recall call as "context deadline exceeded" though
          # nothing is broken (#352a0b11 subtask 7, live evidence: run 32524227911).
          # 120s is headroom, not a guess at exact worst-case queue depth.
          MESH_MCP_HTTP_TIMEOUT_SECS: '120'
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b
          # Fixtures are aged after ingest, against the ephemeral postgres this
          # job owns (`fixture_ages.py` refuses any non-loopback DSN, so the prod
          # arm cannot be pointed at this even by editing the YAML). Without it
          # every fixture is seconds old, every score carries the same decay
          # factor, and nothing that depends on memory age — apply_recency_decay,
          # half_life_days, recency_weight, any temporal profile — moves the
          # number this gate enforces on. `run_ci` prints the resulting age
          # distribution, so "the corpus was aged" is evidence in gate.log rather
          # than an inference from this variable existing.
          BENCH_FIXTURE_AGE_MODE: question-anchored
          BENCH_BACKDATE_DSN: postgres://mesh:mesh@127.0.0.1:5432/mesh?sslmode=disable
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --retrieval-only --arm branch \
            --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e

          reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
          if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval' gate.log; then
            rc=2
            reason="no-baseline — the gate compared against nothing"
          fi
          [ -z "$reason" ] && reason="unspecified"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## Memory recall gate (branch build)"
            echo
            echo "Target: \`cmd/api\` built from \`${{ github.sha }}\`, ephemeral postgres,"
            echo "local \`BAAI/bge-small-en-v1.5\`. Not comparable with the prod canary's numbers."
            echo
            case "$rc" in
              0) echo "✅ **PASS** — recall measured on THIS branch, within tolerance of the branch baseline." ;;
              1) echo "❌ **REGRESSION** — recall dropped below the branch baseline in the same retrieval mode."
                 echo "This PR makes memory measurably worse. This is the only condition that blocks the merge." ;;
              2) echo "### ⚠️ INCONCLUSIVE — nothing was measured, so nothing was enforced"
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "\`arm-mismatch\` means the baseline on disk was captured against a"
                 echo "different target than this run — re-snap with \`--arm branch\`, do not"
                 echo "hand-edit. A red nobody can clear gets bypassed on the FIRST such run,"
                 echo "so this step alone does not fail the check — the alert below opens or"
                 echo "updates the tracking issue instead. If that issue was ALREADY open when"
                 echo "this run started (i.e. this is not the first consecutive occurrence),"
                 echo "the escalation step below this one fails the job on purpose: a first"
                 echo "occurrence gets a quiet grace period, a second one turns the badge red." ;;
              *) echo "❌ Gate exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then exit "$rc"; fi
          exit 0

      # ---------------------------------------------------------------------
      # THE ALERT THE SUMMARY ABOVE ALREADY PROMISES.
      #
      # The `rc=2` branch of that summary says "the alert below is what stops it
      # being silent". Until this step existed there was no alert below it: the
      # blindness-alert shell lived in the prod canary and the advisory arm, and
      # both read their OWN `steps.*.outputs.rc`, so neither could see this job's
      # verdict even in principle.
      #
      # What that cost, measured from the tracker rather than argued from the
      # YAML: `no-baseline` was this check's steady state on EVERY run from #394
      # (2026-07-28 05:02Z) until #f70347b5 committed a baseline — runs on main
      # (30525387007) and on branches (30334590080, 30336693957, 30522592913,
      # 30532577681) — and exactly ONE `no-baseline` issue has ever been opened
      # (#333, 2026-07-13, i.e. predating the split). Every post-#394 blindness
      # issue is a `version-*` or `mode-*` kind, all of them raised by the prod
      # canary's version pin, which this arm does not have. Two days blind on the
      # merge gate, zero pages. It surfaced only because #e8570874's AC4 tripped
      # over it by accident.
      #
      # NOT SCOPED TO PUSH, AND NOT RUN ON pull_request. Both halves carry
      # `github.event_name != 'pull_request'` and that is a correctness claim,
      # not convenience:
      #   - a PR branch's measurement is not authoritative about the repo's
      #     state, so letting it RAISE means a PR that breaks only its own
      #     baseline opens a repo-level episode main is fine with, and letting it
      #     RESOLVE means a PR that fixes its own baseline closes an episode main
      #     is still blind on. Both directions are wrong, and the second loses
      #     the alarm;
      #   - on push/schedule/dispatch this job builds the default branch, so what
      #     it measured and what the episode is about are the same thing;
      #   - and a fork PR gets a read-only GITHUB_TOKEN, so alerting from
      #     `pull_request` would fail this REQUIRED check for an author who could
      #     not possibly clear it — the #342 rule this whole arm is built around.
      # The gap this leaves is one push wide: a PR merges with rc=2 visible in
      # its summary, and the next run on main opens the episode.
      #
      # NO VERSION-DRILL GUARD, deliberately — the prod pair excludes
      # `inputs.expect_commit` dispatches because that input pins a SERVING
      # version and a version drill is neither an incident nor a recovery. This
      # arm builds its own server from the checkout and never reads that input,
      # so the same clause here would be a guard on a value the job cannot
      # observe: it would silence real blindness on any dispatch that happened to
      # set an unrelated input. Pinned, with that reason, by
      # `test_the_branch_pair_carries_no_drill_guard`.
      #
      # THERE IS A CLIENT-DRILL GUARD, and it is the same idea applied to the one
      # input this arm DOES read. `mcp_ref` was added by #faf92388 so a run can
      # measure a mesh-mcp client branch; such a run is INCONCLUSIVE by design
      # (`mcp-ref-mismatch`) because the committed floor was captured on a
      # different client. Without the clause below, the feature's intended use
      # pages an episode saying the merge gate is blind — and it is not: the PR
      # and merge_group arms build the default client, untouched by a dispatch.
      # Measured on the very first such run (31321344020): TWO false episodes,
      # #543 here and #541 on the canary, both `kind=mcp-ref-mismatch`, one of
      # them asserting "a recall regression can merge into main unnoticed" about
      # a run that gated nothing.
      #
      # Spelled over the RESOLVED ref rather than over `inputs.mcp_ref != ''` so
      # an explicit `mcp_ref=main` — identical in every respect to leaving it
      # empty — keeps both halves live, and so real blindness on such a dispatch
      # still pages. The empty disjunct is the fail-OPEN direction: an arm that
      # never resolved a client (its resolve step skipped) must still be able to
      # alert, which is why this is not simply `env.MCP_REF == 'main'`.
      # ---------------------------------------------------------------------
      - name: Alert — the required recall gate is blind (INCONCLUSIVE)
        id: alert
        if: >-
          !cancelled()
          && steps.scope.outputs.relevant == 'true'
          && steps.gate.outputs.rc == '2'
          && github.event_name != 'pull_request'
          && (github.event_name != 'workflow_dispatch'
              || env.MCP_REF == '' || env.MCP_REF == 'main')
        uses: ./.github/actions/blindness-issue
        with:
          mode: alert
          title: 'Memory recall gate (branch arm) is INCONCLUSIVE (merge gate blind)'
          marker-slug: recall-gate-branch-blind
          arm: 'The **required** `Memory recall gate` (branch build)'
          reason: ${{ steps.gate.outputs.reason }}
          reason-kind: ${{ steps.gate.outputs.reason_kind }}
          stakes: >-
            This is the merge-gating check. While this episode is open it cannot
            produce a REGRESSION verdict at all, so **a recall regression can
            merge into `main` unnoticed** and the only thing looking at memory
            quality is the advisory prod canary.
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # ESCALATION — a SECOND consecutive blind run turns THIS run red.
      #
      # #352a0b11 AC5: from #587 (opened 2026-08-17) to the run that surfaced
      # this gap (32447862443, 2026-08-21), this arm sat INCONCLUSIVE across at
      # least three straight nightlies while every job kept reporting
      # `success` — the tracking issue existed and nobody read it, because
      # nothing about the workflow's own colour said "look here". "An issue
      # was opened" turned out not to be sufficient; the badge has to say it
      # too, or the next blind spell repeats this one.
      #
      # WHY NOT FAIL ON THE FIRST rc=2, THE WAY THIS LOOKED BEFORE THIS PR:
      # the advisory arm's own exit step (below, `memory-bench` job) already
      # reasoned this through and landed on "no" — "a check that is red
      # forever is one people learn to scroll past, which is how the real
      # rc=1 would get ignored too". A same-day infra blip (a Docker Hub
      # mirror hiccup, one bad `context deadline exceeded`) is exactly the
      # transient case that reasoning protects, and this arm sees the same
      # class of blip. So: the FIRST occurrence behaves exactly as before —
      # it opens/updates the tracking issue and the job stays green, same as
      # every arm. Only once `episode-status: existing` comes back — meaning
      # the SAME episode was still open when this run started, i.e. the LAST
      # run's alert went unaddressed — does this run fail. That is the
      # difference between "red on any blip" (rejected, see above) and "red
      # once the blip has already been visible for a full cycle and nobody
      # acted" (this).
      #
      # SCOPED NARROWER THAN THE ALERT ABOVE, on purpose: this step drops
      # `merge_group` from the alert's `!= 'pull_request'`. The alert may
      # still comment on a merge_group run (posting is harmless), but FAILING
      # a merge_group run would block the queue on an infra cause no queued
      # PR can fix — precisely the #342 failure mode this whole arm exists to
      # avoid, and precisely why `pull_request` was already excluded. A
      # schedule or push run blocks nobody: nothing is waiting on its result,
      # which is exactly why it is safe to let it go red.
      - name: Escalate — the merge gate has been blind since the last run
        if: >-
          !cancelled()
          && steps.scope.outputs.relevant == 'true'
          && steps.gate.outputs.rc == '2'
          && steps.alert.outputs.episode-status == 'existing'
          && github.event_name != 'pull_request'
          && github.event_name != 'merge_group'
          && (github.event_name != 'workflow_dispatch'
              || env.MCP_REF == '' || env.MCP_REF == 'main')
        run: |
          echo "::error::Memory recall gate has been INCONCLUSIVE (${{ steps.gate.outputs.reason }}) across at least two consecutive runs on this event type, and the tracking issue opened for it is still open. Failing this run so the badge stops reporting green while the merge gate cannot enforce anything. This does not block any PR or merge_group run — only schedule/push/dispatch reach this step."
          exit 1

      # EVENT SCOPING IS IDENTICAL TO THE ALERT ABOVE — read the two `if:`s
      # together. `test_gate_blindness.py` extracts both and fails if they
      # diverge, because the last time they diverged it was invisible in review
      # and the episode outlived the blindness.
      - name: Resolve — the required recall gate is measuring again
        if: >-
          !cancelled()
          && steps.scope.outputs.relevant == 'true'
          && steps.gate.outputs.rc == '0'
          && github.event_name != 'pull_request'
          && (github.event_name != 'workflow_dispatch'
              || env.MCP_REF == '' || env.MCP_REF == 'main')
        uses: ./.github/actions/blindness-issue
        with:
          mode: resolve
          title: 'Memory recall gate (branch arm) is INCONCLUSIVE (merge gate blind)'
          recovery-note: >-
            The required recall gate compared against its branch baseline and
            produced a verdict again, so it can go red again.
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # POSITIVE CONTROL ON THE CONTROL — the step that has been missing every
      # previous time this harness went blind.
      #
      # "Gold was retrieved" proves the dense arm works only if the same
      # assertion FAILS when the dense arm is gone. So: kill the embedder, leave
      # the binary and the corpus exactly as they are, and require the control to
      # miss. If it still finds gold, BM25 could reach it all along and every
      # green the control ever produced was uninformative.
      #
      # Runs LAST because it destroys the dense arm for the rest of the job.
      # ---------------------------------------------------------------------
      - name: Power check — with the dense arm off, the control must MISS
        id: control_dead
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        env:
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          MESH_MCP_HTTP_TIMEOUT_SECS: '120'
          RECALL_GRAPH_ENABLED: 'true'
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-b-pwr
        run: |
          kill "$(cat scripts/memory-bench/embedder.pid)" 2>/dev/null || true
          # Recall fails OPEN on an embed error (memory_service.go: log, count,
          # return) — so this yields bm25-only rather than a 500, which is
          # exactly the degraded shape being simulated.
          for i in $(seq 20); do
            curl -sf http://127.0.0.1:8099/healthz > /dev/null || break
            sleep 1
          done
          cd scripts/memory-bench
          set +e
          python dense_arm_control.py --expect dead 2>&1 | tee control_dead.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "### Dense-arm control — power check"
            echo
            case "$rc" in
              0) echo "✅ The control goes red when the dense arm is removed, so its green means something." ;;
              1) echo "❌ **The control has no power** — gold was still found with the dense arm off."
                 echo "Every green it has produced was uninformative. See \`control_dead.log\`." ;;
              *) echo "⚠️ Power check inconclusive (\`$rc\`) — the dense arm could not be confirmed off." ;;
            esac
            echo
            echo '```'
            tail -20 control_dead.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      - name: Server logs (always — a boot failure is invisible otherwise)
        if: always() && steps.scope.outputs.relevant == 'true'
        run: |
          echo "::group::mesh-api"; tail -200 api.log 2>/dev/null || true; echo "::endgroup::"
          echo "::group::embedder"; tail -50 scripts/memory-bench/embedder.log 2>/dev/null || true; echo "::endgroup::"

      - name: Upload branch-arm results
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recall-gate-branch-results
          path: |
            scripts/memory-bench/gate.log
            scripts/memory-bench/control_alive.log
            scripts/memory-bench/control_dead.log
            scripts/memory-bench/embedder.log
            scripts/memory-bench/results/
            api.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The prod CANARY (ADR-0003). Same harness, different question: "is what we
  # deployed still good?" It is no longer a PR gate — it never could answer the
  # PR's question, and presenting its green as if it did is the defect that
  # opened #2a079432. Runs on push to main (post-deploy), nightly, and dispatch.
  # ---------------------------------------------------------------------------
  recall-gate:
    name: Memory recall canary (prod)
    # A `retrieval-branch` capture re-snaps the REQUIRED arm's baseline. That
    # arm builds and measures its own server, so this prod-judging canary
    # contributes nothing to it — it only joins `memory-bench-prod` and takes a
    # slot from whoever is legitimately measuring prod. Excluded by arm name
    # rather than by "is this a capture": an `end-to-end` or `retrieval`
    # capture still wants the canary's opinion.
    # Spelled as an ALLOW-LIST of the events on which "is what we deployed still
    # good?" is even a question — not as `!= 'pull_request'`, which is what it
    # used to say. That negation was correct for exactly as long as the trigger
    # list was, and adding `merge_group:` to `on:` silently recruited this job
    # into the queue: a candidate branch that is not deployed anywhere would have
    # been judged against production, taken a `memory-bench-prod` slot from
    # whoever was legitimately measuring prod, and — via `prod-arm-cancelled` —
    # been able to open and resolve prod incident issues from a tree that never
    # shipped. The same rule this file already applies to `!= 'cancelled'` two
    # jobs down; it just had not been applied to event names yet.
    #
    # These three are exactly the events reachable before `merge_group:` existed,
    # so this is behaviour-preserving for every existing trigger.
    # `test_the_prod_canary_does_not_run_on_merge_group` pins it.
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      !(github.event_name == 'workflow_dispatch' &&
        inputs.update_baseline && inputs.baseline_arm == 'retrieval-branch')
    runs-on: ubuntu-latest
    # There is exactly ONE `secrets.MESH_API_URL`, and every job below this line
    # ingests a haystack into it and searches it. Concurrent runs therefore do
    # not merely queue — they slow each other down inside the shared server, and
    # a run that would take 17 min alone takes 30+ with company. On 2026-07-28
    # four runs overlapped and the slowest hit `timeout-minutes: 30` at 14/15
    # checks green, which surfaces as `cancelled`, NOT `failure` — so the arm
    # produced no verdict at all while looking like an infra hiccup.
    #
    # `cancel-in-progress: false` is the point of the block, not boilerplate.
    # The template default `true` would abort a peer MID-RUN to make room, which
    # is the same lost verdict by a different route and without even a timeout in
    # the log to diagnose it from. Serialise; never pre-empt.
    #
    # The required arm (above) needs no group at all: its postgres and embedder
    # live inside its own job, so it has nothing to contend for.
    #
    # ------------------------------------------------------------------------
    # WHICH EVICTIONS REMAIN POSSIBLE, and why each is acceptable (#3ce651a0).
    # A group holds one running + one pending member; a third arrival cancels the
    # pending one. That is not avoidable in GitHub Actions — the group is not a
    # queue — so the only honest control is over WHO can be the third arrival.
    # The previous version of this comment claimed only one ordering existed and
    # was wrong about which; enumerate them all or the omitted one is the one
    # that bites.
    #
    #   (a) A newer run ON THE SAME REF evicts an older run's PENDING canary.
    #       POSSIBLE, and intended. The canary asks "is what is deployed still
    #       good"; when two commits are deploying, the newer is the one worth
    #       measuring, and the older canary would in any case have been refused
    #       by the version pin for being unable to find its own sha in prod.
    #       The ref qualifier is load-bearing and was missing here until ordering
    #       (f) below fired on the very first post-fix push — see there.
    #
    #   (b) The advisory arm evicts the canary of its OWN run.
    #       IMPOSSIBLE now. `needs: recall-gate` keeps the advisory out of the
    #       group until the canary has left it. This was the whole defect.
    #
    #   (c) An older run's advisory evicts a newer run's PENDING canary.
    #       POSSIBLE, and now rare by construction rather than by luck: the
    #       advisory is off `push`, so it only enters the group on the nightly
    #       and on an explicit `full_eval` dispatch, and it needs a canary
    #       already pending at the moment it arrives — i.e. two pushes landing
    #       inside one nightly canary. Accepted rather than eliminated: removing
    #       it means taking the advisory out of this group, which restores the
    #       two arms strangling each other through one API. It is bounded by
    #       being loud — see the `prod-arm-cancelled` job at the end of this file.
    #
    #   (d) This job is cancelled by `timeout-minutes`.
    #       POSSIBLE, and indistinguishable from (a)-(c) by conclusion alone:
    #       GitHub reports a timeout as `cancelled`, not `failure`. Only elapsed
    #       time separates them. Also handled by `prod-arm-cancelled`.
    #
    #   (e) A newer run's canary evicts a PENDING ADVISORY arm.
    #       POSSIBLE. (a)-(d) all take the canary as the victim, which is the bias
    #       of having found this through the canary — but the advisory was the
    #       victim in 3 of the 6 pre-fix runs, so an enumeration that only ever
    #       kills the canary is describing half the group. `needs:` does not close
    #       this one: it stops the advisory from being co-pending with its OWN
    #       canary, not from pending behind a DIFFERENT run's canary and then being
    #       evicted by a third arrival. Concretely: the nightly's canary finishes,
    #       its advisory queues while a push run's canary holds the running slot,
    #       and a second push evicts the pending advisory.
    #       ACCEPTED, and it is the same trade as (a) read from the other side —
    #       when commits are arriving faster than the advisory can measure, the
    #       newer commit is the one worth measuring, and this arm is explicitly
    #       advisory, never a merge gate. Note what it costs elsewhere though:
    #       `prod-arm-cancelled` sees a newer run in existence and correctly
    #       classifies it (a)-style as `superseded`, i.e. **silently**. So a
    #       nightly advisory can be lost without a page. That is a deliberate
    #       consequence of not paging on legitimate supersedes, not an oversight:
    #       the alternative is paging on every busy evening. If the advisory's
    #       nightly coverage is ever found to be missing more often than it lands,
    #       the fix is a workflow-level group (one run = one slot), not an alert.
    #
    #   (f) A run on a DIFFERENT REF evicts this ref's PENDING canary.
    #       POSSIBLE, and it is the ordering that actually killed the first
    #       post-fix push. `memory-bench-prod` is a REPOSITORY-scoped group — the
    #       group name is not namespaced by ref — so every `workflow_dispatch` on
    #       a feature branch competes for the same single slot as `main`'s
    #       post-deploy canary. Measured: run 30341031059 (`main`, the merge that
    #       introduced this very comment) had its canary evicted at 08:08:18Z by a
    #       dispatch on `riker/pin-honours-negation-and-capture` created 08:08:16Z
    #       — two seconds earlier.
    #       NOT accepted, and it is exactly the mistake (b) was: the cost accepted
    #       in (a) is paid for by "the newer commit is the one worth measuring",
    #       and a branch dispatch carries no newer commit for this ref at all. The
    #       verdict is destroyed and nothing is measured in its place. Hence its
    #       own classifier verdict `contended`, which pages — it is NOT folded
    #       into (a). Eliminating it would mean keying the group by ref, which
    #       re-permits two runs against one prod; that trade is deliberately not
    #       taken, so this stays loud rather than silent.
    #
    #   NOT possible: a newer run's ADVISORY evicting an older PENDING canary.
    #       The newer run's own canary reaches the group first and is the arrival
    #       that does the eviction — its advisory cannot get there while an older
    #       canary is still pending. Enumerated to record that it was checked
    #       rather than skipped.
    #
    # (a), (c), (d), (e) and (f) all surface as the same word — `cancelled` — which
    # is the conclusion every reader has been trained to skim past as an infra
    # hiccup. That is how (b) hid for its entire existence. The safety net's death
    # must not look like weather: `prod-arm-cancelled` classifies it and goes red
    # for everything that is not (a) — where "(a)" now means a same-ref supersede
    # specifically, since counting (f) as (a) is what made the first post-fix page
    # name a mechanism its own job list refuted.
    # ------------------------------------------------------------------------
    concurrency:
      group: memory-bench-prod
      cancel-in-progress: false
    # A recall pass is ~17 min, so a `--repeat 3` capture needs the same headroom
    # the advisory arm already takes. Unchanged (30) for every PR and nightly.
    # 30 -> 50 because the version pin below now spends IN-JOB time: up to
    # BENCH_VERSION_WAIT_SECONDS (15 min) waiting for a deploy to land, on top of
    # a 17-25 min measurement. Leaving the budget at 30 would have made the guard
    # die on precisely the runs it exists for — and it would have died as a
    # `cancelled` at the ceiling, which reads as a flake rather than as the deploy
    # collision it is. (Measured 2026-07-28: run 30330437164 was cancelled at
    # 32m51s while ALONE in the endpoint, so 30 is now too tight even without the
    # wait.) The wait is a CEILING, not a cost: a matching first poll returns in
    # about a second, so a quiet run is no slower than before.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 50 }}
    permissions:
      contents: read
      # The gate raises an out-of-band alert when it is BLIND (INCONCLUSIVE), so
      # that a safety net that stopped enforcing anything always pages somebody
      # instead of quietly passing.
      issues: write

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs on EVERY PR, before (and independently of) the scope check — these
      # are the tests that guard the gate against going blind, so they must not
      # be skipped by the very no-op they exist to detect. Stdlib only: no
      # secrets, no network, ~1s.
      #
      # A red here means "this PR would make the recall gate stop enforcing" —
      # e.g. it adds a memory source file that MEMORY_PATHS does not cover. That
      # IS a legitimate merge block, and unlike an infra failure the author can
      # clear it: list the file.
      - name: Set up Python (gate self-checks)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Gate self-checks (blind-spot + mode logic)
        run: |
          python scripts/memory-bench/test_gate_blindness.py
          python scripts/memory-bench/test_gate_modes.py
          python scripts/memory-bench/test_gate_arm.py
          python scripts/memory-bench/test_gate_dense_arm.py
          python scripts/memory-bench/test_gate_scope.py
          python scripts/memory-bench/test_check_captured_baseline.py
          python scripts/memory-bench/test_gold_rank.py
          python scripts/memory-bench/test_fixture_isolation.py
          python scripts/memory-bench/test_serving_version.py
          python scripts/memory-bench/test_classify_cancelled_arm.py
          python scripts/memory-bench/test_resume_after_deploy.py
          python scripts/memory-bench/test_bench_window.py
          python scripts/memory-bench/dense_arm_control.py --selftest
          python scripts/memory-bench/prod_window.py --selftest

      # One source of truth for "this dispatch is a capture, not a verdict". Two
      # steps have to agree on it — the capture runs, the gate must not — and two
      # copies of the same expression is how they drift into either both running
      # or neither.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (inputs.update_baseline && (inputs.baseline_arm == 'retrieval' || inputs.baseline_arm == 'both')) && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      # One predicate, two callers — see scope_relevant.sh for why merge_group is
      # diffed rather than short-circuited, and for the fail-closed rules. The
      # SHAs are passed as env, never interpolated into the script body: on
      # pull_request the PR's OWN base..head (never the merge ref — a guard that
      # reads the merge ref deadlocks every open PR), on merge_group the group's
      # base..head, which is main plus exactly the batch.
      - name: Does this change touch memory?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash scripts/memory-bench/scope_relevant.sh

      - name: No memory paths touched — nothing to gate
        if: steps.scope.outputs.relevant != 'true'
        run: |
          echo "This PR changes no memory-path file; the recall gate is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Which binary is this canary about to measure?
      #
      # This job triggers on `push: branches:[main]`. So does deploy-backend.yml.
      # Nothing sequences them, so a push-triggered canary used to spend its first
      # ~6 minutes measuring the PREVIOUS binary and then have the binary swap
      # underneath it. Every run on the night of 2026-07-28 crossed a deploy,
      # including one dispatched at 03:23:43Z *specifically* to be a clean
      # post-deploy run: prod went f161732 -> de52f76 at 03:43:10Z, inside it. The
      # harness reported a score anyway, because it had no way to say it could not
      # attribute one.
      #
      # Only this arm needs it. The required branch arm above builds and starts
      # its own server, so there is no deployed version for it to race.
      #
      # Runs BEFORE the Go build so a run that cannot be attributed costs the wait
      # and nothing else.
      # ---------------------------------------------------------------------
      - name: Which commit is prod serving?
        id: version
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          # Ceiling, not a cost: a matching first poll returns in ~1s. Sized for
          # the ~6-7 min a backend deploy takes, doubled, so a queued deploy still
          # fits. Paired with `timeout-minutes: 50` above — raise both together or
          # the guard dies as a timeout on the runs it exists for.
          BENCH_VERSION_WAIT_SECONDS: '900'
          # Operator-supplied, so it goes through the environment rather than
          # `${{ }}` interpolation into the script body — an input spliced into a
          # shell line is the standard Actions script-injection shape, and this one
          # runs with the bench credentials in scope.
          EXPECT_COMMIT_INPUT: ${{ inputs.expect_commit }}
        run: |
          set -euo pipefail
          # Pin only where `github.sha` names a commit prod is expected to serve.
          # push to main / schedule / dispatch on main: github.sha IS main's tip,
          # which deploy-backend.yml ships. This job never runs on pull_request.
          expect="${EXPECT_COMMIT_INPUT:-}"
          if [ -z "$expect" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            expect="${{ github.sha }}"
          fi

          if [ -n "$expect" ]; then
            echo "Pinning to $expect (wait up to ${BENCH_VERSION_WAIT_SECONDS}s)."
            set +e
            python3 scripts/memory-bench/check_serving_version.py \
              --expect "$expect" --wait-seconds "${BENCH_VERSION_WAIT_SECONDS}" \
              2>&1 | tee version.log
            rc=${PIPESTATUS[0]}
            set -e
          else
            echo "No pin: ${{ github.event_name }} on ${{ github.ref }} is not a commit prod serves."
            set +e
            python3 scripts/memory-bench/check_serving_version.py --record 2>&1 | tee version.log
            rc=${PIPESTATUS[0]}
            set -e
          fi

          reason="$(grep -m1 '^GATE_REASON:' version.log | sed 's/^GATE_REASON: *//' || true)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          if [ "$rc" != "0" ]; then
            {
              echo "## Memory recall canary — NOT RUN"
              echo
              echo "### ⚠️ INCONCLUSIVE — could not confirm which binary would be measured"
              echo
              echo "> The canary refused to score rather than measure whichever build happened"
              echo "> to be up. **Nothing was measured, so nothing was enforced.**"
              echo
              echo "**Reason:** \`${reason:-unspecified}\`"
              echo
              echo "This is infrastructure: a backend deploy was in flight, or prod is serving"
              echo "code that is not on the line under test. Re-run once the deploy has landed."
              echo
              echo '```'
              tail -30 version.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Never exit non-zero here. `cannot measure => inconclusive`, and
          # INCONCLUSIVE must not fail a check (cf. #342) — the steps below are
          # skipped and the alert step pages instead.
          exit 0

      - name: Checkout evc-mesh-mcp
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        uses: actions/checkout@v7
        with:
          # See the branch arm's copy of this key for why '' == default branch.
          ref: ${{ inputs.mcp_ref }}
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Resolve which mesh-mcp this run measures
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        env:
          MCP_REF_INPUT: ${{ inputs.mcp_ref }}
        run: |
          branch="$(git -C evc-mesh-mcp rev-parse --abbrev-ref HEAD)"
          if [ "$branch" = "HEAD" ]; then
            branch="${MCP_REF_INPUT:-unknown}"
          fi
          {
            echo "MCP_REF=$branch"
            echo "MCP_COMMIT=$(git -C evc-mesh-mcp rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "mesh-mcp client: ref=$branch commit=$(git -C evc-mesh-mcp rev-parse --short HEAD)"

      - name: Set up Go
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        uses: actions/setup-go@v7
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      # Second copy of the binary-provenance check — see the branch arm's copy
      # for why the checkout's own report does not answer this question.
      - name: Cross-compile mesh-mcp (linux/amd64)
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        env:
          MCP_REF_INPUT: ${{ inputs.mcp_ref }}
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin
          built="$(go version -m ../mesh-mcp-bin | sed -n 's/.*vcs\.revision=//p' | head -1)"
          echo "mesh-mcp binary: vcs.revision=${built:-<unstamped>} (checkout ${MCP_COMMIT:-<unset>})"
          if [ -n "$MCP_REF_INPUT" ] && [ "$built" != "$MCP_COMMIT" ]; then
            echo "::error::dispatched mcp_ref='${MCP_REF_INPUT}' resolved to ${MCP_COMMIT:-<unset>}, but the binary carries '${built:-<unstamped>}' — this run would have measured a client nobody asked for"
            exit 1
          fi

      - name: Install Python dependencies
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0'
        # Python itself is already set up above for the gate self-checks.
        # No `openai` — the recall gate must not acquire a paid dependency.
        run: pip install mcp httpx

      # ---------------------------------------------------------------------
      # Baseline capture for the REQUIRED arm. #363 added this path for the
      # advisory arm and deliberately left the required arm's baseline alone;
      # this is the same path extended to cover it, rather than a second capture
      # route with its own drift.
      #
      # It runs HERE for the same reason the advisory capture does — same runner,
      # same MESH_BENCH_KEY, same embedder as the PR runs it will judge — and it
      # matters MORE here: this is the baseline behind a required check, so a
      # laptop capture against a different key would make every PR's verdict a
      # comparison across two environments.
      #
      # `run_ci.py` refuses to write this file at all if the run was incomplete or
      # served in a degraded mode, so a capture that reaches the artifact is a
      # 24/24 hybrid run by construction, not by the operator remembering to read
      # the log.
      # ---------------------------------------------------------------------
      - name: Re-snap the recall baseline
        id: resnap
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0' && steps.mode.outputs.capture == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-p-snap
          # The commit the pre-flight pin confirmed prod was serving. Empty only when
          # no pin applied and the endpoint could not be read.
          SERVED_AT_START: ${{ steps.version.outputs.served }}
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --retrieval-only --update-baseline \
            --served-commit "${SERVED_AT_START:-}" \
            --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e

          # ------------------------------------------------------------------
          # POST-FLIGHT STABILITY. The gate arm has had this since #e8570874; the
          # CAPTURE arm never did, and the capture is the arm where it matters
          # more. A gate run straddling two binaries yields one wrong verdict,
          # visible that day. A BASELINE straddling two binaries becomes the
          # standing floor for a required check — every future run is then scored
          # against a number that measured neither binary, and nothing in the file
          # says so.
          #
          # Not hypothetical. Capture 30336693957 (2026-07-28, --repeat 3): PR #407
          # merged at 07:35:32Z touching one `*_test.go` file, `deploy-backend.yml`
          # still matched it under `internal/**`, and prod went 5d2cda8 -> ba7deae
          # at 07:41:44Z — 42 minutes into a 65-minute capture. The run exited
          # SUCCESS and wrote a baseline. Recovering what it had measured took a
          # human diffing two commits by hand afterwards.
          #
          # The file is DELETED, not just flagged: `capture_blockers` refuses
          # before writing precisely because "a guard that reports after the file
          # is on disk is advice, not a guard" — the artifact still uploads and
          # the figure still gets committed. This check can only run after the
          # measurement, so deleting is the only way it inherits that property.
          if [ "$rc" = "0" ] && [ -n "${SERVED_AT_START:-}" ]; then
            set +e
            python3 check_serving_version.py --was "${SERVED_AT_START}" 2>&1 | tee -a resnap.log
            vrc=${PIPESTATUS[0]}
            set -e
            if [ "$vrc" != "0" ]; then
              rc=2
              rm -f baseline_retrieval.json
              echo "✗ CAPTURE DISCARDED — prod was redeployed during the measurement." \
                | tee -a resnap.log
            fi
          fi

          {
            echo "## Recall baseline re-snap (required arm)"
            echo
            if [ "$rc" = "0" ]; then
              echo "Captured over \`${{ inputs.repeat || '3' }}\` pass(es) on a complete,"
              echo "\`hybrid\`-served run. Download the \`recall-gate-baseline\` artifact and"
              echo "commit \`scripts/memory-bench/baseline_retrieval.json\`."
              echo
              echo '```json'
              cat baseline_retrieval.json
              echo '```'
            else
              reason="$(grep -m1 '^GATE_REASON:' resnap.log | sed 's/^GATE_REASON: *//' || true)"
              echo "⚠️ Capture exited $rc — \`baseline_retrieval.json\` was **NOT** written."
              echo
              echo "**Reason:** \`${reason:-unspecified}\`"
              echo
              echo "\`capture-refused\` means the run was not a sound basis for a required"
              echo "check's threshold — incomplete sample or degraded retrieval mode."
              echo
              echo "\`version-changed-mid-run\` means a backend deploy landed inside the"
              echo "measurement window, so the numbers span two binaries and describe"
              echo "neither. Nothing is wrong with the harness: re-dispatch once the deploy"
              echo "has settled. Check the open PRs on a \`deploy-backend.yml\` path first,"
              echo "because a \`--repeat 3\` capture occupies prod for ~65 minutes."
              echo
              echo "Either way: fix the cause and re-dispatch; do not hand-edit the baseline."
            fi
            echo
            echo '```'
            tail -40 resnap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the re-snapped recall baseline
        if: always() && steps.mode.outputs.capture == 'true' && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recall-gate-baseline
          path: |
            scripts/memory-bench/baseline_retrieval.json
            scripts/memory-bench/resnap.log
          retention-days: 30

      - name: Run recall gate (no LLM)
        id: gate
        if: steps.scope.outputs.relevant == 'true' && steps.version.outputs.rc == '0' && steps.mode.outputs.capture != 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-p
          # The commit the version pin confirmed prod was serving before the
          # measurement began. Empty when no pin applied and the endpoint could
          # not be read, in which case the stability check below is skipped.
          SERVED_AT_START: ${{ steps.version.outputs.served }}
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1: the harness prints its tracebacks to stderr, so without this the
          # uploaded gate.log — the only artifact anyone reads after the fact —
          # contains the "could not measure" verdict but not the reason for it.
          python run_ci.py --retrieval-only --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e

          # run_ci emits a machine-readable `GATE_REASON: <kind> — <detail>` line on
          # every INCONCLUSIVE path. Belt-and-braces: an older run_ci returns 0 with
          # no baseline, which is a VACUOUS GREEN (it compared against nothing) —
          # treat it as inconclusive too. A gate that enforces nothing must never
          # look green-and-healthy.
          reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
          if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval.json' gate.log; then
            rc=2
            reason="no-baseline — the gate compared against nothing"
          fi

          # The pin above proved which binary we STARTED against. A deploy takes
          # ~6-7 min and a recall pass 17-25, so the binary can still swap in the
          # middle — which is exactly what happened to run 30325802161, dispatched
          # to be a clean post-deploy run and crossed by one anyway at 03:43:10Z.
          #
          # This OVERRIDES rc=1 as well as rc=0, on purpose. A score straddling two
          # binaries is a measurement of neither, so a REGRESSION verdict from one
          # is no more attributable than a PASS — and a red nobody can reproduce is
          # how a gate loses its authority. INCONCLUSIVE pages instead.
          if [ -n "${SERVED_AT_START:-}" ]; then
            set +e
            python3 check_serving_version.py \
              --was "${SERVED_AT_START}" 2>&1 | tee -a gate.log
            vrc=${PIPESTATUS[0]}
            set -e
            if [ "$vrc" != "0" ]; then
              rc=2
              reason="$(grep -m1 '^GATE_REASON: version-changed-mid-run' gate.log \
                        | sed 's/^GATE_REASON: *//' || true)"
              [ -z "$reason" ] && reason="version-changed-mid-run — prod was redeployed during the measurement"
            fi
          fi
          [ -z "$reason" ] && reason="unspecified"

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## Memory recall gate"
            echo
            case "$rc" in
              0) echo "✅ **PASS** — recall measured, comparable, and within tolerance of the baseline." ;;
              1) echo "❌ **REGRESSION** — recall dropped below the baseline **in the same retrieval mode**."
                 echo "This PR makes memory measurably worse. This is the only condition that blocks the merge." ;;
              # The banner is scoped to the REASON KIND. `mode-mismatch` and
              # `mode-unknown` really do measure nothing; `category-unmeasured` and
              # `baseline-sample-mismatch` are per-category and leave every
              # comparable category enforced (decide_verdict ranks REGRESSION above
              # INCONCLUSIVE). One banner for both overstates the partial case, and
              # a banner that overstates gets discounted — after which it also
              # understates, at the exact moment it is telling the truth.
              2) case "${reason%% *}" in
                   category-unmeasured|baseline-sample-mismatch|persistent-errors)
                     echo "### ⚠️ PARTIAL — some categories were not compared on this PR"
                     echo
                     echo "> **This is not total blindness.** Every *comparable* category was measured"
                     echo "> and enforced, and a regression in one of those still fails this check."
                     echo "> The gap is narrower: the categories named below were set aside as"
                     echo "> not-comparable, so a regression **in those** could pass through unseen." ;;
                   *)
                     echo "### ⚠️ INCONCLUSIVE — the recall safety net is **BLIND** for this PR"
                     echo
                     echo "> **Nothing was measured, so nothing was enforced.** A real memory regression"
                     echo "> could pass through this PR unseen." ;;
                 esac
                 echo "> This check is **not failing you** — the cause is infrastructure you cannot"
                 echo "> fix from a PR, and a red check nobody can clear just gets bypassed until"
                 echo "> the whole gate is worthless."
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 case "${reason%% *}" in
                   persistent-errors)
                     echo "One or more questions failed with an error that is **not transient**:"
                     echo "either the message is not an infrastructure blip, or the question spent"
                     echo "its entire retry allowance and every attempt died the same way. Such a"
                     echo "question will fail identically on the next run, so it is not merely"
                     echo "excluded from this score — it is excluded from every score, for ever."
                     echo
                     echo "The percentage budget (\`--max-error-rate\`) cannot express that: it"
                     echo "forgives up to 10% *per run*, which forgives the same 8% permanently."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** the error report in the log"
                     echo "names the question ids and the failing stage. Fix the harness or the"
                     echo "dataset — this one does not clear itself and no re-snap will hide it." ;;
                   baseline-sample-mismatch)
                     echo "A category was measured on a different number of questions than the baseline"
                     echo "was captured on. \`1.000\` over 2 questions and \`0.500\` over 4 are two"
                     echo "different measurements, not a 50% drop — so they are not compared."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** re-snap the baseline so its"
                     echo "denominator matches — \`python run_ci.py --retrieval-only --update-baseline\`." ;;
                   category-unmeasured)
                     echo "Those categories lost questions to a harness error (see the log below), which"
                     echo "widens the per-question quantum past the tolerance — at n=3 one unlucky"
                     echo "answer moves the score by 1/3 > 0.25 and would clear the bar on its own."
                     echo
                     echo "**Fix:** stop losing the questions, rather than lowering the bar. The error"
                     echo "report in the log names the failing stage per question." ;;
                   *)
                     echo "Most common cause: the baseline was captured in one retrieval mode (\`hybrid\`)"
                     echo "but this run was served in another (\`bm25-only\`, i.e. the embedder is down and"
                     echo "\`recall\` failed open). Hit@k is not comparable across modes, so a lower score"
                     echo "here says nothing about this PR's code."
                     echo
                     echo "**Fix (repo maintainer, not the PR author):** restore the embedder, then re-snap"
                     echo "the baseline — \`python run_ci.py --retrieval-only --update-baseline\`." ;;
                 esac
                 echo "A tracking issue has been opened/updated so this blindness is not silent." ;;
              *) echo "❌ Gate exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # rc=1 (REGRESSION) is the ONLY blocking condition — measured, comparable,
          # worse. rc=2 (INCONCLUSIVE) must not fail the check: see the alert step.
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then exit "$rc"; fi
          exit 0

      # ---------------------------------------------------------------------
      # Blindness must never be silent. INCONCLUSIVE does not block the merge,
      # so the ONLY thing standing between "the safety net stopped working" and
      # "nobody ever noticed" is this alert.
      #
      # ONE tracking issue, not one per PR: we comment on the existing open issue
      # instead of opening a new one, and only when the reason KIND changed (cf.
      # the 292-task alert storm — a poisoned dedup key turns an alert into spam,
      # and spam is ignored, which is the same as having no alert at all).
      # ---------------------------------------------------------------------
      # Reads from EITHER blind source. The version pin can refuse before the gate
      # step ever runs, in which case `steps.gate.outputs.rc` is empty — keying the
      # alert on the gate step alone would make the newest way of going blind the
      # one way that goes blind SILENTLY, which is the whole failure mode this
      # alert exists to prevent.
      #
      # A DRILL IS NOT AN INCIDENT. `expect_commit` exists so the refusal can be
      # proved on demand by pinning to a commit prod is not serving — and the
      # first time that proof was run (30328820759) it posted a real
      # `version-mismatch` alert onto the live tracking issue #397, claiming the
      # safety net was blind when nothing was wrong. Left alone, the acceptance
      # criterion that asks for this proof would charge a false page every time
      # anyone satisfied it, and the readers of that issue would learn to discount
      # it — the same alert-fatigue failure the dedup key below exists to avoid.
      #
      # The suppression is narrow AND fails toward alerting. Only a
      # `workflow_dispatch` that explicitly NAMED a commit is treated as a drill:
      # `expect_commit` is unsettable on push/schedule, so those runs match the
      # first disjunct and alert unconditionally, whatever an absent input coerces
      # to. (A bare `inputs.expect_commit == ''` would put the whole alert at the
      # mercy of that coercion — a guard that silences the alarm on every
      # automatic run is strictly worse than the false page it removes.) A drill
      # is never silent either: the operator dispatched it, and `rc=2` plus the
      # reason are in the step summary and the log.
      # The shell that used to live here — marker, dedup window, storm guard — is
      # now `.github/actions/blindness-issue`, shared with the REQUIRED branch arm
      # and the advisory arm. It moved rather than being copied a third time
      # because each existing copy had already lost something different on the way
      # across; the action's header comment lists which. The `if:` stays here: what
      # a given arm may alert on is a property of the arm.
      #
      # TITLE CHANGED (was `Memory recall gate is INCONCLUSIVE (safety net
      # blind)`). Since #394 `Memory recall gate` is the name of a DIFFERENT
      # check — the required branch arm — so an episode raised by this canary and
      # titled after that check sent its reader to a green check to explain a
      # blind one. Renamed while no issue with the old title was open (verified
      # against the tracker: #458, the last one, closed 2026-07-30 05:44Z), so
      # nothing is orphaned by the change.
      # SECOND DRILL GUARD, same shape, different input — see the branch arm's
      # copy for the measured false page (#541 was this step's). `mcp_ref` names
      # a CLIENT to build; a dispatch that sets it is measuring a different
      # system on purpose, which is neither an incident nor a recovery. The
      # `env.MCP_REF == ''` disjunct matters more here than on the branch arm:
      # this job's resolve-the-client step is skipped when the version pin fails,
      # and the version-blindness path must keep paging.
      - name: Alert — the prod recall canary is blind (INCONCLUSIVE)
        if: >-
          !cancelled()
          && steps.scope.outputs.relevant == 'true'
          && (steps.gate.outputs.rc == '2' || steps.version.outputs.rc == '2')
          && (github.event_name != 'workflow_dispatch' || inputs.expect_commit == '')
          && (github.event_name != 'workflow_dispatch'
              || env.MCP_REF == '' || env.MCP_REF == 'main')
        uses: ./.github/actions/blindness-issue
        with:
          mode: alert
          title: 'Memory recall canary (prod) is INCONCLUSIVE (safety net blind)'
          marker-slug: recall-gate-blind
          arm: 'The memory recall canary (prod)'
          reason: ${{ steps.gate.outputs.reason || steps.version.outputs.reason }}
          reason-kind: ${{ steps.gate.outputs.reason_kind || steps.version.outputs.reason_kind }}
          stakes: >-
            This arm is advisory and blocks no merge, so its blindness is
            invisible in the UI. While this episode is open, **nothing is
            watching whether the recall quality we already DEPLOYED has
            regressed** — the required branch arm rules on PR builds, never on
            prod.
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A gate that recovered should stop shouting: close the tracking issue once
      # a real, comparable verdict is produced again.
      # EVENT SCOPING IS IDENTICAL TO THE ALERT ABOVE. Read the two `if:`s
      # together; `test_gate_blindness.py` extracts both from this file and fails
      # if they diverge, because the previous divergence was invisible in review.
      #
      # NEITHER is push-scoped. This step used to carry
      # `github.event_name == 'push'` while the alert carried no such clause, so
      # the alert could be RAISED by a schedule but only RESOLVED by a push: a
      # blind episode found on a Sunday stayed open until someone happened to
      # push to main. Episodes were bounded by push cadence rather than by
      # recovery.
      #
      # That is load-bearing now rather than merely untidy. The dedup key below
      # suppresses a same-kind alert for as long as the issue is OPEN, so a
      # stale-open issue does not just sit there — it MUTES its own re-alerts.
      # The widened dedup is correct, but it is only correct while the issue
      # closes on recovery.
      #
      # Why unscoped is the right direction and not "scope the alert too": this
      # job is the prod canary and carries `if: github.event_name != 'pull_request'`
      # at the job level, so it never measures a branch. Every run that reaches
      # here measured PROD. The trigger therefore says nothing about what was
      # measured — a schedule that comes back green is exactly as much a recovery
      # as a push that does.
      #
      # The drill exclusion IS mirrored, deliberately. `expect_commit` marks an
      # operator drill, and a drill is not an incident (see the alert's comment);
      # by the same token a drill is not a RECOVERY. Without this clause a
      # dispatch pinned to a commit prod happens to be serving could close a real
      # episode it was never permitted to open — the same false signal, in the
      # direction that loses the alarm instead of faking one.
      - name: Resolve — the prod recall canary is measuring again
        if: >-
          !cancelled()
          && steps.scope.outputs.relevant == 'true'
          && steps.gate.outputs.rc == '0'
          && (github.event_name != 'workflow_dispatch' || inputs.expect_commit == '')
          && (github.event_name != 'workflow_dispatch'
              || env.MCP_REF == '' || env.MCP_REF == 'main')
        uses: ./.github/actions/blindness-issue
        with:
          mode: resolve
          title: 'Memory recall canary (prod) is INCONCLUSIVE (safety net blind)'
          recovery-note: >-
            The prod canary produced a comparable verdict again (baseline and run
            in the same retrieval mode).
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload recall-gate results
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recall-gate-results
          path: |
            scripts/memory-bench/gate.log
            scripts/memory-bench/results/
            version.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The advisory arm: paid, LLM-judged, end-to-end. Never a PR merge gate.
  # ---------------------------------------------------------------------------
  memory-bench:
    name: LongMemEval-S end-to-end (advisory)
    runs-on: ubuntu-latest
    # Same single prod server as the canary, so the same group: two arms racing
    # each other through one API is exactly the contention the block exists to
    # remove, and putting them in separate groups would serialise each arm
    # against itself while leaving them free to strangle each other.
    concurrency:
      group: memory-bench-prod
      cancel-in-progress: false
    # ORDERING, not merely membership — and this line is why the canary exists at
    # all rather than only on paper.
    #
    # A GitHub concurrency group holds ONE running + ONE pending member; a third
    # arrival cancels the pending one. Both jobs of a single run are created in
    # the same second, so with no `needs:` between them the second to queue killed
    # the first. WHICH of the two loses is a RACE, not an order: over the six runs
    # observed before the fix, exactly one sibling died every time (6/6) but the
    # victim split 3-3 — on `push` alone the canary lost 3 (30330437164,
    # 30334077279, 30334590080) and the advisory lost 2 (30335245738,
    # 30337511797), plus 1 advisory on `schedule`. An earlier version of this
    # comment said "the first was always the canary"; that was generalised from
    # three runs sharing one event type and is retracted. It matters for the fix,
    # not the defect: anything that merely re-orders the two arms leaves the coin
    # in play, whereas `needs:` removes it. What holds without the ordering claim
    # is the blast radius — the canary was cancelled on 3 of 3 pushes, twice at
    # **0s**, and produced zero verdicts in its entire existence (#3ce651a0), so
    # the version-attribution guard shipped into it by #402 had never executed. The
    # version-attribution guard shipped in #402 lives inside that arm and had
    # therefore never executed on a real trigger.
    #
    # The accepted cost documented on the canary above ("a third arrival
    # supersedes the pending one — the newer commit is the one worth measuring")
    # was correct reasoning about a third RUN. The arrival here was the second JOB
    # of the SAME run carrying the SAME sha, so the justifying premise never held
    # and the cost that was accepted was not the cost being paid. A comment that
    # anticipates the wrong arrival reads as a defence and silences the question.
    #
    # `needs:` removes the collision at its source rather than reshuffling it:
    # this job cannot enter the group until the canary has LEFT it, so the two can
    # never be co-pending. It also gives the pair the property the group was
    # bought for — prod is measured by at most one job at a time — without either
    # arm being able to pre-empt the other.
    needs: recall-gate
    # DELIBERATELY NOT version-pinned, unlike the canary above. This arm measures
    # the same live prod and can straddle a deploy in exactly the same way, so the
    # gap is real — it is scoped out rather than overlooked. It is advisory (never
    # a merge gate) and judge-based, so its numbers are already read as
    # indicative; the pin was spent on the arm whose job is attribution. Stated
    # here so the next reader does not infer from the shared concurrency group
    # that this job is covered. If this arm's baseline ever starts gating
    # anything, it needs the pin first.
    #
    # One pass is ~19 min, so a --repeat 3 baseline capture needs room.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 30 }}
    permissions:
      contents: read
      # Advisory does not mean unwatched. An arm that cannot compare must page
      # somebody, or tightening its comparison rules just makes it silent.
      issues: write
    # A retrieval capture is a capture for the OTHER arm — it must not drag the
    # paid job in with it. Without this, re-snapping a free recall baseline
    # would silently also spend an end-to-end capture.
    #
    # Named as the arms this job SERVES, not as the ones it excludes. The
    # previous form was `baseline_arm != 'retrieval'`, correct while the options
    # were {end-to-end, retrieval, both}; #394 added `retrieval-branch`, and a
    # negation cannot know about an option added after it — so the fourth arm
    # inherited "paid capture" by default and re-armed the exact spend this
    # guard exists to prevent. An allow-list fails toward not spending money.
    # Pinned by `test_gate_arm.py::test_only_the_paid_arms_start_the_paid_job`.
    #
    # `push` REMOVED (#3ce651a0). Two independent reasons, either sufficient:
    #
    #   1. This arm is deliberately NOT version-pinned (see above), so a number it
    #      produces on a push cannot be attributed to the commit that triggered
    #      it — the deploy of that very commit is still in flight underneath it.
    #      A per-commit trigger on an arm that cannot answer a per-commit question
    #      buys an unattributable paid number. The commit-level question belongs
    #      to the canary; this arm's question is "how is prod doing", and its home
    #      is the nightly, exactly as the `schedule:` trigger already says.
    #   2. It is 100% of the observed canary kills. With `needs:` above, a push
    #      run now puts exactly ONE member in `memory-bench-prod` instead of two,
    #      which is the only shape in which the group's documented one-running +
    #      one-pending behaviour matches the cost that was accepted for it.
    #
    # Cost, stated rather than hidden: main no longer gets a per-push end-to-end
    # judge score. It gets the nightly, plus `workflow_dispatch` with
    # `full_eval: true` on demand — which is also how the both-arms path is now
    # exercised on purpose instead of only by accident.
    #
    # `!cancelled()` rather than `success()`: the canary's verdict is not this
    # arm's business — a red canary (rc=1) is a prod regression the advisory
    # should still be measured against, and a default `needs:` skip would have
    # quietly made a canary failure disable the nightly too. It is NOT `always()`:
    # this arm is paid, and a human who cancels the run means it.
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
         (inputs.full_eval ||
          (inputs.update_baseline &&
           (inputs.baseline_arm == 'end-to-end' || inputs.baseline_arm == 'both')))))

    steps:
      # Same one-source-of-truth reason as the recall arm: three steps below key
      # off "is this dispatch an end-to-end capture", and `update_baseline` alone
      # is no longer that question — it now also means the other arm.
      - name: Capture or judge?
        id: mode
        run: |
          echo "capture=${{ (inputs.update_baseline && (inputs.baseline_arm == 'end-to-end' || inputs.baseline_arm == 'both')) && 'true' || 'false' }}" \
            >> "$GITHUB_OUTPUT"

      - name: Checkout evc-mesh
        uses: actions/checkout@v7
        with:
          # `check_serving_version.py` decides "prod is close enough" by DIFFING
          # prod's commit against this one and asking whether anything
          # deploy-backend.yml deploys changed. Both commits therefore have to be
          # in the checkout, and the default depth-1 clone has exactly one.
          #
          # Without this the pin below cannot fail SAFE — it can only fail. The
          # string compare that precedes the diff means the step passes solely
          # when prod already serves this exact sha; every other case, including
          # the ordinary one (a CI-only merge prod will never deploy), reads as
          # "commit <sha> is not in this checkout" and refuses. The pin that was
          # added so a capture could not straddle a deploy would instead have
          # blocked EVERY capture, forever.
          #
          # Observed on the first dispatch after that pin merged: run
          # 30909509069, prod on ff6a694, checkout 328ed3f, diff empty because
          # #505 touched only CI files — polled 900s and aborted a capture that
          # was correctly attributable the whole time.
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # Which binary is this CAPTURE about to measure?
      #
      # The required arm has had this since #410; this arm never did, and the
      # asymmetry is not defensible on the capture path. A judging run that
      # straddles two binaries yields one wrong advisory verdict, visible that
      # day. A BASELINE that straddles two binaries becomes the standing floor
      # this arm is compared against for weeks, and nothing in the file says so
      # — which is this card's own defect (#f0e655e7) re-manufactured from the
      # capture side.
      #
      # Capture only, deliberately. Pinning the nightly judging run is a real
      # gap too, but a different one: it is about attributing a single night's
      # score, not about what a standing floor measured. Scoping it here keeps
      # the paid nightly on its current trigger conditions.
      #
      # Runs BEFORE the Go build so a capture that cannot be attributed costs
      # the wait and nothing else — no build, no ~60 min of prod, no tokens.
      # ---------------------------------------------------------------------
      # Named distinctly from the recall arm's identical-purpose step on
      # purpose: the workflow self-checks slice this file by `- name:` and take
      # the FIRST match, so two steps sharing a name make the second one's test
      # silently assert against the first — a green test for wiring that is not
      # there.
      - name: Which commit will this capture measure?
        id: version
        if: steps.mode.outputs.capture == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          # Ceiling, not a cost: a matching first poll returns in ~1s. Sized for
          # the ~6-7 min a backend deploy takes, doubled, so a queued deploy
          # still fits. Paired with this job's `timeout-minutes` — raise both
          # together or the guard dies as a timeout on the runs it exists for.
          BENCH_VERSION_WAIT_SECONDS: '900'
          # Operator-supplied, so it goes through the environment rather than
          # `${{ }}` interpolation into the script body — an input spliced into
          # a shell line is the standard Actions script-injection shape, and
          # this one runs with the bench credentials in scope.
          EXPECT_COMMIT_INPUT: ${{ inputs.expect_commit }}
        run: |
          set -euo pipefail
          # Pin only where `github.sha` names a commit prod is expected to serve.
          # A capture is dispatched on main, which deploy-backend.yml ships.
          expect="${EXPECT_COMMIT_INPUT:-}"
          if [ -z "$expect" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            expect="${{ github.sha }}"
          fi

          if [ -n "$expect" ]; then
            echo "Pinning to $expect (wait up to ${BENCH_VERSION_WAIT_SECONDS}s)."
            set +e
            python3 scripts/memory-bench/check_serving_version.py \
              --expect "$expect" --wait-seconds "${BENCH_VERSION_WAIT_SECONDS}" \
              2>&1 | tee version.log
            rc=${PIPESTATUS[0]}
            set -e
          else
            echo "No pin: ${{ github.event_name }} on ${{ github.ref }} is not a commit prod serves."
            set +e
            python3 scripts/memory-bench/check_serving_version.py --record 2>&1 | tee version.log
            rc=${PIPESTATUS[0]}
            set -e
          fi

          reason="$(grep -m1 '^GATE_REASON:' version.log | sed 's/^GATE_REASON: *//' || true)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          # A capture ABORTS here rather than proceeding unattributed. The
          # judging path has an INCONCLUSIVE to fall back on; a capture does
          # not — its only output is a file that will be committed, and an
          # unattributable one is worse than none.
          if [ "$rc" != "0" ]; then
            {
              echo "## LongMemEval-S baseline re-snap — NOT RUN"
              echo
              echo "### ⚠️ Refused: could not confirm which binary would be measured"
              echo
              echo "**Reason:** \`${reason:-unspecified}\`"
              echo
              echo "> Nothing was measured and no baseline was written. A backend deploy"
              echo "> was in flight, or prod is serving code that is not on the line under"
              echo "> test. Re-dispatch once the deploy has landed — a \`--repeat 3\`"
              echo "> capture occupies prod for ~60 minutes, so check the open PRs on a"
              echo "> \`deploy-backend.yml\` path first."
              echo
              echo '```'
              tail -30 version.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: Checkout evc-mesh-mcp
        uses: actions/checkout@v7
        with:
          # See the branch arm's copy of this key for why '' == default branch.
          ref: ${{ inputs.mcp_ref }}
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Resolve which mesh-mcp this run measures
        env:
          MCP_REF_INPUT: ${{ inputs.mcp_ref }}
        run: |
          branch="$(git -C evc-mesh-mcp rev-parse --abbrev-ref HEAD)"
          if [ "$branch" = "HEAD" ]; then
            branch="${MCP_REF_INPUT:-unknown}"
          fi
          {
            echo "MCP_REF=$branch"
            echo "MCP_COMMIT=$(git -C evc-mesh-mcp rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "mesh-mcp client: ref=$branch commit=$(git -C evc-mesh-mcp rev-parse --short HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      # Third copy of the binary-provenance check — see the branch arm's copy.
      # `file` already said what KIND of binary this is; it never said which
      # source produced it, which is the only part a client A/B depends on.
      - name: Cross-compile mesh-mcp (linux/amd64)
        env:
          MCP_REF_INPUT: ${{ inputs.mcp_ref }}
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin
          echo "mesh-mcp built: $(file ../mesh-mcp-bin)"
          built="$(go version -m ../mesh-mcp-bin | sed -n 's/.*vcs\.revision=//p' | head -1)"
          echo "mesh-mcp binary: vcs.revision=${built:-<unstamped>} (checkout ${MCP_COMMIT:-<unset>})"
          if [ -n "$MCP_REF_INPUT" ] && [ "$built" != "$MCP_COMMIT" ]; then
            echo "::error::dispatched mcp_ref='${MCP_REF_INPUT}' resolved to ${MCP_COMMIT:-<unset>}, but the binary carries '${built:-<unstamped>}' — this run would have measured a client nobody asked for"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openai mcp httpx

      # ---------------------------------------------------------------------
      # Baseline capture. Runs HERE rather than on a maintainer's laptop so the
      # baseline is produced by the same runner, the same MESH_BENCH_KEY and the
      # same chat/judge models as the nightly that will be compared against it —
      # a baseline captured in a different environment is the same class of
      # not-comparable this workflow already exits 2 over.
      # ---------------------------------------------------------------------
      - name: Re-snap the end-to-end baseline
        id: resnap
        if: steps.mode.outputs.capture == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-e-snap
          # The commit the pre-flight pin confirmed prod was serving. Empty only
          # when no pin applied and the endpoint could not be read.
          SERVED_AT_START: ${{ steps.version.outputs.served }}
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --update-baseline \
            --served-commit "${SERVED_AT_START:-}" \
            --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e

          # POST-FLIGHT STABILITY. The pin above says which binary the capture
          # STARTED on; only this says it was still that binary at the end. The
          # documented case is capture 30336693957 (2026-07-28): prod went
          # 5d2cda8 -> ba7deae 42 minutes into a 65-minute capture, the run
          # exited SUCCESS, and recovering what it had measured took a human
          # diffing two commits by hand afterwards.
          #
          # The file is DELETED, not just flagged. `capture_blockers` refuses
          # BEFORE writing for exactly this reason: a guard that reports after
          # the file is on disk is advice, not a guard — the artifact still
          # uploads and the figure still gets committed. This check can only run
          # after the measurement, so deleting is how it inherits that property.
          if [ "$rc" = "0" ] && [ -n "${SERVED_AT_START:-}" ]; then
            set +e
            python3 check_serving_version.py --was "${SERVED_AT_START}" 2>&1 | tee -a resnap.log
            vrc=${PIPESTATUS[0]}
            set -e
            if [ "$vrc" != "0" ]; then
              rc=2
              rm -f baseline.json
              echo "✗ CAPTURE DISCARDED — prod was redeployed during the measurement." \
                | tee -a resnap.log
            fi
          fi

          {
            echo "## LongMemEval-S baseline re-snap"
            echo
            if [ "$rc" = "0" ]; then
              echo "Captured over \`${{ inputs.repeat || '3' }}\` pass(es). Download the"
              echo "\`memory-bench-baseline\` artifact and commit \`scripts/memory-bench/baseline.json\`."
              echo
              echo '```json'
              cat baseline.json
              echo '```'
            else
              reason="$(grep -m1 '^GATE_REASON:' resnap.log | sed 's/^GATE_REASON: *//' || true)"
              echo "⚠️ Capture exited $rc — \`baseline.json\` was **NOT** written."
              echo
              echo "**Reason:** \`${reason:-unspecified}\`"
              echo
              echo "\`version-changed-mid-run\` means a backend deploy landed inside the"
              echo "measurement window, so the numbers span two binaries and describe"
              echo "neither. Nothing is wrong with the harness: re-dispatch once the deploy"
              echo "has settled. Check the open PRs on a \`deploy-backend.yml\` path first,"
              echo "because a \`--repeat 3\` capture occupies prod for ~60 minutes."
              echo
              echo "Either way: fix the cause and re-dispatch; do not hand-edit the baseline."
            fi
            echo
            echo '```'
            tail -30 resnap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the re-snapped baseline
        if: always() && steps.mode.outputs.capture == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: memory-bench-baseline
          path: |
            scripts/memory-bench/baseline.json
            scripts/memory-bench/resnap.log
          retention-days: 30

      - name: Run LongMemEval-S end-to-end
        if: steps.mode.outputs.capture != 'true'
        id: bench
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
          # Namespaces this job's fixtures. Fixture names used to be a pure
          # function of the question id, while `remember` UPSERTs on key and
          # cleanup deletes by tag — so any two benches sharing this workspace
          # wrote the same rows and swept each other's haystacks mid-run. That is
          # invisible by construction: a question whose haystack was deleted under
          # it retrieves nothing and scores a clean miss (#eb1c5617).
          #
          # Scoped by JOB, not just by run. It was bought when recall-gate and
          # the advisory arm ran CONCURRENTLY with no `needs:` between them —
          # same questions, same workspace, so a run-only nonce left those two
          # sweeping each other's fixtures. #3ce651a0 has since serialised the
          # arms (`needs: recall-gate` on the advisory) and taken the advisory
          # off `push`, so that overlap can no longer occur on any trigger.
          #
          # The job scope STAYS, and not out of caution: it is what makes an
          # orphaned row name the job that abandoned it, it costs nothing, and it
          # is the thing that would keep a future re-parallelising of the arms
          # from silently re-opening the race. A guard removed because the
          # condition it guards is currently impossible is a guard removed at
          # exactly the moment nobody would notice its absence.
          #
          # Derived from the run id rather than random so an orphaned row names
          # the run that abandoned it.
          BENCH_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-e
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1 for the same reason as the recall gate: the harness prints its
          # tracebacks to stderr, and bench.log is the only artifact anyone reads.
          python run_ci.py --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee bench.log
          rc=${PIPESTATUS[0]}
          set -e

          reason="$(grep -m1 '^GATE_REASON:' bench.log | sed 's/^GATE_REASON: *//' || true)"
          [ -z "$reason" ] && reason="unspecified"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## LongMemEval-S (advisory)"
            echo
            case "$rc" in
              0) echo "✅ PASS — measured, comparable, within tolerance of the baseline." ;;
              1) echo "❌ REGRESSION — end-to-end memory quality dropped past the baseline's own spread." ;;
              2) # The scope of the blindness depends on WHICH reason fired, and
                 # saying "measured nothing" when six of seven categories were
                 # enforced normally is not a harmless exaggeration: a banner that
                 # overstates gets discounted, and then it understates on the day
                 # the arm really is fully dark.
                 case "${reason%% *}" in
                   category-unmeasured)
                     echo "### ⚠️ INCONCLUSIVE — **one or more categories** went unmeasured"
                     echo
                     echo "> **Partial blindness, not total.** Every other category was compared and"
                     echo "> enforced normally; a regression in one of those would still have been"
                     echo "> reported. What is missing is the categories named below, which lost"
                     echo "> questions to harness errors and were set aside rather than scored on a"
                     echo "> sample too small to compare." ;;
                   *)
                     echo "### ⚠️ INCONCLUSIVE — this arm measured nothing"
                     echo
                     echo "> Advisory does not mean unwatched. Nothing was compared, so nothing was"
                     echo "> checked — and because this arm never blocks a merge, a silent"
                     echo "> INCONCLUSIVE is indistinguishable from a healthy pass. A tracking issue"
                     echo "> has been opened/updated so it is not silent." ;;
                 esac
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "* \`harness-errors\` — the chat/judge API is down or out of credit."
                 echo "* \`mode-unknown\` / \`mode-mismatch\` — the baseline and this run were served"
                 echo "  in different retrieval modes, or \`baseline.json\` predates mode-scoping."
                 echo "  Re-snap it: run this workflow with **update_baseline**."
                 echo "* \`no-baseline\` — there is nothing to compare against at all."
                 echo "* \`category-unmeasured\` — **partial**: specific categories lost questions to"
                 echo "  harness errors, so their surviving sample no longer supports the tolerance."
                 echo "  The other categories were still enforced. Fix the harness error, not the bar."
                 echo "* \`no-eligible-category\` — the baseline's recorded run-to-run spread is"
                 echo "  wider than its own scores everywhere, so no category could fail." ;;
              *) echo "❌ Eval exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Same rule as the recall gate, for the same reason. rc=2 is an INFRA
          # failure (judge/chat API out of credit) — nothing was measured, so
          # there is nothing to report red about. Failing here paints every push
          # to main red for a cause no author can fix, and a check that is red
          # forever is one people learn to scroll past — which is how the real
          # rc=1 would get ignored too. Advisory means advisory: an unmeasurable
          # run is a loud no-op, a measured regression still shouts.
          if [ "$rc" = "2" ]; then
            echo "::warning title=LongMemEval-S inconclusive::The advisory eval measured nothing ($reason)."
            exit 0
          fi
          exit $rc

      # ---------------------------------------------------------------------
      # The counterpart to tightening this arm's comparison rules. Before, an
      # invalid comparison was published as `✗ REGRESSION` — wrong, but at least
      # visible. Now it exits 2, which does not fail the job, so without this step
      # the fix would trade a noisy red for a silent no-op on an arm nobody is
      # required to look at. Same one-issue / dedup-on-reason-kind shape as the
      # recall gate: an alert that fires per run is spam, and spam is ignored.
      # ---------------------------------------------------------------------
      # Third caller of the same shared action. The TITLE is byte-identical to what
      # this arm has always used, unlike the prod arm's: issue #464 is OPEN under
      # it right now (raised 2026-07-30 07:05Z), and a retitle here would strand
      # it — the resolve looks up by exact title, so a renamed arm can never close
      # the episode it opened under the old name.
      # THIRD DRILL GUARD — see the branch arm's copy. This arm reaches the same
      # client gate in `run_ci.py` (the comparison is per baseline FILE, not per
      # arm), so `full_eval=true` together with `mcp_ref=<branch>` would page an
      # episode about a run that deliberately measured another client. Not
      # observed live only because that combination has not been dispatched yet;
      # the other two arms both produced their false episode on the first try.
      - name: Alert — advisory arm measured nothing (INCONCLUSIVE)
        if: >-
          !cancelled()
          && steps.bench.outputs.rc == '2'
          && (github.event_name != 'workflow_dispatch'
              || env.MCP_REF == '' || env.MCP_REF == 'main')
        uses: ./.github/actions/blindness-issue
        with:
          mode: alert
          title: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          marker-slug: advisory-arm-blind
          # `lede` rather than the derived one: this arm's reason kinds are the
          # end-to-end harness's, not the recall gate's version/category kinds, so
          # the derived case statement would fall through to its generic arm and
          # say less than this sentence does.
          lede: >-
            The end-to-end LongMemEval arm produced no verdict: it compared
            nothing, so it checked nothing.
          stakes: >-
            It does not block merges, so this would otherwise be
            indistinguishable from a nightly pass.
          reason: ${{ steps.bench.outputs.reason }}
          reason-kind: ${{ steps.bench.outputs.reason_kind }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve advisory blindness alert (arm is measuring again)
        if: >-
          !cancelled()
          && steps.bench.outputs.rc == '0'
          && (github.event_name != 'workflow_dispatch'
              || env.MCP_REF == '' || env.MCP_REF == 'main')
        uses: ./.github/actions/blindness-issue
        with:
          mode: resolve
          title: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          recovery-note: 'The advisory arm produced a comparable verdict again.'
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload benchmark results
        if: always() && steps.mode.outputs.capture != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: memory-bench-results
          path: |
            scripts/memory-bench/bench.log
            scripts/memory-bench/results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # THE WATCHDOG. A safety net whose death is indistinguishable from weather is
  # not a safety net.
  #
  # `Memory recall canary (prod)` produced ZERO verdicts between the day it was
  # created and the day this job was written, and nobody noticed — because every
  # one of those deaths surfaced as `cancelled`, and `cancelled` is the
  # conclusion every reader has been trained to skim past as a runner hiccup.
  # The defect was not that the arm could be evicted; it is that being evicted,
  # timing out, and being legitimately superseded are the SAME WORD in the UI.
  #
  # So this job does the one thing the conclusion cannot: it separates them, and
  # it goes red for every cause except the one that is actually expected.
  #
  # Deliberately NOT a member of `memory-bench-prod`. It touches no prod
  # endpoint, and a watchdog that the thing it watches can evict is decoration.
  # ---------------------------------------------------------------------------
  prod-arm-cancelled:
    name: Prod arm cancelled (must not be silent)
    needs: [recall-gate, memory-bench]
    # `always()` is load-bearing and not boilerplate: a job whose dependency was
    # CANCELLED is skipped by default, which would make this watchdog absent from
    # precisely the runs it exists for. `!cancelled()` would do the same thing.
    #
    # THE LAST TWO CLAUSES ARE THE RECOVERY CASE, and this job now runs on healthy
    # runs too. Until #5e38c799 it ran only when something was cancelled, which is
    # why it had no resolve half: there was no run on which one could have fired.
    # The cost of that was not theoretical — see the resolve step below for the
    # measured 2-day mute.
    #
    # Spelled as an allow-list of the results that are EVIDENCE, not as
    # `!= 'cancelled'`. A negation would adopt `skipped`, and `skipped` is what the
    # canary reports on every pull_request — so the tidier form would close a prod
    # episode from a PR run that never touched prod. Same rule as the quiet branch
    # below, and the same rule #406's guard was rewritten under.
    if: >-
      always() &&
      (needs.recall-gate.result == 'cancelled' ||
       needs.memory-bench.result == 'cancelled' ||
       needs.recall-gate.result == 'success' ||
       needs.recall-gate.result == 'failure')
    runs-on: ubuntu-latest
    # 8, not 5, because the classifier now waits for the run list to settle
    # before believing "nothing newer was there" (up to a 150s internal
    # deadline, on top of checkout + setup-python). A watchdog that hits its own
    # ceiling dies `cancelled` and says nothing — the exact conclusion-that-reads
    # -as-weather this job exists to abolish, one level up. The settler's own
    # deadline is the real bound; this is headroom so the ceiling is never what
    # stops it.
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write

    steps:
      # ---------------------------------------------------------------------
      # The discriminator is NOT elapsed time. That was the first instinct and
      # it is wrong: GitHub sets `started_at` on a job when it is QUEUED, not
      # when a runner picks it up, so a canary that sat pending for 9m22s and
      # was then superseded reports the same "9 minutes" as one that ran for 9
      # minutes. Measured on the real incident: run 30334077279's canary was
      # pending 9m22s before an eviction — duration alone would have called that
      # a timeout.
      #
      # What separates them is whether the job ever EXECUTED anything. A job
      # cancelled while pending never reaches a runner and reports no completed
      # steps; a job killed by `timeout-minutes` has a trail of them. Combine
      # that with "did a newer run of this workflow already EXIST when this arm
      # died" and every ordering enumerated on the canary job above is
      # distinguishable:
      #
      #   0 steps + newer run, SAME ref  -> (a) superseded. Expected. Not an alert.
      #   0 steps + newer run, OTHER ref -> (f) contended. A branch dispatch took
      #                                     the slot; no newer commit on this ref,
      #                                     so nothing was measured in exchange. Red.
      #   0 steps + no newer run         -> (b)/(c) evicted by a SIBLING or by an
      #                                     older run's advisory. Red.
      #   >=1 step                       -> (d) timeout, or a mid-run cancel. Red.
      #
      # The ref split exists because without it the two middle rows collapse, and
      # WHICH way they collapse depends on how the run list was fetched. Fetched
      # with `?branch=`, an (f) is invisible and reads as the bottom row — the
      # first post-fix push paged for "a sibling job of its own run" while its
      # sibling was `skipped` in the same payload. Fetched repo-wide without the
      # split, an (f) reads as the top row and goes silent, which is worse.
      #
      # `created_at <= completed_at` on the newer-run filter is not tidiness. A
      # bare "is there a newer run" is evaluated whenever this job happens to get
      # a runner, so a push arriving in that gap would relabel a genuine
      # sibling-eviction as an expected supersede — the alarm would go quiet
      # exactly on a busy repo. Only a run that already existed at the instant of
      # death can have caused it.
      #
      # An earlier version of this comment went on to claim the bound "makes the
      # verdict a pure function of recorded history". It does not, and the gap
      # produced a false alert on this watchdog's first live firing (#13fb482b).
      # The verdict is a pure function of THE PAYLOAD IT IS HANDED. Handed a live
      # read taken seconds after the death, it is a function of GitHub API
      # propagation: the evictor existed, satisfied every clause of the test, and
      # was simply not in the response yet. Hence the settling step below, and
      # hence a reason text that says "was VISIBLE in the run list" rather than
      # "existed". The replay controls stay controls precisely because the
      # freshness metadata is reported but never fed into the verdict.
      #
      # POSITIVE CONTROL, taken before this job was trusted, and it caught a real
      # error in the first draft — see `test_classify_cancelled_arm.py`, which
      # replays the recorded API payloads of those three runs on every PR. An
      # UNBOUNDED newer-run query returns 4/3/2 when re-read hours later and
      # scores all three as "superseded": the first draft of this watchdog would
      # have stayed silent through the entire incident it was written for. That
      # wrong rule is pinned as a negative control so it cannot return as
      # tidy-up. Bounded at the death instant it reproduces the ground truth the
      # incident established by hand:
      #   30330437164  canary   0 steps, 0 newer  -> defect      (sibling)
      #   30334077279  canary   0 steps, 1 newer  -> superseded  (run …90080)
      #   30334590080  canary   0 steps, 0 newer  -> defect      (sibling)
      #   30334590080  advisory 0 steps, 1 newer  -> superseded  (the 06:30 nightly)
      # 2 defects + 2 expected. A probe that only ever produces a NEW number is
      # unfalsifiable; reproducing the OLD one is the free calibration.
      # ---------------------------------------------------------------------
      - name: Checkout evc-mesh
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The classifier is a SCRIPT, not thirty lines of shell wedged into YAML,
      # for one reason: the logic here decides whether an alarm fires, and logic
      # that only exists inside a workflow can only be tested by triggering the
      # incident. `test_classify_cancelled_arm.py` replays the three recorded
      # deaths through it on every PR, which is how the first draft's missing
      # time-bound was caught before it shipped instead of after.
      # Gated, because the job now also runs on healthy runs to clear episodes.
      # There is nothing to classify when nothing was cancelled, and a classifier
      # handed a run with no cancelled arm would have to invent a verdict for it.
      # Naming the case it SERVES keeps the recovery path from silently acquiring
      # a `verdict`/`must_page` pair that no cancellation produced.
      - name: Classify the cancellation
        id: classify
        if: >-
          needs.recall-gate.result == 'cancelled' ||
          needs.memory-bench.result == 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          api="repos/${GITHUB_REPOSITORY}"

          # Two payloads, straight from the API, unfiltered — the shaping is the
          # classifier's job so that what runs here and what the tests exercise
          # are the same code path.
          gh api "${api}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > jobs.json || echo '__unreadable__' > jobs.json

          # The run list is NOT fetched here any more, and not because the shell
          # was ugly. It is fetched inside the classifier so that WHEN it is read
          # is testable.
          #
          # Two properties the old one-shot `gh api > runs.json` did not have:
          #
          #   * NOT `?branch=`. `memory-bench-prod` is a REPO-scoped concurrency
          #     group, so a run on any ref can evict a pending arm here.
          #     Filtering to this run's own branch made the commonest real
          #     evictor — someone's `workflow_dispatch` on a feature branch —
          #     structurally invisible, and the classifier reported the one
          #     mechanism left in its enumeration.
          #   * SETTLED, not instantaneous. This job starts seconds after the
          #     death it is asked about, and `/actions/runs` lags: run
          #     30341157927 was created at 08:08:16Z, killed the canary at
          #     08:08:18Z, and was still absent from the list at ~08:08:30Z when
          #     the watchdog read it. The verdict flipped on replay. The run most
          #     likely to be the superseder is the newest one, which is exactly
          #     the row a lagging list endpoint is missing, so this is aimed at
          #     the evidence the verdict turns on rather than being a rare tail.
          #
          # The settler waits out a grace measured FROM THE DEATH and then polls
          # until consecutive reads agree. It can only ever make more runs
          # visible, and the classifier's `created_at <= death` bound means an
          # added run genuinely predated the death — so settling cannot invent a
          # superseder, only stop us from missing one. `payload_settled` is
          # reported either way, and an unsettled payload makes the reason text
          # say so instead of asserting "no newer run existed".
          python scripts/memory-bench/classify_cancelled_arm.py \
            --jobs-json jobs.json \
            --settle-repo "${GITHUB_REPOSITORY}" \
            --settle-workflow memory-bench.yml \
            --run-id "${GITHUB_RUN_ID}" \
            --run-ref "${GITHUB_REF_NAME}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # A legitimate supersede is the ONE cause that must not page. Alerting on
      # it would put this job in the red on ordinary busy days, and a check that
      # is red routinely is a check people learn to scroll past — which is the
      # failure this whole job exists to undo, reintroduced one level up.
      - name: Expected supersede — nothing to page
        # Gated on `must_page`, NOT on `verdict != 'defect'`. The classifier now
        # has a third pageable verdict (`contended`), and a negation guard would
        # have adopted it into the quiet branch silently — the guard must name
        # what it serves, not what it excludes.
        #
        # `steps.classify.outcome == 'success'` is the second half of that same
        # rule, added with the recovery path: on a healthy run the classifier is
        # skipped, so `must_page` is the EMPTY STRING and `!= 'true'` is true. This
        # step would then announce "classified as ''" on every green run — a notice
        # that reports a verdict nothing produced.
        if: >-
          steps.classify.outcome == 'success'
          && steps.classify.outputs.must_page != 'true'
        # Through `env:`, not `${{ }}` inside the script — the same convention the
        # alert steps above already follow. These values are assembled from job
        # names and API timestamps, but a `run:` block that interpolates an output
        # is a shell-injection shape regardless of who fills it today.
        env:
          VERDICT: ${{ steps.classify.outputs.verdict }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          echo "::notice::Prod arm cancellation classified as '${VERDICT}': ${REASON}"

      # ROUTED THROUGH THE SHARED ACTION as of #5e38c799. It was the fourth and
      # last inline copy of this shell, exempt from #064eabca's factoring because
      # it had no resolve half and "the canary stopped being cancelled" is not a
      # state that self-clears. It has one now — see the resolve step below — so
      # the exemption is gone, and with it the narrow `continue` that let this job
      # skip `test_no_arm_keeps_an_inline_copy_of_the_alert_shell`.
      #
      # THE MARKER IS NOW KIND-SCOPED (`<!-- prod-arm-cancelled kind=defect -->`,
      # was a bare `<!-- prod-arm-cancelled -->`). Two things had to be true first,
      # and both were checked rather than assumed:
      #
      #   * No issue may be open under this title when the shape changes, or the
      #     first fire afterwards fails to match what is already there and posts a
      #     duplicate. #411 was open — opened 2026-07-28T08:08:35Z — and is now
      #     closed on its real recovery evidence (below).
      #   * The kinds must actually distinguish something. `verdict` is one of
      #     `defect` / `contended`, both pageable and different faults: `contended`
      #     is a foreign ref taking the concurrency slot, `defect` is a sibling or
      #     an outright timeout. Under the bare marker the first of the two to fire
      #     silenced the other for the whole episode.
      - name: Alert — the prod canary was killed, not superseded
        if: >-
          !cancelled()
          && steps.classify.outputs.must_page == 'true'
        uses: ./.github/actions/blindness-issue
        with:
          mode: alert
          title: 'Memory recall canary (prod) is being cancelled, not run'
          marker-slug: prod-arm-cancelled
          arm: 'The memory recall canary (prod)'
          reason: ${{ steps.classify.outputs.reason }}
          # The classifier's verdict, not a `reason_kind` — this job reports a
          # cancellation cause, not an INCONCLUSIVE cause, so it is deliberately
          # absent from `_arms_that_can_go_inconclusive()`.
          reason-kind: ${{ steps.classify.outputs.verdict }}
          # Overridden rather than derived: the action's `case` maps the recall
          # gate's INCONCLUSIVE kinds, and `defect` matches none of them, so the
          # default lede would say "could not produce a verdict" — true, but it
          # describes blindness while this episode is about the arm never having
          # RUN. Two failure modes with one sentence is how a reader learns to
          # skim both.
          lede: >-
            A prod arm of the memory benchmark ended `cancelled` for a reason that
            is **not** a newer run superseding it. It did not measure prod and then
            fail to compare — it never ran.
          stakes: >-
            While this holds, the post-deploy recall canary produces no verdict at
            all, and it does so quietly: `cancelled` is the conclusion everyone
            reads as an infra hiccup. The run itself is still failed by the step
            below, so this episode is a durable record rather than the only signal.
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The red is the point. An alert on an issue nobody has open in a tab is a
      # filing cabinet; this makes the run itself carry the failure.
      - name: Fail the run
        if: steps.classify.outputs.must_page == 'true'
        env:
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          echo "::error::${REASON}"
          exit 1

      # ---------------------------------------------------------------------
      # THE RESOLVE HALF. #5e38c799.
      #
      # WHAT RECOVERY MEANS HERE, and it is not the same answer the other three
      # arms give. Their episodes are about being INCONCLUSIVE, so they clear on
      # `rc == '0'` — a comparable verdict. This episode is about the arm never
      # having RUN, so it clears on the arm REACHING A CONCLUSION, whatever that
      # conclusion is. A canary that completes and scores a regression (`failure`)
      # has proved it was not cancelled, which is the entire claim of this issue.
      #
      # Requiring a comparable verdict here instead would conflate two faults: a
      # canary that runs but goes blind would leave the CANCELLATION episode open,
      # and an open episode mutes its own re-alerts through the dedup key — which
      # is the exact defect this step exists to fix, reintroduced via its own
      # recovery condition. Blindness has its own episode, raised by the canary
      # job's own alert pair; these two must not be able to hold each other open.
      #
      # WHY THIS WAS MISSING RATHER THAN FORGOTTEN: until now the job only ran when
      # something was cancelled, so there was no run on which a resolve could
      # execute. Hence the job-level `if:` above gained the two success/failure
      # clauses; the resolve is not merely a step, it needed the job to be allowed
      # to start.
      #
      # THE MEASURED COST OF ITS ABSENCE, on this exact issue and not by argument:
      #   #411 opened 2026-07-28T08:08:35Z and never closed, because nothing could
      #   close it. Two days later, run 30519997368 (push on main, 06:34Z) had its
      #   canary cancelled, the classifier returned `verdict: defect / must_page:
      #   true`, the alert step ran — and logged `Issue #411 already reports this —
      #   not commenting again.` A genuine, separate cancellation two days after
      #   the episode began produced no record. #411 carried 0 comments for its
      #   whole life. The canary then recovered at 08:06:43Z (run 30525387007,
      #   `success`) and #411 stayed open anyway, muting everything after it.
      #   That 08:06 run is the evidence this step would have acted on, and it is
      #   what #411 was finally closed against by hand.
      #
      # FAILURE DIRECTION, NAMED, because the honest part of this decision is what
      # it gets wrong: the watchdog watches TWO arms (`recall-gate` and
      # `memory-bench`) under ONE title, so an episode opened solely by an
      # ADVISORY-arm cancellation can be closed by a healthy canary. That is a
      # false close. It is the safe direction: the issue is then CLOSED, so the
      # next advisory cancellation opens a NEW issue and pages again. The cost is a
      # redundant open/close cycle; it cannot produce silence. The alternative —
      # requiring both arms healthy — fails toward leaving the episode open, and an
      # open episode is exactly what mutes re-alerts. Splitting the title per arm
      # would remove the trade entirely and is the right follow-up; it is not done
      # here because changing the title is what orphans an open episode, and one
      # such migration (#411) is enough for one change.
      #
      # Likewise, intermittent cancellations now produce open/close churn instead
      # of one permanently muted issue. That is loud, and for an alert whose whole
      # purpose is not being silent, loud is the correct direction to fail in. If
      # the churn ever becomes the complaint, it is a measurement of how often the
      # arm is being cancelled, not a fault in the alert.
      #
      # `must_page != 'true'` and not `steps.classify.outcome == 'skipped'`: when
      # the advisory arm was cancelled but only as an expected supersede, the
      # classifier RAN and stayed quiet, and the canary's own conclusion is still
      # valid recovery evidence. What must block the resolve is a live pageable
      # cancellation, which is what `must_page` names.
      # ---------------------------------------------------------------------
      # `steps.classify.outcome != 'failure'` is fail-closed and the one clause here
      # that guards a path nobody has reached yet. `must_page` is read from the
      # classifier's `$GITHUB_OUTPUT`; if the classifier ever died before writing it
      # — an uncaught exception rather than one of the failure modes it already
      # handles, all of which fail toward `must_page=true` — the output would be the
      # EMPTY STRING, `!= 'true'` would be true, and a run whose cancellation was
      # never classified would clear the episode. "I could not tell" must not read
      # as "nothing to page", which is the same rule the classifier applies to an
      # unsettled run list. Added after an adversarial pass could not find a
      # reachable path to it and could not rule one out either; the clause costs
      # nothing and closes the class.
      - name: Resolve — the prod canary is running again, not being cancelled
        if: >-
          !cancelled()
          && steps.classify.outcome != 'failure'
          && steps.classify.outputs.must_page != 'true'
          && (needs.recall-gate.result == 'success' ||
              needs.recall-gate.result == 'failure')
        uses: ./.github/actions/blindness-issue
        with:
          mode: resolve
          # Byte-identical to the alert's title above. It is the episode identity:
          # the resolve finds what the alert opened by exact title, so a character
          # of drift here leaves every episode open for ever — and a permanently
          # open episode mutes its own re-alerts. Pinned by
          # `test_each_arm_alerts_and_resolves_on_the_same_title`.
          title: 'Memory recall canary (prod) is being cancelled, not run'
          recovery-note: >-
            The prod canary reached a conclusion instead of being cancelled, so it
            is running again. Whether it also produced a comparable verdict is a
            separate question with its own episode.
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
