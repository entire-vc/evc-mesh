name: Memory Benchmark (LongMemEval-S)

# Two arms, split by cost and determinism:
#
#   recall-gate  — free, no LLM, deterministic. Scores recall@k against the
#                  dataset's gold answer_session_ids. Runs on EVERY PR (see the
#                  no-paths-filter note below) and is the arm intended to become
#                  a required check.
#
#   memory-bench — full LongMemEval (recall → chat model → LLM judge). Depends on
#                  a paid API and a nondeterministic judge, so it is ADVISORY and
#                  runs on a schedule/dispatch, never as a PR merge gate. It used
#                  to run on PRs, where it failed on every single one since it
#                  landed (2026-07-04) with `chat_complete failed: 402` — a red
#                  check nobody can act on is worse than no check.

on:
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Per-category regression tolerance (default: 0.25 — 1-question variance on 4q/category CI subset)'
        required: false
        default: '0.25'
      full_eval:
        description: 'Also run the paid end-to-end LongMemEval (chat + LLM judge)'
        type: boolean
        required: false
        default: false
      update_baseline:
        description: >-
          Re-snap the END-TO-END baseline (baseline.json) instead of judging against
          it. Uploads the new file as the `memory-bench-baseline` artifact to commit
          by hand — capture it HERE, not on a laptop: a baseline snapped against a
          different agent key or chat model is not comparable to the nightly that
          will be judged against it.
        type: boolean
        required: false
        default: false
      repeat:
        description: >-
          Passes to average when re-snapping (default 3). One pass is a coin toss:
          4 questions per category means one flipped answer moves it 0.25, and
          single-session-assistant was observed at 1.000/0.250/1.000 on three
          consecutive nightlies of identical code.
        required: false
        default: '3'

  # NOTE: deliberately NO `paths:` filter on pull_request. A required check born
  # in a path-filtered workflow never reports on PRs that miss the filter, and a
  # never-reported required context blocks that PR forever (cf. evc-mesh#320).
  # The gate runs on every PR and no-ops internally when no memory path changed.
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'internal/service/memory_service.go'
      - 'internal/repository/postgres/memory_repo.go'
      - 'internal/repository/postgres/memory_edges_repo.go'
      - 'internal/mcp/tools.go'
      - 'internal/mcp/server.go'
      - 'internal/reconciler/**'
      - 'scripts/memory-bench/**'

  schedule:
    # Nightly 04:00 UTC — the paid end-to-end eval lives here, not on PRs.
    - cron: '0 4 * * *'

env:
  # Every file whose behaviour the gate is supposed to protect. A memory file
  # MISSING from this list is the worst failure mode available to a required
  # check: the job reports green having measured nothing, and the "required"
  # badge certifies a run that never happened.
  #
  # That was not hypothetical — #347 rewrote the authorization on memory DELETE,
  # touching only `internal/handler/memory_handler.go`, and the gate no-op'd to
  # green because the handler was not listed here. When adding a memory code
  # path, add it here in the same PR.
  MEMORY_PATHS: |
    internal/handler/memory_handler.go
    internal/domain/memory.go
    internal/service/memory_service.go
    internal/repository/postgres/memory_repo.go
    internal/repository/postgres/memory_edges_repo.go
    internal/mcp/tools.go
    internal/mcp/server.go
    internal/reconciler/
    pkg/sdk/memories.go
    scripts/memory-bench/

jobs:
  # ---------------------------------------------------------------------------
  # The gateable arm: free, deterministic, no third-party API.
  # ---------------------------------------------------------------------------
  recall-gate:
    name: Memory recall gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The gate raises an out-of-band alert when it is BLIND (INCONCLUSIVE), so
      # that a safety net that stopped enforcing anything always pages somebody
      # instead of quietly passing.
      issues: write

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs on EVERY PR, before (and independently of) the scope check — these
      # are the tests that guard the gate against going blind, so they must not
      # be skipped by the very no-op they exist to detect. Stdlib only: no
      # secrets, no network, ~1s.
      #
      # A red here means "this PR would make the recall gate stop enforcing" —
      # e.g. it adds a memory source file that MEMORY_PATHS does not cover. That
      # IS a legitimate merge block, and unlike an infra failure the author can
      # clear it: list the file.
      - name: Set up Python (gate self-checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate self-checks (blind-spot + mode logic)
        run: |
          python scripts/memory-bench/test_gate_blindness.py
          python scripts/memory-bench/test_gate_modes.py

      - name: Does this change touch memory?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the PR's own base..head — never the merge ref (a guard that reads
          # the merge ref deadlocks every open PR).
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"; echo "$changed"
          relevant=false
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if echo "$changed" | grep -qE "^${p}"; then relevant=true; fi
          done <<< "$(printf '%s' "${MEMORY_PATHS}" | tr -d '\r')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "memory-relevant: $relevant"

      - name: No memory paths touched — nothing to gate
        if: steps.scope.outputs.relevant != 'true'
        run: |
          echo "This PR changes no memory-path file; the recall gate is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout evc-mesh-mcp
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Set up Go
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      - name: Cross-compile mesh-mcp (linux/amd64)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin

      - name: Install Python dependencies
        if: steps.scope.outputs.relevant == 'true'
        # Python itself is already set up above for the gate self-checks.
        # No `openai` — the recall gate must not acquire a paid dependency.
        run: pip install mcp httpx

      - name: Run recall gate (no LLM)
        id: gate
        if: steps.scope.outputs.relevant == 'true'
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1: the harness prints its tracebacks to stderr, so without this the
          # uploaded gate.log — the only artifact anyone reads after the fact —
          # contains the "could not measure" verdict but not the reason for it.
          python run_ci.py --retrieval-only --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee gate.log
          rc=${PIPESTATUS[0]}
          set -e

          # run_ci emits a machine-readable `GATE_REASON: <kind> — <detail>` line on
          # every INCONCLUSIVE path. Belt-and-braces: an older run_ci returns 0 with
          # no baseline, which is a VACUOUS GREEN (it compared against nothing) —
          # treat it as inconclusive too. A gate that enforces nothing must never
          # look green-and-healthy.
          reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
          if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval.json' gate.log; then
            rc=2
            reason="no-baseline — the gate compared against nothing"
          fi
          [ -z "$reason" ] && reason="unspecified"

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## Memory recall gate"
            echo
            case "$rc" in
              0) echo "✅ **PASS** — recall measured, comparable, and within tolerance of the baseline." ;;
              1) echo "❌ **REGRESSION** — recall dropped below the baseline **in the same retrieval mode**."
                 echo "This PR makes memory measurably worse. This is the only condition that blocks the merge." ;;
              2) echo "### ⚠️ INCONCLUSIVE — the recall safety net is **BLIND** for this PR"
                 echo
                 echo "> **Nothing was measured, so nothing was enforced.** A real memory regression"
                 echo "> could pass through this PR unseen. This check is **not failing you** —"
                 echo "> the cause is infrastructure you cannot fix from a PR, and a red check"
                 echo "> nobody can clear just gets bypassed until the whole gate is worthless."
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "Most common cause: the baseline was captured in one retrieval mode (\`hybrid\`)"
                 echo "but this run was served in another (\`bm25-only\`, i.e. the embedder is down and"
                 echo "\`recall\` failed open). Hit@k is not comparable across modes, so a lower score"
                 echo "here says nothing about this PR's code."
                 echo
                 echo "**Fix (repo maintainer, not the PR author):** restore the embedder, then re-snap"
                 echo "the baseline — \`python run_ci.py --retrieval-only --update-baseline\`."
                 echo "A tracking issue has been opened/updated so this blindness is not silent." ;;
              *) echo "❌ Gate exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # rc=1 (REGRESSION) is the ONLY blocking condition — measured, comparable,
          # worse. rc=2 (INCONCLUSIVE) must not fail the check: see the alert step.
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then exit "$rc"; fi
          exit 0

      # ---------------------------------------------------------------------
      # Blindness must never be silent. INCONCLUSIVE does not block the merge,
      # so the ONLY thing standing between "the safety net stopped working" and
      # "nobody ever noticed" is this alert.
      #
      # ONE tracking issue, not one per PR: we comment on the existing open issue
      # instead of opening a new one, and only when the reason KIND changed (cf.
      # the 292-task alert storm — a poisoned dedup key turns an alert into spam,
      # and spam is ignored, which is the same as having no alert at all).
      # ---------------------------------------------------------------------
      - name: Alert — recall gate is blind (INCONCLUSIVE)
        if: steps.scope.outputs.relevant == 'true' && steps.gate.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Memory recall gate is INCONCLUSIVE (safety net blind)'
          REASON: ${{ steps.gate.outputs.reason }}
          REASON_KIND: ${{ steps.gate.outputs.reason_kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- recall-gate-blind kind=${REASON_KIND} -->"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" \
            "The memory recall gate could not produce a verdict: it measured nothing, so it enforced nothing. Until this clears, **memory regressions can merge unnoticed**." \
            "**Reason:** \`${REASON}\`" \
            "Run: ${RUN_URL}")

          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")

          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body" --label memory,ci 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$body"
            echo "Opened tracking issue."
            exit 0
          fi

          # Storm guard: if the most recent comment (or the issue body, when there
          # are none) already reports THIS reason kind, the alert is already live —
          # adding a copy per PR would bury it.
          last=$(gh issue view "$num" --json comments,body \
                   --jq '(.comments | last | .body) // .body // ""')
          if printf '%s' "$last" | grep -qF "$marker"; then
            echo "Issue #$num already reports '${REASON_KIND}' — not commenting again."
            exit 0
          fi
          gh issue comment "$num" --body "$body"
          echo "Commented on tracking issue #$num."

      # A gate that recovered should stop shouting: close the tracking issue once
      # a real, comparable verdict is produced again.
      - name: Resolve blindness alert (gate is measuring again)
        if: steps.scope.outputs.relevant == 'true' && steps.gate.outputs.rc == '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Memory recall gate is INCONCLUSIVE (safety net blind)'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          [ -z "$num" ] && { echo "No open blindness issue."; exit 0; }
          gh issue close "$num" --comment "Recall gate produced a comparable verdict again (baseline and run in the same retrieval mode). Safety net restored: ${RUN_URL}"

      - name: Upload recall-gate results
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-gate-results
          path: |
            scripts/memory-bench/gate.log
            scripts/memory-bench/results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The advisory arm: paid, LLM-judged, end-to-end. Never a PR merge gate.
  # ---------------------------------------------------------------------------
  memory-bench:
    name: LongMemEval-S end-to-end (advisory)
    runs-on: ubuntu-latest
    # One pass is ~19 min, so a --repeat 3 baseline capture needs room.
    timeout-minutes: ${{ (inputs.update_baseline && 120) || 30 }}
    permissions:
      contents: read
      # Advisory does not mean unwatched. An arm that cannot compare must page
      # somebody, or tightening its comparison rules just makes it silent.
      issues: write
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.full_eval || inputs.update_baseline))

    steps:
      - name: Checkout evc-mesh
        uses: actions/checkout@v4

      - name: Checkout evc-mesh-mcp
        uses: actions/checkout@v4
        with:
          repository: entire-vc/evc-mesh-mcp
          token: ${{ secrets.GITHUB_TOKEN }}
          path: evc-mesh-mcp

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: evc-mesh-mcp/go.mod
          cache-dependency-path: evc-mesh-mcp/go.sum

      - name: Cross-compile mesh-mcp (linux/amd64)
        run: |
          cd evc-mesh-mcp
          GOOS=linux GOARCH=amd64 go build -o ../mesh-mcp-bin .
          chmod +x ../mesh-mcp-bin
          echo "mesh-mcp built: $(file ../mesh-mcp-bin)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openai mcp httpx

      # ---------------------------------------------------------------------
      # Baseline capture. Runs HERE rather than on a maintainer's laptop so the
      # baseline is produced by the same runner, the same MESH_BENCH_KEY and the
      # same chat/judge models as the nightly that will be compared against it —
      # a baseline captured in a different environment is the same class of
      # not-comparable this workflow already exits 2 over.
      # ---------------------------------------------------------------------
      - name: Re-snap the end-to-end baseline
        id: resnap
        if: inputs.update_baseline
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
        run: |
          cd scripts/memory-bench
          set +e
          python run_ci.py --update-baseline --repeat "${{ inputs.repeat || '3' }}" 2>&1 | tee resnap.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## LongMemEval-S baseline re-snap"
            echo
            if [ "$rc" = "0" ]; then
              echo "Captured over \`${{ inputs.repeat || '3' }}\` pass(es). Download the"
              echo "\`memory-bench-baseline\` artifact and commit \`scripts/memory-bench/baseline.json\`."
              echo
              echo '```json'
              cat baseline.json
              echo '```'
            else
              echo "⚠️ Capture exited $rc — the baseline was NOT written. See the log."
            fi
            echo
            echo '```'
            tail -30 resnap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload the re-snapped baseline
        if: always() && inputs.update_baseline
        uses: actions/upload-artifact@v4
        with:
          name: memory-bench-baseline
          path: |
            scripts/memory-bench/baseline.json
            scripts/memory-bench/resnap.log
          retention-days: 30

      - name: Run LongMemEval-S end-to-end
        if: ${{ !inputs.update_baseline }}
        id: bench
        env:
          MESH_API_URL: ${{ secrets.MESH_API_URL }}
          MESH_AGENT_KEY: ${{ secrets.MESH_BENCH_KEY }}
          LME_JUDGE_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_JUDGE_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_JUDGE_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          LME_CHAT_API_KEY: ${{ secrets.LME_JUDGE_API_KEY }}
          LME_CHAT_BASE_URL: ${{ vars.LME_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LME_CHAT_MODEL: ${{ vars.LME_JUDGE_MODEL || 'openai/gpt-4o-mini' }}
          MESH_MCP_BIN: ${{ github.workspace }}/mesh-mcp-bin
          RECALL_GRAPH_ENABLED: 'true'
          LME_TOP_K: '10'
        run: |
          cd scripts/memory-bench
          set +e
          # 2>&1 for the same reason as the recall gate: the harness prints its
          # tracebacks to stderr, and bench.log is the only artifact anyone reads.
          python run_ci.py --tolerance "${{ inputs.tolerance || '0.25' }}" 2>&1 | tee bench.log
          rc=${PIPESTATUS[0]}
          set -e

          reason="$(grep -m1 '^GATE_REASON:' bench.log | sed 's/^GATE_REASON: *//' || true)"
          [ -z "$reason" ] && reason="unspecified"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "reason_kind=${reason%% *}" >> "$GITHUB_OUTPUT"

          {
            echo "## LongMemEval-S (advisory)"
            echo
            case "$rc" in
              0) echo "✅ PASS — measured, comparable, within tolerance of the baseline." ;;
              1) echo "❌ REGRESSION — end-to-end memory quality dropped past the baseline's own spread." ;;
              2) echo "### ⚠️ INCONCLUSIVE — this arm measured nothing"
                 echo
                 echo "> Advisory does not mean unwatched. Nothing was compared, so nothing was"
                 echo "> checked — and because this arm never blocks a merge, a silent"
                 echo "> INCONCLUSIVE is indistinguishable from a healthy pass. A tracking issue"
                 echo "> has been opened/updated so it is not silent."
                 echo
                 echo "**Reason:** \`$reason\`"
                 echo
                 echo "* \`harness-errors\` — the chat/judge API is down or out of credit."
                 echo "* \`mode-unknown\` / \`mode-mismatch\` — the baseline and this run were served"
                 echo "  in different retrieval modes, or \`baseline.json\` predates mode-scoping."
                 echo "  Re-snap it: run this workflow with **update_baseline**."
                 echo "* \`no-baseline\` — there is nothing to compare against at all."
                 echo "* \`no-eligible-category\` — the baseline's recorded run-to-run spread is"
                 echo "  wider than its own scores everywhere, so no category could fail." ;;
              *) echo "❌ Eval exited $rc." ;;
            esac
            echo
            echo '```'
            tail -30 bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Same rule as the recall gate, for the same reason. rc=2 is an INFRA
          # failure (judge/chat API out of credit) — nothing was measured, so
          # there is nothing to report red about. Failing here paints every push
          # to main red for a cause no author can fix, and a check that is red
          # forever is one people learn to scroll past — which is how the real
          # rc=1 would get ignored too. Advisory means advisory: an unmeasurable
          # run is a loud no-op, a measured regression still shouts.
          if [ "$rc" = "2" ]; then
            echo "::warning title=LongMemEval-S inconclusive::The advisory eval measured nothing ($reason)."
            exit 0
          fi
          exit $rc

      # ---------------------------------------------------------------------
      # The counterpart to tightening this arm's comparison rules. Before, an
      # invalid comparison was published as `✗ REGRESSION` — wrong, but at least
      # visible. Now it exits 2, which does not fail the job, so without this step
      # the fix would trade a noisy red for a silent no-op on an arm nobody is
      # required to look at. Same one-issue / dedup-on-reason-kind shape as the
      # recall gate: an alert that fires per run is spam, and spam is ignored.
      # ---------------------------------------------------------------------
      - name: Alert — advisory arm measured nothing (INCONCLUSIVE)
        if: steps.bench.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          REASON: ${{ steps.bench.outputs.reason }}
          REASON_KIND: ${{ steps.bench.outputs.reason_kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- advisory-arm-blind kind=${REASON_KIND} -->"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" \
            "The end-to-end LongMemEval arm produced no verdict: it compared nothing, so it checked nothing. It does not block merges, so this would otherwise be indistinguishable from a nightly pass." \
            "**Reason:** \`${REASON}\`" \
            "Run: ${RUN_URL}")

          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")

          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body" --label memory,ci 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$body"
            echo "Opened tracking issue."
            exit 0
          fi

          last=$(gh issue view "$num" --json comments,body \
                   --jq '(.comments | last | .body) // .body // ""')
          if printf '%s' "$last" | grep -qF "$marker"; then
            echo "Issue #$num already reports '${REASON_KIND}' — not commenting again."
            exit 0
          fi
          gh issue comment "$num" --body "$body"
          echo "Commented on tracking issue #$num."

      - name: Resolve advisory blindness alert (arm is measuring again)
        if: steps.bench.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'LongMemEval-S advisory arm is INCONCLUSIVE (measuring nothing)'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search "\"${TITLE}\" in:title" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          [ -z "$num" ] && { echo "No open advisory-blindness issue."; exit 0; }
          gh issue close "$num" --comment "The advisory arm produced a comparable verdict again: ${RUN_URL}"

      - name: Upload benchmark results
        if: always() && !inputs.update_baseline
        uses: actions/upload-artifact@v4
        with:
          name: memory-bench-results
          path: |
