name: Showcase migrated gate

# This GitHub repository is a read-only mirror. Development canon moved to
# GitLab (git.entire.host) on 2026-08-22 (CLAUDE-workflow.md §0z); a systemd
# timer on VM 113 is meant to push GitLab -> GitHub every 10 minutes, no
# push here required. Anything merged directly into showcase `main` sits
# ahead of canon until someone notices and reconciles it by hand.
#
# That mirror has been failing to deliver -- measured 2026-08-23, showcase was
# 26 commits behind canon, its push refused by this repo's own branch
# protection. The gap opens and closes, so no start date is asserted anywhere:
# the gate's message tells the reader to measure it instead of promising a
# delivery that may not happen.
#
# Measured 2026-08-23 (task #e04ebd26): four PRs merged into showcase main in
# six hours via `gh-merge`/web button, each one stalling the GitLab->GitHub
# sync until fixed manually -- not a one-off leftover from the migration, an
# ongoing habit.
#
# This gate is deliberately unconditional: it fails EVERY pull request and
# every merge-group run against this repository's main, with no exception
# path. The fix on a red run here is never "make the check pass" -- it is
# "merge the same change on GitLab instead". See docs/hold-gate.md for the
# fuller argument (made there about the sibling `hold` gate) for why a
# required status check is the one gate that reaches every merge path -- web
# button, `gh pr merge`, direct REST PUT, and the merge queue -- rather than
# only the paths that go through our own wrapper scripts.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: showcase-migrated-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the required-check context string branch protection
  # matches on. Renaming it un-arms the gate silently -- same trap recorded
  # for `Hold gate` in docs/hold-gate.md.
  showcase-migrated-gate:
    name: Showcase migrated gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gate
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/showcase_migrated_gate.py
          sparse-checkout-cone-mode: false

      - name: Confirm the gate was actually checked out
        run: |
          test -f .github/scripts/showcase_migrated_gate.py || { echo "::error::showcase_migrated_gate.py missing after checkout"; exit 1; }

      - name: Refuse -- this repository merges on GitLab
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/showcase_migrated_gate.py
