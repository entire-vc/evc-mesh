# CI for the GitLab canon (git.entire.host/entire-vc/evc-mesh).
#
# ## Why this file exists
#
# Development moved from GitHub to GitLab on 2026-08-23. The nine required
# status checks that guarded merges — Lint, Test, Build, Hold gate and the
# rest — live in `.github/workflows/` and are executed by GitHub Actions.
# They still run, on a repository nobody merges into any more. For one day
# every merge request here landed on `main` having been checked by nothing:
# no pipeline, no approval, no required check. Not because a gate was
# bypassed, but because none existed.
#
# ## Honest scope
#
# This is NOT a port of all 22 GitHub check-runs. It carries the four that
# catch the most per minute spent — lint, race-enabled tests against real
# Postgres/Redis/NATS, the Go build, the frontend typecheck+build — plus the
# hold gate, self-host-env (config-only, no live daemon needed),
# repo-integration (Postgres only — see that job's own header for why it does
# NOT need NATS/MinIO despite carrying the same `integration` build tag as
# tenancy-rbac-gate), tenancy-rbac-gate itself (Postgres + NATS-with-
# JetStream + MinIO, a live API server, and a two-part guard against the gate
# quietly guarding nothing — see that job's own header), and vendor-trailer-gate
# (adapted, not a literal port — see that job's own header and
# `.gitlab/scripts/vendor_trailer_gate.py` for why GitLab's squash mechanics
# change what it can actually check). CodeQL's job — SAST — is now
# carried by `semgrep` (see that job's own header for why it is a
# re-implementation rather than a port). Deliberately still absent, and worth
# their own cards: Authed E2E, Go coverage ≥80% (affected-set), Memory recall
# gate. A stub that looks like full CI is more dangerous than a gap
# you can see, so the gap is named here rather than implied.
#
# ## The half that is not in this file
#
# A pipeline is a display until `only_allow_merge_if_pipeline_succeeds` is
# true on the project — until then GitLab will happily merge over a red run.
# That setting is now TRUE (read back 2026-08-27 from the project API, not
# assumed), so a red pipeline here genuinely blocks the merge. It needed
# Maintainer to set: every agent account on this group is Developer(30) and
# the sole holder of 40+ is `pavel`.
#
# Consequence worth knowing before you wonder why your MR will not merge: a
# job that is red on `main` blocks every MR, not just the one that broke it.

workflow:
  rules:
    # MR pipelines are the ones that matter — they are what a merge consults,
    # and the only context where $CI_MERGE_REQUEST_LABELS exists at all.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Never run a branch pipeline for a branch that already has an open MR:
    # that is GitLab's classic duplicate-pipeline trap, and it doubles runner
    # load on the one shared runner this fleet has.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [gate, sast, lint, test, build, deploy]

variables:
  # Services are reachable by their image alias on the docker executor, NOT on
  # localhost — the single most common wrong translation from a GitHub Actions
  # `services:` block, where port-mapping to localhost is how it works.
  POSTGRES_USER: mesh
  POSTGRES_PASSWORD: mesh
  POSTGRES_DB: mesh
  DATABASE_URL: "postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable"
  REDIS_URL: "redis://redis:6379"
  NATS_URL: "nats://nats:4222"
  GOLANGCI_LINT_VERSION: "v2.11.3"   # keep in step with Makefile:81
  # Pinned, NOT `@latest`. `go install ...@latest` resolves against upstream
  # at job time, so a release requiring a newer Go breaks every job here
  # without a commit in this repo. That happened on 2026-09-02: goose v3.28.0
  # requires go >= 1.26 while these images are golang:1.25-alpine, and the
  # three jobs that run migrations (test, repo-integration, tenancy-rbac-gate)
  # all failed at `go install`, before a single test ran. Keep in step with
  # the goose version in go.mod — the tool and the library must not drift.
  GOOSE_VERSION: "v3.27.3"   # keep in step with go.mod
  GOFLAGS: "-buildvcs=false"

default:
  tags: [docker]
  interruptible: true

# ── gate ────────────────────────────────────────────────────────────────────
# Makes the `hold` label a gate here too. On GitHub this is a required status
# check (.github/workflows/hold-gate.yml); `~/bin/glab-merge` reads the same
# label list, but a wrapper is a request, not a wall — the web button and a
# bare `glab mr merge` never ask it.
#
# The label list is READ FROM `.github/hold-labels.txt`, the file already in
# this repository, rather than copied into this one. A second copy is a second
# thing to drift, and that file's own header records that it drifted from the
# fleet list within a day of being written.
hold-gate:
  stage: gate
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -eu
      LABELS_FILE=.github/hold-labels.txt
      # Fail closed on every unknown. "I could not check" must never read the
      # same as "I checked and it is clean" — that equivalence is the defect
      # this whole gate family exists to kill.
      test -f "$LABELS_FILE" || { echo "REFUSING: $LABELS_FILE missing — cannot know what 'held' means"; exit 1; }
      HOLD=$(grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -c . || true)
      test "$HOLD" -gt 0 || { echo "REFUSING: $LABELS_FILE parsed to zero labels — a gate that knows no hold label passes everything"; exit 1; }
      echo "hold labels known: $HOLD"
      echo "labels on this merge request: '${CI_MERGE_REQUEST_LABELS:-}'"
      FOUND=""
      OLDIFS=$IFS; IFS=','
      for L in ${CI_MERGE_REQUEST_LABELS:-}; do
        L=$(printf '%s' "$L" | tr 'A-Z' 'a-z' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        [ -n "$L" ] || continue
        if grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qxF "$L"; then
          FOUND="$FOUND $L"
        fi
      done
      IFS=$OLDIFS
      if [ -n "$FOUND" ]; then
        echo "REFUSING to let this merge request through: it carries a hold label —$FOUND"
        echo "Remove the label when the work is ready; this job re-runs on the next pipeline."
        exit 1
      fi
      echo "no hold label present ✓"

# ── vendor-trailer-gate ──────────────────────────────────────────────────────
# Adapted from `.github/workflows/vendor-trailer-gate.yml`, not a literal
# port. Reads every commit on this MR's source branch not yet on the target
# branch (`git log origin/<target>..HEAD`, computed locally in the job's own
# checkout — see `.gitlab/scripts/vendor_trailer_gate.py`'s header for why
# not the GitLab API) and refuses any whose message carries a
# `Co-Authored-By:`/`Generated with/by` trailer naming a development tool.
# Detector, term list (`.github/vendor-trailer-terms.txt`, reused not copied)
# and self-test are the same as the GitHub script's; the *scope* differs —
# short version: GitLab's squash commit message is the MR title only, body
# discarded, so this cannot check what lands on `main` (there is nothing left
# to check by the time it gets there) — it checks whether the branch commits
# followed the convention, which is what the squash step used to hide.
#
# Known residual gap, same shape as GitHub's own accepted one (see that
# workflow's header): a human hand-editing the squash/merge commit message in
# GitLab's merge widget, after this job has already passed, is invisible to
# it — no pipeline re-runs on that edit. Not closed here; stated.
vendor-trailer-gate:
  stage: gate
  image: python:3.12-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # Full clone: the script diffs `origin/<target>..HEAD` itself (see its
    # own header for why — CI_JOB_TOKEN cannot read this project's own
    # merge_requests/:iid/commits API, measured live as a 404). A shallow
    # clone risks that diff silently missing history past the cutoff; GIT_DEPTH:0
    # removes the question rather than picking a depth and hoping.
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - python3 .gitlab/scripts/vendor_trailer_gate.py

# ── self-host-env ──────────────────────────────────────────────────────────
# Ported from .github/workflows/ci.yml's "Self-host env (no new required
# vars)". Guards the class of defect that broke the 2026-07-29 upgrade of an
# external self-host instance: a compose variable made required (`${VAR:?}`)
# without also being added to check-required-env.sh's allowlist and
# .env.prod.example — invisible on our own prod, which has always had the
# variable, and fatal for every existing self-host install that does not.
#
# `docker compose config` is a client-side render of the compose spec — it
# does not talk to a running engine (verified locally: `DOCKER_HOST` pointed
# at a nonexistent socket, still exits 0 with valid output). That is what
# makes this portable onto a plain image instead of needing docker:dind and
# a privileged runner, unlike every job on this fleet's shared hel01 runner
# that has needed a live daemon so far.
self-host-env:
  stage: lint
  image: docker:27-cli
  timeout: 10m
  before_script:
    - apk add --no-cache bash
  script:
    - bash deploy/docker/mesh/check-required-env.sh
    # Same second half as the GitHub job: an .env from the FIRST installable
    # release must still parse against today's compose files — the exact
    # upgrade that failed on 2026-07-29 (mesh.prototypes.ventures,
    # 5b672a6 -> 9d7ac87). Both compose files, not just the prod one — see
    # check-required-env.sh's own header for why "just the prod file" is a
    # gap that gets believed and stops being watched.
    - |
      cd deploy/docker/mesh
      sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder/' \
        testdata/first-release.env.example > /tmp/first-release.env
      for f in docker-compose.prod.yml docker-compose.yml; do
        echo "--- $f"
        docker compose -f "$f" --env-file /tmp/first-release.env config >/dev/null
      done

# ── mcp-reference-gate ──────────────────────────────────────────
# docs/mcp-reference.md is the public catalogue of the MCP tools, but the tools
# themselves live in a DIFFERENT repository (evc-mesh-mcp). Nothing in this
# repo's CI could notice a tool added or removed there, and over time the page
# drifted to 20 undocumented tools plus 4 documented tools the server never
# registered (Mesh #1f0ee22c) — while stating three mutually inconsistent
# totals about itself.
#
# The script fetches the server source and fails on a mismatch in EITHER
# direction. It fails closed: a source it cannot fetch, or fetches and cannot
# parse, is a refusal, not a pass — "I could not look" must not read the same
# as "I looked and it was fine".
mcp-reference-gate:
  stage: lint
  image: alpine:3.20
  timeout: 5m
  before_script:
    - apk add --no-cache bash curl coreutils
  script:
    - bash scripts/check-mcp-reference.sh

# ── sast ────────────────────────────────────────────────────────────────────
# The GitLab-side replacement for GitHub's `CodeQL` required check (Mesh
# #48f243e4). Modeled on entire-vc/evc-argus, which ported this same class of
# control the same way (`#10fea634`).
#
# ## Why this is a re-implementation and not a port
#
# There is no `.github/workflows/codeql.yml` in this repository to translate.
# CodeQL here is GitHub's *default setup* — a repository setting, not code:
#
#     code-scanning/default-setup → {"state":"configured",
#       "languages":["actions","go","javascript","javascript-typescript",
#                    "python","typescript"],
#       "query_suite":"default","schedule":"weekly"}
#
# (readable only under `robert-j-evc`; an agent token gets 403 there, which is
# indistinguishable from "not configured" unless you re-check under an account
# that can actually see it.) So nothing could be copied line-for-line. The
# `// codeql[...]` suppression comments that exist in the Go sources belong to
# that scanner and mean nothing to semgrep; semgrep's own suppressions are
# `nosemgrep:` comments, each carrying a written reason.
#
# ## What this does NOT reproduce
#
# CodeQL's cross-function dataflow/taint analysis. semgrep here is pattern-level
# SAST: it matches shapes in a file, it does not follow a tainted value across
# call boundaries. Treat the two as the same *class* of control, not as
# equivalent engines — writing "CodeQL is covered" without this paragraph would
# overstate what was carried across.
#
# ## `semgrep ci`, and why NOT `semgrep scan --config ...`
#
# They are not interchangeable inside this image, and picking the wrong one
# produces a job that fails without ever having scanned anything. Measured on
# this runner (pipeline 438, job 3982), `semgrep scan --config ...` gives:
#
#     Detected Docker environment without a code volume, please include
#     '-v "${PWD}:/src"'
#     ERROR: Job failed: exit code 2
#
# `semgrep scan` calls adjust_for_docker(), which insists the code live at
# /src; GitLab's docker executor clones into $CI_PROJECT_DIR and leaves /src
# empty, so it raises before the first rule runs. The danger is not the crash —
# it is that the job goes red and *looks like a gate that caught something*.
# Exit 2 with an empty scan is indistinguishable from exit 1 with a real
# finding if you only read the job's status dot (§0x).
#
# `semgrep ci` does not take that path.
#
# ## What a green here does and does not mean — read this before trusting it
#
# `semgrep ci` scopes itself differently depending on the pipeline, and the
# difference decides what the green tick is evidence of. Measured on evc-argus,
# same image, same runner:
#
#   main-branch run (job 2201)  → Scanning 393 files tracked by git
#                                 = the whole tracked tree
#   MR-pipeline run (job 2152)  → Scanning 1 file tracked by git
#                                 "Scan was limited to files changed since
#                                  baseline commit."
#
# So on a merge request this gate asks "does this MR ADD anything insecure?",
# NOT "is the repository clean?". That is the right question for a merge gate —
# it means a newly-shipped registry rule firing on years-old code cannot wall
# off every open MR — but it does mean an MR's green tick is not a statement
# about the tree. The whole-tree statement comes from the `main` run, which is
# why the rules below deliberately keep `main` in scope rather than running on
# merge requests alone.
#
# The full-tree baseline at the time this job was added was measured off-CI,
# for the same reason: 0 findings on 1194 files (and 38 under --disable-nosem).
# An MR pipeline could not have told us that.
#
# ## Rule sets
#
# `p/security-audit p/secrets p/owasp-top-ten` are argus's three, unchanged.
# The fourth is argus's `p/python` swapped for `p/golang`, this being a Go
# service. Python and TypeScript here (scripts/memory-bench, web/) are not left
# unscanned: security-audit and owasp-top-ten are multi-language and do cover
# them — measured, not assumed, in the baseline below.
#
# ## The baseline this job was allowed to become a gate on
#
# A gate is worth nothing if it is switched on red and then made to
# `allow_failure` (§0x). Measured on canon `main` @36ab94e, same four rule sets,
# before this job was written:
#
#     Ran 428 rules on 1194 files: 0 findings.        exit 0
#
# and, with suppressions switched off, to prove those suppressions are live
# rather than annotations that stopped matching some time ago:
#
#     --disable-nosem → 38 findings                   exit 1
#
# 0 with them, 38 without: every `nosemgrep:` in this tree is currently doing
# work. The triage that got the baseline to 0 is `.semgrepignore` in the repo
# root — read its comments before editing it, especially the part about a
# repo-level ignore file REPLACING semgrep's built-in defaults instead of
# adding to them.
#
# `.github/` IS scanned, as of #5fe7fb4b. This comment used to say its 90
# findings "belong to the showcase mirror, not to this pipeline"; that was the
# exclusion's rationale, and it stopped being true when the exclusion was
# lifted. All 90 are gone — 75 mutable action tags pinned to commit SHAs, 12
# `${{ }}` interpolations moved out of `run:` bodies, and 3
# `dependabot-missing-cooldown` retired with the file itself (#5f017e34). The
# mirror's workflows do still execute, with a real GITHUB_TOKEN in scope, so
# "belongs to the mirror" was never the same thing as "is not our perimeter".
#
# ## Known hazard: the rule registry moves under you
#
# `p/...` packs are fetched from the semgrep registry at run time and are not
# version-pinned — there is no pinned form of them to use. New rules ship
# continuously, so this job can go red on a commit that changed nothing
# relevant. Measured live during this card's own triage: 15 findings appeared
# between two scans of the same tree hours apart. When that happens the answer
# is to triage the new finding — fix it, or `nosemgrep:` it with a written
# reason, the way every existing suppression here is written — NOT to set
# `allow_failure: true`, which converts the gate back into a lamp nobody reads.
semgrep:
  stage: sast
  image: semgrep/semgrep
  timeout: 10m
  allow_failure: false   # explicit: a red scan must block the merge, not decorate it
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    SEMGREP_RULES: "p/security-audit p/secrets p/owasp-top-ten p/golang"
  script:
    - semgrep ci

# ── lint ────────────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: golang:1.25-alpine
  timeout: 15m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION
  script:
    - $GOPATH/bin/golangci-lint run ./...

# ── test ────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: golang:1.25-alpine
  timeout: 30m
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: nats:2-alpine
      alias: nats
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    # build-base is not optional: `go test -race` needs cgo, and alpine has no
    # C toolchain by default. Without it the race detector fails to link and
    # the failure looks like a broken test rather than a missing package.
    #
    # poppler-utils (pdftotext) is the PDF export tests' own acceptance check
    # — it extracts text back out of a rendered PDF to prove the embedded
    # Cyrillic font actually produces real, selectable glyphs rather than a
    # rasterized or boxed-off image (Export 4/7, #25ac04d2). It is a CI/test
    # tool only: the PDF renderer itself ships zero external binaries to
    # prod, which is the whole point of embedding the font in the Go binary.
    #
    # python-docx is the same role for the DOCX export tests (Export 5/7,
    # #91ce6291): an independent, non-project-controlled parser proving the
    # hand-written OOXML actually opens as a real .docx, not just bytes our
    # own writer and a hand-rolled unzip agree on. Also CI/test only — the
    # DOCX renderer itself ships zero external binaries to prod either, same
    # as PDF.
    - apk add --no-cache git build-base postgresql-client poppler-utils python3 py3-pip
    - pip install --break-system-packages --no-cache-dir python-docx
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
  script:
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
    # go-test-stall-watchdog wraps `go test` so a wedge (Mesh #405872aa: 28min of
    # silence, the runner's only slot held, the whole fleet's queue stalled) fails
    # fast with a goroutine dump naming what's blocked, instead of running out the
    # job timeout with nothing to diagnose.
    - sh scripts/ci/go-test-stall-watchdog.sh ./... -race -coverprofile=coverage.out -covermode=atomic
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 1 week

# ── repo-integration ────────────────────────────────────────────────────────
# Ported from .github/workflows/ci.yml:repo-integration ("Repo tests
# (integration)"). internal/repository/postgres/*_db_test.go and
# integration_test.go (`//go:build integration`, ~30 files) are invisible to
# the `test` job above: it runs `go test ./...` with NO build tag, so every
# integration-tagged file is excluded from compilation entirely. Net effect
# without this job: the class of bug this guards — a field present in an
# UPDATE but missing from the matching INSERT — never ran in CI (the
# reviewer_id incident, #564).
#
# Despite carrying the same `integration` tag as the Tenancy & RBAC gate job,
# this one does NOT need NATS/MinIO: the GitHub source job's own `services:`
# block declares only postgres, and grepping every integration-tagged file
# under internal/repository/postgres/ for nats/minio/jetstream imports finds
# none — confirmed by reading the source, not by pattern-matching the task
# description that (incorrectly) generalised from the Tenancy & RBAC gate
# job's needs. Manual NATS+JetStream/MinIO containers belong to that other
# job, not this one.
repo-integration:
  stage: test
  image: golang:1.25-alpine
  timeout: 20m
  needs: [lint]
  services:
    - name: postgres:16
      alias: postgres
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    # TEST_DATABASE_URL is what integration_test.go's testDB() actually reads;
    # DATABASE_URL (already set globally) covers the *_db_test.go files that
    # carry no build tag and connect the same way the `test` job's non-race
    # DB tests do — setting it here too means this job doesn't accidentally
    # skip them.
    TEST_DATABASE_URL: "postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable"
  before_script:
    - apk add --no-cache git build-base postgresql-client
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
  script:
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
    - go test ./internal/repository/postgres/... -v -race -tags=integration

# ── tenancy-rbac-gate ──────────────────────────────────────────────────────
# Ports `.github/workflows/ci.yml`'s "Tenancy & RBAC gate" (#e64a383f /
# #3b12e7ce). Needs a live API server on top of Postgres, unlike
# repo-integration above — the tests under ./tests/integration/ drive the
# HTTP surface, not the repository layer directly — plus NATS WITH JetStream
# and MinIO, which a plain `services:` entry cannot give: the image's default
# CMD runs neither with JetStream nor as an object server (see the `test`
# job's own nats service above, which deliberately has no `command:` and is
# JetStream-less for exactly that reason). `probe-docker-nested`/
# `probe-services-command` (MR !806, pipelines #321/#322) settled which of
# the two candidate fixes this runner actually allows: `docker run` inside a
# job fails outright here (`NO DAEMON REACHABLE` — hel01's docker executor
# gives jobs no daemon socket), while a `services:` entry with an overridden
# `command:` works and is what both NATS and MinIO use below.
#
# Two independent guards, because a selection floor alone is not enough (see
# TENANCY_MIN_PASSED below):
tenancy-rbac-gate:
  stage: test
  image: golang:1.25-alpine
  timeout: 20m
  needs: [lint]
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: nats:2-alpine
      alias: nats
      command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    - name: minio/minio
      alias: minio
      command: ["server", "/data"]
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    # Single source of truth for what this gate covers — both the guard step
    # and the run step read it, so they cannot disagree about the selection.
    TENANCY_RUN_RE: "^(TestCrossTenant|TestCrossWorkspace|TestRBACLite|TestSecretsRBAC|TestSecretsPlaintext|TestWorkspaceListing|TestAgentTaskFeedIsWorkspaceScoped)"
    # Measured on the tree that introduced this job (locally, against the
    # exact services/versions below, before ever pushing — the shared runner
    # queue on this project currently runs 30-90+ minutes per pipeline,
    # #22f4efcc, so both guards were red/green-proven off-CI first): 50 tests
    # match. Raise this number when tenancy tests are added; lowering it is a
    # deliberate act that must be explained.
    TENANCY_MIN_TESTS: "50"
    # ...and 46 of those 50 actually EXECUTE. Selection is not execution: 4
    # selected tests skip today — TestRBACLite_{Owner,Member,Agent}* are
    # unconditional `t.Skip("TODO: implement RBAC lite first")` placeholders,
    # and TestCrossTenant_SparkInstallRequiresMembership is env-gated on
    # TEST_SPARK_ENABLED (unset here — the Spark catalog is not part of this
    # gate's own service list). A selection floor alone would accept a tree
    # where every real assertion had been replaced by t.Skip: the count
    # holds, the job is green, and the gate guards nothing. So the run step
    # below asserts on tests that PASSED, the number with teeth. The
    # RBACLite placeholders stay in the pattern deliberately — implement
    # RBAC lite and they come under the gate for free, and this floor moves
    # to 49.
    TENANCY_MIN_PASSED: "46"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: mesh
    DB_PASSWORD: mesh
    DB_NAME: mesh
    DB_SSL_MODE: disable
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    NATS_URL: "nats://nats:4222"
    # Alias, not localhost — and here it is not cosmetic. On startup the API asks
    # JetStream for a 10 GiB stream; this runner's NATS has far less, and the
    # recovery path is to read the host's real limit from
    # {NATS_MONITOR_URL}/jsz?config=1 and retry with it. Left at its default
    # (http://localhost:8223) that query dials the job container itself, is
    # refused, and the API disables the event bus for the whole process:
    # "event publishing (WS broadcast, cross-agent notifications, event
    # history) is disabled". Every WebSocket assertion then fails with no NATS
    # error anywhere near it, because the publish never happens. Measured on
    # pipelines 391/394/404/405 (red) vs 416 (green).
    #
    # Deliberately NOT in the global `variables:` block: the `test` job runs
    # unit tests, and config's own defaults test asserts this var is UNSET.
    # A global value there is environment leaking into an assertion about
    # defaults — pipeline 416 failed exactly that way.
    NATS_MONITOR_URL: "http://nats:8222"   # --http_port 8222 in the nats service
    S3_ENDPOINT: "minio:9000"
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
    S3_BUCKET: mesh-artifacts
    S3_REGION: us-east-1
    S3_USE_SSL: "false"
    JWT_SECRET: "ci-test-secret-32chars-minimum!!"
    JWT_ISSUER: "mesh-ci"
    MESH_RATE_LIMIT_ENABLED: "false"
    # Same fixed, published, CI-only key the other jobs use — it protects a
    # throwaway Postgres that dies with the runner. REQUIRED=1 so a key
    # mistake fails loudly instead of silently downgrading to plaintext.
    MESH_INTEGRATION_ENCRYPTION_KEY: "ZXZjLW1lc2gtY2ktaW50ZWdyYXRpb24tdGVzdC1rMzI="
    MESH_INTEGRATION_ENCRYPTION_REQUIRED: "1"
    APP_ENV: test
  before_script:
    - apk add --no-cache git build-base curl postgresql-client
  script:
    # Guard 1 — the selection is not empty. A `-run` regex that matches
    # nothing exits 0 with "testing: warning: no tests to run" and paints the
    # job green; that failure is invisible in exactly the way this whole job
    # exists to prevent. `-list` compiles the package but starts nothing, so
    # this needs no database and runs before any service wait below.
    - |
      go test ./tests/integration/ -tags=integration -list "$TENANCY_RUN_RE" \
        | grep -E '^Test' | sort > /tmp/selected.txt
      n=$(wc -l < /tmp/selected.txt | tr -d ' ')
      echo "selected $n test(s), floor is $TENANCY_MIN_TESTS"
      cat /tmp/selected.txt
      if [ "$n" -lt "$TENANCY_MIN_TESTS" ]; then
        echo "Tenancy gate selects $n tests, below the floor of $TENANCY_MIN_TESTS."
        echo "Either tests were removed/renamed out of the pattern, or TENANCY_RUN_RE no longer matches. Refusing to run a gate that guards less than it claims."
        exit 1
      fi
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - for i in $(seq 30); do curl -sf http://nats:8222/healthz && break; sleep 1; done
    - curl -sf http://nats:8222/healthz
    - for i in $(seq 30); do curl -sf http://minio:9000/minio/health/live && break; sleep 1; done
    - curl -sf http://minio:9000/minio/health/live
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable" $GOPATH/bin/goose -dir migrations up
    - go build -o /tmp/mesh-api ./cmd/api
    - /tmp/mesh-api &
    # The GitHub original waited on GET /healthz, a path this codebase has
    # never had (only /api/v1/healthz/version) — its own for-loop then fell
    # through to "API server ready" unconditionally on timeout, which is the
    # exact §0x class this job exists to police, just one layer up. Fixed
    # here to the real endpoint and a loop that actually fails when the
    # server never comes up, instead of an unverified "ready" echo.
    - |
      ok=0
      for i in $(seq 15); do
        if curl -sf http://localhost:8005/api/v1/healthz/version >/dev/null; then ok=1; break; fi
        sleep 1
      done
      if [ "$ok" -ne 1 ]; then
        echo "API server did not become healthy on :8005"
        exit 1
      fi
      echo "API server ready"
    # pipefail, or `tee` returns 0 and a failing suite reads as a pass.
    - |
      set -o pipefail
      TEST_API_URL="http://localhost:8005" \
      TEST_DB_DSN="host=postgres port=5432 user=mesh password=mesh dbname=mesh sslmode=disable" \
      go test ./tests/integration/ -v -tags=integration -timeout=300s -run "$TENANCY_RUN_RE" 2>&1 | tee /tmp/tenancy.log
    # Guard 2 — selection is not execution (see TENANCY_MIN_PASSED above).
    # `--- PASS:` at column 0 is a top-level test; subtests are indented and
    # excluded so a parent isn't double-counted with its children.
    - |
      passed=$(grep -cE '^--- PASS: ' /tmp/tenancy.log || true)
      skipped=$(grep -cE '^--- SKIP: ' /tmp/tenancy.log || true)
      echo "executed: $passed passed, $skipped skipped (floor is $TENANCY_MIN_PASSED passed)"
      grep -E '^--- SKIP: ' /tmp/tenancy.log || true
      if [ "$passed" -lt "$TENANCY_MIN_PASSED" ]; then
        echo "Tenancy gate: $passed tests passed, below the floor of $TENANCY_MIN_PASSED."
        echo "go test exited 0, so nothing FAILED — tests were skipped or removed instead. A gate that guards fewer assertions than it claims is not a gate."
        exit 1
      fi

# ── build ───────────────────────────────────────────────────────────────────
build:api:
  stage: build
  image: golang:1.25-alpine
  timeout: 15m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base
  script:
    - go build -o /dev/null ./cmd/api

build:web:
  stage: build
  image: node:22-alpine
  timeout: 20m
  before_script:
    # bash, because both negative-control scripts below are #!/usr/bin/env bash
    # and alpine ships ash only.
    - apk add --no-cache bash git
    - corepack enable
  script:
    # Dependencies FIRST. Both asserts below shell out to `pnpm typecheck`,
    # so without node_modules they die on `tsc: not found` — and the script
    # then correctly refuses to draw any conclusion ("proves nothing about
    # whether the check discriminates"). Measured on pipeline 101: the
    # negative control worked, the job order did not.
    - cd web && pnpm install --frozen-lockfile && cd ..
    # The asserts run BEFORE the real typecheck on purpose: they are the
    # negative controls proving `tsc` actually looks at the files it claims
    # to cover. A typecheck that covers nothing passes everything.
    - bash scripts/assert-typecheck-is-not-vacuous.sh
    - bash scripts/assert-typecheck-covers-e2e.sh
    - cd web
    - pnpm typecheck
    - pnpm build

# ── deploy ──────────────────────────────────────────────────────────────────
# Выкатка прод-бэкенда по мёржу в канон. До 28.08.2026 её запускал человек
# кнопкой `build:mesh-backend` в entire-vc/deploy, и это было главной причиной
# отставания прода: замер за 110 ч дал 79% времени позади канона, крупнейший
# эпизод 57.6 ч — при нуле упавших джоб и нуле отказов после разбора. Кнопка
# стоит НИЖЕ мёржа по течению: отказ нажать не отменяет мёрж, а лишь
# откладывает выкатку, поэтому предотвратить она ничего не могла by
# construction. Место человеческого суждения о совместимости миграции — ревью
# MR, до точки невозврата, а не кнопка после неё.
#
# ⚠️ ГЕЙТ ЖИВЁТ В ЭТОМ ЖЕ ПАЙПЛАЙНЕ, а не «ждёт соседний».
# Конструкция «дождаться завершения другого пайплайна» молча наследует ЕГО
# условия запуска: стоит изменить файл, не попадающий в его фильтры, и ждать
# станет нечего — деплой не поедет вовсе, без единой ошибки. Здесь тесты и
# триггер — один пайплайн, поэтому гейт физически не может разъехаться с тем,
# что реально прогнали.
#
# Область гейта = то, что эта выкатка РЕАЛЬНО везёт (бинарь cmd/api +
# migrations), а не весь CI:
#   входят   lint, test, repo-integration, tenancy-rbac-gate, build:api
#   не входят:
#     build:web  — фронтенд едет своей джобой (build:mesh-frontend); связать
#                  их значило бы дать упавшему тесту вёрстки блокировать
#                  выкатку бэкенда;
#     semgrep    — на main сканирует всё дерево, и находка в web/ встала бы
#                  вечным стопом для бэкенда. Он остаётся собственным сигналом;
#     self-host-env — про compose-инстансы самохостеров, наш прод это
#                  бинарь + systemd.
trigger:prod-backend:
  stage: deploy
  # Только пуш в канон. На MR-пайплайнах не запускается: там деплоить нечего,
  # а `$CI_COMMIT_BRANCH` в них вообще не тот.
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  needs: ["lint", "test", "repo-integration", "tenancy-rbac-gate", "build:api"]
  # ⚠️ ЯВНО, вопреки `default: interruptible: true` выше. Прерываемая джоба
  # была бы отменена следующим пушем в main — вместе с ДОЧЕРНИМ пайплайном
  # (`strategy: depend`), то есть посреди выкатки: между `goose up` и подменой
  # бинаря. Ровно тот полудеплой, от которого защищается остальной пайплайн.
  interruptible: false
  variables:
    # Ключ, по которому deploy-проект отличает автозапуск от ручного нажатия.
    DEPLOY_MESH_BACKEND: "1"
  trigger:
    project: entire-vc/deploy
    branch: main
    # ⚠️ `strategy: depend` здесь НЕЛЬЗЯ, хотя по смыслу хотелось бы: пусть
    # упавшая выкатка красит пайплайн канона. Замерено 28.08 — не работает by
    # construction. Пайплайн в entire-vc/deploy ОБЩИЙ на все продукты, и его
    # агрегатный статус висит на ручных джобах чужих продуктов, которые никто
    # не обязан жать: из 30 последних пайплайнов 25 так и остались `manual`,
    # терминального статуса достигли два. `depend` ждёт именно терминального,
    # то есть ждал бы вечно — а по таймауту дал бы КРАСНЫЙ на канон-main при
    # успешно уехавшей выкатке. Ложный красный на каждом мёрже хуже, чем
    # отсутствие сигнала: он приучает не смотреть на цвет main.
    #
    # Чем закрыт отказ выкатки вместо этого:
    #   • `verify:mesh-backend` краснеет в самом deploy-пайплайне;
    #   • сторож дрейфа (launchd, 15 мин) сравнивает /api/version с каноном
    #     напрямую и заводит карточку владельцу — он не зависит ни от статуса
    #     пайплайна, ни от этого моста.

# Выкатка прод-фронтенда по мёржу в канон — зеркало trigger:prod-backend выше,
# заведённое позже (#55c074e2) и по этой причине заслуживающее объяснения, чем
# оно было ДО этой правки, а не только чем стало.
#
# ⚠️ ДО ЭТОЙ ПРАВКИ АВТОЗАПУСКА У ФРОНТЕНДА НЕ БЫЛО ВООБЩЕ — не «тоже кнопка»,
# а ДВЕ отдельные ручные кнопки (`build:mesh-frontend` и `deploy:mesh-frontend`
# в entire-vc/deploy — `deploy:` не несёт своего `when:`, оно наследуется от
# `.deploy_base`, поэтому по тексту джобы выглядит как едущее следом само,
# а на деле ждёт второго отдельного нажатия). Решение #46d7375b (28.08)
# сняло обязательность нажатия только у backend; текст того решения читался
# как «доставка Mesh теперь автоматическая» целиком — неверно наполовину.
# Живое подтверждение: пайплайн 723 (31.08), коммит d1aa60c4 в web/ — backend
# доехал до прода сам, фронтенд остался собран из ae73e68a (27.08), четверо
# суток дрейфа поймал сторож.
#
# Область гейта = то, что эта выкатка РЕАЛЬНО везёт (bundle из web/dist), а не
# весь CI:
#   входит   build:web — единственная джоба, которая реально собирает и
#            тайпчекает то же дерево, что переносится на прод;
#   не входят lint, test, repo-integration, tenancy-rbac-gate, build:api —
#            это Go-код, к содержимому web/dist отношения не имеет;
#            упавший тест бэкенда не должен держать фронтенд, и наоборот
#            (та же симметрия, что у backend-гейта в обратную сторону);
#   semgrep, self-host-env — исключены по тем же причинам, что и у backend
#            выше (сканирует всё дерево / про compose-самохостеров).
#
# ⚠️ Без фильтра `paths:` — намеренно, а не забыто. Технически лишний прогон
# `build:mesh-frontend`/`deploy:mesh-frontend` на коммите вне web/ стоит
# минуту и ничего не меняет на проде (та же сборка ляжет тем же содержимым).
# А `paths:`/`paths-ignore:` на required-гейте уже стоил флоту забуксовавшего
# PR: у ЭТОГО ЖЕ репозитория `paths-ignore` на pull_request однажды скипал
# required-чек целиком на docs-only PR, и залипший чек с `enforce_admins=true`
# держал PR навсегда без единой ошибки (см. память
# `canon-enforce-admins-flip-8-repos`). backend-гейт выше тоже без `paths:`
# по той же логике: симметрия дешевле сэкономленной минуты раннера.
trigger:prod-frontend:
  stage: deploy
  # Только пуш в канон — то же условие, что у backend.
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  needs: ["build:web"]
  # ⚠️ ЯВНО, та же причина, что у backend: прерывание вместе с ДОЧЕРНИМ
  # пайплайном (`strategy: depend` здесь тоже НЕ используется, см. ниже)
  # посреди выкладки — `rsync --delete` в середине — хуже, чем подождать.
  interruptible: false
  variables:
    # Ключ, по которому deploy-проект отличает автозапуск от ручного нажатия.
    DEPLOY_MESH_FRONTEND: "1"
  trigger:
    project: entire-vc/deploy
    branch: main
    # ⚠️ Без `strategy: depend` — та же причина, измеренная для backend и не
    # переизмерявшаяся отдельно для фронтенда: пайплайн в entire-vc/deploy
    # ОБЩИЙ на все продукты, его агрегатный статус висит на чужих ручных
    # джобах, которые никто не обязан жать. `depend` дал бы таймаут и
    # ложный красный на канон-main при успешно уехавшей выкатке.
    #
    # Чем закрыт отказ выкатки вместо этого:
    #   • `verify:mesh-frontend` краснеет в самом deploy-пайплайне и сверяет
    #     CACHE_NAME живого sw.js с собранным — по содержимому, не по коду
    #     ответа;
    #   • сторож дрейфа (launchd, 15 мин) — для фронтенда это state-трекинг
    #     (у отданного бандла нет метки коммита): ждёт смены `index-<hash>.js`
    #     в пределах grace после нового коммита в web/** на канон-main.
