# CI for the GitLab canon (git.entire.host/entire-vc/evc-mesh).
#
# ## Why this file exists
#
# Development moved from GitHub to GitLab on 2026-08-23. The nine required
# status checks that guarded merges — Lint, Test, Build, Hold gate and the
# rest — live in `.github/workflows/` and are executed by GitHub Actions.
# They still run, on a repository nobody merges into any more. For one day
# every merge request here landed on `main` having been checked by nothing:
# no pipeline, no approval, no required check. Not because a gate was
# bypassed, but because none existed.
#
# ## Honest scope
#
# This is NOT a port of all 22 GitHub check-runs. It carries the four that
# catch the most per minute spent — lint, race-enabled tests against real
# Postgres/Redis/NATS, the Go build, the frontend typecheck+build — plus the
# hold gate, self-host-env (config-only, no live daemon needed),
# repo-integration (Postgres only — see that job's own header for why it does
# NOT need NATS/MinIO despite carrying the same `integration` build tag as
# tenancy-rbac-gate), and tenancy-rbac-gate itself (Postgres + NATS-with-
# JetStream + MinIO, a live API server, and a two-part guard against the gate
# quietly guarding nothing — see that job's own header). Deliberately still
# absent, and worth their own cards: Authed E2E, Go coverage ≥80%
# (affected-set), Memory recall gate, Vendor trailer gate, CodeQL. A stub
# that looks like full CI is more dangerous than a gap you can see, so the
# gap is named here rather than implied.
#
# ## The half that is not in this file
#
# A pipeline is a display until `only_allow_merge_if_pipeline_succeeds` is
# true on the project — until then GitLab will happily merge over a red run.
# That setting needs Maintainer; every agent account on this group is
# Developer(30) and the sole holder of 40+ is `pavel`. Asked for separately.

workflow:
  rules:
    # MR pipelines are the ones that matter — they are what a merge consults,
    # and the only context where $CI_MERGE_REQUEST_LABELS exists at all.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Never run a branch pipeline for a branch that already has an open MR:
    # that is GitLab's classic duplicate-pipeline trap, and it doubles runner
    # load on the one shared runner this fleet has.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [gate, lint, test, build]

variables:
  # Services are reachable by their image alias on the docker executor, NOT on
  # localhost — the single most common wrong translation from a GitHub Actions
  # `services:` block, where port-mapping to localhost is how it works.
  POSTGRES_USER: mesh
  POSTGRES_PASSWORD: mesh
  POSTGRES_DB: mesh
  DATABASE_URL: "postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable"
  REDIS_URL: "redis://redis:6379"
  NATS_URL: "nats://nats:4222"
  GOLANGCI_LINT_VERSION: "v2.11.3"   # keep in step with Makefile:81
  GOFLAGS: "-buildvcs=false"

default:
  tags: [docker]
  interruptible: true

# ── gate ────────────────────────────────────────────────────────────────────
# Makes the `hold` label a gate here too. On GitHub this is a required status
# check (.github/workflows/hold-gate.yml); `~/bin/glab-merge` reads the same
# label list, but a wrapper is a request, not a wall — the web button and a
# bare `glab mr merge` never ask it.
#
# The label list is READ FROM `.github/hold-labels.txt`, the file already in
# this repository, rather than copied into this one. A second copy is a second
# thing to drift, and that file's own header records that it drifted from the
# fleet list within a day of being written.
hold-gate:
  stage: gate
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -eu
      LABELS_FILE=.github/hold-labels.txt
      # Fail closed on every unknown. "I could not check" must never read the
      # same as "I checked and it is clean" — that equivalence is the defect
      # this whole gate family exists to kill.
      test -f "$LABELS_FILE" || { echo "REFUSING: $LABELS_FILE missing — cannot know what 'held' means"; exit 1; }
      HOLD=$(grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -c . || true)
      test "$HOLD" -gt 0 || { echo "REFUSING: $LABELS_FILE parsed to zero labels — a gate that knows no hold label passes everything"; exit 1; }
      echo "hold labels known: $HOLD"
      echo "labels on this merge request: '${CI_MERGE_REQUEST_LABELS:-}'"
      FOUND=""
      OLDIFS=$IFS; IFS=','
      for L in ${CI_MERGE_REQUEST_LABELS:-}; do
        L=$(printf '%s' "$L" | tr 'A-Z' 'a-z' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        [ -n "$L" ] || continue
        if grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qxF "$L"; then
          FOUND="$FOUND $L"
        fi
      done
      IFS=$OLDIFS
      if [ -n "$FOUND" ]; then
        echo "REFUSING to let this merge request through: it carries a hold label —$FOUND"
        echo "Remove the label when the work is ready; this job re-runs on the next pipeline."
        exit 1
      fi
      echo "no hold label present ✓"

# ── self-host-env ──────────────────────────────────────────────────────────
# Ported from .github/workflows/ci.yml's "Self-host env (no new required
# vars)". Guards the class of defect that broke the 2026-07-29 upgrade of an
# external self-host instance: a compose variable made required (`${VAR:?}`)
# without also being added to check-required-env.sh's allowlist and
# .env.prod.example — invisible on our own prod, which has always had the
# variable, and fatal for every existing self-host install that does not.
#
# `docker compose config` is a client-side render of the compose spec — it
# does not talk to a running engine (verified locally: `DOCKER_HOST` pointed
# at a nonexistent socket, still exits 0 with valid output). That is what
# makes this portable onto a plain image instead of needing docker:dind and
# a privileged runner, unlike every job on this fleet's shared hel01 runner
# that has needed a live daemon so far.
self-host-env:
  stage: lint
  image: docker:27-cli
  timeout: 10m
  before_script:
    - apk add --no-cache bash
  script:
    - bash deploy/docker/mesh/check-required-env.sh
    # Same second half as the GitHub job: an .env from the FIRST installable
    # release must still parse against today's compose files — the exact
    # upgrade that failed on 2026-07-29 (mesh.prototypes.ventures,
    # 5b672a6 -> 9d7ac87). Both compose files, not just the prod one — see
    # check-required-env.sh's own header for why "just the prod file" is a
    # gap that gets believed and stops being watched.
    - |
      cd deploy/docker/mesh
      sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder/' \
        testdata/first-release.env.example > /tmp/first-release.env
      for f in docker-compose.prod.yml docker-compose.yml; do
        echo "--- $f"
        docker compose -f "$f" --env-file /tmp/first-release.env config >/dev/null
      done

# ── lint ────────────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: golang:1.25-alpine
  timeout: 15m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION
  script:
    - $GOPATH/bin/golangci-lint run ./...

# ── test ────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: golang:1.25-alpine
  timeout: 30m
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: nats:2-alpine
      alias: nats
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    # build-base is not optional: `go test -race` needs cgo, and alpine has no
    # C toolchain by default. Without it the race detector fails to link and
    # the failure looks like a broken test rather than a missing package.
    - apk add --no-cache git build-base postgresql-client
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@latest
  script:
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
    - go test ./... -race -coverprofile=coverage.out -covermode=atomic
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 1 week

# ── repo-integration ────────────────────────────────────────────────────────
# Ported from .github/workflows/ci.yml:repo-integration ("Repo tests
# (integration)"). internal/repository/postgres/*_db_test.go and
# integration_test.go (`//go:build integration`, ~30 files) are invisible to
# the `test` job above: it runs `go test ./...` with NO build tag, so every
# integration-tagged file is excluded from compilation entirely. Net effect
# without this job: the class of bug this guards — a field present in an
# UPDATE but missing from the matching INSERT — never ran in CI (the
# reviewer_id incident, #564).
#
# Despite carrying the same `integration` tag as the Tenancy & RBAC gate job,
# this one does NOT need NATS/MinIO: the GitHub source job's own `services:`
# block declares only postgres, and grepping every integration-tagged file
# under internal/repository/postgres/ for nats/minio/jetstream imports finds
# none — confirmed by reading the source, not by pattern-matching the task
# description that (incorrectly) generalised from the Tenancy & RBAC gate
# job's needs. Manual NATS+JetStream/MinIO containers belong to that other
# job, not this one.
repo-integration:
  stage: test
  image: golang:1.25-alpine
  timeout: 20m
  needs: [lint]
  services:
    - name: postgres:16
      alias: postgres
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    # TEST_DATABASE_URL is what integration_test.go's testDB() actually reads;
    # DATABASE_URL (already set globally) covers the *_db_test.go files that
    # carry no build tag and connect the same way the `test` job's non-race
    # DB tests do — setting it here too means this job doesn't accidentally
    # skip them.
    TEST_DATABASE_URL: "postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable"
  before_script:
    - apk add --no-cache git build-base postgresql-client
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@latest
  script:
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
    - go test ./internal/repository/postgres/... -v -race -tags=integration

# ── tenancy-rbac-gate ──────────────────────────────────────────────────────
# Ports `.github/workflows/ci.yml`'s "Tenancy & RBAC gate" (#e64a383f /
# #3b12e7ce). Needs a live API server on top of Postgres, unlike
# repo-integration above — the tests under ./tests/integration/ drive the
# HTTP surface, not the repository layer directly — plus NATS WITH JetStream
# and MinIO, which a plain `services:` entry cannot give: the image's default
# CMD runs neither with JetStream nor as an object server (see the `test`
# job's own nats service above, which deliberately has no `command:` and is
# JetStream-less for exactly that reason). `probe-docker-nested`/
# `probe-services-command` (MR !806, pipelines #321/#322) settled which of
# the two candidate fixes this runner actually allows: `docker run` inside a
# job fails outright here (`NO DAEMON REACHABLE` — hel01's docker executor
# gives jobs no daemon socket), while a `services:` entry with an overridden
# `command:` works and is what both NATS and MinIO use below.
#
# Two independent guards, because a selection floor alone is not enough (see
# TENANCY_MIN_PASSED below):
tenancy-rbac-gate:
  stage: test
  image: golang:1.25-alpine
  timeout: 20m
  needs: [lint]
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: nats:2-alpine
      alias: nats
      command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    - name: minio/minio
      alias: minio
      command: ["server", "/data"]
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    # Single source of truth for what this gate covers — both the guard step
    # and the run step read it, so they cannot disagree about the selection.
    TENANCY_RUN_RE: "^(TestCrossTenant|TestCrossWorkspace|TestRBACLite|TestSecretsRBAC|TestSecretsPlaintext|TestWorkspaceListing|TestAgentTaskFeedIsWorkspaceScoped)"
    # Measured on the tree that introduced this job (locally, against the
    # exact services/versions below, before ever pushing — the shared runner
    # queue on this project currently runs 30-90+ minutes per pipeline,
    # #22f4efcc, so both guards were red/green-proven off-CI first): 50 tests
    # match. Raise this number when tenancy tests are added; lowering it is a
    # deliberate act that must be explained.
    TENANCY_MIN_TESTS: "50"
    # ...and 46 of those 50 actually EXECUTE. Selection is not execution: 4
    # selected tests skip today — TestRBACLite_{Owner,Member,Agent}* are
    # unconditional `t.Skip("TODO: implement RBAC lite first")` placeholders,
    # and TestCrossTenant_SparkInstallRequiresMembership is env-gated on
    # TEST_SPARK_ENABLED (unset here — the Spark catalog is not part of this
    # gate's own service list). A selection floor alone would accept a tree
    # where every real assertion had been replaced by t.Skip: the count
    # holds, the job is green, and the gate guards nothing. So the run step
    # below asserts on tests that PASSED, the number with teeth. The
    # RBACLite placeholders stay in the pattern deliberately — implement
    # RBAC lite and they come under the gate for free, and this floor moves
    # to 49.
    TENANCY_MIN_PASSED: "46"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: mesh
    DB_PASSWORD: mesh
    DB_NAME: mesh
    DB_SSL_MODE: disable
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    NATS_URL: "nats://nats:4222"
    S3_ENDPOINT: "minio:9000"
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
    S3_BUCKET: mesh-artifacts
    S3_REGION: us-east-1
    S3_USE_SSL: "false"
    JWT_SECRET: "ci-test-secret-32chars-minimum!!"
    JWT_ISSUER: "mesh-ci"
    MESH_RATE_LIMIT_ENABLED: "false"
    # Same fixed, published, CI-only key the other jobs use — it protects a
    # throwaway Postgres that dies with the runner. REQUIRED=1 so a key
    # mistake fails loudly instead of silently downgrading to plaintext.
    MESH_INTEGRATION_ENCRYPTION_KEY: "ZXZjLW1lc2gtY2ktaW50ZWdyYXRpb24tdGVzdC1rMzI="
    MESH_INTEGRATION_ENCRYPTION_REQUIRED: "1"
    APP_ENV: test
  before_script:
    - apk add --no-cache git build-base curl postgresql-client
  script:
    # Guard 1 — the selection is not empty. A `-run` regex that matches
    # nothing exits 0 with "testing: warning: no tests to run" and paints the
    # job green; that failure is invisible in exactly the way this whole job
    # exists to prevent. `-list` compiles the package but starts nothing, so
    # this needs no database and runs before any service wait below.
    - |
      go test ./tests/integration/ -tags=integration -list "$TENANCY_RUN_RE" \
        | grep -E '^Test' | sort > /tmp/selected.txt
      n=$(wc -l < /tmp/selected.txt | tr -d ' ')
      echo "selected $n test(s), floor is $TENANCY_MIN_TESTS"
      cat /tmp/selected.txt
      if [ "$n" -lt "$TENANCY_MIN_TESTS" ]; then
        echo "Tenancy gate selects $n tests, below the floor of $TENANCY_MIN_TESTS."
        echo "Either tests were removed/renamed out of the pattern, or TENANCY_RUN_RE no longer matches. Refusing to run a gate that guards less than it claims."
        exit 1
      fi
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - for i in $(seq 30); do curl -sf http://nats:8222/healthz && break; sleep 1; done
    - curl -sf http://nats:8222/healthz
    - for i in $(seq 30); do curl -sf http://minio:9000/minio/health/live && break; sleep 1; done
    - curl -sf http://minio:9000/minio/health/live
    - go install github.com/pressly/goose/v3/cmd/goose@latest
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable" $GOPATH/bin/goose -dir migrations up
    - go build -o /tmp/mesh-api ./cmd/api
    - /tmp/mesh-api &
    # The GitHub original waited on GET /healthz, a path this codebase has
    # never had (only /api/v1/healthz/version) — its own for-loop then fell
    # through to "API server ready" unconditionally on timeout, which is the
    # exact §0x class this job exists to police, just one layer up. Fixed
    # here to the real endpoint and a loop that actually fails when the
    # server never comes up, instead of an unverified "ready" echo.
    - |
      ok=0
      for i in $(seq 15); do
        if curl -sf http://localhost:8005/api/v1/healthz/version >/dev/null; then ok=1; break; fi
        sleep 1
      done
      if [ "$ok" -ne 1 ]; then
        echo "API server did not become healthy on :8005"
        exit 1
      fi
      echo "API server ready"
    # pipefail, or `tee` returns 0 and a failing suite reads as a pass.
    - |
      set -o pipefail
      TEST_API_URL="http://localhost:8005" \
      TEST_DB_DSN="host=postgres port=5432 user=mesh password=mesh dbname=mesh sslmode=disable" \
      go test ./tests/integration/ -v -tags=integration -timeout=300s -run "$TENANCY_RUN_RE" 2>&1 | tee /tmp/tenancy.log
    # Guard 2 — selection is not execution (see TENANCY_MIN_PASSED above).
    # `--- PASS:` at column 0 is a top-level test; subtests are indented and
    # excluded so a parent isn't double-counted with its children.
    - |
      passed=$(grep -cE '^--- PASS: ' /tmp/tenancy.log || true)
      skipped=$(grep -cE '^--- SKIP: ' /tmp/tenancy.log || true)
      echo "executed: $passed passed, $skipped skipped (floor is $TENANCY_MIN_PASSED passed)"
      grep -E '^--- SKIP: ' /tmp/tenancy.log || true
      if [ "$passed" -lt "$TENANCY_MIN_PASSED" ]; then
        echo "Tenancy gate: $passed tests passed, below the floor of $TENANCY_MIN_PASSED."
        echo "go test exited 0, so nothing FAILED — tests were skipped or removed instead. A gate that guards fewer assertions than it claims is not a gate."
        exit 1
      fi

# ── build ───────────────────────────────────────────────────────────────────
build:api:
  stage: build
  image: golang:1.25-alpine
  timeout: 15m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base
  script:
    - go build -o /dev/null ./cmd/api

build:web:
  stage: build
  image: node:22-alpine
  timeout: 20m
  before_script:
    # bash, because both negative-control scripts below are #!/usr/bin/env bash
    # and alpine ships ash only.
    - apk add --no-cache bash git
    - corepack enable
  script:
    # Dependencies FIRST. Both asserts below shell out to `pnpm typecheck`,
    # so without node_modules they die on `tsc: not found` — and the script
    # then correctly refuses to draw any conclusion ("proves nothing about
    # whether the check discriminates"). Measured on pipeline 101: the
    # negative control worked, the job order did not.
    - cd web && pnpm install --frozen-lockfile && cd ..
    # The asserts run BEFORE the real typecheck on purpose: they are the
    # negative controls proving `tsc` actually looks at the files it claims
    # to cover. A typecheck that covers nothing passes everything.
    - bash scripts/assert-typecheck-is-not-vacuous.sh
    - bash scripts/assert-typecheck-covers-e2e.sh
    - cd web
    - pnpm typecheck
    - pnpm build
