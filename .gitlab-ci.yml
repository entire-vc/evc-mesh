# CI for the GitLab canon (self-hosted GitLab, entire-vc/evc-mesh).
#
# ## Why this file exists
#
# Development moved from GitHub to GitLab on 2026-08-23. The nine required
# status checks that guarded merges — Lint, Test, Build, Hold gate and the
# rest — live in `.github/workflows/` and are executed by GitHub Actions.
# They still run, on a repository nobody merges into any more. For one day
# every merge request here landed on `main` having been checked by nothing:
# no pipeline, no approval, no required check. Not because a gate was
# bypassed, but because none existed.
#
# ## Honest scope
#
# This is NOT a port of all 22 GitHub check-runs. It carries the six that
# catch the most per minute spent — lint, race-enabled tests against real
# Postgres/Redis/NATS, the Go build, the frontend typecheck+build — plus the
# hold gate, self-host-env (config-only, no live daemon needed),
# repo-integration (Postgres only — see that job's own header for why it does
# NOT need NATS/MinIO despite carrying the same `integration` build tag as
# tenancy-rbac-gate), tenancy-rbac-gate itself (Postgres + NATS-with-
# JetStream + MinIO, a live API server, and a two-part guard against the gate
# quietly guarding nothing — see that job's own header), vendor-trailer-gate
# (adapted, not a literal port — see that job's own header and
# `.gitlab/scripts/vendor_trailer_gate.py` for why GitLab's squash mechanics
# change what it can actually check), the Go coverage ≥80% (affected-set)
# gate, authed-e2e (present in the YAML and gating merges for real —
# the two GitLab CI/CD variables it needs, E2E_USER_EMAIL/E2E_USER_PASSWORD,
# were set via `gl-admin set-ci-variable` on 2026-09-07, #d5619f11; do not
# read an older comment saying otherwise as still current), and now (since
# #06bc8932) the required "Memory recall gate" (`recall-gate-branch`). CodeQL's
# job — SAST — is now carried by `semgrep` (see that job's own header for why
# it is a re-implementation rather than a port). A stub that looks like full
# CI is more dangerous than a gap you can see, so any remaining gap is named
# here rather than implied.
#
# ## `recall-gate-branch` — corrected premise, read before touching it
#
# The card that ported it (#06bc8932) was filed on the belief that "Memory
# recall gate" reaches PROD memory and needs careful secret handling. That
# was true of the job under this name once (evc-mesh#394/#2a079432) but is
# NOT true of what the name currently identifies: ADR-0003
# (.github/workflows/memory-bench.yml, job `recall-gate-branch`) rebuilt
# `cmd/api` from the PR head and measures THAT — an ephemeral server over an
# ephemeral Postgres, minting its own throwaway agent key
# (`ci_bootstrap.py`) rather than touching `secrets.MESH_BENCH_KEY`, which
# is prod's. The job that DOES touch prod is a different, differently-named,
# NON-required check: `recall-gate` / "Memory recall canary (prod)" — it
# only runs on push/schedule/dispatch to `main`, never on `pull_request` or
# `merge_group`, and is out of this card's scope (it is not what "Memory
# recall gate" identifies). Ported below: zero prod secrets, zero GitLab
# CI/CD variables, nothing masked — there is nothing to mask.
#
# ## The half that is not in this file
#
# A pipeline is a display until `only_allow_merge_if_pipeline_succeeds` is
# true on the project — until then GitLab will happily merge over a red run.
# That setting is now TRUE (read back 2026-08-27 from the project API, not
# assumed), so a red pipeline here genuinely blocks the merge. It needed
# Maintainer to set: every agent account on this group is Developer(30) and
# the sole holder of 40+ is `pavel`.
#
# Consequence worth knowing before you wonder why your MR will not merge: a
# job that is red on `main` blocks every MR, not just the one that broke it.

workflow:
  rules:
    # MR pipelines are the ones that matter — they are what a merge consults,
    # and the only context where $CI_MERGE_REQUEST_LABELS exists at all.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Never run a branch pipeline for a branch that already has an open MR:
    # that is GitLab's classic duplicate-pipeline trap, and it doubles runner
    # load on the one shared runner this fleet has.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [gate, sast, lint, test, build, memory-gate, deploy]

variables:
  # Services are reachable by their image alias on the docker executor, NOT on
  # localhost — the single most common wrong translation from a GitHub Actions
  # `services:` block, where port-mapping to localhost is how it works.
  POSTGRES_USER: mesh
  POSTGRES_PASSWORD: mesh
  POSTGRES_DB: mesh
  DATABASE_URL: "postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable"
  REDIS_URL: "redis://redis:6379"
  NATS_URL: "nats://nats:4222"
  GOLANGCI_LINT_VERSION: "v2.11.3"   # keep in step with Makefile:81
  # Pinned, NOT `@latest`. `go install ...@latest` resolves against upstream
  # at job time, so a release requiring a newer Go breaks every job here
  # without a commit in this repo. That happened on 2026-09-02: goose v3.28.0
  # requires go >= 1.26 while these images are golang:1.25-alpine, and the
  # three jobs that run migrations (test, repo-integration, tenancy-rbac-gate)
  # all failed at `go install`, before a single test ran. Keep in step with
  # the goose version in go.mod — the tool and the library must not drift.
  #
  # `recall-gate-branch` (defined separately below, self-hosted memory-bench
  # harness) had its OWN unpinned `goose@latest` in its inline migration step
  # — missed in the 2026-09-02 fix because it doesn't share a job template
  # with the four jobs above. Same class of break, hit again 2026-09-18
  # (#1bc9c311) the moment upstream cut goose v3.28.0. Fixed to use this same
  # variable; a fifth job pinned is not a guarantee a sixth won't be missed —
  # grep this file for `goose/v3/cmd/goose@` before trusting "all jobs pinned".
  GOOSE_VERSION: "v3.27.3"   # keep in step with go.mod
  GOFLAGS: "-buildvcs=false"
  # Every file whose behaviour `recall-gate-branch` is supposed to protect.
  # Copied verbatim from `.github/workflows/memory-bench.yml`'s own `env:` —
  # ONE list, not two: a file missing here is the worst failure a required
  # check can have (it reports green having measured nothing, #347). Keep
  # this in step with the GitHub copy by hand until one of the two files is
  # retired; there is no mechanism that syncs them.
  MEMORY_PATHS: |
    internal/handler/memory_handler.go
    internal/domain/memory.go
    internal/service/memory_service.go
    internal/service/memory_sanitizer.go
    internal/repository/postgres/memory_repo.go
    internal/repository/postgres/memory_edges_repo.go
    internal/repository/postgres/memory_chunk_rank.go
    internal/repository/postgres/memory_chunk_repo.go
    internal/reconciler/
    pkg/sdk/memories.go
    scripts/memory-bench/

default:
  tags: [docker]
  interruptible: true

# ── gate ────────────────────────────────────────────────────────────────────
# Makes the `hold` label a gate here too. On GitHub this is a required status
# check (.github/workflows/hold-gate.yml); `~/bin/glab-merge` reads the same
# label list, but a wrapper is a request, not a wall — the web button and a
# bare `glab mr merge` never ask it.
#
# The label list is READ FROM `.github/hold-labels.txt`, the file already in
# this repository, rather than copied into this one. A second copy is a second
# thing to drift, and that file's own header records that it drifted from the
# fleet list within a day of being written.
hold-gate:
  stage: gate
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -eu
      LABELS_FILE=.github/hold-labels.txt
      # Fail closed on every unknown. "I could not check" must never read the
      # same as "I checked and it is clean" — that equivalence is the defect
      # this whole gate family exists to kill.
      test -f "$LABELS_FILE" || { echo "REFUSING: $LABELS_FILE missing — cannot know what 'held' means"; exit 1; }
      HOLD=$(grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -c . || true)
      test "$HOLD" -gt 0 || { echo "REFUSING: $LABELS_FILE parsed to zero labels — a gate that knows no hold label passes everything"; exit 1; }
      echo "hold labels known: $HOLD"
      echo "labels on this merge request: '${CI_MERGE_REQUEST_LABELS:-}'"
      FOUND=""
      OLDIFS=$IFS; IFS=','
      for L in ${CI_MERGE_REQUEST_LABELS:-}; do
        L=$(printf '%s' "$L" | tr 'A-Z' 'a-z' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        [ -n "$L" ] || continue
        if grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qxF "$L"; then
          FOUND="$FOUND $L"
        fi
      done
      IFS=$OLDIFS
      if [ -n "$FOUND" ]; then
        echo "REFUSING to let this merge request through: it carries a hold label —$FOUND"
        echo "Remove the label when the work is ready; this job re-runs on the next pipeline."
        exit 1
      fi
      echo "no hold label present ✓"

# ── migration-gate ───────────────────────────────────────────────────────────
# Ported from `.github/workflows/migration-check.yml`'s first step, because the
# canon moved to GitLab (2026-08-23) and this control did not come with it. The
# script `scripts/check-migration-version.sh` was here the whole time and was
# correct the whole time; nothing on this side ever called it, so between the
# move and 2026-09-09 migration version numbers were checked by nobody.
#
# How that stayed invisible for two weeks, and why this job runs on the SOURCE
# BRANCH rather than needing merged-results pipelines (#3d18da50):
#
#   A branch that predates the colliding file on `main` holds only ONE file
#   with that version, so its own directory is honestly clean and every job in
#   its pipeline is honestly green. Git merges the two without a conflict —
#   git cannot see migration version numbers, only paths. The collision is
#   created BY the merge and is invisible before it.
#
# The script catches it anyway, and that is the whole reason it has a second
# rule: rule 1 (no duplicates in the directory) is blind to this shape, but
# rule 2 (every migration new in this branch must have version > max on the
# base branch) fires on the branch alone. Measured on the real case: gate exits
# 1 with "20260907002 ≤ max 20260909001 on origin/main" reading nothing but the
# unmerged branch.
#
# What the merge would otherwise cost: goose does NOT skip a duplicate version
# silently. It panics in `collectMigrationsFS`, before executing any SQL —
# measured at v3.27.3, the version GOOSE_VERSION pins below. So the failure is
# loud, but it lands on the migrate step of EVERY subsequent mesh-api deploy,
# including deploys of unrelated work.
#
# Deliberately NOT ported here, and worth its own card rather than a silent
# omission: the GitHub job's `up → down-to 0 → up` reversibility check. Four
# jobs in this file already run `goose up` against a real Postgres, so "the
# migrations apply" is covered; that a migration can be rolled back is not
# covered anywhere on this side.
#
# No `changes:` rule on purpose. The job takes seconds, and a gate that only
# runs under a condition is a gate you have to re-derive the reachability of
# every time you trust it.
migration-gate:
  stage: gate
  image: alpine:3.20
  timeout: 5m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # The script compares against origin/<target>; a truncated clone can leave
    # that ref absent, and the script's own guard then SKIPS the comparison and
    # exits 0 — clean-looking output for a check that did not run.
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash git
  script:
    - |
      set -eu
      # Fail closed if the target branch is not reachable. Without this the
      # script's "SKIP: origin/<base> not found" path prints OK and exits 0,
      # which is exactly the shape this gate exists to stop believing.
      git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=1
      git rev-parse "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >/dev/null 2>&1 || {
        echo "REFUSING: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME unreachable — cannot compare versions"
        exit 1
      }
      bash scripts/check-migration-version.sh migrations

# ── vendor-trailer-gate ──────────────────────────────────────────────────────
# Adapted from `.github/workflows/vendor-trailer-gate.yml`, not a literal
# port. Reads every commit on this MR's source branch not yet on the target
# branch (`git log origin/<target>..HEAD`, computed locally in the job's own
# checkout — see `.gitlab/scripts/vendor_trailer_gate.py`'s header for why
# not the GitLab API) and refuses any whose message carries a
# `Co-Authored-By:`/`Generated with/by` trailer naming a development tool.
# Detector, term list (`.github/vendor-trailer-terms.txt`, reused not copied)
# and self-test are the same as the GitHub script's; the *scope* differs —
# short version: GitLab's squash commit message is the MR title only, body
# discarded, so this cannot check what lands on `main` (there is nothing left
# to check by the time it gets there) — it checks whether the branch commits
# followed the convention, which is what the squash step used to hide.
#
# Known residual gap, same shape as GitHub's own accepted one (see that
# workflow's header): a human hand-editing the squash/merge commit message in
# GitLab's merge widget, after this job has already passed, is invisible to
# it — no pipeline re-runs on that edit. Not closed here; stated.
vendor-trailer-gate:
  stage: gate
  image: python:3.12-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # Full clone: the script diffs `origin/<target>..HEAD` itself (see its
    # own header for why — CI_JOB_TOKEN cannot read this project's own
    # merge_requests/:iid/commits API, measured live as a 404). A shallow
    # clone risks that diff silently missing history past the cutoff; GIT_DEPTH:0
    # removes the question rather than picking a depth and hoping.
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - python3 .gitlab/scripts/vendor_trailer_gate.py

# ── self-host-env ──────────────────────────────────────────────────────────
# Ported from .github/workflows/ci.yml's "Self-host env (no new required
# vars)". Guards the class of defect that broke the 2026-07-29 upgrade of an
# external self-host instance: a compose variable made required (`${VAR:?}`)
# without also being added to check-required-env.sh's allowlist and
# .env.prod.example — invisible on our own prod, which has always had the
# variable, and fatal for every existing self-host install that does not.
#
# `docker compose config` is a client-side render of the compose spec — it
# does not talk to a running engine (verified locally: `DOCKER_HOST` pointed
# at a nonexistent socket, still exits 0 with valid output). That is what
# makes this portable onto a plain image instead of needing docker:dind and
# a privileged runner, unlike every job on this fleet's shared hel01 runner
# that has needed a live daemon so far.
self-host-env:
  stage: lint
  image: docker:27-cli
  timeout: 10m
  before_script:
    - apk add --no-cache bash
  script:
    - bash deploy/docker/mesh/check-required-env.sh
    # Same second half as the GitHub job: an .env from the FIRST installable
    # release must still parse against today's compose files — the exact
    # upgrade that failed on 2026-07-29 (mesh.prototypes.ventures,
    # 5b672a6 -> 9d7ac87). Both compose files, not just the prod one — see
    # check-required-env.sh's own header for why "just the prod file" is a
    # gap that gets believed and stops being watched.
    - |
      cd deploy/docker/mesh
      sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder/' \
        testdata/first-release.env.example > /tmp/first-release.env
      for f in docker-compose.prod.yml docker-compose.yml; do
        echo "--- $f"
        docker compose -f "$f" --env-file /tmp/first-release.env config >/dev/null
      done

# ── mcp-reference-gate ──────────────────────────────────────────
# docs/mcp-reference.md is the public catalogue of the MCP tools, but the tools
# themselves live in a DIFFERENT repository (evc-mesh-mcp). Nothing in this
# repo's CI could notice a tool added or removed there, and over time the page
# drifted to 20 undocumented tools plus 4 documented tools the server never
# registered (Mesh #1f0ee22c) — while stating three mutually inconsistent
# totals about itself.
#
# The script fetches the server source and fails on a mismatch in EITHER
# direction. It fails closed: a source it cannot fetch, or fetches and cannot
# parse, is a refusal, not a pass — "I could not look" must not read the same
# as "I looked and it was fine".
mcp-reference-gate:
  stage: lint
  image: alpine:3.20
  timeout: 5m
  before_script:
    - apk add --no-cache bash curl coreutils
  script:
    - bash scripts/check-mcp-reference.sh

# ── sast ────────────────────────────────────────────────────────────────────
# The GitLab-side replacement for GitHub's `CodeQL` required check (Mesh
# #48f243e4). Modeled on entire-vc/evc-argus, which ported this same class of
# control the same way (`#10fea634`).
#
# ## Why this is a re-implementation and not a port
#
# There is no `.github/workflows/codeql.yml` in this repository to translate.
# CodeQL here is GitHub's *default setup* — a repository setting, not code:
#
#     code-scanning/default-setup → {"state":"configured",
#       "languages":["actions","go","javascript","javascript-typescript",
#                    "python","typescript"],
#       "query_suite":"default","schedule":"weekly"}
#
# (readable only under `robert-j-evc`; an agent token gets 403 there, which is
# indistinguishable from "not configured" unless you re-check under an account
# that can actually see it.) So nothing could be copied line-for-line. The
# `// codeql[...]` suppression comments that exist in the Go sources belong to
# that scanner and mean nothing to semgrep; semgrep's own suppressions are
# `nosemgrep:` comments, each carrying a written reason.
#
# ## What this does NOT reproduce
#
# CodeQL's cross-function dataflow/taint analysis. semgrep here is pattern-level
# SAST: it matches shapes in a file, it does not follow a tainted value across
# call boundaries. Treat the two as the same *class* of control, not as
# equivalent engines — writing "CodeQL is covered" without this paragraph would
# overstate what was carried across.
#
# ## `semgrep ci`, and why NOT `semgrep scan --config ...`
#
# They are not interchangeable inside this image, and picking the wrong one
# produces a job that fails without ever having scanned anything. Measured on
# this runner (pipeline 438, job 3982), `semgrep scan --config ...` gives:
#
#     Detected Docker environment without a code volume, please include
#     '-v "${PWD}:/src"'
#     ERROR: Job failed: exit code 2
#
# `semgrep scan` calls adjust_for_docker(), which insists the code live at
# /src; GitLab's docker executor clones into $CI_PROJECT_DIR and leaves /src
# empty, so it raises before the first rule runs. The danger is not the crash —
# it is that the job goes red and *looks like a gate that caught something*.
# Exit 2 with an empty scan is indistinguishable from exit 1 with a real
# finding if you only read the job's status dot (§0x).
#
# `semgrep ci` does not take that path.
#
# ## What a green here does and does not mean — read this before trusting it
#
# `semgrep ci` scopes itself differently depending on the pipeline, and the
# difference decides what the green tick is evidence of. Measured on evc-argus,
# same image, same runner:
#
#   main-branch run (job 2201)  → Scanning 393 files tracked by git
#                                 = the whole tracked tree
#   MR-pipeline run (job 2152)  → Scanning 1 file tracked by git
#                                 "Scan was limited to files changed since
#                                  baseline commit."
#
# So on a merge request this gate asks "does this MR ADD anything insecure?",
# NOT "is the repository clean?". That is the right question for a merge gate —
# it means a newly-shipped registry rule firing on years-old code cannot wall
# off every open MR — but it does mean an MR's green tick is not a statement
# about the tree. The whole-tree statement comes from the `main` run, which is
# why the rules below deliberately keep `main` in scope rather than running on
# merge requests alone.
#
# The full-tree baseline at the time this job was added was measured off-CI,
# for the same reason: 0 findings on 1194 files (and 38 under --disable-nosem).
# An MR pipeline could not have told us that.
#
# ## Rule sets
#
# `p/security-audit p/secrets p/owasp-top-ten` are argus's three, unchanged.
# The fourth is argus's `p/python` swapped for `p/golang`, this being a Go
# service. Python and TypeScript here (scripts/memory-bench, web/) are not left
# unscanned: security-audit and owasp-top-ten are multi-language and do cover
# them — measured, not assumed, in the baseline below.
#
# ## The baseline this job was allowed to become a gate on
#
# A gate is worth nothing if it is switched on red and then made to
# `allow_failure` (§0x). Measured on canon `main` @36ab94e, same four rule sets,
# before this job was written:
#
#     Ran 428 rules on 1194 files: 0 findings.        exit 0
#
# and, with suppressions switched off, to prove those suppressions are live
# rather than annotations that stopped matching some time ago:
#
#     --disable-nosem → 38 findings                   exit 1
#
# 0 with them, 38 without: every `nosemgrep:` in this tree is currently doing
# work. The triage that got the baseline to 0 is `.semgrepignore` in the repo
# root — read its comments before editing it, especially the part about a
# repo-level ignore file REPLACING semgrep's built-in defaults instead of
# adding to them.
#
# `.github/` IS scanned, as of #5fe7fb4b. This comment used to say its 90
# findings "belong to the showcase mirror, not to this pipeline"; that was the
# exclusion's rationale, and it stopped being true when the exclusion was
# lifted. All 90 are gone — 75 mutable action tags pinned to commit SHAs, 12
# `${{ }}` interpolations moved out of `run:` bodies, and 3
# `dependabot-missing-cooldown` retired with the file itself (#5f017e34). The
# mirror's workflows do still execute, with a real GITHUB_TOKEN in scope, so
# "belongs to the mirror" was never the same thing as "is not our perimeter".
#
# ## Known hazard: the rule registry moves under you
#
# `p/...` packs are fetched from the semgrep registry at run time and are not
# version-pinned — there is no pinned form of them to use. New rules ship
# continuously, so this job can go red on a commit that changed nothing
# relevant. Measured live during this card's own triage: 15 findings appeared
# between two scans of the same tree hours apart. When that happens the answer
# is to triage the new finding — fix it, or `nosemgrep:` it with a written
# reason, the way every existing suppression here is written — NOT to set
# `allow_failure: true`, which converts the gate back into a lamp nobody reads.
semgrep:
  stage: sast
  image: semgrep/semgrep
  timeout: 10m
  allow_failure: false   # explicit: a red scan must block the merge, not decorate it
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    SEMGREP_RULES: "p/security-audit p/secrets p/owasp-top-ten p/golang"
  script:
    - semgrep ci

# ── lint ────────────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: golang:1.25-alpine
  timeout: 15m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION
  script:
    - $GOPATH/bin/golangci-lint run ./...

# ── test ────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: golang:1.25-alpine
  timeout: 30m
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: nats:2-alpine
      alias: nats
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    # build-base is not optional: `go test -race` needs cgo, and alpine has no
    # C toolchain by default. Without it the race detector fails to link and
    # the failure looks like a broken test rather than a missing package.
    #
    # poppler-utils (pdftotext) is the PDF export tests' own acceptance check
    # — it extracts text back out of a rendered PDF to prove the embedded
    # Cyrillic font actually produces real, selectable glyphs rather than a
    # rasterized or boxed-off image (Export 4/7, #25ac04d2). It is a CI/test
    # tool only: the PDF renderer itself ships zero external binaries to
    # prod, which is the whole point of embedding the font in the Go binary.
    #
    # python-docx is the same role for the DOCX export tests (Export 5/7,
    # #91ce6291): an independent, non-project-controlled parser proving the
    # hand-written OOXML actually opens as a real .docx, not just bytes our
    # own writer and a hand-rolled unzip agree on. Also CI/test only — the
    # DOCX renderer itself ships zero external binaries to prod either, same
    # as PDF.
    - apk add --no-cache git build-base postgresql-client poppler-utils python3 py3-pip
    - pip install --break-system-packages --no-cache-dir python-docx
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
  script:
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
    # go-test-stall-watchdog wraps `go test` so a wedge (Mesh #405872aa: 28min of
    # silence, the runner's only slot held, the whole fleet's queue stalled) fails
    # fast with a goroutine dump naming what's blocked, instead of running out the
    # job timeout with nothing to diagnose.
    - sh scripts/ci/go-test-stall-watchdog.sh ./... -race -coverprofile=coverage.out -covermode=atomic
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 1 week

# ── repo-integration ────────────────────────────────────────────────────────
# Ported from .github/workflows/ci.yml:repo-integration ("Repo tests
# (integration)"). internal/repository/postgres/*_db_test.go and
# integration_test.go (`//go:build integration`, ~30 files) are invisible to
# the `test` job above: it runs `go test ./...` with NO build tag, so every
# integration-tagged file is excluded from compilation entirely. Net effect
# without this job: the class of bug this guards — a field present in an
# UPDATE but missing from the matching INSERT — never ran in CI (the
# reviewer_id incident, #564).
#
# Despite carrying the same `integration` tag as the Tenancy & RBAC gate job,
# this one does NOT need NATS/MinIO: the GitHub source job's own `services:`
# block declares only postgres, and grepping every integration-tagged file
# under internal/repository/postgres/ for nats/minio/jetstream imports finds
# none — confirmed by reading the source, not by pattern-matching the task
# description that (incorrectly) generalised from the Tenancy & RBAC gate
# job's needs. Manual NATS+JetStream/MinIO containers belong to that other
# job, not this one.
repo-integration:
  stage: test
  image: golang:1.25-alpine
  timeout: 20m
  needs: [lint]
  services:
    - name: postgres:16
      alias: postgres
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    # TEST_DATABASE_URL is what integration_test.go's testDB() actually reads;
    # DATABASE_URL (already set globally) covers the *_db_test.go files that
    # carry no build tag and connect the same way the `test` job's non-race
    # DB tests do — setting it here too means this job doesn't accidentally
    # skip them.
    TEST_DATABASE_URL: "postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable"
  before_script:
    - apk add --no-cache git build-base postgresql-client
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
  script:
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
    - go test ./internal/repository/postgres/... -v -race -tags=integration

# ── tenancy-rbac-gate ──────────────────────────────────────────────────────
# Ports `.github/workflows/ci.yml`'s "Tenancy & RBAC gate" (#e64a383f /
# #3b12e7ce). Needs a live API server on top of Postgres, unlike
# repo-integration above — the tests under ./tests/integration/ drive the
# HTTP surface, not the repository layer directly — plus NATS WITH JetStream
# and MinIO, which a plain `services:` entry cannot give: the image's default
# CMD runs neither with JetStream nor as an object server (see the `test`
# job's own nats service above, which deliberately has no `command:` and is
# JetStream-less for exactly that reason). `probe-docker-nested`/
# `probe-services-command` (MR !806, pipelines #321/#322) settled which of
# the two candidate fixes this runner actually allows: `docker run` inside a
# job fails outright here (`NO DAEMON REACHABLE` — hel01's docker executor
# gives jobs no daemon socket), while a `services:` entry with an overridden
# `command:` works and is what both NATS and MinIO use below.
#
# Two independent guards, because a selection floor alone is not enough (see
# TENANCY_MIN_PASSED below):
tenancy-rbac-gate:
  stage: test
  image: golang:1.25-alpine
  timeout: 20m
  needs: [lint]
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: nats:2-alpine
      alias: nats
      command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    # Docker Hub's minio/minio repository started returning "pull access denied
    # ... repository does not exist" (measured 2026-09-13, reproduced with a
    # plain `docker pull minio/minio:latest` outside CI too — not a runner-side
    # flake). quay.io/minio/minio is MinIO's own other published mirror of the
    # same image; verified it serves an identical /minio/health/live 200 before
    # this change went in.
    - name: quay.io/minio/minio
      alias: minio
      command: ["server", "/data"]
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    # Single source of truth for what this gate covers — both the guard step
    # and the run step read it, so they cannot disagree about the selection.
    TENANCY_RUN_RE: "^(TestCrossTenant|TestCrossWorkspace|TestRBACLite|TestSecretsRBAC|TestSecretsPlaintext|TestWorkspaceListing|TestAgentTaskFeedIsWorkspaceScoped)"
    # Measured on the tree that introduced this job (locally, against the
    # exact services/versions below, before ever pushing — the shared runner
    # queue on this project currently runs 30-90+ minutes per pipeline,
    # #22f4efcc, so both guards were red/green-proven off-CI first): 50 tests
    # match. Raise this number when tenancy tests are added; lowering it is a
    # deliberate act that must be explained.
    TENANCY_MIN_TESTS: "50"
    # ...and 46 of those 50 actually EXECUTE. Selection is not execution: 4
    # selected tests skip today — TestRBACLite_{Owner,Member,Agent}* are
    # unconditional `t.Skip("TODO: implement RBAC lite first")` placeholders,
    # and TestCrossTenant_SparkInstallRequiresMembership is env-gated on
    # TEST_SPARK_ENABLED (unset here — the Spark catalog is not part of this
    # gate's own service list). A selection floor alone would accept a tree
    # where every real assertion had been replaced by t.Skip: the count
    # holds, the job is green, and the gate guards nothing. So the run step
    # below asserts on tests that PASSED, the number with teeth. The
    # RBACLite placeholders stay in the pattern deliberately — implement
    # RBAC lite and they come under the gate for free, and this floor moves
    # to 49.
    TENANCY_MIN_PASSED: "46"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: mesh
    DB_PASSWORD: mesh
    DB_NAME: mesh
    DB_SSL_MODE: disable
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    NATS_URL: "nats://nats:4222"
    # Alias, not localhost — and here it is not cosmetic. On startup the API asks
    # JetStream for a 10 GiB stream; this runner's NATS has far less, and the
    # recovery path is to read the host's real limit from
    # {NATS_MONITOR_URL}/jsz?config=1 and retry with it. Left at its default
    # (http://localhost:8223) that query dials the job container itself, is
    # refused, and the API disables the event bus for the whole process:
    # "event publishing (WS broadcast, cross-agent notifications, event
    # history) is disabled". Every WebSocket assertion then fails with no NATS
    # error anywhere near it, because the publish never happens. Measured on
    # pipelines 391/394/404/405 (red) vs 416 (green).
    #
    # Deliberately NOT in the global `variables:` block: the `test` job runs
    # unit tests, and config's own defaults test asserts this var is UNSET.
    # A global value there is environment leaking into an assertion about
    # defaults — pipeline 416 failed exactly that way.
    NATS_MONITOR_URL: "http://nats:8222"   # --http_port 8222 in the nats service
    S3_ENDPOINT: "minio:9000"
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
    S3_BUCKET: mesh-artifacts
    S3_REGION: us-east-1
    S3_USE_SSL: "false"
    JWT_SECRET: "ci-test-secret-32chars-minimum!!"
    JWT_ISSUER: "mesh-ci"
    MESH_RATE_LIMIT_ENABLED: "false"
    # Same fixed, published, CI-only key the other jobs use — it protects a
    # throwaway Postgres that dies with the runner. REQUIRED=1 so a key
    # mistake fails loudly instead of silently downgrading to plaintext.
    MESH_INTEGRATION_ENCRYPTION_KEY: "ZXZjLW1lc2gtY2ktaW50ZWdyYXRpb24tdGVzdC1rMzI="
    MESH_INTEGRATION_ENCRYPTION_REQUIRED: "1"
    APP_ENV: test
  before_script:
    - apk add --no-cache git build-base curl postgresql-client
  script:
    # Guard 1 — the selection is not empty. A `-run` regex that matches
    # nothing exits 0 with "testing: warning: no tests to run" and paints the
    # job green; that failure is invisible in exactly the way this whole job
    # exists to prevent. `-list` compiles the package but starts nothing, so
    # this needs no database and runs before any service wait below.
    - |
      go test ./tests/integration/ -tags=integration -list "$TENANCY_RUN_RE" \
        | grep -E '^Test' | sort > /tmp/selected.txt
      n=$(wc -l < /tmp/selected.txt | tr -d ' ')
      echo "selected $n test(s), floor is $TENANCY_MIN_TESTS"
      cat /tmp/selected.txt
      if [ "$n" -lt "$TENANCY_MIN_TESTS" ]; then
        echo "Tenancy gate selects $n tests, below the floor of $TENANCY_MIN_TESTS."
        echo "Either tests were removed/renamed out of the pattern, or TENANCY_RUN_RE no longer matches. Refusing to run a gate that guards less than it claims."
        exit 1
      fi
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - for i in $(seq 30); do curl -sf http://nats:8222/healthz && break; sleep 1; done
    - curl -sf http://nats:8222/healthz
    - for i in $(seq 30); do curl -sf http://minio:9000/minio/health/live && break; sleep 1; done
    - curl -sf http://minio:9000/minio/health/live
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="postgres://mesh:mesh@postgres:5432/mesh?sslmode=disable" $GOPATH/bin/goose -dir migrations up
    - go build -o /tmp/mesh-api ./cmd/api
    - /tmp/mesh-api &
    # The GitHub original waited on GET /healthz, a path this codebase has
    # never had (only /api/v1/healthz/version) — its own for-loop then fell
    # through to "API server ready" unconditionally on timeout, which is the
    # exact §0x class this job exists to police, just one layer up. Fixed
    # here to the real endpoint and a loop that actually fails when the
    # server never comes up, instead of an unverified "ready" echo.
    - |
      ok=0
      for i in $(seq 15); do
        if curl -sf http://localhost:8005/api/v1/healthz/version >/dev/null; then ok=1; break; fi
        sleep 1
      done
      if [ "$ok" -ne 1 ]; then
        echo "API server did not become healthy on :8005"
        exit 1
      fi
      echo "API server ready"
    # pipefail, or `tee` returns 0 and a failing suite reads as a pass.
    - |
      set -o pipefail
      TEST_API_URL="http://localhost:8005" \
      TEST_DB_DSN="host=postgres port=5432 user=mesh password=mesh dbname=mesh sslmode=disable" \
      go test ./tests/integration/ -v -tags=integration -timeout=300s -run "$TENANCY_RUN_RE" 2>&1 | tee /tmp/tenancy.log
    # Guard 2 — selection is not execution (see TENANCY_MIN_PASSED above).
    # `--- PASS:` at column 0 is a top-level test; subtests are indented and
    # excluded so a parent isn't double-counted with its children.
    - |
      passed=$(grep -cE '^--- PASS: ' /tmp/tenancy.log || true)
      skipped=$(grep -cE '^--- SKIP: ' /tmp/tenancy.log || true)
      echo "executed: $passed passed, $skipped skipped (floor is $TENANCY_MIN_PASSED passed)"
      grep -E '^--- SKIP: ' /tmp/tenancy.log || true
      if [ "$passed" -lt "$TENANCY_MIN_PASSED" ]; then
        echo "Tenancy gate: $passed tests passed, below the floor of $TENANCY_MIN_PASSED."
        echo "go test exited 0, so nothing FAILED — tests were skipped or removed instead. A gate that guards fewer assertions than it claims is not a gate."
        exit 1
      fi

# ── coverage gate ───────────────────────────────────────────────────────────
# Ported from `.github/workflows/ci.yml:coverage-gate` ("Go coverage ≥80%
# (affected-set)"). Gates on the coverage of the lines THIS diff touches, not
# the aggregate of the affected set (see the comment inside diff_coverage.py
# for why — pre-existing debt in packages the author never opened must not
# hold an unrelated PR hostage). The affected-set / diff-coverage / self-check
# scripts are shared byte-for-byte with GitHub — only the base-SHA source and
# the service hostnames differ here.
#
# `needs: [lint]` intentionally skips waiting on the `gate` stage explicitly:
# `lint` itself only starts once `hold-gate` (stage: gate) has completed, so
# the ordering is preserved through stage sequencing, not duplicated here.
#
# Restricted to merge_request pipelines: $CI_MERGE_REQUEST_DIFF_BASE_SHA,
# which this gate diffs against, only exists in that context — same reason
# `hold-gate` above carries the same rule.
coverage-gate:
  stage: test
  image: golang:1.25-alpine
  timeout: 30m
  needs: [lint]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    # Full history: the affected-set script and diff_coverage.py both diff
    # against $CI_MERGE_REQUEST_DIFF_BASE_SHA, which a shallow clone may not
    # contain (GitLab's default GIT_DEPTH is a truncated clone).
    GIT_DEPTH: "0"
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: nats:2-alpine
      alias: nats
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  before_script:
    - apk add --no-cache git build-base bash python3 postgresql-client
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
  script:
    - |
      set -eu
      BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      # An empty BASE would make `git diff` compare against the working tree
      # and silently report nothing changed — fail loudly instead.
      if [ -z "$BASE" ]; then
        echo "REFUSING: CI_MERGE_REQUEST_DIFF_BASE_SHA is empty — cannot diff"
        exit 1
      fi
      echo "Diff base: $BASE"
      AFFECTED=$(bash docs/ci-templates/scripts/affected_set_go.sh "$BASE" 2>/dev/null || true)
      echo "Affected packages: $AFFECTED"

      if [ -z "$AFFECTED" ]; then
        echo "No Go files in this diff — coverage gate skipped."
        exit 0
      fi

      FAILED=0
      # `<<<` is a bashism; the docker executor runs this script with `sh`
      # (bash isn't on PATH yet when the runner picks a shell — before_script,
      # which installs it, hasn't run). Feed the loop from a file instead of a
      # here-string/pipe: a file redirect keeps the loop in the current shell
      # under POSIX sh too, so $FAILED set inside it is still visible after.
      printf '%s\n' "$AFFECTED" > /tmp/affected_packages.txt
      while IFS= read -r pkg; do
        [ -z "$pkg" ] && continue
        # Skip main packages. A composition root is wiring that unit tests
        # never execute — it is covered by the Test job instead. Measuring it
        # here makes the gate unpassable for any change to cmd/*.
        if [ "$(go list -f '{{.Name}}' "$pkg" 2>/dev/null)" = "main" ]; then
          echo "skip (main package, not unit-testable): $pkg"
          continue
        fi
        go test -race -covermode=atomic \
          -coverprofile="/tmp/cover_$(echo "$pkg" | tr '/' '_').out" \
          "$pkg" 2>&1 || { FAILED=1; echo "FAIL: $pkg"; }
      done < /tmp/affected_packages.txt

      if ls /tmp/cover_*.out 1>/dev/null 2>&1; then
        # Keep exactly one "mode:" line — a plain `cat` of N profiles emits N
        # of them, which makes `go tool cover` bail out and the total
        # unparseable (see the incident this exact bug caused: PR #381/#382).
        echo "mode: atomic" > /tmp/merged_cover.out
        grep -h -v '^mode:' /tmp/cover_*.out >> /tmp/merged_cover.out

        go tool cover -func=/tmp/merged_cover.out | tee /tmp/cover_summary.txt
        cp /tmp/cover_summary.txt "$CI_PROJECT_DIR/coverage-affected-summary.txt" || true
        TOTAL=$(grep '^total:' /tmp/cover_summary.txt | awk '{print $NF}' | tr -d '%')
        echo "Affected-set total coverage (context, not gated): ${TOTAL}%"

        if [ "$FAILED" -ne 0 ]; then
          echo "One or more affected packages failed to test"
          exit 1
        fi
      else
        echo "No coverage profiles produced (affected set was main-only or test-free) — nothing to gate."
        exit 0
      fi

      # The threshold is applied to the lines THIS change touches, not the
      # affected-set aggregate — see diff_coverage.py's module docstring.
      set +e
      python3 scripts/ci/diff_coverage.py \
        --profile /tmp/merged_cover.out --base "$BASE" --threshold 80
      rc=$?
      set -e
      # 2 = could not measure. That is an infrastructure fault, not a verdict
      # on the author's change, and must not read as "you made it worse" —
      # so it does NOT skip the self-check below.
      if [ "$rc" -eq 2 ]; then
        echo "WARNING: Diff coverage INCONCLUSIVE — gate not applied"
      elif [ "$rc" -ne 0 ]; then
        exit "$rc"
      fi

      python3 scripts/ci/test_diff_coverage.py
  artifacts:
    when: always
    paths: [coverage-affected-summary.txt]
    expire_in: 1 week

# ── test:web ─────────────────────────────────────────────────────────────────
# Until this job existed, NOTHING ran the 94 files / 851 tests under
# web/src/**/__tests__/**. `make ci` only ever ran `go test` (Makefile's
# `test:`/`ci-test:` targets); this pipeline's own `build:web` job runs
# `pnpm typecheck` + `pnpm build`, neither of which executes a single
# `it()`/`describe()` block. A pipeline could — and on 2026-09-07 did, MR
# !896 — go fully green on a diff that touched only web/src/** while
# executing zero of the tests that diff should have exercised (Mesh
# `#83c53770`). Green with no assertion run is not a passing check, it's an
# absent one (§0x) — this job is what makes "frontend CI is green" mean the
# same thing "backend CI is green" already means: assertions ran and held.
#
# Unconditional, same as `build:web` right below (no `changes:` filter) — a
# gate that only runs on a guessed-relevant diff pattern is one commit away
# from silently not running on the change that needed it.
test:web:
  stage: test
  image: node:22-alpine
  timeout: 20m
  before_script:
    - apk add --no-cache bash git
    - corepack enable
    - cd web && pnpm install --frozen-lockfile
  script:
    - pnpm test

# ── build ───────────────────────────────────────────────────────────────────
# ── authed-e2e ──────────────────────────────────────────────────────────────
# Ported from .github/workflows/ci.yml:playwright-e2e ("Authed E2E"). Despite
# its name and the task description's assumption, this job stands up NO
# infrastructure at all — no API/frontend/DB/NATS/MinIO. web/playwright.config.ts
# points baseURL at the LIVE prod app (configured via the $MESH_PROD_APP_BASE_URL
# project CI/CD variable below) and
# web/e2e/auth-helper.ts logs in once through the real, deployed
# /api/v1/auth/login as a dedicated CI-only account (member of exactly one
# scratch workspace, e2e-ci-sandbox, and of no real workspace). There is no
# Casdoor/OIDC step to reach — this app authenticates natively
# (web/src/stores/auth.ts) — so the runner-reachability risk the task
# description flagged does not apply.
#
# Image pinned to the SAME playwright-core version as web/pnpm-lock.yaml, for
# the reason the GitHub job's own comment records: mismatched, Playwright
# deletes the image's baked-in browsers and re-downloads from
# cdn.playwright.dev on every run — which geo-blocked the GitHub runner once
# and evicted a green PR from the merge queue (2026-08-19). PLAYWRIGHT_DOWNLOAD_HOST
# black-holes any such download so drift fails in milliseconds instead of
# quietly reaching the CDN.
#
# E2E_USER_EMAIL / E2E_USER_PASSWORD exist as masked+protected GitLab CI/CD
# variables on this project (set 2026-09-07, task #d5619f11 — reading/writing
# them needed Maintainer(40); every agent account is Developer(30), same gap
# as `only_allow_merge_if_pipeline_succeeds`, §1q — cleared via the
# `gl-admin`/`gitlab-rails` root channel on VM 113, not by hand-editing this
# repo's settings). The job is wired live and green in prod (pipeline 2184,
# job `authed-e2e`, 8/8 passed against the live prod app) — no `hold`,
# no open Pavel ask. global-setup.ts still fails loudly, not silently-skips,
# if the variables ever go missing again (the #40ea4053 incident this job
# exists to prevent was exactly a green check over a silently skipped suite).
authed-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-jammy
  timeout: 20m
  needs: [lint]
  variables:
    APP_BASE_URL: "$MESH_PROD_APP_BASE_URL"
    # Same download black-hole as the GitHub job — see header above.
    PLAYWRIGHT_DOWNLOAD_HOST: "http://127.0.0.1:9"
  before_script:
    - corepack enable
    - cd web && pnpm install --frozen-lockfile
  script:
    - |
      if ! npx playwright install chromium; then
        echo "Playwright tried to download a browser: the image and web/pnpm-lock.yaml have drifted."
        echo "Fix: pin this job's image to mcr.microsoft.com/playwright:v<version>-jammy, where"
        echo "<version> is playwright-core's version in web/pnpm-lock.yaml. Do not delete this"
        echo "step to make it green — it is what keeps cdn.playwright.dev out of the merge path."
        exit 1
      fi
    - npx playwright test
  artifacts:
    when: always
    paths: [web/playwright-report/]
    expire_in: 1 week

build:api:
  stage: build
  image: golang:1.25-alpine
  timeout: 15m
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base
  script:
    - go build -o /dev/null ./cmd/api

build:web:
  stage: build
  image: node:22-alpine
  timeout: 20m
  before_script:
    # bash, because both negative-control scripts below are #!/usr/bin/env bash
    # and alpine ships ash only.
    - apk add --no-cache bash git
    - corepack enable
  script:
    # Dependencies FIRST. Both asserts below shell out to `pnpm typecheck`,
    # so without node_modules they die on `tsc: not found` — and the script
    # then correctly refuses to draw any conclusion ("proves nothing about
    # whether the check discriminates"). Measured on pipeline 101: the
    # negative control worked, the job order did not.
    - cd web && pnpm install --frozen-lockfile && cd ..
    # The asserts run BEFORE the real typecheck on purpose: they are the
    # negative controls proving `tsc` actually looks at the files it claims
    # to cover. A typecheck that covers nothing passes everything.
    - bash scripts/assert-typecheck-is-not-vacuous.sh
    - bash scripts/assert-typecheck-covers-e2e.sh
    - cd web
    - pnpm typecheck
    - pnpm build
  # Только скомпилированный CSS, не весь `dist` (1,7 МБ против 92 КБ): оба
  # визуальных гейта ниже читают ровно `web/dist/assets/*.css` и ничего больше
  # (`findBuiltCss()` в обоих скриптах). Артефакт поменьше — меньше нагрузки на
  # тот самый кэш MinIO раннера, чьё переполнение уже роняло этот пайплайн.
  artifacts:
    paths:
      - web/dist/assets/*.css
    expire_in: 1 day

# ── визуальные гейты свёрнутого рейла ───────────────────────────────────────
# Оба скрипта существуют с момента своих инцидентов (`#bb8f1092` — буква в
# плитке проекта нечитаема; `#13ff4803` — глиф марки нарисован 18,55×18,55 при
# 16×16 у десяти соседей) и до сих пор запускались ТОЛЬКО руками. Гейт, который
# надо помнить, — это не гейт, а записка: размерная асимметрия пережила три
# подряд правки того же рейла, потому что каждая правка мерила координаты,
# находила их безупречными и была права. Вопрос «а какого он размера» никто не
# задавал, потому что задавать его было некому.
#
# Почему не в стадию `test`: обоим нужен СКОМПИЛИРОВАННЫЙ CSS, то есть выход
# `build:web`. Гейт судит по тем цветам и размерам, которые браузер реально
# вычисляет над реальной таблицей стилей, а не по классам в исходнике —
# именно поэтому он ловит то, что не ловит ни typecheck, ни юнит-тест
# (tailwind-merge, молча вытесняющий более раннее правило более поздним).
#
# `--selftest` обязателен, а не украшение: он дополнительно прогоняет через тот
# же путь ЗАВЕДОМО СЛОМАННЫЙ до-фиксовый рецепт и требует, чтобы тот вышел
# КРАСНЫМ. Проверка, которая не умеет падать, — не проверка; здесь этот
# негативный контроль прибит к каждому прогону, а не остался скриншотом в
# комментарии.
# ── migration-reversibility-gate ──────────────────────────────────────────
# Closes the gap `migration-gate`'s own header (above) names but deliberately
# does not close: four jobs in this file (test, repo-integration,
# tenancy-rbac-gate, coverage-gate) run `goose ... up` against a real
# Postgres, so "migrations apply" is well covered. None of them ever run
# `down-to 0`. The retired GitHub job (`.github/workflows/migration-check.yml`)
# did the full `up → down-to 0 → up` cycle, and that meaning did not survive
# the move to GitLab — moving CI does not move a control by itself, the same
# lesson `check-migration-version.sh` taught (it was also correct and also
# uncalled from 2026-08-23 until `migration-gate` above wired it back in).
#
# A `-- +goose Down` section is written for every migration and verified by
# NOTHING today: it can fail to compile, reference an object a later
# migration dropped, or silently no-op. That is discovered mid-incident, the
# moment §1b's rollback path ("revert the image, then the migration") is
# actually invoked — the worst time to learn a Down is broken.
#
# Full `down-to 0` chosen over "only migrations new in this branch" — a
# deliberate cost decision, not the default. Measured locally against a
# throwaway postgres:16 container on the unmodified tree (130 migrations,
# 600K on disk): up 2.87s, down-to 0 1.40s, re-up 2.37s — 6.64s of goose
# runtime for the whole history. That is small next to the apk-install +
# `go install goose` overhead every migration-running job in this file
# already pays once per run (the same fixed cost this job also pays), so
# checking the FULL history costs barely more than checking only the MR's
# diff would — and it is strictly more coverage: it also catches an old
# migration whose Down rotted after a later migration removed something it
# depended on, not just migrations new in this MR.
migration-reversibility-gate:
  stage: test
  image: golang:1.25-alpine
  timeout: 10m
  services:
    - name: postgres:16
      alias: postgres
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gocache/, .gomodcache/]
    policy: pull
  variables:
    GOCACHE: $CI_PROJECT_DIR/.gocache
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
  before_script:
    - apk add --no-cache git build-base postgresql-client
    - for i in $(seq 60); do pg_isready -h postgres -U mesh && break; sleep 1; done
    - pg_isready -h postgres -U mesh
    - go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
  script:
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations down-to 0
    - GOOSE_DRIVER=postgres GOOSE_DBSTRING="$DATABASE_URL" $GOPATH/bin/goose -dir migrations up

rail-visual-gates:
  stage: build
  # Тот же образ и та же версия, что у `authed-e2e`: браузер уже внутри, и
  # версия обязана совпадать с `playwright-core` в `web/pnpm-lock.yaml`.
  image: mcr.microsoft.com/playwright:v1.62.1-jammy
  timeout: 15m
  needs: ["build:web"]
  variables:
    # Любая попытка что-то скачать обязана упасть сразу, а не тихо утянуть
    # браузер из интернета в середине мёрж-пути.
    PLAYWRIGHT_DOWNLOAD_HOST: http://127.0.0.1:9
  before_script:
    # Версия node печатается намеренно: оба гейта импортируют `.ts` напрямую
    # (`web/src/lib/cn.ts`, `rail-icon-classes.ts`) — они читают рецепт из
    # модуля компонента, а не пересказывают его, иначе гейт проверял бы копию.
    # Такой импорт работает только на node со снятием типов, поэтому версия
    # должна быть видна в логе, а не выясняться по симптомам.
    - node -v
    - corepack enable
    - cd web && pnpm install --frozen-lockfile && cd ..
  script:
    - |
      if ! (cd web && npx playwright install chromium); then
        echo "Playwright полез скачивать браузер: образ и web/pnpm-lock.yaml разъехались."
        echo "Чинить пином образа на mcr.microsoft.com/playwright:v<версия>-jammy, где"
        echo "<версия> — playwright-core из web/pnpm-lock.yaml. Не удалять этот шаг ради"
        echo "зелёного: он и держит cdn.playwright.dev вне мёрж-пути."
        exit 1
      fi
    - node scripts/assert-rail-icon-contrast.mjs --selftest
    - node scripts/assert-rail-icon-size.mjs --selftest
    - node scripts/assert-rail-header-geometry.mjs --selftest

# ── deploy ──────────────────────────────────────────────────────────────────
# Выкатка прод-бэкенда по мёржу в канон. До 28.08.2026 её запускал человек
# кнопкой `build:mesh-backend` в entire-vc/deploy, и это было главной причиной
# отставания прода: замер за 110 ч дал 79% времени позади канона, крупнейший
# эпизод 57.6 ч — при нуле упавших джоб и нуле отказов после разбора. Кнопка
# стоит НИЖЕ мёржа по течению: отказ нажать не отменяет мёрж, а лишь
# откладывает выкатку, поэтому предотвратить она ничего не могла by
# construction. Место человеческого суждения о совместимости миграции — ревью
# MR, до точки невозврата, а не кнопка после неё.
#
# ⚠️ ГЕЙТ ЖИВЁТ В ЭТОМ ЖЕ ПАЙПЛАЙНЕ, а не «ждёт соседний».
# Конструкция «дождаться завершения другого пайплайна» молча наследует ЕГО
# условия запуска: стоит изменить файл, не попадающий в его фильтры, и ждать
# станет нечего — деплой не поедет вовсе, без единой ошибки. Здесь тесты и
# триггер — один пайплайн, поэтому гейт физически не может разъехаться с тем,
# что реально прогнали.
#
# Область гейта = то, что эта выкатка РЕАЛЬНО везёт (бинарь cmd/api +
# migrations), а не весь CI:
#   входят   lint, test, repo-integration, tenancy-rbac-gate, build:api
#   не входят:
#     build:web  — фронтенд едет своей джобой (build:mesh-frontend); связать
#                  их значило бы дать упавшему тесту вёрстки блокировать
#                  выкатку бэкенда;
#     semgrep    — на main сканирует всё дерево, и находка в web/ встала бы
#                  вечным стопом для бэкенда. Он остаётся собственным сигналом;
#     self-host-env — про compose-инстансы самохостеров, наш прод это
#                  бинарь + systemd.
trigger:prod-backend:
  stage: deploy
  # Только пуш в канон. На MR-пайплайнах не запускается: там деплоить нечего,
  # а `$CI_COMMIT_BRANCH` в них вообще не тот.
  #
  # ⚠️ Каждый пуш в main порождает ДВЕ downstream-пайплайна в entire-vc/deploy
  # — эта джоба и `trigger:prod-frontend` ниже стартуют СВОЙ пайплайн каждая,
  # независимо (замечено 11.09, #c4fc7c24: пайплайны 3080/3081, разница 6с).
  # Это НЕ дубль конфига и не два разных триггерящих события — обе джобы
  # смотрят ровно на `push`. Это BY DESIGN: `needs` здесь и у frontend-триггера
  # ниже намеренно РАЗНЫЕ (backend/frontend-гейты), чтобы красный `build:web`
  # не держал бэкенд-выкатку и наоборот (см. правило в шапке frontend-джобы).
  # Слияние в одну bridge-джобу с объединённым `needs` убрало бы дубль
  # пайплайна ценой этой развязки — сознательно НЕ сделано (#c4fc7c24).
  # Единственный реальный пробел, который это создавало, — отсутствие кулдаун-
  # гарда на `deploy:mesh-frontend` (у backend он уже был); закрыто в
  # entire-vc/deploy MR !43.
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  needs: ["lint", "test", "repo-integration", "tenancy-rbac-gate", "build:api"]
  # ⚠️ ЯВНО, вопреки `default: interruptible: true` выше. Прерываемая джоба
  # была бы отменена следующим пушем в main — вместе с ДОЧЕРНИМ пайплайном
  # (`strategy: depend`), то есть посреди выкатки: между `goose up` и подменой
  # бинаря. Ровно тот полудеплой, от которого защищается остальной пайплайн.
  interruptible: false
  variables:
    # Ключ, по которому deploy-проект отличает автозапуск от ручного нажатия.
    DEPLOY_MESH_BACKEND: "1"
  trigger:
    project: entire-vc/deploy
    branch: main
    # ⚠️ `strategy: depend` здесь НЕЛЬЗЯ, хотя по смыслу хотелось бы: пусть
    # упавшая выкатка красит пайплайн канона. Замерено 28.08 — не работает by
    # construction. Пайплайн в entire-vc/deploy ОБЩИЙ на все продукты, и его
    # агрегатный статус висит на ручных джобах чужих продуктов, которые никто
    # не обязан жать: из 30 последних пайплайнов 25 так и остались `manual`,
    # терминального статуса достигли два. `depend` ждёт именно терминального,
    # то есть ждал бы вечно — а по таймауту дал бы КРАСНЫЙ на канон-main при
    # успешно уехавшей выкатке. Ложный красный на каждом мёрже хуже, чем
    # отсутствие сигнала: он приучает не смотреть на цвет main.
    #
    # Чем закрыт отказ выкатки вместо этого:
    #   • `verify:mesh-backend` краснеет в самом deploy-пайплайне;
    #   • сторож дрейфа (launchd, 15 мин) сравнивает /api/version с каноном
    #     напрямую и заводит карточку владельцу — он не зависит ни от статуса
    #     пайплайна, ни от этого моста.

# Выкатка прод-фронтенда по мёржу в канон — зеркало trigger:prod-backend выше,
# заведённое позже (#55c074e2) и по этой причине заслуживающее объяснения, чем
# оно было ДО этой правки, а не только чем стало.
#
# ⚠️ Эта джоба и trigger:prod-backend выше запускают ДВА независимых
# downstream-пайплайна на каждый пуш — by design, не дубль; разбор и причина
# смотри в комментарии над trigger:prod-backend (#c4fc7c24).
#
# ⚠️ ДО ЭТОЙ ПРАВКИ АВТОЗАПУСКА У ФРОНТЕНДА НЕ БЫЛО ВООБЩЕ — не «тоже кнопка»,
# а ДВЕ отдельные ручные кнопки (`build:mesh-frontend` и `deploy:mesh-frontend`
# в entire-vc/deploy — `deploy:` не несёт своего `when:`, оно наследуется от
# `.deploy_base`, поэтому по тексту джобы выглядит как едущее следом само,
# а на деле ждёт второго отдельного нажатия). Решение #46d7375b (28.08)
# сняло обязательность нажатия только у backend; текст того решения читался
# как «доставка Mesh теперь автоматическая» целиком — неверно наполовину.
# Живое подтверждение: пайплайн 723 (31.08), коммит d1aa60c4 в web/ — backend
# доехал до прода сам, фронтенд остался собран из ae73e68a (27.08), четверо
# суток дрейфа поймал сторож.
#
# Область гейта = то, что эта выкатка РЕАЛЬНО везёт (bundle из web/dist), а не
# весь CI:
#   входит   build:web — единственная джоба, которая реально собирает и
#            тайпчекает то же дерево, что переносится на прод;
#   не входят lint, test, repo-integration, tenancy-rbac-gate, build:api —
#            это Go-код, к содержимому web/dist отношения не имеет;
#            упавший тест бэкенда не должен держать фронтенд, и наоборот
#            (та же симметрия, что у backend-гейта в обратную сторону);
#   semgrep, self-host-env — исключены по тем же причинам, что и у backend
#            выше (сканирует всё дерево / про compose-самохостеров).
#
# ⚠️ Без фильтра `paths:` — намеренно, а не забыто. Технически лишний прогон
# `build:mesh-frontend`/`deploy:mesh-frontend` на коммите вне web/ стоит
# минуту и ничего не меняет на проде (та же сборка ляжет тем же содержимым).
# А `paths:`/`paths-ignore:` на required-гейте уже стоил флоту забуксовавшего
# PR: у ЭТОГО ЖЕ репозитория `paths-ignore` на pull_request однажды скипал
# required-чек целиком на docs-only PR, и залипший чек с `enforce_admins=true`
# держал PR навсегда без единой ошибки (см. память
# `canon-enforce-admins-flip-8-repos`). backend-гейт выше тоже без `paths:`
# по той же логике: симметрия дешевле сэкономленной минуты раннера.
trigger:prod-frontend:
  stage: deploy
  # Только пуш в канон — то же условие, что у backend.
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  # `rail-visual-gates` здесь ОБЯЗАТЕЛЕН, хотя мёрж и так закрыт красным
  # пайплайном (`only_allow_merge_if_pipeline_succeeds=true`, замерено).
  # Без него выкатка фронтенда стартует по одному `build:web` — `needs`
  # отменяет ожидание стадии, — и уехала бы мимо ещё бегущего гейта.
  needs: ["build:web", "rail-visual-gates"]
  # ⚠️ ЯВНО, та же причина, что у backend: прерывание вместе с ДОЧЕРНИМ
  # пайплайном (`strategy: depend` здесь тоже НЕ используется, см. ниже)
  # посреди выкладки — `rsync --delete` в середине — хуже, чем подождать.
  interruptible: false
  variables:
    # Ключ, по которому deploy-проект отличает автозапуск от ручного нажатия.
    DEPLOY_MESH_FRONTEND: "1"
  trigger:
    project: entire-vc/deploy
    branch: main
    # ⚠️ Без `strategy: depend` — та же причина, измеренная для backend и не
    # переизмерявшаяся отдельно для фронтенда: пайплайн в entire-vc/deploy
    # ОБЩИЙ на все продукты, его агрегатный статус висит на чужих ручных
    # джобах, которые никто не обязан жать. `depend` дал бы таймаут и
    # ложный красный на канон-main при успешно уехавшей выкатке.
    #
    # Чем закрыт отказ выкатки вместо этого:
    #   • `verify:mesh-frontend` краснеет в самом deploy-пайплайне и сверяет
    #     CACHE_NAME живого sw.js с собранным — по содержимому, не по коду
    #     ответа;
    #   • сторож дрейфа (launchd, 15 мин) — для фронтенда это state-трекинг
    #     (у отданного бандла нет метки коммита): ждёт смены `index-<hash>.js`
    #     в пределах grace после нового коммита в web/** на канон-main.

# ── memory-gate ─────────────────────────────────────────────────────────────
# Ports `.github/workflows/memory-bench.yml`'s job `recall-gate-branch`
# (check name "Memory recall gate") — see the file header above for why this
# is safe without any GitLab CI/CD variable: the job builds `cmd/api` from
# THIS branch and measures an ephemeral server over an ephemeral database, no
# prod credential anywhere in it.
#
# Not ported, and why:
#   - the `update_baseline` re-snap path (`workflow_dispatch` only — an
#     operator action, not something a merge gate needs);
#   - the blindness-alert/escalate/resolve trio, which files GitHub issues —
#     dead code for this port even on GitHub, since all three are gated
#     `github.event_name != 'pull_request'` and this job only ever runs on
#     `merge_request_event`. A GitLab-issue equivalent is a real gap for the
#     PUSH/SCHEDULE arm this port does not carry either (see below), not for
#     this one.
#   - the prod canary (`recall-gate` / "Memory recall canary (prod)") and the
#     paid end-to-end arm (`memory-bench`) — both advisory, both need
#     `secrets.MESH_BENCH_KEY`/an LLM judge key, neither is what this card's
#     title names. Left for a future card if the fleet wants an equivalent of
#     the post-deploy prod canary on GitLab.
#
# TRANSLATION DECISIONS FROM THE GITHUB VERSION:
#   - image is `golang:1.25-bookworm` (glibc), not this file's usual
#     `-alpine` tags. `fastembed` pulls in `onnxruntime`, which ships NO musl
#     wheel at all (verified: `pip install fastembed` on `golang:1.25-alpine`
#     fails ResolutionImpossible, "no matching distributions" for
#     onnxruntime on ANY Python version) — this job cannot run on Alpine,
#     full stop, independent of the loopback point below.
#   - Postgres/Redis/NATS are NOT `services:` containers. `fixture_ages.py`
#     (used to backdate memory rows for the recency controls) hard-refuses
#     any DSN whose host is not `localhost`/`127.0.0.1`/`::1` — a deliberate
#     guard so this arm's backdating can never reach a real database even by
#     editing the YAML. A `services:` container is reachable by alias only on
#     the docker executor (see this file's own header comment), never by
#     loopback, so honouring that guard means self-hosting all three INSIDE
#     the job — installed via `apt`/`go install`, listening on 127.0.0.1,
#     gone when the job ends. Same reasoning `#e64a383f` names for the
#     separately-tracked "Self-host env" context, applied here because the
#     safety property forces it rather than because the context asked for it.
#     Side effect: Debian bookworm's `postgresql` package is 15, not 16 like
#     this file's other jobs — verified wire-compatible for this schema, but
#     named here rather than left implicit.
#   - `entire-vc/evc-mesh-mcp` (the recall CLIENT this arm measures against)
#     is checked out from its **public GitHub showcase mirror**
#     (`github.com/entire-vc/evc-mesh-mcp`, no auth), not from GitLab canon.
#     Canon is private, and granting this project's `CI_JOB_TOKEN` access to
#     it — or adding a deploy token as a masked CI/CD variable — needs
#     Maintainer(40); every fleet agent account is Developer(30) (verified
#     live: `GET /projects/23/job_token_scope` and
#     `GET /projects/21/variables` both 403 under this account). The mirror
#     lags canon by up to ~10 min (§0z point 9), so a client change merged
#     seconds ago can be invisible to the very next pipeline — an accepted,
#     named gap, not a silent one. Revisit if Maintainer rights are ever
#     delegated for this.
#   - Self-checks run through `bash <<'GATE_SCRIPT' … GATE_SCRIPT` rather than
#     as plain `script:` lines: several downstream steps capture a piped
#     command's exit code via `${PIPESTATUS[0]}`, which does not exist in
#     POSIX `sh`. Explicitly invoking bash makes that portable regardless of
#     the runner's default job shell.
#   - `EVENT_NAME` is hardcoded `pull_request` for `scope_relevant.sh` and
#     `prove_gate_can_go_red.py`'s rc=2 handling: the job's own `rules:`
#     below already restrict it to `merge_request_event`, so there is no
#     `merge_group` case here the way GitHub's `merge_group:` trigger has —
#     GitLab's merge trains reuse the MR pipeline rather than firing a
#     distinct event.
#   - stage placed AFTER `build` and BEFORE `deploy` in the `stages:` list at
#     the top of this file: this job has no `needs:` (it builds its own
#     ephemeral `cmd/api`, not the `build:api` artifact), so it only needs to
#     not race the deploy triggers — and it never runs on `push` anyway
#     (`rules:` below is MR-only), so its presence in that slot costs nothing
#     on a push-to-main pipeline.
recall-gate-branch:
  stage: memory-gate
  image: golang:1.25-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # Full history: `scope_relevant.sh` diffs base..head, and a shallow clone
    # may not contain the base commit.
    GIT_DEPTH: "0"
  # Deliberately NO `cache:` and no GOCACHE/GOMODCACHE override, unlike every
  # other Go job in this file. Measured live on pipeline #3698: a shared
  # go-mod cache restored INTO the repo tree (this file's usual
  # `$CI_PROJECT_DIR/.gomodcache` convention) lands before `step_script` even
  # starts — GitLab's own cache-restore stage runs ahead of it — so the gate's
  # OWN self-check (`test_every_memory_source_file_is_gated`, shared verbatim
  # with the GitHub arm) then walks a tree that already contains vendored Go
  # source under `.gomodcache/` and correctly flags three "memory"-named files
  # in it (zapcore/memory_encoder.go, two copies of windows/memory_windows.go)
  # as uncovered by `MEMORY_PATHS`. That is the self-check doing its job on an
  # input the GitHub arm never produces — `ubuntu-latest` runners don't
  # pre-populate a module cache into the checkout before this job's steps run.
  # Go's container defaults (`$HOME/go/pkg/mod`, `$HOME/.cache/go-build`) live
  # outside `$CI_PROJECT_DIR`, so leaving these unset keeps the self-check's
  # input identical to the GitHub arm's at the cost of a from-scratch module
  # download every run — acceptable here since nothing else in this job reuses
  # that cache across runs anyway (fresh container each time either way).
  # Sized off the GitHub arm's own measured worst case (~57 min, see that
  # job's `timeout-minutes` comment) plus headroom for `apt`/`go install`
  # self-hosting installs this port adds that the GitHub arm does not pay
  # for. Not yet independently re-measured on this runner — the first few
  # real runs are what that measurement has to be; raise or lower from an
  # actual number, not from this guess, the same rule the source file states
  # about itself.
  timeout: 90m
  script:
    - |
      bash <<'GATE_SCRIPT'
      set -euo pipefail

      echo "## Gate self-checks (stdlib only, no network, no services needed yet)"
      # `jq` added here, not just `python3`/`postgresql-client`: measured live
      # on pipeline #3698, `test_gate_blindness.py`'s own setUpClass refuses
      # to run 5 test classes without it ("'jq' is required to EXECUTE the
      # storm guard ... skipping instead of failing would leave the guard
      # unproven while reporting green"). `ubuntu-latest` (the GitHub arm's
      # runner) ships `jq` preinstalled; `golang:1.25-bookworm` does not.
      # `python3-venv` added here too: measured live on pipeline #3900,
      # any memory-relevant MR failed deterministically at the `python3 -m
      # venv /tmp/venv` step below ("ensurepip is not available") because
      # Debian's `python3` package ships without it. Not flaky — every
      # memory-relevant MR hit this every time until fixed.
      apt-get update -qq && apt-get install -y -qq python3 python3-venv jq postgresql-client >/dev/null
      cd scripts/memory-bench
      for f in test_mcp_ref.py test_gate_blindness.py test_gate_modes.py test_gate_arm.py \
               test_gate_dense_arm.py test_gate_scope.py test_check_captured_baseline.py \
               test_gold_rank.py test_fixture_isolation.py test_serving_version.py \
               test_classify_cancelled_arm.py test_resume_after_deploy.py test_bench_window.py \
               test_fixture_ages.py test_search_settle.py test_embed_drain.py \
               test_confirm_embedder_alive.py test_corpus_sanitize.py test_corpus_sanitize_wiring.py \
               test_gate_recency_floor.py test_ci_bootstrap_workspace_slug.py; do
        python3 "$f" || { echo "SELF-CHECK FAILED: $f"; exit 1; }
      done
      python3 dense_arm_control.py --selftest || exit 1
      python3 prod_window.py --selftest || exit 1
      python3 fixture_ages.py --selftest || exit 1
      python3 recency_control.py --selftest || exit 1
      echo "all self-checks passed"

      echo "## The gate must still be able to go RED (redproof)"
      set +e
      python3 prove_gate_can_go_red.py baseline_retrieval_branch.json branch 2>&1 | tee redproof.log
      rc=${PIPESTATUS[0]}
      set -e
      case "$rc" in
        0) echo "redproof PASS: identity OK, an over-tolerance drop names its category, an in-tolerance drop stays OK." ;;
        1) echo "redproof FAILED — the gate can no longer produce the verdict it exists to produce. Blocking."; exit 1 ;;
        2) echo "redproof INCONCLUSIVE (missing/mismatched baseline) — nothing here is the author's to fix, not blocking on an MR." ;;
        *) echo "redproof exited $rc"; exit "$rc" ;;
      esac
      cd "$CI_PROJECT_DIR"

      echo "## Does this change touch memory?"
      # HEAD_SHA is $CI_COMMIT_SHA, not a "CI_MERGE_REQUEST_DIFF_HEAD_SHA" —
      # measured live on pipeline #3708: that variable does not exist on
      # GitLab (confirmed against the predefined-variables reference; the
      # nearest real name, CI_MERGE_REQUEST_DIFF_BASE_SHA, is real and used
      # below), and `set -u` turned the typo into an immediate hard failure
      # rather than a silent empty string. This job's `rules:` restrict it to
      # `merge_request_event` (a "merge request pipeline", not a "merged
      # results pipeline"), so the checkout is the source branch's real head
      # commit (confirmed: pipeline #3698/#3708 both checked out exactly the
      # branch's pushed SHA, not a synthetic merge commit) — CI_COMMIT_SHA IS
      # the head of the diff this step needs.
      EVENT_NAME=pull_request \
      BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA" \
      HEAD_SHA="$CI_COMMIT_SHA" \
        bash scripts/memory-bench/scope_relevant.sh > scope.log
      cat scope.log
      if ! grep -q '^memory-relevant: true$' scope.log; then
        echo "No memory-path file in this diff — the recall gate is a no-op."
        exit 0
      fi

      echo "## Self-hosting Postgres/Redis/NATS on loopback (see file header for why not services:)"
      export DEBIAN_FRONTEND=noninteractive
      apt-get install -y -qq postgresql redis-server gcc >/dev/null
      service postgresql start
      for i in $(seq 30); do pg_isready -h 127.0.0.1 -U "$(whoami)" >/dev/null 2>&1 && break; sleep 1; done
      su postgres -c "psql -c \"CREATE USER mesh WITH PASSWORD 'mesh' SUPERUSER;\""
      su postgres -c "psql -c \"CREATE DATABASE mesh OWNER mesh;\""
      PGPASSWORD=mesh psql -h 127.0.0.1 -U mesh -d mesh -c 'select 1;' >/dev/null
      redis-server --daemonize yes --bind 127.0.0.1
      go install github.com/nats-io/nats-server/v2@v2.10.22
      "$(go env GOPATH)/bin/nats-server" -p 4222 -a 127.0.0.1 > /tmp/nats.log 2>&1 &
      echo "postgres, redis, nats up on 127.0.0.1"

      echo "## Python venv + fastembed (glibc-only — see file header)"
      python3 -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install -q mcp httpx fastembed

      echo "## Run migrations"
      go install github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION
      GOOSE_DRIVER=postgres GOOSE_DBSTRING="postgres://mesh:mesh@127.0.0.1:5432/mesh?sslmode=disable" \
        "$(go env GOPATH)/bin/goose" -dir migrations up

      echo "## Start the local embedder"
      cd scripts/memory-bench
      nohup python3 ci_embedder.py --port 8099 --cache-dir .fastembed_cache > embedder.log 2>&1 &
      echo $! > embedder.pid
      for i in $(seq 180); do
        curl -sf http://127.0.0.1:8099/healthz > /dev/null && { echo "embedder ready after ${i}s"; break; }
        sleep 1
      done
      curl -sf http://127.0.0.1:8099/healthz > /dev/null || { echo "embedder never became ready"; cat embedder.log; exit 1; }
      cd "$CI_PROJECT_DIR"

      echo "## Build + start the API from THIS branch"
      go build -o /tmp/mesh-api ./cmd/api
      export DB_HOST=127.0.0.1 DB_PORT=5432 DB_USER=mesh DB_PASSWORD=mesh DB_NAME=mesh DB_SSL_MODE=disable
      export REDIS_HOST=127.0.0.1 REDIS_PORT=6379 NATS_URL="nats://127.0.0.1:4222"
      export JWT_SECRET="ci-recall-gate-secret-32chars-min!" JWT_ISSUER=mesh-ci
      export MESH_RATE_LIMIT_ENABLED=false MESH_ALLOW_REGISTRATION=true
      export EMBEDDING_PROVIDER=openai EMBEDDING_ENDPOINT="http://127.0.0.1:8099"
      export EMBEDDING_MODEL="BAAI/bge-small-en-v1.5" EMBEDDING_DIMENSIONS=384
      export EMBEDDING_API_KEY=not-used-by-the-local-embedder APP_ENV=test
      nohup /tmp/mesh-api > api.log 2>&1 &
      echo $! > api.pid
      export MESH_API_URL=http://127.0.0.1:8005

      echo "## Bootstrap a bench workspace + agent key (never printed — see ci_bootstrap.py)"
      python3 scripts/memory-bench/ci_bootstrap.py --api-url "$MESH_API_URL" --env-file /tmp/bench.env \
        || { echo "bootstrap failed"; tail -50 api.log; exit 1; }
      set -a; . /tmp/bench.env; set +a

      echo "## Checkout evc-mesh-mcp from its public GitHub showcase mirror (see file header)"
      git clone --depth 1 https://github.com/entire-vc/evc-mesh-mcp.git /tmp/evc-mesh-mcp
      MCP_COMMIT="$(git -C /tmp/evc-mesh-mcp rev-parse HEAD)"
      echo "mesh-mcp client: mirror commit=$MCP_COMMIT"

      echo "## Cross-compile mesh-mcp"
      ( cd /tmp/evc-mesh-mcp && GOOS=linux GOARCH=amd64 go build -o "$CI_PROJECT_DIR/mesh-mcp-bin" . )
      chmod +x mesh-mcp-bin

      echo "## Confirm the embedder is still alive before measuring"
      bash scripts/memory-bench/confirm_embedder_alive.sh http://127.0.0.1:8099/healthz scripts/memory-bench/embedder.log

      export MESH_MCP_BIN="$CI_PROJECT_DIR/mesh-mcp-bin"
      export MESH_MCP_HTTP_TIMEOUT_SECS=120
      export RECALL_GRAPH_ENABLED=true
      export BENCH_BACKDATE_DSN="postgres://mesh:mesh@127.0.0.1:5432/mesh?sslmode=disable"

      echo "## Dense-arm control — the vector arm must be contributing"
      cd scripts/memory-bench
      set +e
      BENCH_RUN_NONCE="${CI_PIPELINE_ID}-ctl" python3 dense_arm_control.py --expect alive 2>&1 | tee control_alive.log
      rc=${PIPESTATUS[0]}
      set -e
      [ "$rc" = "1" ] && exit 1
      true

      echo "## Recency control — fixture age must be visible"
      export BENCH_FIXTURE_AGE_MODE=question-anchored
      set +e
      BENCH_RUN_NONCE="${CI_PIPELINE_ID}-age" python3 recency_control.py --expect visible 2>&1 | tee control_recency_visible.log
      rc=${PIPESTATUS[0]}
      set -e
      [ "$rc" = "1" ] && exit 1
      true

      echo "## Recency control — and what it sees is AGE, not the parameter"
      unset BENCH_BACKDATE_DSN
      set +e
      BENCH_RUN_NONCE="${CI_PIPELINE_ID}-age-neg" python3 recency_control.py --expect blind 2>&1 | tee control_recency_blind.log
      rc=${PIPESTATUS[0]}
      set -e
      [ "$rc" = "1" ] && exit 1
      true
      export BENCH_BACKDATE_DSN="postgres://mesh:mesh@127.0.0.1:5432/mesh?sslmode=disable"

      echo "## Run the recall gate against the branch build"
      set +e
      BENCH_RUN_NONCE="${CI_PIPELINE_ID}-gate" python3 run_ci.py --retrieval-only --arm branch --tolerance 0.25 2>&1 | tee gate.log
      rc=${PIPESTATUS[0]}
      set -e
      reason="$(grep -m1 '^GATE_REASON:' gate.log | sed 's/^GATE_REASON: *//' || true)"
      if [ "$rc" = "0" ] && grep -qi 'no baseline_retrieval' gate.log; then rc=2; reason="no-baseline"; fi
      echo "GATE VERDICT rc=$rc reason=${reason:-unspecified}"
      case "$rc" in
        0) echo "PASS — recall on this branch, within tolerance of the branch baseline." ;;
        1) echo "REGRESSION — recall dropped below the branch baseline. This blocks the merge."; exit 1 ;;
        2) echo "INCONCLUSIVE ($reason) — nothing measured, not blocking an MR author for it." ;;
        *) echo "gate exited $rc"; exit "$rc" ;;
      esac

      echo "## Power check — with the dense arm off, the control must MISS"
      kill "$(cat embedder.pid)" 2>/dev/null || true
      for i in $(seq 20); do curl -sf http://127.0.0.1:8099/healthz > /dev/null || break; sleep 1; done
      set +e
      BENCH_RUN_NONCE="${CI_PIPELINE_ID}-pwr" python3 dense_arm_control.py --expect dead 2>&1 | tee control_dead.log
      rc=${PIPESTATUS[0]}
      set -e
      if [ "$rc" = "1" ]; then
        echo "The control has NO POWER — gold was still found with the dense arm off. Every green it produced was uninformative."
        exit 1
      fi
      echo "power check OK: the control goes red when the dense arm is removed, so its green means something."

      echo "## Server logs"
      tail -200 "$CI_PROJECT_DIR/api.log" 2>/dev/null || true
      tail -50 embedder.log 2>/dev/null || true
      GATE_SCRIPT
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - scripts/memory-bench/gate.log
      - scripts/memory-bench/redproof.log
      - scripts/memory-bench/control_alive.log
      - scripts/memory-bench/control_dead.log
      - scripts/memory-bench/control_recency_visible.log
      - scripts/memory-bench/control_recency_blind.log
      - scripts/memory-bench/embedder.log
      - scripts/memory-bench/results/
      - api.log
