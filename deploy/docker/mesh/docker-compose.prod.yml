services:
  # Provisions secrets the stack needs but the operator has no reason to
  # choose by hand. Runs to completion before api and prometheus start.
  #
  # MESH_METRICS_TOKEN gates GET /metrics. It has to be the same string on
  # both sides, which is why it was once a required .env variable — and that
  # made every upgrade from a release predating it fail at config-parse time
  # with "required variable MESH_METRICS_TOKEN is missing a value", before a
  # single container was touched. A variable that is required but absent from
  # the .env.prod.example the operator installed from is an upgrade break by
  # construction; see check-required-env.sh, which now fails CI on new ones.
  #
  # So the stack generates it instead. Setting MESH_METRICS_TOKEN in .env
  # still wins — that path is unchanged for anyone already using it.
  init-secrets:
    image: alpine:3.20
    environment:
      MESH_METRICS_TOKEN: ${MESH_METRICS_TOKEN:-}
    volumes:
      - ./volumes/secrets:/secrets
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$${MESH_METRICS_TOKEN:-}" ]; then
          printf '%s' "$$MESH_METRICS_TOKEN" > /secrets/metrics_token
        elif [ ! -s /secrets/metrics_token ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/metrics_token
          echo "init-secrets: generated a metrics token at volumes/secrets/metrics_token"
        fi
        chmod 600 /secrets/metrics_token

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Kept in lockstep with the api service's DB_NAME/DB_USER.
      POSTGRES_DB: ${DB_NAME:-mesh}
      POSTGRES_USER: ${DB_USER:-mesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./volumes/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - ./volumes/nats/data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - ./volumes/minio/data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ../../../
      dockerfile: deploy/docker/mesh/Dockerfile
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-8005}:8005"
    volumes:
      - ./volumes/secrets:/run/mesh-secrets:ro
    environment:
      # SERVER_HOST/SERVER_PORT stay pinned: the container-side port is
      # referenced by the port mapping above, the healthcheck below and the
      # nginx upstream, so it is not independently overridable. Change
      # API_PORT to move the host-side port.
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8005"
      SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT:-30s}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-30s}
      # DB_HOST/DB_PORT/DB_USER/DB_NAME default to the bundled postgres service
      # but can be repointed at a managed instance. DB_USER/DB_NAME must be
      # changed in lockstep with POSTGRES_USER/POSTGRES_DB when using the
      # bundled service.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mesh}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${DB_NAME:-mesh}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-mesh-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Empty means integration credentials are written to the database in
      # plaintext. Not passing it through at all meant setting it in .env did
      # nothing — the template's own note said to edit this block by hand,
      # which is a workaround standing in for the one line it describes.
      MESH_INTEGRATION_ENCRYPTION_KEY: ${MESH_INTEGRATION_ENCRYPTION_KEY:-}
      # Unset means inbound GitHub webhook signatures are not verified.
      MESH_GITHUB_WEBHOOK_SECRET: ${MESH_GITHUB_WEBHOOK_SECRET:-}
      CASDOOR_ENDPOINT: ${CASDOOR_ENDPOINT:-}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-}
      AGENT_KEY_PREFIX: ${AGENT_KEY_PREFIX:-agk}
      # CORS_ORIGINS is the historical name for this knob in compose;
      # MESH_CORS_ORIGINS is what the binary and docs/self-hosting.md call it.
      # Accept either, preferring the documented name.
      MESH_CORS_ORIGINS: ${MESH_CORS_ORIGINS:-${CORS_ORIGINS:-*}}
      # Set to false to close self-registration on an internet-facing install.
      # The very first user on an empty database can always register, so a
      # closed instance is still bootstrappable.
      MESH_ALLOW_REGISTRATION: ${MESH_ALLOW_REGISTRATION:-true}
      MESH_BASE_URL: ${MESH_BASE_URL:-http://localhost:5173}
      # First-admin seed. Runs only when the database has zero users, and only
      # at API startup. Leave MESH_ADMIN_PASSWORD unset to have a strong one
      # generated and printed once in the API log — never ship a default
      # password on an internet-facing install.
      MESH_SEED_ADMIN: ${MESH_SEED_ADMIN:-true}
      MESH_ADMIN_EMAIL: ${MESH_ADMIN_EMAIL:-admin@localhost}
      MESH_ADMIN_PASSWORD: ${MESH_ADMIN_PASSWORD:-}
      MESH_ADMIN_NAME: ${MESH_ADMIN_NAME:-Admin}
      MESH_RATE_LIMIT_ENABLED: ${MESH_RATE_LIMIT_ENABLED:-true}
      MESH_RATE_LIMIT_AUTH_RPM: ${MESH_RATE_LIMIT_AUTH_RPM:-5}
      MESH_RATE_LIMIT_REFRESH_RPM: ${MESH_RATE_LIMIT_REFRESH_RPM:-60}
      MESH_RATE_LIMIT_API_RPM: ${MESH_RATE_LIMIT_API_RPM:-600}
      MESH_SPARK_ENABLED: ${MESH_SPARK_ENABLED:-false}
      MESH_SPARK_URL: ${MESH_SPARK_URL:-}
      # Outbound email — required for workspace invites to actually be
      # delivered. Left empty the API logs the invite link instead of sending.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Gates GET /metrics behind a bearer token — this compose stack
      # publishes the api port and has no front proxy of its own, unlike the
      # non-compose internal deploy this endpoint's comment used to assume.
      # Read from the file init-secrets wrote, which prometheus reads too, so
      # the token is neither an operator's problem nor visible in `docker
      # inspect` on either container.
      MESH_METRICS_TOKEN_FILE: /run/mesh-secrets/metrics_token
      # An explicit MESH_METRICS_TOKEN wins over the file (see
      # getEnvOrFile in internal/config). It is passed here as well as being
      # written to the file, and that is load-bearing rather than redundant:
      # the API reads its config once at startup, and Compose only recreates
      # a container whose spec changed. With the file alone, editing
      # MESH_METRICS_TOKEN in .env leaves this service's spec identical,
      # so `up -d` does not restart it and the API keeps serving the old
      # token while prometheus — which re-reads the file every scrape —
      # starts sending the new one. Referencing the variable here makes the
      # edit visible to Compose, which recreates the container.
      #
      # Empty (the generated path, and the default) interpolates to "" and
      # puts nothing in `docker inspect`.
      MESH_METRICS_TOKEN: ${MESH_METRICS_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: ../../../
      dockerfile: deploy/docker/mesh/Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

  mcp:
    build:
      context: ../../../
      dockerfile: deploy/docker/mesh/Dockerfile
    restart: unless-stopped
    command: ["mesh-mcp", "--transport", "sse"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8081}:8081"
    volumes:
      - ./volumes/secrets:/run/mesh-secrets:ro
    environment:
      MESH_API_URL: http://api:8005
      MESH_MCP_TRANSPORT: sse
      MESH_MCP_HOST: "0.0.0.0"
      MESH_MCP_PORT: "8081"
      # Only needed when a reverse proxy serves MCP under a path prefix
      # (e.g. https://mesh.example.com/mcp). Empty is correct otherwise: the
      # message endpoint is then advertised relative to the URL the client
      # connected to. See docs/agent-onboarding.md.
      MESH_MCP_PUBLIC_URL: ${MESH_MCP_PUBLIC_URL:-}
      # Gates this service's own GET /metrics — a separate promhttp handler
      # in a separate binary from the api service, not covered by that
      # service's MESH_METRICS_TOKEN wiring. Same file + explicit-var-wins
      # pattern as the api service above, and for the same reason: an
      # edit to MESH_METRICS_TOKEN in .env must change this service's spec
      # too, or Compose won't recreate it and it keeps serving the old token.
      MESH_METRICS_TOKEN_FILE: /run/mesh-secrets/metrics_token
      MESH_METRICS_TOKEN: ${MESH_METRICS_TOKEN:-}

  prometheus:
    image: prom/prometheus:v2.50.0
    restart: unless-stopped
    user: "root"
    volumes:
      - ../../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./volumes/prometheus/data:/prometheus
      - ./volumes/secrets:/run/mesh-secrets:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:10.3.1
    restart: unless-stopped
    user: "root"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./volumes/grafana/data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
