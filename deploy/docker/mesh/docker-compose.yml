services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mesh}
      POSTGRES_DB: ${DB_NAME:-mesh}
    ports:
      - "${DB_PORT:-5437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6383}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    # No host bind-mount for the config (see nats-server.conf's own header for
    # why a file is needed at all, and #21e7808a for why it can't come from a
    # host path): Docker Desktop's file sharing on this fleet's Mac Mini
    # silently resolves ANY bind mount rooted under /tmp to an empty phantom
    # location -- proven directly (`docker run -v /tmp/x:/mnt alpine ls /mnt`
    # shows nothing) and not specific to files or to this compose file. Most
    # of the fleet's git worktrees live under /tmp/wt-*, so this used to break
    # `make ci` there. Writing the same content into the container's own
    # filesystem at startup needs no host path at all.
    # `$$NATS_STREAM_MAX_BYTES` (doubled `$`) is escaped FROM Compose's own
    # interpolation -- Compose would otherwise try to substitute it at
    # parse-time using the host's shell environment, not the container's;
    # the container's own /bin/sh performs the real substitution below, from
    # the `environment:` block two lines down.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nats/nats-server.conf <<CONF
        jetstream {
          store_dir: "/data"
          max_file_store: $$NATS_STREAM_MAX_BYTES
        }
        http_port: 8222
        CONF
        exec nats-server -c /etc/nats/nats-server.conf
    environment:
      NATS_STREAM_MAX_BYTES: ${NATS_STREAM_MAX_BYTES:-10737418240}
    ports:
      - "${NATS_PORT:-4223}:4222"
      - "${NATS_MONITOR_PORT:-8223}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volumes, not host bind-mounts: this compose file is the DEV/CI
# stack (`make docker-up` / `ci-services-up`), and every checkout that
# starts it -- git worktree or a scratchpad clone -- can live under /tmp,
# which colima's guest VM does NOT share with the host (only `~` is
# virtiofs-mounted). A relative bind-mount source like
# `./volumes/postgres/data` still resolves against the checkout's own
# directory, but since that path isn't visible inside the guest, the
# in-guest docker daemon just materializes it as a real directory on the
# guest's OWN filesystem to satisfy the mount -- and that directory outlives
# the checkout forever once it's deleted on the host, invisible to both
# `du` on the host and `docker system df` (it's neither an image nor a
# tracked volume). Measured: dozens of such orphaned trees, several GB,
# a large share of the guest root disk's used space -- same failure class
# the config comment above already worked around for `nats-server.conf`,
# just for data instead of config.
#
# Named volumes are the fix because the cleanup path ALREADY EXISTS and
# already runs reliably: `make ci-test`'s EXIT/INT/TERM/HUP trap calls
# `ci-services-down` (`docker compose down -v`), and
# `scripts/ci/reap_stale_ci_containers.py` (the SIGKILL backstop, invoked
# from every `ci-services-up`) calls the same `down -v --remove-orphans`.
# `-v` removes compose-managed named volumes; it has never removed a host
# bind-mount directory, which is exactly why the leak accumulated even
# though teardown was "working" the whole time. No new script/cron needed.
#
# `COMPOSE_PROJECT_NAME` (set per-checkout, see Makefile's "Per-checkout
# isolation" block) namespaces these same as it already namespaces
# containers/networks, so concurrent checkouts still don't collide.
#
# `deploy/docker/mesh/volumes/` (gitignored) and its bind-mounts stay as-is
# in docker-compose.prod.yml -- that stack is long-lived on a real host path
# per docs/self-hosting.md (backup tooling reads those paths directly), not
# an ephemeral per-checkout CI stack, so it was never part of this leak.
volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
