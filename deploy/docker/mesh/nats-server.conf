# JetStream file-storage limit, explicit rather than NATS's disk-autodetect
# default. Autodetect silently derives the cap from whatever free space the
# host disk happens to report at startup (observed: ~9.76GiB on a partner
# host) instead of the size the application actually configures via
# NATS_STREAM_MAX_BYTES (internal/eventbus) -- the two could silently
# diverge. $NATS_STREAM_MAX_BYTES is interpolated from the container's
# environment by nats-server itself. NATS's own var interpolation has no
# bash-style ${VAR:-default} fallback syntax, so the default (10GiB /
# 10737418240 bytes, matching internal/config's own default) is supplied
# by the compose file's `environment:` block, not here -- this file
# always sees a concrete value.
jetstream {
  store_dir: "/data"
  max_file_store: $NATS_STREAM_MAX_BYTES
}

http_port: 8222
