# This container never terminates TLS (listens on plain :80 only), so its own
# $scheme is always "http" — it says nothing about the scheme the client
# actually used. When Mesh sits behind a TLS-terminating edge (the documented
# deployment shape, see docs/self-hosting.md), that edge sends its own
# X-Forwarded-Proto and it must be preserved, not overwritten with $scheme.
# Direct http access with no forwarded header falls back to $scheme (i.e.
# "http", honestly) rather than being upgraded to something it isn't.
map $http_x_forwarded_proto $mesh_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Real fix for generic.nginx.security.possible-h2c-smuggling: the /ws location
# below used to forward $http_upgrade verbatim, so a client could send
# `Upgrade: h2c` (or any other value) and have it passed straight through to
# the backend, which is exactly the smuggling vector the rule warns about —
# an attacker-chosen Upgrade value reaching a proxied backend that speaks
# whatever protocol it names. WebSocket support is the only upgrade this
# location needs (the mitigation semgrep names for "WebSocket required":
# allow only the literal value `websocket`), so this map allows exactly that
# value through and reduces everything else to an empty header. An empty
# Upgrade/Connection header is dropped by nginx rather than forwarded, so any
# non-websocket upgrade attempt is proxied as a plain HTTP/1.1 request instead
# — the backend (cmd/api) doesn't speak h2c at all (grep confirms no
# golang.org/x/net/http2 h2c usage in this repo), so there was never a live
# exploit here, but restricting the passthrough is a one-line, zero-risk fix
# rather than a suppression of a rule that is otherwise correctly describing
# the config shape.
map $http_upgrade $mesh_ws_upgrade {
    default    '';
    'websocket' 'websocket';
}
map $mesh_ws_upgrade $mesh_ws_connection {
    default    '';
    'websocket' 'upgrade';
}

server {
    listen 80;
    root /srv/web;
    index index.html;

    # SEO: mark the entire app host as noindex (defense-in-depth alongside <meta name=robots>).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Proxy REST API
    location /api/ {
        proxy_pass http://api:8005;
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used — this is Mesh's own reverse proxy for its own api/mcp backends inside the compose network, not a routing decision keyed on Host across tenants/domains; the one place cmd/api trusts a client-supplied host for anything security-sensitive (auth_handler.go's isRequestSecure/isLoopbackHost) already treats an unrecognized host as the safe (Secure=true) default, and computeTaskURL (task_handler.go) prefers X-Forwarded-Host over this Host header for link generation, so spoofing this value downgrades at most the spoofer's own session, never another user's.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mesh_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://api:8005;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- real fix applied above ($mesh_ws_upgrade/$mesh_ws_connection restrict the Upgrade value to the literal "websocket"; see the map block comment near the top of this file), but the rule is a structural pattern match on proxy_http_version+Upgrade+Connection and can't see that the value is restricted
        proxy_set_header Upgrade $mesh_ws_upgrade;
        proxy_set_header Connection $mesh_ws_connection;
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used — see the /api/ location above; same internal reverse-proxy shape, same reasoning.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Health check (proxied to API for liveness probe)
    location /health {
        proxy_pass http://api:8005/health;
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used — see the /api/ location above; same internal reverse-proxy shape, same reasoning.
        proxy_set_header Host $host;
    }

    # Never proxy MCP's own metrics endpoint through here, regardless of
    # whether MESH_METRICS_TOKEN ends up set on the mcp service — an operator
    # who leaves it unset gets a metrics endpoint with NO app-level auth
    # (internal/middleware.MetricsAuthHTTP falls open on an empty token), and
    # this is the exact class of leak #986b6c88 found on the Caddy-fronted
    # instance (the fix there is the same shape: block the path at the edge).
    # Must come before the /mcp/ location below — nginx picks the most
    # specific matching prefix location, and without this one first the
    # general /mcp/ location would proxy metrics right through.
    location ^~ /mcp/metrics {
        return 404;
    }

    # Proxy MCP (Model Context Protocol) SSE transport for remote agents.
    #
    # Unlike /api/ and /s3/ above, this does NOT use a literal upstream
    # (proxy_pass http://mcp:8081) even though that would be simpler. nginx
    # resolves a literal upstream once at config load and REFUSES TO START at
    # all if the name doesn't resolve — fine for api/minio, which the whole
    # product depends on regardless (see nginx's depends_on comment in
    # docker-compose.prod.yml), but mcp is documented as optional
    # (docs/self-hosting.md). Making an optional service a startup dependency
    # of the web UI would mean an operator who stops mcp doesn't get "MCP is
    # off" — they get a dead UI. The resolver below defers the DNS lookup to
    # request time, so nginx starts fine with mcp down and only this one
    # location answers 502.
    location /mcp/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream http://mcp:8081;
        # A variable in proxy_pass disables nginx's normal "append the
        # matched URI onto the upstream" behavior, so the /mcp prefix has to
        # be stripped explicitly — otherwise the upstream sees /mcp/sse
        # instead of /sse and every request 404s.
        rewrite ^/mcp/(.*)$ /$1 break;
        proxy_pass $mcp_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal — the rule's SSRF concern is a proxy_pass target built from attacker-influenced input; $mcp_upstream above is set to the literal string "http://mcp:8081" (never derived from any request data), used only to defer DNS resolution past config-load time (see the comment above this location). Adding an internal directive here would 403 the real remote-agent traffic this location exists to serve (see the comment above), which is the opposite of what's needed here.
        proxy_http_version 1.1;
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used — see the /api/ location above; same internal reverse-proxy shape, same reasoning.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE-specific: without these, events queue up in nginx's own buffer
        # instead of reaching the client (proxy_buffering), a long-lived
        # stream can get cut by the default read timeout, and "Connection"
        # must be cleared or nginx forwards its own keepalive value instead
        # of letting the upstream and client negotiate directly.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    # Proxy presigned artifact/icon downloads through to MinIO. ^~ so this
    # wins over the static-asset regex location below — most artifacts end in
    # an extension that regex matches (.png, .pdf, ...), and a plain prefix
    # location loses to a regex location in nginx's matching order.
    # Deliberately does NOT override the Host header: presigned URLs are
    # signed against S3_ENDPOINT (minio:9000), and MinIO validates the
    # signature against the Host header it receives, so it must keep nginx's
    # default upstream Host.
    location ^~ /s3/ {
        proxy_pass http://minio:9000/;
    }

    # SEO: serve a valid robots.txt explicitly (no SPA fallback for this path).
    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
    }

    # SEO: do not expose a fake sitemap/llms.txt — return 404 so crawlers know it does not exist.
    location = /sitemap.xml { return 404; }
    location = /llms.txt   { return 404; }

    # Static assets with file extensions: serve as-is or 404 (no SPA fallback for missing files).
    location ~* \.(js|css|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|json|txt|xml|wasm|mp4|webm|pdf)$ {
        try_files $uri =404;
    }

    # SPA fallback: extensionless paths route to index.html for client-side routing.
    # Crawlers indexing these still see <meta name=robots> noindex + X-Robots-Tag header.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
