# This container never terminates TLS (listens on plain :80 only), so its own
# $scheme is always "http" — it says nothing about the scheme the client
# actually used. When Mesh sits behind a TLS-terminating edge (the documented
# deployment shape, see docs/self-hosting.md), that edge sends its own
# X-Forwarded-Proto and it must be preserved, not overwritten with $scheme.
# Direct http access with no forwarded header falls back to $scheme (i.e.
# "http", honestly) rather than being upgraded to something it isn't.
map $http_x_forwarded_proto $mesh_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /srv/web;
    index index.html;

    # SEO: mark the entire app host as noindex (defense-in-depth alongside <meta name=robots>).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Proxy REST API
    location /api/ {
        proxy_pass http://api:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mesh_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://api:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Health check (proxied to API for liveness probe)
    location /health {
        proxy_pass http://api:8005/health;
        proxy_set_header Host $host;
    }

    # Proxy presigned artifact/icon downloads through to MinIO. ^~ so this
    # wins over the static-asset regex location below — most artifacts end in
    # an extension that regex matches (.png, .pdf, ...), and a plain prefix
    # location loses to a regex location in nginx's matching order.
    # Deliberately does NOT override the Host header: presigned URLs are
    # signed against S3_ENDPOINT (minio:9000), and MinIO validates the
    # signature against the Host header it receives, so it must keep nginx's
    # default upstream Host.
    location ^~ /s3/ {
        proxy_pass http://minio:9000/;
    }

    # SEO: serve a valid robots.txt explicitly (no SPA fallback for this path).
    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
    }

    # SEO: do not expose a fake sitemap/llms.txt — return 404 so crawlers know it does not exist.
    location = /sitemap.xml { return 404; }
    location = /llms.txt   { return 404; }

    # Static assets with file extensions: serve as-is or 404 (no SPA fallback for missing files).
    location ~* \.(js|css|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|json|txt|xml|wasm|mp4|webm|pdf)$ {
        try_files $uri =404;
    }

    # SPA fallback: extensionless paths route to index.html for client-side routing.
    # Crawlers indexing these still see <meta name=robots> noindex + X-Robots-Tag header.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
