global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mesh-api'
    static_configs:
      - targets: ['api:8005']
    metrics_path: /metrics
    scrape_interval: 10s
    # The same file the api reads as MESH_METRICS_TOKEN_FILE, written by the
    # init-secrets service in deploy/docker/mesh/docker-compose.prod.yml —
    # /metrics rejects unauthenticated requests.
    bearer_token_file: /run/mesh-secrets/metrics_token
