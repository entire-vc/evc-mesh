global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mesh-api'
    static_configs:
      - targets: ['api:8005']
    metrics_path: /metrics
    scrape_interval: 10s
    # Matches the api service's MESH_METRICS_TOKEN (deploy/docker/mesh/
    # docker-compose.prod.yml) — /metrics rejects unauthenticated requests.
    bearer_token_file: /run/secrets/mesh_metrics_token
