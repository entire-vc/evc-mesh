<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/theme-manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#006b6b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="EVC Mesh web app — login required." />
    <title>EVC Mesh</title>
    <!--
      Theme before the first frame: same localStorage key and fallback as
      main.tsx / header.tsx, so the static shell below paints in the right
      theme instead of flashing light first.
    -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
      try {
        if (localStorage.getItem("density") === "compact") document.documentElement.dataset.density = "compact";
      } catch (e) {}
    </script>
    <!--
      Instance theme before the first frame: public/instance-theme.js applies
      the last theme the server sent (localStorage), refreshes it, and keeps
      <meta name="theme-color"> in step. The tags above are the mesh-default
      look, so only a first visit can paint it before the answer arrives.
    -->
    <script src="/instance-theme.js"></script>
    <!--
      Import map for theme view bundles (ADR D10): React, react-dom, jsx-runtime,
      react-i18next and the SDK are the core's single copies, so a theme bundle
      never carries its own React. The shims in /theme-shared re-export from
      window.__MESH_SHARED__ (src/core/themes/shared.ts). Generated list:
      scripts/gen-theme-shims.mjs --check keeps this block in step.
    -->
    <script type="importmap">{"imports":{"react":"/theme-shared/react.js","react-dom":"/theme-shared/react-dom.js","react/jsx-runtime":"/theme-shared/jsx-runtime.js","react-i18next":"/theme-shared/react-i18next.js","@entire-vc/mesh-theme-sdk":"/theme-shared/mesh-theme-sdk.js"}}</script>
    <!-- Self-hosted (src/styles/fonts.css) — no more render-blocking round
         trip to fonts.googleapis.com before the font URLs even arrive.
         Preload only the one face nearly every screen paints text with
         before anything else: Inter 400, latin subset. Other
         weights/subsets are requested by the browser as CSS resolves. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <!--
      Static shell (perf·Б2). Until the bundle has loaded and React
      has mounted, #root holds a copy of the markup React renders on its FIRST
      frame for this route, so the screen is visible at TTFB + CSS instead of
      after all of the JS. createRoot() then replaces it (not hydration).

      Each template MUST match its React counterpart class-for-class, as the
      classes come out of cn()/tailwind-merge (CardTitle, for one, loses
      leading-none once text-2xl is merged in):
        shell-login → pages/login.tsx (LoginPage, registrationEnabled=true —
                      the hook's initial value)
        shell-app   → components/layout/app-layout.tsx (authLoading branch)
      scripts/assert-static-shell-match.mjs diffs the two pixel-by-pixel (CI).

      Kill switch: ?static-shell=off (remembered in localStorage
      "mesh-static-shell"), ?static-shell=on clears it.
    -->
    <template id="shell-login">
      <div class="flex min-h-screen items-center justify-center bg-background px-4">
        <div class="rounded-xl border border-border bg-card text-card-foreground shadow-sm w-full max-w-md">
          <div class="flex flex-col space-y-1.5 p-6 text-center">
            <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-primary text-lg font-bold text-primary-foreground">M</div>
            <h3 class="font-semibold tracking-tight text-2xl">Welcome back</h3>
            <p class="text-sm text-muted-foreground">Sign in to your EVC Mesh account</p>
          </div>
          <!-- Not submittable: typed values are carried into the React form by lib/static-shell.ts. -->
          <form onsubmit="return false">
            <div class="p-6 pt-0 space-y-4">
              <div class="space-y-2">
                <label for="email" class="text-sm font-medium">Email</label>
                <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" class="flex h-9 w-full rounded-lg border border-input bg-background px-3 py-1 text-sm shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" />
              </div>
              <div class="space-y-2">
                <label for="password" class="text-sm font-medium">Password</label>
                <input id="password" type="password" placeholder="Your password" required autocomplete="current-password" class="flex h-9 w-full rounded-lg border border-input bg-background px-3 py-1 text-sm shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" />
              </div>
            </div>
            <div class="flex items-center p-6 pt-0 flex-col gap-4">
              <button type="submit" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2 w-full">Sign in</button>
              <p class="text-center text-sm text-muted-foreground">Don&apos;t have an account? <a href="/register" class="text-primary hover:underline">Register</a></p>
            </div>
          </form>
        </div>
      </div>
    </template>
    <template id="shell-app">
      <div class="flex h-screen items-center justify-center bg-background">
        <div class="space-y-4 text-center">
          <div class="animate-pulse bg-muted mx-auto h-8 w-8 rounded-full"></div>
          <div class="animate-pulse rounded-md bg-muted h-4 w-32"></div>
        </div>
      </div>
    </template>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var KEY = "mesh-static-shell";
          var q = /[?&]static-shell=(on|off)\b/.exec(location.search);
          if (q) {
            if (q[1] === "off") localStorage.setItem(KEY, "off");
            else localStorage.removeItem(KEY);
          }
          if (localStorage.getItem(KEY) === "off") return;
        } catch (e) {}
        var p = location.pathname;
        // /register, /accept-invite and /connect (OAuth consent) render their
        // own standalone pages — no shell there rather than a wrong one.
        var id = p === "/login" || p === "/login/" ? "shell-login"
          : /^\/(register|accept-invite|connect)(\/|$)/.test(p) ? null
          : "shell-app";
        var tpl = id && document.getElementById(id);
        if (!tpl) return;
        var root = document.getElementById("root");
        root.appendChild(tpl.content.cloneNode(true));
        root.setAttribute("data-static-shell", id);
      })();
    </script>
    <script id="boot-guard">
      // Boot guard: runs before the module entry, so it still works when the
      // entry (or one of its static imports) fails to load, which no code
      // inside the bundle can handle. main.tsx sets window.__meshBooted.
      // Recovery is bounded: ONE targeted cache-bypassing refetch of the failed
      // file plus ONE reload per tab session, then a visible panel with the
      // failing URL/stage and a manual Reload. It never clears storage or
      // cookies and never touches the session.
      (function () {
        var FLAG = "mesh-boot-retry";
        var done = false;
        function clean(u) {
          try { var x = new URL(u, location.href); return x.origin === location.origin ? x.pathname : x.origin + x.pathname; }
          catch (e) { return "unknown"; }
        }
        function panel(stage, url, status) {
          var root = document.getElementById("root");
          if (!root || window.__meshBooted) return;
          var box = document.createElement("div");
          box.setAttribute("role", "alert");
          box.setAttribute("data-boot-failure", stage);
          box.style.cssText = "display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center";
          var inner = document.createElement("div");
          inner.style.cssText = "max-width:420px";
          var h = document.createElement("h1");
          h.style.cssText = "font-size:18px;font-weight:600;margin:0 0 8px";
          h.textContent = "Mesh could not start";
          var p = document.createElement("p");
          p.style.cssText = "font-size:14px;opacity:.75;margin:0 0 16px";
          p.textContent = "A part of the app failed to load. Your session and data are untouched.";
          var d = document.createElement("p");
          d.style.cssText = "font:12px ui-monospace,monospace;opacity:.6;margin:0 0 16px;word-break:break-all";
          d.setAttribute("data-boot-detail", "");
          d.textContent = stage + (url ? " " + url : "") + (status ? " HTTP " + status : "");
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = "Reload";
          b.style.cssText = "height:36px;padding:0 16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-size:14px";
          b.onclick = function () { location.reload(); };
          inner.appendChild(h); inner.appendChild(p); inner.appendChild(d); inner.appendChild(b);
          box.appendChild(inner);
          root.textContent = "";
          root.removeAttribute("data-static-shell");
          root.appendChild(box);
        }
        function fail(stage, url) {
          if (done || window.__meshBooted) return;
          done = true;
          var shown = url ? clean(url) : "";
          var retried = false;
          try { retried = sessionStorage.getItem(FLAG) === "1"; } catch (e) {}
          if (retried || !window.fetch) { diagnose(stage, url, shown); return; }
          // Reload only if the one-shot flag really persisted; otherwise the
          // next load could not see it and the repair would loop.
          var armed = false;
          try { sessionStorage.setItem(FLAG, "1"); armed = sessionStorage.getItem(FLAG) === "1"; } catch (e) {}
          if (!armed) { diagnose(stage, url, shown); return; }
          // Overwrite a poisoned HTTP-cache entry, then reload once.
          var bust = url ? fetch(url, { cache: "reload", credentials: "same-origin" }) : fetch(location.pathname, { cache: "reload", credentials: "same-origin" });
          bust.then(function () { location.reload(); }, function () { diagnose(stage, url, shown); });
        }
        function diagnose(stage, url, shown) {
          if (!url || !window.fetch) { panel(stage, shown); return; }
          fetch(url, { cache: "no-store", credentials: "same-origin" }).then(
            function (r) { panel(stage, shown, r.status); },
            function () { panel(stage, shown, "network-error"); }
          );
        }
        window.__meshBootFail = fail;
        // Booting clears the one-shot retry flag, so a later failure can repair again.
        var booted = false;
        Object.defineProperty(window, "__meshBooted", {
          configurable: true,
          get: function () { return booted; },
          set: function (v) {
            booted = !!v;
            if (booted) { try { sessionStorage.removeItem(FLAG); } catch (e) {} }
          }
        });
        // A failed asset is acted on after a short grace period, so a request
        // that is merely slow to report (or deliberately blocked by a test
        // harness that wants the static shell) does not flash the panel.
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK") && (t.src || t.href)) {
            var u = t.src || t.href;
            if (clean(u).indexOf("/assets/") === 0) setTimeout(function () { fail("asset-load-failed", u); }, 3000);
          }
        }, true);
        // vite:preloadError: a lazy chunk vanished (deploy under an open tab).
        // One reload per minute picks up the new index.html; no loop.
        window.addEventListener("vite:preloadError", function (e) {
          var K = "mesh-chunk-reload";
          try {
            if (Date.now() - Number(sessionStorage.getItem(K) || 0) < 60000) return;
            sessionStorage.setItem(K, String(Date.now()));
          } catch (err) { return; }
          e.preventDefault();
          location.reload();
        });
        setTimeout(function () { fail("boot-timeout"); }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
