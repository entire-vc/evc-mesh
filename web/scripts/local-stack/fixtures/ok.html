<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; }
      /* Sized off the viewport (100vh), the way the real Docs page's inner
         scroller is: a flex column pinned to the viewport height. Growing the
         browser viewport grows this element's available height along with it,
         so the trap here is only that a naive `fullPage: true` screenshot (which
         captures just the outer viewport) would still miss #bottom — the fix
         under test (grow the viewport to the scroller's content height) must
         make both #top and #bottom visible in an ordinary, non-scrolled shot. */
      .scroller { height: 100vh; overflow-y: auto; box-sizing: border-box; padding: 8px; }
      .filler { height: 1400px; background: linear-gradient(#eef, #fee); }
      #top { background: lightgreen; padding: 8px; }
      #bottom { background: lightcoral; padding: 8px; }
    </style>
  </head>
  <body>
    <div class="scroller">
      <div id="top">TOP marker</div>
      <div class="filler"></div>
      <div id="bottom">BOTTOM marker</div>
    </div>
  </body>
</html>
